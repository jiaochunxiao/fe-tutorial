<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 274" width="100%" role="img" aria-labelledby="r8mt r8md">
  <title id="r8mt">重渲染的成本构成与 memo 的剪枝条件</title>
  <desc id="r8md">重渲染的成本分两块：组件函数执行是必付的，父组件一更新所有子组件函数都要重跑；DOM 更新只有在 Diff 出差异时才付。React.memo 包住子组件后，props 浅比较相等就跳过整棵子树的函数执行，不等就照常重渲染。但 memo 有三个天敌：内联函数、内联对象、内联数组，每次渲染都是新引用，浅比较必然失败。所以要配套 useCallback 稳定函数引用、useMemo 稳定对象引用。零成本手段优先：状态下放、派生值不落 state、列表项组件化配稳定 key、用 children 传稳定子树。</desc>

  <style>
    .r8m-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .r8m-g{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .r8m-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .r8m-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .r8m-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="r8m-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="r8m-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="r8m-t" x="40" y="24" font-size="8.5">重渲染成本 = ① 必付 + ② 可免 —— memo 剪掉的是 ①</text>

  <rect class="r8m-b" x="40" y="40" width="280" height="40" rx="2"/>
  <text class="r8m-t" x="52" y="58" font-size="8.5">① 组件函数执行</text>
  <text class="r8m-s" x="52" y="72" font-size="7">必付：父组件一更新，子组件函数全部重跑</text>
  <text class="r8m-t" x="336" y="66" font-size="9" text-anchor="middle">+</text>
  <rect class="r8m-b" x="360" y="40" width="300" height="40" rx="2"/>
  <text class="r8m-t" x="372" y="58" font-size="8.5">② DOM 更新</text>
  <text class="r8m-s" x="372" y="72" font-size="7">Diff 无差异就免 —— 但 ① 已经白跑了</text>

  <rect class="r8m-g" x="40" y="104" width="220" height="34" rx="2"/>
  <text class="r8m-t" x="150" y="125" font-size="8.5" text-anchor="middle">Child 的 props 浅相等？</text>

  <text class="r8m-s" x="278" y="117" font-size="7">是</text>
  <line x1="260" y1="121" x2="296" y2="121" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#r8m-ink)"/>
  <rect class="r8m-b" x="300" y="104" width="240" height="34" rx="2"/>
  <text class="r8m-t" x="420" y="125" font-size="8.5" text-anchor="middle">跳过整棵子树的 ①</text>

  <line x1="150" y1="138" x2="150" y2="150" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#r8m-ink)"/>
  <rect class="r8m-b" x="40" y="154" width="220" height="34" rx="2"/>
  <text class="r8m-t" x="150" y="175" font-size="8.5" text-anchor="middle">照常重渲染</text>

  <text class="r8m-t" x="312" y="160" font-size="7.5" style="fill:#B03A2E">天敌：内联函数 / 内联对象 / 内联数组</text>
  <text class="r8m-s" x="312" y="174" font-size="7" style="fill:#B03A2E">每次渲染都是新引用 → 浅比较必然失败</text>

  <text class="r8m-t" x="40" y="212" font-size="8.5">三把斧必须配套：React.memo 开闸，useCallback / useMemo 负责让 props 真的相等</text>

  <rect class="r8m-b" x="40" y="220" width="190" height="26" rx="2"/>
  <text class="r8m-mono" x="135" y="237" font-size="7.5" text-anchor="middle">React.memo</text>
  <rect class="r8m-b" x="250" y="220" width="190" height="26" rx="2"/>
  <text class="r8m-mono" x="345" y="237" font-size="7.5" text-anchor="middle">useCallback</text>
  <rect class="r8m-b" x="460" y="220" width="190" height="26" rx="2"/>
  <text class="r8m-mono" x="555" y="237" font-size="7.5" text-anchor="middle">useMemo</text>
  <text class="r8m-t" x="40" y="268" font-size="8.5" style="fill:#B03A2E">免费手段优先：状态下放 · 派生值不落 state · 列表项组件化 + 稳定 key · children 传稳定子树。</text>
</svg>
