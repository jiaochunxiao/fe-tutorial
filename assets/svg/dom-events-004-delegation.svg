<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 34 740 246" width="100%" role="img" aria-labelledby="ed4t ed4d">
  <title id="ed4t">事件委托：一个监听接住所有子元素的点击</title>
  <desc id="ed4d">列表里每个 li 都有一个删除按钮，但只在 ul 上挂一个 click 监听。点击任意按钮后事件冒泡到 ul，回调里用 e.target.closest 判断点中的是谁：命中删除按钮就删这一行，命中 li 就选中，都没命中就忽略。新增的 li 不需要重新绑定。</desc>

  <style>
    .ed4-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .ed4-li{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.2}
    .ed4-btn{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.2}
    .ed4-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .ed4-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .ed4-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="ed4-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <rect class="ed4-box" x="40" y="56" width="210" height="190" rx="3"/>
  <text class="ed4-mono" x="54" y="78" font-size="10">ul</text>

  <rect class="ed4-li" x="62" y="88" width="170" height="42" rx="2"/>
  <text class="ed4-s" x="76" y="114" font-size="9">li</text>
  <rect class="ed4-btn" x="190" y="97" width="34" height="24" rx="2"/>
  <rect class="ed4-li" x="62" y="136" width="170" height="42" rx="2"/>
  <text class="ed4-s" x="76" y="162" font-size="9">li</text>
  <rect class="ed4-btn" x="190" y="145" width="34" height="24" rx="2"/>
  <rect class="ed4-li" x="62" y="184" width="170" height="42" rx="2"/>
  <text class="ed4-s" x="76" y="210" font-size="9">li</text>
  <rect class="ed4-btn" x="190" y="193" width="34" height="24" rx="2"/>

  <circle cx="207" cy="157" r="4" fill="#B03A2E"/>
  <text class="ed4-s" x="54" y="264" font-size="9" style="fill:#B03A2E">e.target 就是这个点</text>

  <line x1="254" y1="152" x2="292" y2="152" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#ed4-ink)"/>
  <text class="ed4-s" x="273" y="144" font-size="9" text-anchor="middle">冒泡</text>

  <rect class="ed4-box" x="296" y="120" width="150" height="64" rx="3"/>
  <text class="ed4-mono" x="371" y="146" font-size="9.5" text-anchor="middle">ul 上的 click</text>
  <text class="ed4-s" x="371" y="166" font-size="9" text-anchor="middle">全列表只挂这一个</text>

  <path d="M450 152 H470" fill="none" stroke="#1C1A17" stroke-width="1.4"/>
  <path d="M470 100 V204" fill="none" stroke="#1C1A17" stroke-width="1.4"/>
  <line x1="470" y1="100" x2="486" y2="100" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#ed4-ink)"/>
  <line x1="470" y1="152" x2="486" y2="152" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#ed4-ink)"/>
  <line x1="470" y1="204" x2="486" y2="204" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#ed4-ink)"/>

  <text class="ed4-mono" x="492" y="103" font-size="9">closest('.del')</text>
  <text class="ed4-t" x="600" y="103" font-size="9.5">删除这一行</text>

  <text class="ed4-mono" x="492" y="155" font-size="9">closest('li')</text>
  <text class="ed4-t" x="600" y="155" font-size="9.5">选中这一行</text>

  <text class="ed4-s" x="492" y="207" font-size="9">都没命中</text>
  <text class="ed4-s" x="600" y="207" font-size="9.5">忽略</text>

</svg>
