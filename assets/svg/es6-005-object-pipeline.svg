<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 740 210" width="100%" role="img" aria-labelledby="nm5t nm5d">
  <title id="nm5t">对象的函数式处理闭环：entries 拆开，数组操作，fromEntries 装回</title>
  <desc id="nm5d">对象本身没有 map 和 filter，所以处理对象要走四步：Object.entries 把对象拆成键值对数组，用数组方法映射或过滤，最后 Object.fromEntries 把键值对数组装回一个新对象。上面那条被划掉的红线表示「直接从对象跳到数组操作」这条路不存在。</desc>

  <style>
    .nm5-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .nm5-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .nm5-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .nm5-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="nm5-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="nm5-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="nm5-s" x="280" y="66" font-size="9" text-anchor="middle">对象自己没有 map / filter</text>
  <path d="M110 112 L110 80 L266 80" fill="none" stroke="#B03A2E" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text class="nm5-s" x="280" y="84" font-size="11" text-anchor="middle" style="fill:#B03A2E">✘</text>
  <path d="M294 80 L450 80 L450 108" fill="none" stroke="#B03A2E" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#nm5-red)"/>

  <text class="nm5-mono" x="195" y="106" font-size="9" text-anchor="middle">entries</text>
  <text class="nm5-mono" x="365" y="106" font-size="9" text-anchor="middle">map / filter</text>
  <text class="nm5-mono" x="535" y="106" font-size="9" text-anchor="middle">fromEntries</text>

  <rect class="nm5-box" x="40" y="112" width="140" height="40" rx="3"/>
  <text class="nm5-mono" x="110" y="137" font-size="9.5" text-anchor="middle">{ a: 1, b: 2 }</text>
  <line x1="184" y1="132" x2="206" y2="132" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#nm5-ink)"/>

  <rect class="nm5-box" x="210" y="112" width="140" height="40" rx="3"/>
  <text class="nm5-mono" x="280" y="137" font-size="9.5" text-anchor="middle">[['a',1],['b',2]]</text>
  <line x1="354" y1="132" x2="376" y2="132" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#nm5-ink)"/>

  <rect class="nm5-box" x="380" y="112" width="140" height="40" rx="3"/>
  <text class="nm5-mono" x="450" y="137" font-size="9.5" text-anchor="middle">[['a', 2]]</text>
  <line x1="524" y1="132" x2="546" y2="132" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#nm5-ink)"/>

  <rect class="nm5-box" x="550" y="112" width="140" height="40" rx="3"/>
  <text class="nm5-mono" x="620" y="137" font-size="9.5" text-anchor="middle">{ a: 2 }</text>

  <text class="nm5-s" x="110" y="172" font-size="9" text-anchor="middle">对象</text>
  <text class="nm5-s" x="280" y="172" font-size="9" text-anchor="middle">键值对数组</text>
  <text class="nm5-s" x="450" y="172" font-size="9" text-anchor="middle">仍是数组</text>
  <text class="nm5-s" x="620" y="172" font-size="9" text-anchor="middle">新对象</text>

  <text class="nm5-s" x="40" y="202" font-size="9.5">中间那一步可以随便用数组方法 —— 这就是对象也能「函数式处理」的原因</text>
  <text class="nm5-s" x="40" y="222" font-size="9.5">注意浅拷贝：展开和 assign 只复制第一层，嵌套对象两边共享同一个引用</text>
</svg>
