<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 26 740 252" width="100%" role="img" aria-labelledby="ls3t ls3d">
  <title id="ls3t">同一个函数在词法作用域与动态作用域下的两种答案</title>
  <desc id="ls3d">同一个函数 foo 要取变量 value。词法作用域问的是我在哪儿定义，答案来自定义处的全局环境，取到 1；动态作用域问的是我在哪儿被调用，答案来自调用者 bar 的环境，取到 2。JavaScript 选的是前者。</desc>

  <style>
    .ls3-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .ls3-top{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.6}
    .ls3-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .ls3-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .ls3-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="ls3-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <rect class="ls3-top" x="290" y="34" width="160" height="44" rx="3"/>
  <text class="ls3-mono" x="370" y="61" font-size="11" text-anchor="middle">function foo()</text>

  <path d="M370 78 V96" fill="none" stroke="#1C1A17" stroke-width="1.4"/>
  <path d="M230 96 H510" fill="none" stroke="#1C1A17" stroke-width="1.4"/>
  <path d="M230 96 V106" fill="none" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#ls3-ink)"/>
  <path d="M510 96 V106" fill="none" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#ls3-ink)"/>

  <rect class="ls3-box" x="120" y="110" width="220" height="44" rx="3"/>
  <text class="ls3-t" x="230" y="138" font-size="11" text-anchor="middle">词法作用域</text>

  <rect class="ls3-box" x="400" y="110" width="220" height="44" rx="3"/>
  <text class="ls3-t" x="510" y="138" font-size="11" text-anchor="middle">动态作用域</text>

  <text class="ls3-s" x="230" y="176" font-size="9.5" text-anchor="middle">「我在哪儿定义？」</text>
  <text class="ls3-s" x="510" y="176" font-size="9.5" text-anchor="middle">「我在哪儿被调用？」</text>

  <rect class="ls3-box" x="110" y="194" width="240" height="48" rx="3"/>
  <text class="ls3-s" x="230" y="214" font-size="9.5" text-anchor="middle">沿着定义处往上找</text>
  <text class="ls3-mono" x="230" y="232" font-size="9.5" text-anchor="middle">全局 value = 1</text>

  <rect class="ls3-box" x="390" y="194" width="240" height="48" rx="3"/>
  <text class="ls3-s" x="510" y="214" font-size="9.5" text-anchor="middle">沿着调用处往上找</text>
  <text class="ls3-mono" x="510" y="232" font-size="9.5" text-anchor="middle">bar 里 value = 2</text>

  <text class="ls3-s" x="230" y="264" font-size="9.5" text-anchor="middle" style="fill:#B03A2E">JS 走这条</text>
  <text class="ls3-s" x="510" y="264" font-size="9.5" text-anchor="middle">bash / 部分模板语言</text>

</svg>
