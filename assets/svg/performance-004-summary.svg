<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 320" width="100%" role="img" aria-labelledby="p4st p4sd">
  <title id="p4st">图片优化的四层，以及体积逐层下降的链条</title>
  <desc id="p4sd">第一层格式，图标用 SVG，照片用 AVIF 优先 WebP 与 JPEG 降级，动图换成视频；第二层尺寸，用 srcset 与 sizes 让设备按像素比选档，同时声明宽高兼治布局偏移；第三层策略，首屏和 LCP 图给高优先级且绝不懒加载，非首屏才用 lazy 与异步解码；第四层占位，优先用尺寸属性，其次均色底，最后才是 LQIP 与 blurhash。四层叠加，三兆的 JPEG 能压到手机档两百千字节。</desc>

  <style>
    .p4s-b{fill:#FBF7EE;stroke:#CDC4AF;stroke-width:1}
    .p4s-chip{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .p4s-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .p4s-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .p4s-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="p4s-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="p4s-t" x="40" y="26" font-size="8.5">四层各砍一刀 —— 每一层都是上一层的乘数</text>

  <!-- ① 格式 -->
  <rect class="p4s-chip" x="40" y="50" width="52" height="24" rx="2"/>
  <text class="p4s-t" x="66" y="66" font-size="8.5" text-anchor="middle">① 格式</text>
  <rect class="p4s-b" x="102" y="47" width="598" height="30" rx="2"/>
  <text class="p4s-s" x="116" y="66" font-size="8">SVG 管图标 · 照片 AVIF ▸ WebP ▸ JPEG（picture 降级）· 动图换视频</text>

  <!-- ② 尺寸 -->
  <rect class="p4s-chip" x="40" y="94" width="52" height="24" rx="2"/>
  <text class="p4s-t" x="66" y="110" font-size="8.5" text-anchor="middle">② 尺寸</text>
  <rect class="p4s-b" x="102" y="91" width="598" height="30" rx="2"/>
  <text class="p4s-s" x="116" y="110" font-size="8">srcset(w) + sizes(布局宽) 按 DPR 选档 · width/height 占位兼治 CLS</text>

  <!-- ③ 策略 -->
  <rect class="p4s-chip" x="40" y="138" width="52" height="24" rx="2"/>
  <text class="p4s-t" x="66" y="154" font-size="8.5" text-anchor="middle">③ 策略</text>
  <rect class="p4s-b" x="102" y="135" width="598" height="30" rx="2"/>
  <text class="p4s-s" x="116" y="154" font-size="8">首屏 / LCP 图 fetchpriority=high + preload，绝不 lazy；非首屏 lazy + async</text>

  <!-- ④ 占位 -->
  <rect class="p4s-chip" x="40" y="182" width="52" height="24" rx="2"/>
  <text class="p4s-t" x="66" y="198" font-size="8.5" text-anchor="middle">④ 占位</text>
  <rect class="p4s-b" x="102" y="179" width="598" height="30" rx="2"/>
  <text class="p4s-s" x="116" y="198" font-size="8">尺寸属性（90% 场景）▸ 均色底 ▸ LQIP / blurhash —— 从便宜到贵</text>

  <line x1="40" y1="228" x2="700" y2="228" stroke="#CDC4AF" stroke-width="1"/>

  <text class="p4s-t" x="40" y="248" font-size="8.5">四层叠完的体积链</text>

  <rect class="p4s-chip" x="40" y="260" width="200" height="28" rx="2"/>
  <text class="p4s-mono" x="140" y="278" font-size="8.5" text-anchor="middle">3MB　JPEG 原图</text>

  <line x1="244" y1="274" x2="268" y2="274" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#p4s-ink)"/>

  <rect class="p4s-chip" x="272" y="260" width="150" height="28" rx="2"/>
  <text class="p4s-mono" x="347" y="278" font-size="8.5" text-anchor="middle">800KB　WebP</text>

  <line x1="426" y1="274" x2="450" y2="274" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#p4s-ink)"/>

  <rect class="p4s-chip" x="454" y="260" width="170" height="28" rx="2"/>
  <text class="p4s-mono" x="539" y="278" font-size="8.5" text-anchor="middle">200KB　手机档</text>

  <text class="p4s-t" x="40" y="314" font-size="8.5" style="fill:#B03A2E">少做一层，体积就差一个量级 —— 而图片通常占页面体积一半以上。</text>
</svg>
