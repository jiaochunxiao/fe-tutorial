<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 286" width="100%" role="img" aria-labelledby="v2t v2d">
  <title id="v2t">隐藏类的转移链与形状分叉</title>
  <desc id="v2d">空对象从 C0 开始，加 x 变成 C1，再加 y 变成 C2，每个形状记录属性名到偏移量的映射。a 和 b 沿同一条链长出来，所以对象头里的 Map 都指向 C2，属性偏移完全一致。b 后来多写一个属性 description，就分叉出一条新的转移链，Map 变成 C3，从此与 a 不再共享形状。</desc>

  <style>
    .v2-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .v2-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .v2-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="v2-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="v2-cin" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <!-- 转移链 -->
  <rect class="v2-box" x="40" y="56" width="70" height="52" rx="3"/>
  <text class="v2-mono" x="75" y="78" font-size="12.5" text-anchor="middle">C0</text>
  <text class="v2-mono" x="75" y="96" font-size="9.5" text-anchor="middle" style="fill:#6E675A">{}</text>

  <line x1="114" y1="82" x2="166" y2="82" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#v2-ink)"/>
  <text class="v2-mono" x="140" y="48" font-size="9.5" text-anchor="middle">+x</text>

  <rect class="v2-box" x="170" y="56" width="86" height="52" rx="3"/>
  <text class="v2-mono" x="213" y="78" font-size="12.5" text-anchor="middle">C1</text>
  <text class="v2-mono" x="213" y="96" font-size="9.5" text-anchor="middle" style="fill:#6E675A">{x: 0}</text>

  <line x1="260" y1="82" x2="312" y2="82" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#v2-ink)"/>
  <text class="v2-mono" x="286" y="48" font-size="9.5" text-anchor="middle">+y</text>

  <rect class="v2-box" x="316" y="56" width="120" height="52" rx="3"/>
  <text class="v2-mono" x="376" y="78" font-size="12.5" text-anchor="middle">C2</text>
  <text class="v2-mono" x="376" y="96" font-size="9.5" text-anchor="middle" style="fill:#6E675A">{x: 0, y: 8}</text>

  <line x1="440" y1="82" x2="492" y2="82" stroke="#B03A2E" stroke-width="1.6" marker-end="url(#v2-cin)"/>
  <text class="v2-mono" x="466" y="48" font-size="9.5" text-anchor="middle" style="fill:#B03A2E">+description</text>

  <rect class="v2-box" x="496" y="56" width="150" height="52" rx="3"/>
  <text class="v2-mono" x="571" y="78" font-size="12.5" text-anchor="middle">C3</text>
  <text class="v2-mono" x="571" y="96" font-size="9.5" text-anchor="middle" style="fill:#6E675A">{x: 0, y: 8, desc}</text>

  <!-- 两个对象 -->

  <rect class="v2-box" x="306" y="190" width="140" height="60" rx="3"/>
  <text class="v2-mono" x="322" y="212" font-size="12">a</text>
  <text class="v2-mono" x="322" y="232" font-size="9.5" style="fill:#6E675A">[Map=C2][x][y]</text>
  <line x1="376" y1="190" x2="376" y2="116" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#v2-ink)"/>

  <rect class="v2-box" x="486" y="190" width="170" height="60" rx="3"/>
  <text class="v2-mono" x="502" y="212" font-size="12">b</text>
  <text class="v2-mono" x="502" y="232" font-size="9.5" style="fill:#6E675A">[Map=C3][x][y][desc]</text>
  <line x1="571" y1="190" x2="571" y2="116" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#v2-ink)"/>

  <!-- 两条结论 -->
  <text class="v2-small" x="40" y="176" font-size="10.5">同一条链 → 同一个形状</text>
  <text class="v2-small" x="40" y="200" font-size="10.5">多写一个属性 → 分叉到新形状</text>

</svg>
