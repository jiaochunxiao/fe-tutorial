<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 374" width="100%" role="img" aria-labelledby="f1t f1d">
  <title id="f1t">Fiber 的三个指针</title>
  <desc id="f1d">每个 Fiber 节点用 child 指向第一个子节点、sibling 指向下一个兄弟节点、return 指回父节点，遍历因此可以用循环代替递归，进度存在节点上，可中断可恢复。</desc>
  <defs>
    <marker id="f1-cin" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
    <marker id="f1-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="f1-mut" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6E675A"/>
    </marker>
  </defs>

  <style>
    .f1-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.6}
    .f1-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .f1-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .f1-edge{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;font-size:10px}
  </style>

  <!-- 节点 -->
  <rect class="f1-box" x="320" y="44" width="80" height="40" rx="4"/>
  <text class="f1-mono" x="360" y="69" font-size="12.5" text-anchor="middle">App</text>

  <rect class="f1-box" x="170" y="156" width="80" height="40" rx="4"/>
  <text class="f1-mono" x="210" y="181" font-size="12.5" text-anchor="middle">Page</text>

  <rect class="f1-box" x="470" y="156" width="80" height="40" rx="4"/>
  <text class="f1-mono" x="510" y="181" font-size="12.5" text-anchor="middle">Modal</text>

  <rect class="f1-box" x="80" y="264" width="80" height="40" rx="4"/>
  <text class="f1-mono" x="120" y="289" font-size="12.5" text-anchor="middle">Header</text>

  <rect class="f1-box" x="250" y="264" width="80" height="40" rx="4"/>
  <text class="f1-mono" x="290" y="289" font-size="12.5" text-anchor="middle">List</text>

  <!-- child（朱砂） -->
  <path d="M340 84 C340 118 210 118 210 152" fill="none" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#f1-cin)"/>
  <text class="f1-edge" x="243" y="112" text-anchor="end" style="fill:#B03A2E">child</text>

  <path d="M190 196 C190 230 120 230 120 260" fill="none" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#f1-cin)"/>
  <text class="f1-edge" x="104" y="216" text-anchor="end" style="fill:#B03A2E">child</text>

  <!-- sibling（墨） -->
  <line x1="250" y1="176" x2="466" y2="176" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#f1-ink)"/>
  <text class="f1-edge" x="358" y="169" text-anchor="middle" style="fill:#6E675A">sibling</text>

  <line x1="160" y1="284" x2="246" y2="284" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#f1-ink)"/>
  <text class="f1-edge" x="203" y="277" text-anchor="middle" style="fill:#6E675A">sibling</text>

  <!-- return（灰虚线，画一条作示例） -->
  <path d="M240 156 C270 132 320 108 356 88" fill="none" stroke="#6E675A" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#f1-mut)"/>
  <text class="f1-edge" x="362" y="100" style="fill:#6E675A">return</text>

  <path d="M150 264 C158 236 190 214 216 198" fill="none" stroke="#6E675A" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#f1-mut)"/>

  <!-- 图例 -->
  <line x1="40" y1="332" x2="72" y2="332" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#f1-cin)"/>
  <text class="f1-small" x="82" y="336" font-size="10.5">child —— 第一个子节点</text>

  <line x1="240" y1="332" x2="272" y2="332" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#f1-ink)"/>
  <text class="f1-small" x="282" y="336" font-size="10.5">sibling —— 下一个兄弟</text>

  <line x1="450" y1="332" x2="482" y2="332" stroke="#6E675A" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#f1-mut)"/>
  <text class="f1-small" x="492" y="336" font-size="10.5">return —— 指回父节点</text>

  <text class="f1-small" x="40" y="362" font-size="11">图中只画了两条 return（Page→App、Header→Page），实际每个节点都有一条，指回它的父节点。</text>
</svg>
