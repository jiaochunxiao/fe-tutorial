<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 296" width="100%" role="img" aria-labelledby="cd9t cd9d">
  <title id="cd9t">响应式适配的分层：连续、断点、组件、偏好、图片、移动坑</title>
  <desc id="cd9d">最上面是一条换算链：物理像素经过设备像素比变成 CSS 像素，再经过 meta viewport 得到布局视口，这是所有适配的前提。往下两层是主干：连续适配负责尺寸等比，rem 方案用 JS 按屏宽动态设置根字号、构建时把设计稿像素换算过去，vw 方案直接按视口比例算、不需要 JS；断点适配负责结构变化，用 media 查询的 min-width 调整栅格列数与显隐，移动优先逐级增强，它管跳变不管连续。再往下是组件级与偏好级：容器查询让组件按自身容器宽度响应，prefers 系列读取用户的深色模式与减弱动效偏好。底部两条：图片用 srcset 配 sizes 按宽度与 DPR 选源，picture 做艺术指导与格式切换；移动端两个坑是 DPR 导致的 1px 边框要用 scaleY 补偿，刘海屏要用 env 读取安全区。</desc>

  <style>
    .cd9-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .cd9-c{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .cd9-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .cd9-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .cd9-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="cd9-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="cd9-t" x="30" y="24" font-size="8.5">先有三层像素与视口，才谈得上适配</text>

  <rect class="cd9-b" x="30" y="36" width="170" height="48" rx="2"/>
  <text class="cd9-t" x="115" y="56" font-size="8.5" text-anchor="middle">物理像素</text>
  <text class="cd9-s" x="115" y="72" font-size="7" text-anchor="middle">设备真实的点</text>

  <line x1="200" y1="60" x2="276" y2="60" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#cd9-ink)"/>
  <text class="cd9-s" x="238" y="53" font-size="7" text-anchor="middle" style="fill:#B03A2E">DPR ×</text>

  <rect class="cd9-b" x="290" y="36" width="170" height="48" rx="2"/>
  <text class="cd9-t" x="375" y="56" font-size="8.5" text-anchor="middle">CSS 像素</text>
  <text class="cd9-s" x="375" y="72" font-size="7" text-anchor="middle">写样式用的单位</text>

  <line x1="460" y1="60" x2="536" y2="60" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#cd9-ink)"/>
  <text class="cd9-s" x="498" y="53" font-size="7" text-anchor="middle" style="fill:#B03A2E">meta viewport</text>

  <rect class="cd9-c" x="550" y="36" width="170" height="48" rx="2"/>
  <text class="cd9-t" x="635" y="56" font-size="8.5" text-anchor="middle">布局视口</text>
  <text class="cd9-s" x="635" y="72" font-size="7" text-anchor="middle">媒体查询量的就是它</text>

  <rect class="cd9-b" x="30" y="100" width="330" height="56" rx="2"/>
  <text class="cd9-t" x="44" y="118" font-size="8.5">连续适配 · 尺寸等比</text>
  <text class="cd9-s" x="44" y="134" font-size="7">rem：JS 按屏宽动态设根字号，构建时换算设计稿 px</text>
  <text class="cd9-s" x="44" y="148" font-size="7">vw：直接按视口比例算，不需要 JS</text>

  <rect class="cd9-b" x="380" y="100" width="330" height="56" rx="2"/>
  <text class="cd9-t" x="394" y="118" font-size="8.5">断点适配 · 结构变化</text>
  <text class="cd9-s" x="394" y="134" font-size="7">@media (min-width: …) 调栅格列数与显隐</text>
  <text class="cd9-s" x="394" y="148" font-size="7">移动优先逐级增强 —— 管跳变，不管连续</text>

  <rect class="cd9-b" x="30" y="166" width="330" height="44" rx="2"/>
  <text class="cd9-t" x="44" y="184" font-size="8.5">组件适配 · @container</text>
  <text class="cd9-s" x="44" y="199" font-size="7">按自身容器宽度响应，不再依赖整个视口</text>

  <rect class="cd9-b" x="380" y="166" width="330" height="44" rx="2"/>
  <text class="cd9-t" x="394" y="184" font-size="8.5">用户偏好 · prefers-*</text>
  <text class="cd9-s" x="394" y="199" font-size="7">深色模式、减弱动效 —— 尊重系统设置</text>

  <rect x="30" y="222" width="680" height="22" fill="#E7DEC8" opacity="0.55"/>
  <text class="cd9-s" x="42" y="237" font-size="7.5">图片：srcset 配 sizes 按宽度与 DPR 选源 │ picture 做艺术指导与格式切换</text>

  <text class="cd9-s" x="30" y="262" font-size="7.5" style="fill:#B03A2E">移动两坑：DPR 导致 1px 边框变粗（用 scaleY 补偿）· 刘海屏用 env(safe-area-inset-*) 让出安全区</text>
  <text class="cd9-s" x="30" y="284" font-size="7.5">一句话：缩放体系管「连续」，媒体查询管「跳变」，两套机制各管一档，谁也替不了谁</text>
</svg>
