<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 280" width="100%" role="img" aria-labelledby="e61lt e61ld">
  <title id="e61lt">for(let i) 每轮一个新绑定，以及 TDZ 的时间窗</title>
  <desc id="e61ld">for 循环里用 let 声明计数器时，每一轮都会新建一个块级环境，i 是这一轮的副本。三个闭包各自捕获自己那一轮的 i，所以分别持有 0、1、2，互不影响；这正是老面试题里用 var 会全部打印 3 的原因。下半部分是暂时性死区：块一开始就登记了名字，但还没初始化，从块开始到 let 语句执行之前访问都会抛 ReferenceError。</desc>

  <style>
    .e61l-chip{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .e61l-clo{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .e61l-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .e61l-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .e61l-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="e61l-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="e61l-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="e61l-t" x="40" y="32" font-size="8.5">每一轮都是一个新块环境 —— 闭包捕获的是「本轮的 i」，不是「那个 i」</text>

  <text class="e61l-s" x="40" y="70" font-size="8">第 1 轮</text>
  <rect class="e61l-chip" x="110" y="54" width="150" height="26" rx="2"/>
  <text class="e61l-mono" x="185" y="71" font-size="8.5" text-anchor="middle">新块环境 { i = 0 }</text>
  <line x1="260" y1="67" x2="306" y2="67" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#e61l-ink)"/>
  <rect class="e61l-clo" x="310" y="54" width="150" height="26" rx="2"/>
  <text class="e61l-mono" x="385" y="71" font-size="8.5" text-anchor="middle">闭包 A 持有 0</text>

  <text class="e61l-s" x="40" y="110" font-size="8">第 2 轮</text>
  <rect class="e61l-chip" x="110" y="94" width="150" height="26" rx="2"/>
  <text class="e61l-mono" x="185" y="111" font-size="8.5" text-anchor="middle">新块环境 { i = 1 }</text>
  <line x1="260" y1="107" x2="306" y2="107" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#e61l-ink)"/>
  <rect class="e61l-clo" x="310" y="94" width="150" height="26" rx="2"/>
  <text class="e61l-mono" x="385" y="111" font-size="8.5" text-anchor="middle">闭包 B 持有 1</text>

  <text class="e61l-s" x="40" y="150" font-size="8">第 3 轮</text>
  <rect class="e61l-chip" x="110" y="134" width="150" height="26" rx="2"/>
  <text class="e61l-mono" x="185" y="151" font-size="8.5" text-anchor="middle">新块环境 { i = 2 }</text>
  <line x1="260" y1="147" x2="306" y2="147" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#e61l-ink)"/>
  <rect class="e61l-clo" x="310" y="134" width="150" height="26" rx="2"/>
  <text class="e61l-mono" x="385" y="151" font-size="8.5" text-anchor="middle">闭包 C 持有 2</text>

  <text class="e61l-t" x="490" y="110" font-size="8.5" style="fill:#B03A2E">各自独立</text>
  <text class="e61l-s" x="490" y="128" font-size="8">var 版本里三轮共用同一个 i，</text>
  <text class="e61l-s" x="490" y="144" font-size="8">循环结束它已经是 3 —— 全打印 3。</text>

  <line x1="40" y1="182" x2="700" y2="182" stroke="#CDC4AF" stroke-width="1"/>

  <text class="e61l-t" x="40" y="204" font-size="8.5">TDZ（暂时性死区）</text>

  <rect class="e61l-chip" x="40" y="216" width="100" height="30" rx="2"/>
  <text class="e61l-s" x="90" y="235" font-size="8" text-anchor="middle">块开始</text>
  <rect class="e61l-clo" x="140" y="216" width="280" height="30" rx="2" style="fill:#F3E2DE;stroke:#B03A2E"/>
  <text class="e61l-t" x="280" y="235" font-size="8" text-anchor="middle" style="fill:#B03A2E">访问就抛 ReferenceError</text>
  <rect class="e61l-chip" x="420" y="216" width="120" height="30" rx="2"/>
  <text class="e61l-s" x="480" y="235" font-size="8" text-anchor="middle">let x 执行</text>
  <rect class="e61l-chip" x="540" y="216" width="160" height="30" rx="2"/>
  <text class="e61l-s" x="620" y="235" font-size="8" text-anchor="middle">正常区</text>

  <text class="e61l-s" x="40" y="266" font-size="8.5">名字在块开始就登记了（否则重复声明不会报错），但值还没初始化 —— 所以「已存在但不可用」。</text>
</svg>
