<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 44 740 230" width="100%" role="img" aria-labelledby="hs4t hs4d">
  <title id="hs4t">useState 的状态挂在 Fiber 的 Hooks 链表上，调用顺序就是地址</title>
  <desc id="hs4d">fiber.memoizedState 指向一条单向链表，链上的每个节点对应一次 Hook 调用，依次是 useState 存 0、useEffect 存依赖数组、useState 存空对象，最后指向 null。节点之间没有名字也没有 key，只能靠调用顺序定位——渲染时从表头走一遍，第 k 个 Hook 就取第 k 个节点。所以把 Hook 放进 if 或循环，顺序一变，后面的 Hook 就整体错位，读到别人的状态。首次渲染建节点，更新渲染复用旧节点取回 state。</desc>

  <style>
    .hs4-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .hs4-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .hs4-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .hs4-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="hs4-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="hs4-mono" x="40" y="104" font-size="8.5">fiber.memoizedState</text>
  <line x1="152" y1="100" x2="196" y2="100" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#hs4-ink)"/>

  <rect class="hs4-box" x="200" y="68" width="130" height="64" rx="3"/>
  <text class="hs4-mono" x="214" y="90" font-size="9.5">useState</text>
  <text class="hs4-mono" x="214" y="108" font-size="8.5">state: 0</text>
  <text class="hs4-s" x="214" y="124" font-size="8">① 第 1 个 Hook</text>
  <line x1="330" y1="100" x2="356" y2="100" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#hs4-ink)"/>

  <rect class="hs4-box" x="360" y="68" width="130" height="64" rx="3"/>
  <text class="hs4-mono" x="374" y="90" font-size="9.5">useEffect</text>
  <text class="hs4-mono" x="374" y="108" font-size="8.5">deps: []</text>
  <text class="hs4-s" x="374" y="124" font-size="8">② 第 2 个 Hook</text>
  <line x1="490" y1="100" x2="516" y2="100" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#hs4-ink)"/>

  <rect class="hs4-box" x="520" y="68" width="130" height="64" rx="3"/>
  <text class="hs4-mono" x="534" y="90" font-size="9.5">useState</text>
  <text class="hs4-mono" x="534" y="108" font-size="8.5">state: {}</text>
  <text class="hs4-s" x="534" y="124" font-size="8">③ 第 3 个 Hook</text>
  <line x1="650" y1="100" x2="676" y2="100" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#hs4-ink)"/>
  <text class="hs4-s" x="684" y="104" font-size="9">null</text>

  <line x1="40" y1="152" x2="40" y2="186" stroke="#B03A2E" stroke-width="2.4"/>
  <text class="hs4-t" x="54" y="164" font-size="9">链上节点没有名字也没有 key —— 唯一能定位它的就是「第几个被调用」</text>
  <text class="hs4-t" x="54" y="180" font-size="9">所以 if / 循环让顺序变了，后面的 Hook 就整体错位，读到别人的 state</text>

  <text class="hs4-s" x="54" y="210" font-size="8.5">首次渲染：沿链逐个建节点　│　更新渲染：用工作指针按同样顺序复用旧节点，取回 state</text>
  <text class="hs4-s" x="54" y="228" font-size="8.5">setState 只做两件事：把更新入队、安排一次渲染；本次渲染里的 state 是快照常量</text>
  <text class="hs4-s" x="54" y="246" font-size="8.5">连续更新要写成 setN(c =&gt; c + 1) —— 函数式更新基于队列里的最新值，绕开闭包旧值</text>
  <text class="hs4-s" x="54" y="264" font-size="8.5">自定义 Hook 复用的是逻辑执行路径，状态仍各自挂在调用它的那个组件的 Fiber 上</text>
</svg>
