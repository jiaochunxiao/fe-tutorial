<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 296" width="100%" role="img" aria-labelledby="e62t e62d">
  <title id="e62t">对象解构按名，数组解构按位</title>
  <desc id="e62d">对象解构的每个位置都有三件事可做：重命名（冒号左边是源键，右边是新变量）、默认值（只在值严格等于 undefined 时触发）、剩余收集（把剩下的属性收进一个对象）。数组解构按位置对号入座，空一位就是跳过，剩余收集把后面的一起收走。函数参数解构本质是「命名参数」语法，内层默认值兜属性缺失，外层的等号兜「整个对象都没传」。</desc>

  <style>
    .e62-chip{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.2}
    .e62-chip2{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.2}
    .e62-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .e62-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .e62-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="e62-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="e62-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="e62-t" x="40" y="30" font-size="9">对象解构 · 按名</text>
  <rect class="e62-chip" x="40" y="44" width="110" height="28" rx="2"/>
  <text class="e62-mono" x="95" y="63" font-size="8.5" text-anchor="middle">name: n</text>
  <rect class="e62-chip" x="156" y="44" width="120" height="28" rx="2"/>
  <text class="e62-mono" x="216" y="63" font-size="8.5" text-anchor="middle">age = 18</text>
  <rect class="e62-chip2" x="282" y="44" width="80" height="28" rx="2"/>
  <text class="e62-mono" x="322" y="63" font-size="8.5" text-anchor="middle">...rest</text>

  <line x1="95" y1="72" x2="95" y2="88" stroke="#1C1A17" stroke-width="1.2"/>
  <text class="e62-s" x="40" y="102" font-size="8">重命名</text>
  <text class="e62-s" x="40" y="116" font-size="7.5">左边是源键，右边是新变量</text>

  <line x1="216" y1="72" x2="216" y2="88" stroke="#1C1A17" stroke-width="1.2"/>
  <text class="e62-s" x="156" y="102" font-size="8">默认值</text>
  <text class="e62-s" x="156" y="116" font-size="7.5">只在 undefined 时触发</text>

  <line x1="322" y1="72" x2="322" y2="88" stroke="#1C1A17" stroke-width="1.2"/>
  <text class="e62-s" x="282" y="102" font-size="8">剩余收集</text>
  <text class="e62-s" x="282" y="116" font-size="7.5">剩下的进新对象</text>

  <text class="e62-t" x="440" y="60" font-size="8.5" style="fill:#B03A2E">对象：名字对得上就行，顺序无所谓</text>
  <text class="e62-t" x="440" y="78" font-size="8.5" style="fill:#B03A2E">数组：位置就是语义，错一位全错</text>

  <line x1="40" y1="140" x2="700" y2="140" stroke="#CDC4AF" stroke-width="1"/>

  <text class="e62-t" x="40" y="166" font-size="9">数组解构 · 按位</text>
  <rect class="e62-chip" x="40" y="180" width="80" height="28" rx="2"/>
  <text class="e62-mono" x="80" y="199" font-size="8.5" text-anchor="middle">first</text>
  <rect class="e62-chip" x="126" y="180" width="44" height="28" rx="2"/>
  <text class="e62-mono" x="148" y="199" font-size="8.5" text-anchor="middle">, ,</text>
  <rect class="e62-chip" x="176" y="180" width="80" height="28" rx="2"/>
  <text class="e62-mono" x="216" y="199" font-size="8.5" text-anchor="middle">third</text>
  <rect class="e62-chip2" x="262" y="180" width="100" height="28" rx="2"/>
  <text class="e62-mono" x="312" y="199" font-size="8.5" text-anchor="middle">...others</text>

  <line x1="80" y1="208" x2="80" y2="224" stroke="#1C1A17" stroke-width="1.2"/>
  <text class="e62-s" x="40" y="238" font-size="8">对位取第一个</text>
  <line x1="148" y1="208" x2="148" y2="224" stroke="#1C1A17" stroke-width="1.2"/>
  <text class="e62-s" x="126" y="238" font-size="8">空一位 = 跳过</text>
  <line x1="312" y1="208" x2="312" y2="224" stroke="#1C1A17" stroke-width="1.2"/>
  <text class="e62-s" x="262" y="238" font-size="8">剩下的都收走</text>

  <text class="e62-t" x="440" y="166" font-size="9">函数参数解构 = 命名参数</text>
  <text class="e62-mono" x="440" y="190" font-size="8">function f({ a = 1, b = 2 } = {})</text>
  <text class="e62-s" x="440" y="210" font-size="7.5">内层 <tspan class="e62-mono" font-size="7.5">{}</tspan> 兜「属性缺失」</text>
  <text class="e62-s" x="440" y="226" font-size="7.5">外层 <tspan class="e62-mono" font-size="7.5">= {}</tspan> 兜「整个对象都没传」</text>
  <text class="e62-t" x="440" y="248" font-size="7.5" style="fill:#B03A2E">少写一层，不传参时就炸了</text>

  <line x1="40" y1="264" x2="700" y2="264" stroke="#CDC4AF" stroke-width="1"/>
  <text class="e62-s" x="40" y="284" font-size="8.5">默认值只在值严格等于 undefined 时生效 —— 传 null 不会触发，因为 null 是一个「有值」。</text>
</svg>
