<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 236" width="100%" role="img" aria-labelledby="r1tt r1td">
  <desc id="r1td">HTML 解析出 DOM 树，CSS 解析出 CSSOM，两者合成渲染树。渲染树只含可见节点：display:none 的元素不进，head 与 script 不进，但 visibility:hidden 会进。每个节点都携带最终样式，那是选择器匹配、继承与层叠计算的结果。渲染树交给布局阶段，算出每个盒子的 x、y、宽、高，形成布局树。</desc>
  <title id="r1tt">DOM 与 CSSOM 合成的渲染树，只留看得见的节点</title>

  <style>
    .r1t-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .r1t-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .r1t-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .r1t-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="r1t-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="r1t-t" x="40" y="26" font-size="8.5">两棵树合成第三棵 —— 而第三棵会先做一次减法</text>

  <rect class="r1t-b" x="40" y="52" width="110" height="30" rx="2"/>
  <text class="r1t-t" x="95" y="71" font-size="8" text-anchor="middle">HTML</text>
  <line x1="152" y1="67" x2="192" y2="67" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#r1t-ink)"/>
  <text class="r1t-s" x="172" y="60" font-size="6.5" text-anchor="middle">解析</text>
  <rect class="r1t-b" x="196" y="46" width="130" height="42" rx="2"/>
  <text class="r1t-t" x="261" y="64" font-size="8" text-anchor="middle">DOM 树</text>
  <text class="r1t-s" x="261" y="78" font-size="6.5" text-anchor="middle">结构</text>

  <rect class="r1t-b" x="40" y="112" width="110" height="30" rx="2"/>
  <text class="r1t-t" x="95" y="131" font-size="8" text-anchor="middle">CSS</text>
  <line x1="152" y1="127" x2="192" y2="127" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#r1t-ink)"/>
  <text class="r1t-s" x="172" y="120" font-size="6.5" text-anchor="middle">解析</text>
  <rect class="r1t-b" x="196" y="106" width="130" height="42" rx="2"/>
  <text class="r1t-t" x="261" y="124" font-size="8" text-anchor="middle">CSSOM</text>
  <text class="r1t-s" x="261" y="138" font-size="6.5" text-anchor="middle">样式规则</text>

  <path d="M328 67 H356 V88 H392" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#r1t-ink)"/>
  <path d="M328 127 H356 V108 H392" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#r1t-ink)"/>

  <rect class="r1t-q" x="396" y="72" width="150" height="52" rx="2"/>
  <text class="r1t-t" x="471" y="92" font-size="8.5" text-anchor="middle">渲染树</text>
  <text class="r1t-s" x="471" y="106" font-size="6.5" text-anchor="middle">只含可见节点</text>
  <text class="r1t-s" x="471" y="118" font-size="6.5" text-anchor="middle">每节点带最终样式</text>

  <line x1="548" y1="98" x2="582" y2="98" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#r1t-ink)"/>
  <rect class="r1t-b" x="586" y="72" width="114" height="52" rx="2"/>
  <text class="r1t-t" x="643" y="92" font-size="8" text-anchor="middle">布局树</text>
  <text class="r1t-s" x="643" y="106" font-size="6.5" text-anchor="middle">x / y / w / h</text>
  <text class="r1t-s" x="643" y="118" font-size="6.5" text-anchor="middle">盒模型几何</text>

  <text class="r1t-s" x="396" y="146" font-size="7">display:none 不进 ｜ head、script 不进 ｜ visibility:hidden 会进</text>

  <text class="r1t-t" x="40" y="182" font-size="8">Style 的成本因子 = 节点数量 × 选择器复杂度</text>
  <text class="r1t-s" x="40" y="198" font-size="7.5">几万个节点叠上后代选择器链，就是样式计算的两大负担 —— 类名扁平化、减少无谓层级是解法。</text>

  <text class="r1t-t" x="40" y="222" font-size="8.5" style="fill:#B03A2E">所以「隐藏」有两种：display:none 让节点根本不进渲染树，visibility:hidden 进了树但不画。</text>
</svg>
