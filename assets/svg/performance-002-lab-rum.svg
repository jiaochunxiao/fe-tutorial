<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 296" width="100%" role="img" aria-labelledby="p2st p2sd">
  <title id="p2st">Lab 找原因，RUM 定真相</title>
  <desc id="p2sd">实验室数据在受控环境里跑，用 Lighthouse 打分和机会清单，用 Performance 面板看火焰图，Main 轨上的红三角是超过 50 毫秒的长任务，黄色是 JS、紫色是 Layout、绿色是 Paint，Bottom-Up 能定位到具体函数。真实用户数据靠 PerformanceObserver 采集 LCP、CLS、longtask，用 sendBeacon 上报并按 P75 看曲线，再用 CrUX 的官方样本对照。两者不是二选一，而是一个闭环：RUM 告警、按维度切片、Lab 复现、火焰图定位、修复、再回 RUM 验证。</desc>

  <style>
    .p2s-col{fill:none;stroke:#CDC4AF;stroke-width:1.1}
    .p2s-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.2}
    .p2s-alt{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.2}
    .p2s-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .p2s-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .p2s-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="p2s-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <rect class="p2s-box" x="40" y="20" width="300" height="30" rx="3"/>
  <text class="p2s-t" x="190" y="40" font-size="9" text-anchor="middle">Lab · 找原因</text>
  <rect class="p2s-col" x="40" y="50" width="300" height="132" rx="2"/>
  <text class="p2s-s" x="54" y="70" font-size="8">Lighthouse　打分 + 机会清单</text>
  <text class="p2s-s" x="54" y="90" font-size="8">Performance 面板　火焰图</text>
  <text class="p2s-s" x="54" y="110" font-size="8">Main 轨　红三角 = 长任务 &gt; 50ms</text>
  <text class="p2s-s" x="54" y="130" font-size="8">黄 JS · 紫 Layout · 绿 Paint</text>
  <text class="p2s-s" x="54" y="150" font-size="8">Bottom-Up　定位到具体函数</text>
  <text class="p2s-s" x="54" y="170" font-size="7.5">环境受控、可复现 —— 但未必是用户的真实情况</text>

  <rect class="p2s-alt" x="400" y="20" width="300" height="30" rx="3"/>
  <text class="p2s-t" x="550" y="40" font-size="9" text-anchor="middle">RUM · 定真相</text>
  <rect class="p2s-col" x="400" y="50" width="300" height="132" rx="2"/>
  <text class="p2s-s" x="414" y="70" font-size="8">PerformanceObserver</text>
  <text class="p2s-mono" x="414" y="88" font-size="7.5">LCP / CLS（累加） / longtask</text>
  <text class="p2s-s" x="414" y="108" font-size="8">sendBeacon 上报 + 采样</text>
  <text class="p2s-s" x="414" y="128" font-size="8">按 P75 分位看曲线</text>
  <text class="p2s-s" x="414" y="148" font-size="8">CrUX 官方样本对照</text>
  <text class="p2s-s" x="414" y="170" font-size="7.5">真实设备、真实网络 —— 但看不出为什么慢</text>

  <line x1="40" y1="198" x2="700" y2="198" stroke="#CDC4AF" stroke-width="1"/>

  <text class="p2s-t" x="40" y="218" font-size="8.5">闭环</text>
  <text class="p2s-s" x="100" y="218" font-size="8">RUM 告警 → 维度切片 → Lab 复现 → 火焰图定位 → 修复 → RUM 验证 ✓</text>
  <path d="M658 224 V238 H108 V230" fill="none" stroke="#B03A2E" stroke-width="1.2" marker-end="url(#p2s-red)"/>
  <text class="p2s-mono" x="383" y="248" font-size="7" text-anchor="middle" style="fill:#B03A2E">修完再回来量一次，闭环才合上</text>

  <text class="p2s-s" x="40" y="268" font-size="8">JS 打点：<tspan class="p2s-mono" font-size="8">performance.mark / measure / getEntriesByType</tspan></text>
  <text class="p2s-t" x="40" y="286" font-size="8.5" style="fill:#B03A2E">只有 RUM 能回答「有多少人真的卡」，只有 Lab 能回答「为什么卡」—— 缺一半都做不完。</text>
</svg>
