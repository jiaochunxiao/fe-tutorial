<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="闭包的环境引用：foo 出栈后词法环境仍被 bar 引用">
  <defs>
    <marker id="cl-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B03A2E"/>
    </marker>
  </defs>
  <text x="140" y="28" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="13.5" font-weight="700" fill="#6E675A">调用栈</text>
  <text x="540" y="28" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="13.5" font-weight="700" fill="#6E675A">堆（词法环境仍存活）</text>
  <rect x="40" y="60" width="200" height="54" fill="#EFE8D8" stroke="#1C1A17" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="140" y="92" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="13" fill="#6E675A">checkscope 上下文（已出栈）</text>
  <rect x="40" y="128" width="200" height="54" fill="#FBF8F1" stroke="#1C1A17" stroke-width="1.6"/>
  <text x="140" y="160" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="13.5" fill="#1C1A17">全局上下文（栈底）</text>
  <rect x="360" y="60" width="320" height="112" rx="10" fill="#EFE8D8" stroke="#1C1A17" stroke-width="1.6"/>
  <text x="520" y="90" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="13.5" font-weight="700" fill="#1C1A17">checkscope 的词法环境</text>
  <text x="520" y="116" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#6E675A">scope: 'local scope'</text>
  <text x="520" y="140" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11.5" fill="#6E675A">f: ƒ（函数对象）</text>
  <rect x="420" y="216" width="200" height="66" rx="10" fill="#FBF8F1" stroke="#1C1A17" stroke-width="1.6"/>
  <text x="520" y="244" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="13.5" font-weight="700" fill="#1C1A17">f 函数对象</text>
  <text x="520" y="266" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" fill="#6E675A">[[Environment]] → 词法环境</text>
  <path d="M 520 216 V 178" stroke="#B03A2E" stroke-width="2" marker-end="url(#cl-red)">
    <animate attributeName="stroke-opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <text x="536" y="202" font-family="Noto Sans SC,sans-serif" font-size="12.5" fill="#B03A2E">[[Environment]] 一直引用着</text>
  <path d="M 246 87 H 352" stroke="#B03A2E" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#cl-red)"/>
  <text x="300" y="76" text-anchor="middle" font-family="Noto Sans SC,sans-serif" font-size="12.5" fill="#B03A2E">出栈 ≠ 销毁</text>
</svg>
