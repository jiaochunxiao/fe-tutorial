<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 384" width="100%" role="img" aria-labelledby="cp8t cp8d">
  <title id="cp8t">Composition API 的四处转变：组织、复用、this、与 React 的分野</title>
  <desc id="cp8d">四行对照。组织维度从「按选项类型切片」变成「按功能聚拢」，同一个功能的状态、副作用和清理写在同一个函数里。复用机制从 mixin 变成 composable 函数，解决了来源不明、命名冲突、隐式耦合三个问题。this 被闭包变量取代，词法可见，TypeScript 推断完整。最后一行不是转变而是分野：React Hooks 每次渲染都重跑、依赖数组要手写，而 Vue 的 setup 只跑一次、依赖由响应式系统自动追踪。四行合起来是同一个动作：让 JS 原生的函数与作用域成为组织单元。</desc>

  <style>
    .cp8-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .cp8-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .cp8-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .cp8-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="cp8-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="cp8-t" x="40" y="86" font-size="9.5">组织</text>
  <rect class="cp8-box" x="104" y="56" width="236" height="48" rx="3"/>
  <text class="cp8-t" x="118" y="76" font-size="9.5">按选项类型切片</text>
  <text class="cp8-mono" x="118" y="92" font-size="8.5">data · methods · 钩子 各占一处</text>
  <line x1="340" y1="80" x2="372" y2="80" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#cp8-ink)"/>
  <rect class="cp8-box" x="376" y="56" width="324" height="48" rx="3"/>
  <text class="cp8-t" x="390" y="76" font-size="9.5">按功能聚拢</text>
  <text class="cp8-mono" x="390" y="92" font-size="8.5">state + effect + 清理 写进同一个函数</text>

  <text class="cp8-t" x="40" y="158" font-size="9.5">复用</text>
  <rect class="cp8-box" x="104" y="128" width="236" height="48" rx="3"/>
  <text class="cp8-t" x="118" y="148" font-size="9.5">mixin</text>
  <text class="cp8-s" x="118" y="164" font-size="8.5">来源不明 · 命名冲突 · 隐式耦合</text>
  <line x1="340" y1="152" x2="372" y2="152" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#cp8-ink)"/>
  <rect class="cp8-box" x="376" y="128" width="324" height="48" rx="3"/>
  <text class="cp8-t" x="390" y="148" font-size="9.5">composable 函数</text>
  <text class="cp8-s" x="390" y="164" font-size="8.5">解构显式来源 · 重命名消冲突 · 参数声明依赖</text>

  <text class="cp8-t" x="40" y="230" font-size="9.5">this</text>
  <rect class="cp8-box" x="104" y="200" width="236" height="48" rx="3"/>
  <text class="cp8-t" x="118" y="220" font-size="9.5">选项合并的实例大杂烩</text>
  <text class="cp8-s" x="118" y="236" font-size="8.5">类型只能靠猜</text>
  <line x1="340" y1="224" x2="372" y2="224" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#cp8-ink)"/>
  <rect class="cp8-box" x="376" y="200" width="324" height="48" rx="3"/>
  <text class="cp8-t" x="390" y="220" font-size="9.5">闭包变量</text>
  <text class="cp8-s" x="390" y="236" font-size="8.5">词法可见 · TypeScript 推断完整可用</text>

  <text class="cp8-t" x="40" y="302" font-size="9.5">vs React</text>
  <rect class="cp8-box" x="104" y="272" width="236" height="48" rx="3"/>
  <text class="cp8-t" x="118" y="292" font-size="9.5">每次渲染都重跑</text>
  <text class="cp8-s" x="118" y="308" font-size="8.5">依赖数组要手写</text>
  <text class="cp8-t" x="358" y="303" font-size="16" text-anchor="middle" font-weight="600" style="fill:#B03A2E">≠</text>
  <rect class="cp8-box" x="376" y="272" width="324" height="48" rx="3"/>
  <text class="cp8-t" x="390" y="292" font-size="9.5">setup 只跑一次</text>
  <text class="cp8-s" x="390" y="308" font-size="8.5">依赖由响应式系统自动追踪</text>

  <text class="cp8-t" x="40" y="352" font-size="9">三项收益，一个共同动作：让 JS 原生的「函数与作用域」成为组织单元</text>
</svg>
