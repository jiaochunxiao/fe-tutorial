<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 208" width="100%" role="img" aria-labelledby="b2ft b2fd">
  <title id="b2ft">一次 fetch 的跨进程路径</title>
  <desc id="b2fd">主线程发起 fetch 后立刻拿到 promise 继续渲染，请求经 IO 线程用 IPC 转交给浏览器进程的网络进程，由它真正向服务器发包。服务器响应回来后，网络进程交给 IO 线程，IO 线程把回调排进任务队列，等主线程空闲时再执行。整条路上最耗时的两段——网络往返与服务器处理——都不在渲染进程的主线程上跑，这就是异步的物理实现。</desc>

  <style>
    .b2f-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .b2f-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .b2f-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .b2f-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .b2f-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="b2f-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="b2f-t" x="40" y="26" font-size="8.5">一次 fetch 要跨三个进程，只有第一段在主线程上</text>

  <rect class="b2f-b" x="40" y="58" width="150" height="40" rx="2"/>
  <text class="b2f-t" x="115" y="76" font-size="8.5" text-anchor="middle">主线程</text>
  <text class="b2f-mono" x="115" y="90" font-size="7" text-anchor="middle">fetch → 立刻返回 promise</text>

  <text class="b2f-s" x="201" y="50" font-size="7.5" text-anchor="middle">请求</text>
  <line x1="190" y1="78" x2="212" y2="78" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#b2f-ink)"/>

  <rect class="b2f-b" x="216" y="58" width="140" height="40" rx="2"/>
  <text class="b2f-t" x="286" y="76" font-size="8.5" text-anchor="middle">IO 线程</text>
  <text class="b2f-s" x="286" y="90" font-size="7.5" text-anchor="middle">转交 · 排队</text>

  <text class="b2f-s" x="367" y="50" font-size="7.5" text-anchor="middle">IPC</text>
  <line x1="356" y1="78" x2="378" y2="78" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#b2f-ink)"/>

  <rect class="b2f-b" x="382" y="58" width="140" height="40" rx="2"/>
  <text class="b2f-t" x="452" y="76" font-size="8.5" text-anchor="middle">网络进程</text>
  <text class="b2f-s" x="452" y="90" font-size="7.5" text-anchor="middle">真正发包</text>

  <text class="b2f-s" x="533" y="50" font-size="7.5" text-anchor="middle">网络</text>
  <line x1="522" y1="78" x2="544" y2="78" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#b2f-ink)"/>

  <rect class="b2f-b" x="548" y="58" width="140" height="40" rx="2"/>
  <text class="b2f-t" x="618" y="76" font-size="8.5" text-anchor="middle">服务器</text>
  <text class="b2f-s" x="618" y="90" font-size="7.5" text-anchor="middle">慢在这一段</text>

  <path d="M618 98 V162 H115 V102" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#b2f-ink)"/>
  <text class="b2f-s" x="610" y="130" font-size="7.5" text-anchor="end">响应：网络进程 → IO 线程</text>

  <rect class="b2f-q" x="225" y="150" width="110" height="24" rx="2"/>
  <text class="b2f-t" x="280" y="166" font-size="8" text-anchor="middle">任务队列</text>

  <text class="b2f-t" x="40" y="196" font-size="8.5" style="fill:#B03A2E">耗时的活都不在主线程干 —— 干完把回调排进队列，主线程空闲了才取。</text>
</svg>
