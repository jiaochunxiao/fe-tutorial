<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 414" width="100%" role="img" aria-labelledby="s1t s1d">
  <title id="s1t">Scavenger 半空间复制：三个阶段</title>
  <desc id="s1d">回收前，活对象与死对象混在 From 空间，To 空间空着。复制阶段只把可达的活对象搬进 To 空间，死对象不做任何处理。复制完成后 From 空间整块作废、可以复用，From 与 To 交换角色，下一轮往反方向搬。</desc>

  <style>
    .s1-live{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .s1-dead{fill:#E7DEC8;stroke:#CDC4AF;stroke-width:1.2}
    .s1-space{fill:none;stroke:#1C1A17;stroke-width:1.4}
    .s1-empty{fill:none;stroke:#CDC4AF;stroke-width:1.2;stroke-dasharray:5 4}
    .s1-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .s1-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="s1-cin" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="s1-small" x="214" y="34" font-size="10" text-anchor="middle">From 空间</text>
  <text class="s1-small" x="586" y="34" font-size="10" text-anchor="middle">To 空间</text>

  <text class="s1-small" x="76" y="90" font-size="10.5" text-anchor="end">回收前</text>
  <text class="s1-small" x="76" y="214" font-size="10.5" text-anchor="end">复制中</text>
  <text class="s1-small" x="76" y="340" font-size="10.5" text-anchor="end">回收后</text>

  <rect class="s1-space" x="88" y="48" width="252" height="76" rx="2"/>
  <rect class="s1-live" x="94" y="55" width="56" height="28" rx="2"/>
  <text class="s1-mono" x="122" y="74" font-size="9.5" text-anchor="middle">活</text>
  <rect class="s1-dead" x="155" y="55" width="56" height="28" rx="2"/>
  <text class="s1-mono" x="183" y="74" font-size="9.5" text-anchor="middle" style="fill:#6E675A">死</text>
  <rect class="s1-dead" x="216" y="55" width="56" height="28" rx="2"/>
  <text class="s1-mono" x="244" y="74" font-size="9.5" text-anchor="middle" style="fill:#6E675A">死</text>
  <rect class="s1-live" x="277" y="55" width="56" height="28" rx="2"/>
  <text class="s1-mono" x="305" y="74" font-size="9.5" text-anchor="middle">活</text>
  <rect class="s1-dead" x="94" y="89" width="56" height="28" rx="2"/>
  <text class="s1-mono" x="122" y="108" font-size="9.5" text-anchor="middle" style="fill:#6E675A">死</text>
  <rect class="s1-dead" x="155" y="89" width="56" height="28" rx="2"/>
  <text class="s1-mono" x="183" y="108" font-size="9.5" text-anchor="middle" style="fill:#6E675A">死</text>
  <rect class="s1-live" x="216" y="89" width="56" height="28" rx="2"/>
  <text class="s1-mono" x="244" y="108" font-size="9.5" text-anchor="middle">活</text>
  <rect class="s1-dead" x="277" y="89" width="56" height="28" rx="2"/>
  <text class="s1-mono" x="305" y="108" font-size="9.5" text-anchor="middle" style="fill:#6E675A">死</text>

  <rect class="s1-empty" x="460" y="48" width="252" height="76" rx="2"/>
  <text class="s1-small" x="586" y="90" font-size="10" text-anchor="middle">空闲</text>

  <rect class="s1-space" x="88" y="174" width="252" height="76" rx="2"/>
  <rect class="s1-live" x="94" y="181" width="56" height="28" rx="2"/>
  <text class="s1-mono" x="122" y="200" font-size="9.5" text-anchor="middle">活</text>
  <rect class="s1-dead" x="155" y="181" width="56" height="28" rx="2"/>
  <text class="s1-mono" x="183" y="200" font-size="9.5" text-anchor="middle" style="fill:#6E675A">死</text>
  <rect class="s1-dead" x="216" y="181" width="56" height="28" rx="2"/>
  <text class="s1-mono" x="244" y="200" font-size="9.5" text-anchor="middle" style="fill:#6E675A">死</text>
  <rect class="s1-live" x="277" y="181" width="56" height="28" rx="2"/>
  <text class="s1-mono" x="305" y="200" font-size="9.5" text-anchor="middle">活</text>
  <rect class="s1-dead" x="94" y="215" width="56" height="28" rx="2"/>
  <text class="s1-mono" x="122" y="234" font-size="9.5" text-anchor="middle" style="fill:#6E675A">死</text>
  <rect class="s1-dead" x="155" y="215" width="56" height="28" rx="2"/>
  <text class="s1-mono" x="183" y="234" font-size="9.5" text-anchor="middle" style="fill:#6E675A">死</text>
  <rect class="s1-live" x="216" y="215" width="56" height="28" rx="2"/>
  <text class="s1-mono" x="244" y="234" font-size="9.5" text-anchor="middle">活</text>
  <rect class="s1-dead" x="277" y="215" width="56" height="28" rx="2"/>
  <text class="s1-mono" x="305" y="234" font-size="9.5" text-anchor="middle" style="fill:#6E675A">死</text>

  <line x1="344" y1="212" x2="452" y2="212" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#s1-cin)"/>
  <text class="s1-small" x="398" y="198" font-size="9.5" text-anchor="middle" style="fill:#B03A2E">只搬活对象</text>
  <text class="s1-small" x="398" y="232" font-size="9.5" text-anchor="middle">死对象不处理</text>

  <rect class="s1-empty" x="460" y="174" width="252" height="76" rx="2"/>
  <rect class="s1-live" x="466" y="181" width="56" height="28" rx="2"/>
  <text class="s1-mono" x="494" y="200" font-size="9.5" text-anchor="middle">活</text>
  <rect class="s1-live" x="527" y="181" width="56" height="28" rx="2"/>
  <text class="s1-mono" x="555" y="200" font-size="9.5" text-anchor="middle">活</text>
  <rect class="s1-live" x="588" y="181" width="56" height="28" rx="2"/>
  <text class="s1-mono" x="616" y="200" font-size="9.5" text-anchor="middle">活</text>

  <rect class="s1-empty" x="88" y="300" width="252" height="76" rx="2"/>
  <text class="s1-small" x="214" y="342" font-size="10" text-anchor="middle">整块作废 · 可直接复用</text>

  <rect class="s1-space" x="460" y="300" width="252" height="76" rx="2"/>
  <rect class="s1-live" x="466" y="307" width="56" height="28" rx="2"/>
  <text class="s1-mono" x="494" y="326" font-size="9.5" text-anchor="middle">活</text>
  <rect class="s1-live" x="527" y="307" width="56" height="28" rx="2"/>
  <text class="s1-mono" x="555" y="326" font-size="9.5" text-anchor="middle">活</text>
  <rect class="s1-live" x="588" y="307" width="56" height="28" rx="2"/>
  <text class="s1-mono" x="616" y="326" font-size="9.5" text-anchor="middle">活</text>
  <rect class="s1-empty" x="649" y="307" width="56" height="28" rx="2"/>

  <text class="s1-small" x="400" y="398" font-size="10.5" text-anchor="middle" style="fill:#B03A2E">From 与 To 交换角色 —— 下一轮往反方向搬，所以两个半空间都要占着</text>

</svg>
