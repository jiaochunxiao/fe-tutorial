<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 220" width="100%" role="img" aria-labelledby="n9dt n9dd">
  <title id="n9dt">实时通信的选型决策树</title>
  <desc id="n9dd">第一个问题不是「用不用 WebSocket」，而是「需不需要服务端主动推」。如果只需要服务器单向推，比如行情、通知、AI 流式输出，SSE 就够了，它基于普通 HTTP，自带重连。如果需要双向，才考虑 WebSocket。但很多所谓「双向」其实是频繁请求加推送，这种场景普通 HTTP 配 SSE 往往更简单可靠，别为了一个场景背上一整套长连接的运维成本。</desc>

  <style>
    .n9d-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.3}
    .n9d-ok{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.3}
    .n9d-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .n9d-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .n9d-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="n9d-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="n9d-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <rect class="n9d-box" x="180" y="16" width="380" height="34" rx="3"/>
  <text class="n9d-t" x="370" y="38" font-size="9" text-anchor="middle">需要服务端「主动推」吗？</text>

  <path d="M280 50 V72 H150 V86" fill="none" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#n9d-ink)"/>
  <text class="n9d-s" x="160" y="68" font-size="7.5">否 · 只要单向推</text>
  <path d="M460 50 V72 H590 V86" fill="none" stroke="#B03A2E" stroke-width="1.4" marker-end="url(#n9d-red)"/>
  <text class="n9d-s" x="500" y="68" font-size="7.5" style="fill:#B03A2E">是 · 要双向</text>

  <rect class="n9d-ok" x="40" y="90" width="220" height="44" rx="3"/>
  <text class="n9d-t" x="150" y="110" font-size="9" text-anchor="middle">SSE</text>
  <text class="n9d-s" x="150" y="125" font-size="7.5" text-anchor="middle">行情 / 通知 / AI 流式输出</text>

  <rect class="n9d-box" x="480" y="90" width="220" height="44" rx="3"/>
  <text class="n9d-t" x="590" y="110" font-size="9" text-anchor="middle">WebSocket</text>
  <text class="n9d-s" x="590" y="125" font-size="7.5" text-anchor="middle">聊天 / 游戏 / 协同编辑</text>

  <path d="M590 134 V156 H370 V170" fill="none" stroke="#B03A2E" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#n9d-red)"/>
  <text class="n9d-s" x="404" y="152" font-size="7.5" style="fill:#B03A2E">但先问一句：这个「双向」是真的双向吗</text>

  <rect class="n9d-box" x="180" y="174" width="380" height="34" rx="3"/>
  <text class="n9d-t" x="370" y="190" font-size="8.5" text-anchor="middle">若「双向」= 频繁请求 + 推送</text>
  <text class="n9d-s" x="370" y="203" font-size="7.5" text-anchor="middle">（多数 CRUD + 通知场景都是这样）</text>

  <text class="n9d-t" x="40" y="196" font-size="8.5" style="fill:#B03A2E">普通 HTTP + SSE</text>
  <text class="n9d-s" x="40" y="210" font-size="7.5">常常更简单、更可靠</text>
</svg>
