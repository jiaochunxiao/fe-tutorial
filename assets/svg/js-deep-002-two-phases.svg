<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 28 740 278" width="100%" role="img" aria-labelledby="vo2t vo2d">
  <title id="vo2t">执行上下文的两个阶段与变量对象</title>
  <desc id="vo2d">创建阶段先建好变量对象、作用域链和 this，此时只把形参、函数声明、变量声明的名字登记进去，变量值还是 undefined。执行阶段才逐行求值，把值写进同一张表。所以代码没有被移动，只是名字的处理时机提前了。</desc>

  <style>
    .vo2-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .vo2-key{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.6}
    .vo2-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .vo2-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="vo2-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <rect class="vo2-box" x="56" y="44" width="252" height="116" rx="3"/>
  <text class="vo2-t" x="72" y="70" font-size="12">阶段一 · 创建</text>
  <text class="vo2-s" x="72" y="96" font-size="10.5">创建变量对象</text>
  <text class="vo2-s" x="72" y="118" font-size="10.5">初始化作用域链</text>
  <text class="vo2-s" x="72" y="140" font-size="10.5">确定 this</text>

  <line x1="312" y1="102" x2="424" y2="102" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#vo2-ink)"/>

  <rect class="vo2-box" x="432" y="44" width="252" height="116" rx="3"/>
  <text class="vo2-t" x="448" y="70" font-size="12">阶段二 · 执行</text>
  <text class="vo2-s" x="448" y="96" font-size="10.5">逐条语句求值</text>
  <text class="vo2-s" x="448" y="118" font-size="10.5">赋值、运算、函数调用</text>
  <text class="vo2-s" x="448" y="140" font-size="10.5">改的是那张表里的值</text>

  <path d="M182 160 V196 H330 V202" fill="none" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#vo2-ink)"/>
  <text class="vo2-s" x="196" y="189" font-size="9.5">只登记名字</text>

  <path d="M558 160 V196 H410 V202" fill="none" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#vo2-ink)"/>
  <text class="vo2-s" x="544" y="189" font-size="9.5" text-anchor="end">这时才写值</text>

  <rect class="vo2-key" x="250" y="206" width="240" height="64" rx="3"/>
  <text class="vo2-t" x="266" y="232" font-size="11.5">变量对象 AO</text>
  <text class="vo2-s" x="266" y="254" font-size="10">形参 / 函数声明 / 变量声明</text>

  <text class="vo2-s" x="370" y="292" font-size="9.5" text-anchor="middle">代码没有被挪动，只是名字的登记时间提前到了执行之前</text>

</svg>
