<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 44 740 248" width="100%" role="img" aria-labelledby="tc2t tc2d">
  <title id="tc2t">类型判断的选择树：判断目标决定用哪种手段</title>
  <desc id="tc2d">判断原始类型用 typeof，但 null 要单独用全等比较；判断数组用 Array.isArray，跨 realm 也稳，instanceof 会失灵；判断 NaN 用 Number.isNaN，全局 isNaN 会先做类型转换；判断 null 或 undefined 用等号比较；要细分任意对象类型用 Object.prototype.toString.call，它读的是内部槽标签，但标签可以被 Symbol.toStringTag 伪造。</desc>

  <style>
    .tc2-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .tc2-pill{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.2}
    .tc2-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .tc2-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .tc2-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="tc2-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="tc2-s" x="212" y="54" font-size="9">要判断什么</text>
  <text class="tc2-s" x="408" y="54" font-size="9" text-anchor="middle">首选手段</text>
  <text class="tc2-s" x="496" y="54" font-size="9">注意</text>

  <rect class="tc2-box" x="36" y="142" width="104" height="36" rx="3"/>
  <text class="tc2-t" x="88" y="165" font-size="9.5" text-anchor="middle">要判断什么？</text>

  <line x1="140" y1="160" x2="176" y2="160" stroke="#1C1A17" stroke-width="1.4"/>
  <line x1="176" y1="76" x2="176" y2="244" stroke="#1C1A17" stroke-width="1.4"/>

  <line x1="176" y1="76" x2="204" y2="76" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#tc2-ink)"/>
  <line x1="176" y1="118" x2="204" y2="118" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#tc2-ink)"/>
  <line x1="176" y1="160" x2="204" y2="160" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#tc2-ink)"/>
  <line x1="176" y1="202" x2="204" y2="202" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#tc2-ink)"/>
  <line x1="176" y1="244" x2="204" y2="244" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#tc2-ink)"/>

  <text class="tc2-t" x="212" y="80" font-size="9.5">原始类型</text>
  <text class="tc2-t" x="212" y="122" font-size="9.5">数组</text>
  <text class="tc2-t" x="212" y="164" font-size="9.5">NaN</text>
  <text class="tc2-t" x="212" y="206" font-size="9.5">null / undefined</text>
  <text class="tc2-t" x="212" y="248" font-size="9.5">任意对象细分</text>

  <rect class="tc2-pill" x="336" y="64" width="144" height="24" rx="12"/>
  <text class="tc2-mono" x="408" y="80" font-size="10" text-anchor="middle">typeof</text>
  <rect class="tc2-pill" x="336" y="106" width="144" height="24" rx="12"/>
  <text class="tc2-mono" x="408" y="122" font-size="10" text-anchor="middle">Array.isArray</text>
  <rect class="tc2-pill" x="336" y="148" width="144" height="24" rx="12"/>
  <text class="tc2-mono" x="408" y="164" font-size="10" text-anchor="middle">Number.isNaN</text>
  <rect class="tc2-pill" x="336" y="190" width="144" height="24" rx="12"/>
  <text class="tc2-mono" x="408" y="206" font-size="10" text-anchor="middle">== null</text>
  <rect class="tc2-pill" x="336" y="232" width="144" height="24" rx="12"/>
  <text class="tc2-mono" x="408" y="248" font-size="10" text-anchor="middle">toString.call</text>

  <text class="tc2-s" x="496" y="79" font-size="9">null 是历史 bug，单独 === null</text>
  <text class="tc2-s" x="496" y="121" font-size="9">跨 realm 稳；instanceof 会失灵</text>
  <text class="tc2-s" x="496" y="163" font-size="9">全局 isNaN 会先做类型转换</text>
  <text class="tc2-s" x="496" y="205" font-size="9">一次命中两个空值</text>
  <text class="tc2-s" x="496" y="247" font-size="9">读内部槽，但标签可被伪造</text>

  <text class="tc2-s" x="36" y="278" font-size="9.5">没有一种手段能全覆盖 —— 组合起来用，才是答案</text>
</svg>
