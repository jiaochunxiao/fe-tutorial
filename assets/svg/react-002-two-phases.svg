<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 240" width="100%" role="img" aria-labelledby="p1t p1d">
  <title id="p1t">React 的 render 阶段与 commit 阶段</title>
  <desc id="p1d">setState 触发后进入 render 阶段：组件函数重跑得到新元素，Hooks 读取与登记，Diff 旧 Fiber 标记 EffectTag，产出变更列表。这个阶段是纯计算、可中断。变更列表交给 commit 阶段，它同步且不可中断，依次执行 Before Mutation、Mutation 改 DOM、Layout 三个小步骤，最后把 useEffect 交给异步调度。</desc>

  <style>
    .p1-serif{font-family:'Noto Serif SC','Songti SC','SimSun',serif;fill:#1C1A17}
    .p1-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .p1-sans{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="p1-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="p1-cin" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <!-- 触发 -->
  <rect x="20" y="8" width="280" height="24" rx="2" fill="none" stroke="#6E675A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text class="p1-mono" x="160" y="24" font-size="10.5" text-anchor="middle">触发：setState / 父组件渲染</text>
  <line x1="160" y1="32" x2="160" y2="42" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#p1-ink)"/>

  <!-- render 阶段 -->
  <rect x="20" y="44" width="280" height="184" rx="2" fill="#FBF7EE" stroke="#1C1A17" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text class="p1-serif" x="36" y="68" font-size="13">render 阶段</text>
  <text class="p1-sans" x="36" y="84" font-size="10" style="fill:#B03A2E">可中断 · 纯计算</text>

  <text class="p1-mono" x="36" y="112" font-size="11.5">组件函数重跑</text>
  <text class="p1-sans" x="36" y="126" font-size="9.5">→ 得到新的 React 元素</text>

  <text class="p1-mono" x="36" y="146" font-size="11.5">Hooks 执行 / 登记</text>
  <text class="p1-sans" x="36" y="160" font-size="9.5">useState 读取 · useEffect 排队</text>

  <text class="p1-mono" x="36" y="180" font-size="11.5">Diff 旧 Fiber</text>
  <text class="p1-sans" x="36" y="194" font-size="9.5">→ 标 EffectTag：复用 / 更新 / 新增 / 删除</text>

  <line x1="36" y1="204" x2="284" y2="204" stroke="#CDC4AF" stroke-width="1"/>
  <text class="p1-mono" x="36" y="220" font-size="11" style="fill:#B03A2E">产出：变更列表 Effect List</text>

  <!-- 变更列表交给 commit -->
  <path d="M300 213 H360 V112 H414" fill="none" stroke="#B03A2E" stroke-width="1.6" marker-end="url(#p1-cin)"/>

  <!-- commit 阶段 -->
  <rect x="420" y="44" width="300" height="184" rx="2" fill="#FBF7EE" stroke="#1C1A17" stroke-width="1.6"/>
  <text class="p1-serif" x="436" y="68" font-size="13">commit 阶段</text>
  <text class="p1-sans" x="436" y="84" font-size="10">同步 · 不可中断</text>

  <text class="p1-mono" x="436" y="112" font-size="11.5">① Before Mutation</text>
  <text class="p1-sans" x="436" y="126" font-size="9.5">读旧 DOM 的最后机会</text>

  <text class="p1-mono" x="436" y="146" font-size="11.5">② Mutation</text>
  <text class="p1-sans" x="436" y="160" font-size="9.5">插入 / 移动 / 删除节点</text>

  <text class="p1-mono" x="436" y="180" font-size="11.5">③ Layout</text>
  <text class="p1-sans" x="436" y="194" font-size="9.5">DidMount · DidUpdate · useLayoutEffect</text>

  <line x1="436" y1="204" x2="704" y2="204" stroke="#CDC4AF" stroke-width="1"/>
  <text class="p1-mono" x="436" y="220" font-size="11" style="fill:#6E675A">→ useEffect 交给异步调度</text>
</svg>
