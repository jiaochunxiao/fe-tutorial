<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 292" width="100%" role="img" aria-labelledby="v2dt v2dd">
  <title id="v2dt">Vue 2 双端比较、Vue 3 最长递增子序列，以及 key 的三条军规</title>
  <desc id="v2dd">Vue 2 用双端比较：新旧列表各持头尾指针，依次试头头、尾尾、旧头新尾、旧尾新头四组，命中就 patch 并移动，都不中就用 key 在旧列表里查找，循环结束后对剩余部分批量增删。Vue 3 先同步头尾相同部分，再对中间乱序区间建 key 索引，求出每个新节点的旧下标序列，取最长递增子序列，该子序列对应的节点保持不动，只移动其余节点，从而得到理论最少移动次数。key 必须唯一且稳定，用数组下标会错位复用丢失状态，用随机值会全量重建。</desc>

  <style>
    .v2d-c{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1}
    .v2d-m{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .v2d-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .v2d-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .v2d-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="v2d-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="v2d-t" x="40" y="26" font-size="8.5">两家用不同策略逼近同一个目标：移动最少的节点</text>

  <text class="v2d-t" x="40" y="46" font-size="8.5">Vue 2 · 双端比较</text>

  <text class="v2d-s" x="40" y="68" font-size="7.5">旧</text>
  <rect class="v2d-c" x="72" y="54" width="42" height="24" rx="1"/>
  <text class="v2d-mono" x="93" y="70" font-size="8" text-anchor="middle">a</text>
  <rect class="v2d-c" x="120" y="54" width="42" height="24" rx="1"/>
  <text class="v2d-mono" x="141" y="70" font-size="8" text-anchor="middle">b</text>
  <rect class="v2d-c" x="168" y="54" width="42" height="24" rx="1"/>
  <text class="v2d-mono" x="189" y="70" font-size="8" text-anchor="middle">c</text>
  <rect class="v2d-c" x="216" y="54" width="42" height="24" rx="1"/>
  <text class="v2d-mono" x="237" y="70" font-size="8" text-anchor="middle">d</text>

  <text class="v2d-s" x="40" y="100" font-size="7.5">新</text>
  <rect class="v2d-m" x="72" y="86" width="42" height="24" rx="1"/>
  <text class="v2d-mono" x="93" y="102" font-size="8" text-anchor="middle">d</text>
  <rect class="v2d-m" x="120" y="86" width="42" height="24" rx="1"/>
  <text class="v2d-mono" x="141" y="102" font-size="8" text-anchor="middle">a</text>
  <rect class="v2d-m" x="168" y="86" width="42" height="24" rx="1"/>
  <text class="v2d-mono" x="189" y="102" font-size="8" text-anchor="middle">b</text>
  <rect class="v2d-m" x="216" y="86" width="42" height="24" rx="1"/>
  <text class="v2d-mono" x="237" y="102" font-size="8" text-anchor="middle">c</text>

  <text class="v2d-s" x="300" y="62" font-size="7.5">四试：头头 · 尾尾 · 旧头新尾 · 旧尾新头 → 命中就 patch 并收缩指针</text>
  <text class="v2d-s" x="300" y="78" font-size="7.5">都不中 → 用 key 在旧列表里查</text>
  <text class="v2d-s" x="300" y="94" font-size="7.5">循环结束 → 剩余部分批量增删</text>

  <line x1="40" y1="122" x2="700" y2="122" stroke="#CDC4AF" stroke-width="1"/>

  <text class="v2d-t" x="40" y="142" font-size="8.5">Vue 3 · 同步头尾 + key 索引 + 最长递增子序列</text>

  <rect class="v2d-c" x="40" y="150" width="120" height="44" rx="2"/>
  <text class="v2d-t" x="100" y="168" font-size="8" text-anchor="middle">① 同步头尾</text>
  <text class="v2d-s" x="100" y="182" font-size="7" text-anchor="middle">相同就 patch</text>
  <line x1="160" y1="172" x2="176" y2="172" stroke="#1C1A17" stroke-width="1" marker-end="url(#v2d-ink)"/>

  <rect class="v2d-c" x="180" y="150" width="120" height="44" rx="2"/>
  <text class="v2d-t" x="240" y="168" font-size="8" text-anchor="middle">② key 索引</text>
  <text class="v2d-s" x="240" y="182" font-size="7" text-anchor="middle">中间区间建表</text>
  <line x1="300" y1="172" x2="316" y2="172" stroke="#1C1A17" stroke-width="1" marker-end="url(#v2d-ink)"/>

  <rect class="v2d-c" x="320" y="150" width="120" height="44" rx="2"/>
  <text class="v2d-t" x="380" y="168" font-size="8" text-anchor="middle">③ 旧下标序列</text>
  <text class="v2d-s" x="380" y="182" font-size="7" text-anchor="middle">[1, 2, 0, -]</text>
  <line x1="440" y1="172" x2="456" y2="172" stroke="#1C1A17" stroke-width="1" marker-end="url(#v2d-ink)"/>

  <rect class="v2d-c" x="460" y="150" width="120" height="44" rx="2"/>
  <text class="v2d-t" x="520" y="168" font-size="8" text-anchor="middle">④ 求 LIS</text>
  <text class="v2d-s" x="520" y="182" font-size="7" text-anchor="middle">[1, 2] 保持不动</text>
  <line x1="580" y1="172" x2="596" y2="172" stroke="#1C1A17" stroke-width="1" marker-end="url(#v2d-ink)"/>

  <rect class="v2d-c" x="600" y="150" width="120" height="44" rx="2"/>
  <text class="v2d-t" x="660" y="168" font-size="8" text-anchor="middle">⑤ 只移非 LIS</text>
  <text class="v2d-s" x="660" y="182" font-size="7" text-anchor="middle">移动数 = 区间 − LIS</text>

  <line x1="40" y1="210" x2="700" y2="210" stroke="#CDC4AF" stroke-width="1"/>

  <text class="v2d-t" x="40" y="230" font-size="8.5">key 军规</text>

  <rect class="v2d-c" x="40" y="238" width="200" height="28" rx="2"/>
  <text class="v2d-t" x="140" y="256" font-size="7.5" text-anchor="middle">唯一 + 稳定的业务 id ✓</text>
  <rect class="v2d-c" x="260" y="238" width="200" height="28" rx="2" style="stroke:#B03A2E"/>
  <text class="v2d-t" x="360" y="256" font-size="7.5" text-anchor="middle" style="fill:#B03A2E">数组 index ✕ 错位复用</text>
  <rect class="v2d-c" x="480" y="238" width="220" height="28" rx="2" style="stroke:#B03A2E"/>
  <text class="v2d-t" x="590" y="256" font-size="7.5" text-anchor="middle" style="fill:#B03A2E">随机值 ✕ 每次都全量重建</text>

  <text class="v2d-t" x="40" y="284" font-size="8.5">三个共同前提：只做同层比较 · 类型不同直接替换 · 用 key 认节点。</text>
</svg>
