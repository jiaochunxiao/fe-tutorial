<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 740 310" width="100%" role="img" aria-labelledby="ee6t ee6d">
  <title id="ee6t">EventEmitter 的中间人结构：登记与通知</title>
  <desc id="ee6d">事件中心内部是一个 Map，键是事件名，值是该事件的监听器数组。订阅者通过 on 或 once 把函数压进数组，发布者只管 emit 一个事件名，取快照后同步逐个调用数组里的函数。发布者不知道订阅者是谁，订阅者之间也互不相识，事件名就是那个中间人。</desc>

  <style>
    .ee6-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .ee6-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .ee6-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .ee6-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="ee6-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="ee6-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="ee6-s" x="150" y="50" font-size="9">事件中心</text>
  <rect class="ee6-box" x="150" y="58" width="440" height="64" rx="3"/>
  <text class="ee6-mono" x="170" y="86" font-size="10.5">Map { 'open': [fn1, fn2, onceWrapper] }</text>
  <text class="ee6-s" x="430" y="86" font-size="9">同一事件可挂多个</text>
  <text class="ee6-s" x="170" y="106" font-size="9">事件名 → 监听器数组，数组空了就把键删掉</text>

  <line x1="170" y1="122" x2="170" y2="194" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#ee6-red)"/>
  <text class="ee6-t" x="182" y="148" font-size="10">通知</text>
  <text class="ee6-s" x="182" y="164" font-size="9">同步逐个调用</text>

  <line x1="290" y1="194" x2="290" y2="124" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#ee6-ink)"/>
  <text class="ee6-mono" x="302" y="148" font-size="10">on / once</text>
  <text class="ee6-s" x="302" y="164" font-size="9">压进数组</text>

  <line x1="520" y1="194" x2="520" y2="124" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#ee6-ink)"/>
  <text class="ee6-mono" x="508" y="148" font-size="10" text-anchor="end">emit('open', …args)</text>
  <text class="ee6-s" x="508" y="164" font-size="9" text-anchor="end">取快照，再挨个调</text>

  <rect class="ee6-box" x="110" y="196" width="220" height="56" rx="3"/>
  <text class="ee6-t" x="220" y="220" font-size="10.5" text-anchor="middle">订阅者 B / C / D</text>
  <text class="ee6-s" x="220" y="238" font-size="9" text-anchor="middle">彼此也互不相识</text>

  <rect class="ee6-box" x="410" y="196" width="220" height="56" rx="3"/>
  <text class="ee6-t" x="520" y="220" font-size="10.5" text-anchor="middle">发布者 A</text>
  <text class="ee6-s" x="520" y="238" font-size="9" text-anchor="middle">只认事件名，不认人</text>

  <text class="ee6-s" x="110" y="280" font-size="9.5">A 不知道 B 存在 —— 事件名就是那个中间人</text>
  <text class="ee6-s" x="110" y="300" font-size="9.5">once = 包装函数：先 off 掉自己，再执行原函数</text>
  <text class="ee6-s" x="110" y="320" font-size="9.5">off = lastIndexOf 从后往前找；传原函数时靠 wrapper._original 映射回去</text>
</svg>
