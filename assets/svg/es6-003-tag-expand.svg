<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 262" width="100%" role="img" aria-labelledby="e63t e63d">
  <title id="e63t">标签模板的展开：静态片段数组 + 全部插值</title>
  <desc id="e63d">标签模板在函数名后面直接跟模板字符串，它完全等价于一次函数调用，只是参数被切成了两组：第一组是静态片段数组，按插值的位置切好，还带一个 raw 属性保留原始转义；后面依次是每一个插值求值后的结果。这个切法把「可信的模板」和「不可信的变量」在参数层面就分开了，所以标签函数才能只对其中一组做处理。</desc>

  <style>
    .e63-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.3}
    .e63-alt{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.3}
    .e63-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .e63-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .e63-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="e63-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="e63-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="e63-mono" x="40" y="34" font-size="10">tag`A${x}B${y}C`</text>
  <text class="e63-s" x="240" y="34" font-size="8">← 模板字符串直接跟在函数名后面</text>

  <path d="M170 44 V58" fill="none" stroke="#1C1A17" stroke-width="1.3"/>
  <path d="M170 58 H96 V80" fill="none" stroke="#1C1A17" stroke-width="1.3" marker-end="url(#e63-ink)"/>
  <path d="M170 58 H430 V80" fill="none" stroke="#B03A2E" stroke-width="1.3" marker-end="url(#e63-red)"/>

  <rect class="e63-box" x="40" y="86" width="280" height="34" rx="3"/>
  <text class="e63-mono" x="180" y="107" font-size="8.5" text-anchor="middle">['A', 'B', 'C']</text>
  <text class="e63-s" x="40" y="136" font-size="7.5">静态片段：按插值位置切好，还带 <tspan class="e63-mono" font-size="7.5">raw</tspan> 保留原始转义</text>
  <text class="e63-t" x="40" y="152" font-size="7.5" style="fill:#B03A2E">这一段是「可信」的 —— 来自源码，不是用户输入</text>

  <rect class="e63-alt" x="340" y="86" width="180" height="34" rx="3"/>
  <text class="e63-mono" x="430" y="107" font-size="8.5" text-anchor="middle">x, y</text>
  <text class="e63-s" x="340" y="136" font-size="7.5">全部插值：求值后按顺序铺在后面</text>
  <text class="e63-t" x="340" y="152" font-size="7.5" style="fill:#B03A2E">这一段是「不可信」的 —— 必须处理</text>

  <line x1="40" y1="172" x2="700" y2="172" stroke="#CDC4AF" stroke-width="1"/>

  <text class="e63-s" x="40" y="194" font-size="8.5">等价于</text>
  <text class="e63-mono" x="100" y="194" font-size="9">tag(['A', 'B', 'C'], x, y)</text>
  <text class="e63-s" x="300" y="194" font-size="8">—— 没有魔法，就是一次普通调用，参数被切成了两组</text>

  <text class="e63-s" x="40" y="222" font-size="8.5">所以「标签函数」能做的事，本质上是「能分别拿到这两组」：只碰 values 可以转义，只碰 strings 可以查词表，两个一起用可以编译成新东西。</text>
  <text class="e63-t" x="40" y="248" font-size="8.5" style="fill:#B03A2E">插值的个数永远等于静态片段个数减一 —— 这个不变量让「拼回去」不会错位。</text>
</svg>
