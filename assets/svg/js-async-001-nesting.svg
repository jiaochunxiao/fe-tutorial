<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="100%" role="img" aria-labelledby="a1nt a1nd">
  <title id="a1nt">回调地狱的成因：依赖关系只能靠嵌套表达</title>
  <desc id="a1nd">三步接口 getUser、getOrders、getDetail 之间有先后依赖：后一步必须拿到前一步的结果才能发起。在回调模型里，这个「必须等」只能用「写在上一层的回调里」来表达，于是代码每深一层依赖就多缩进一级。右边那列说明：这不是排版审美问题，是「下一步」没有办法作为值传出去，只能作为嵌套传下去。</desc>

  <style>
    .a1n-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.3}
    .a1n-band{fill:none;stroke:#CDC4AF;stroke-width:1.1}
    .a1n-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .a1n-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .a1n-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="a1n-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="a1n-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <rect class="a1n-box" x="40" y="18" width="150" height="32" rx="3"/>
  <text class="a1n-mono" x="115" y="39" font-size="9" text-anchor="middle">getUser</text>
  <line x1="190" y1="34" x2="246" y2="34" stroke="#1C1A17" stroke-width="1.5" marker-end="url(#a1n-ink)"/>
  <text class="a1n-s" x="218" y="28" font-size="7.5" text-anchor="middle">依赖</text>

  <rect class="a1n-box" x="250" y="18" width="160" height="32" rx="3"/>
  <text class="a1n-mono" x="330" y="39" font-size="9" text-anchor="middle">getOrders</text>
  <line x1="410" y1="34" x2="466" y2="34" stroke="#1C1A17" stroke-width="1.5" marker-end="url(#a1n-ink)"/>
  <text class="a1n-s" x="438" y="28" font-size="7.5" text-anchor="middle">依赖</text>

  <rect class="a1n-box" x="470" y="18" width="160" height="32" rx="3"/>
  <text class="a1n-mono" x="550" y="39" font-size="9" text-anchor="middle">getDetail</text>

  <text class="a1n-t" x="40" y="72" font-size="8.5" style="fill:#B03A2E">每一段依赖，就多一层缩进 —— 依赖有多长，金字塔就有多深</text>

  <rect class="a1n-band" x="40" y="92" width="470" height="194" rx="2"/>
  <rect class="a1n-band" x="62" y="116" width="426" height="146" rx="2"/>
  <rect class="a1n-band" x="84" y="140" width="382" height="74" rx="2"/>

  <text class="a1n-mono" x="52" y="110" font-size="8.5">getUser(id, (err, user) =&gt; {</text>
  <text class="a1n-mono" x="74" y="134" font-size="8.5">getOrders(user.id, (err, orders) =&gt; {</text>
  <text class="a1n-mono" x="96" y="158" font-size="8.5">getDetail(orders[0].id, (err, d) =&gt; {</text>
  <text class="a1n-s" x="96" y="178" font-size="8.5">render(d)</text>
  <text class="a1n-mono" x="96" y="198" font-size="8.5">})</text>
  <text class="a1n-mono" x="74" y="232" font-size="8.5">})</text>
  <text class="a1n-mono" x="52" y="268" font-size="8.5">})</text>

  <text class="a1n-t" x="524" y="146" font-size="8.5" style="fill:#B03A2E">依赖有多长，</text>
  <text class="a1n-t" x="524" y="162" font-size="8.5" style="fill:#B03A2E">缩进就有多深</text>
  <text class="a1n-s" x="524" y="186" font-size="8">这不是排版问题，</text>
  <text class="a1n-s" x="524" y="202" font-size="8">是「下一步」传不出去</text>
  <text class="a1n-s" x="524" y="218" font-size="8">只能往下写</text>

  <line x1="40" y1="302" x2="40" y2="318" stroke="#B03A2E" stroke-width="2.4"/>
  <text class="a1n-s" x="54" y="312" font-size="8.5">解药不是「少写几层」，是让「下一步」能作为值传出去 —— 那就是 Promise</text>
</svg>
