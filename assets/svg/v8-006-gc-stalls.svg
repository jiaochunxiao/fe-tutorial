<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" role="img" aria-labelledby="g1t g1d">
  <title id="g1t">GC 停顿的四种做法</title>
  <desc id="g1d">全量 STW 一次停一百毫秒；增量标记把停顿拆成多个小段穿插在 JS 之间；并发标记把大头搬到后台线程；并行压缩用多线程缩短必须停顿的窗口。</desc>
  <defs>
    <pattern id="g1-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#B03A2E" stroke-width="1.4" opacity="0.55"/>
    </pattern>
  </defs>

  <style>
    .g1-js{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.2}
    .g1-mark{fill:#DDB9B1;stroke:#B03A2E;stroke-width:1.2}
    .g1-bg{fill:#F3E6E2;stroke:#B03A2E;stroke-width:1.2}
    .g1-lbl{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;font-size:11px;fill:#1C1A17}
    .g1-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <!-- ① 全量 STW -->
  <text class="g1-lbl" x="150" y="66" text-anchor="end">全量 STW</text>
  <rect class="g1-js" x="165" y="48" width="40" height="30"/>
  <text class="g1-small" x="185" y="68" font-size="9.5" text-anchor="middle">JS</text>
  <rect class="g1-mark" x="205" y="48" width="415" height="30"/>
  <text class="g1-lbl" x="412" y="68" font-size="10.5" text-anchor="middle" style="fill:#B03A2E">标记 100ms · 主线程全程停住</text>
  <rect class="g1-js" x="620" y="48" width="110" height="30"/>
  <text class="g1-small" x="675" y="68" font-size="9.5" text-anchor="middle">JS</text>
  <text class="g1-small" x="150" y="82" font-size="9.5" text-anchor="end" style="fill:#B03A2E">毛刺元凶</text>

  <!-- ② 增量标记 -->
  <text class="g1-lbl" x="150" y="120" text-anchor="end">增量标记</text>
  <g>
    <rect class="g1-js" x="165" y="104" width="40" height="30"/>
    <rect class="g1-mark" x="205" y="104" width="14" height="30"/>
    <rect class="g1-js" x="219" y="104" width="40" height="30"/>
    <rect class="g1-mark" x="259" y="104" width="14" height="30"/>
    <rect class="g1-js" x="273" y="104" width="40" height="30"/>
    <rect class="g1-mark" x="313" y="104" width="14" height="30"/>
    <rect class="g1-js" x="327" y="104" width="40" height="30"/>
    <rect class="g1-mark" x="367" y="104" width="14" height="30"/>
    <rect class="g1-js" x="381" y="104" width="40" height="30"/>
    <rect class="g1-mark" x="421" y="104" width="14" height="30"/>
    <rect class="g1-js" x="435" y="104" width="40" height="30"/>
    <rect class="g1-mark" x="475" y="104" width="14" height="30"/>
    <rect class="g1-js" x="489" y="104" width="40" height="30"/>
    <rect class="g1-mark" x="529" y="104" width="14" height="30"/>
    <rect class="g1-js" x="543" y="104" width="40" height="30"/>
    <rect class="g1-mark" x="583" y="104" width="14" height="30"/>
    <rect class="g1-js" x="597" y="104" width="40" height="30"/>
    <rect class="g1-mark" x="637" y="104" width="14" height="30"/>
    <rect class="g1-js" x="651" y="104" width="79" height="30"/>
  </g>
  <text class="g1-small" x="150" y="136" font-size="9.5" text-anchor="end">每次只停几毫秒</text>

  <!-- ③ 并发标记 -->
  <text class="g1-lbl" x="150" y="176" text-anchor="end">并发标记</text>
  <text class="g1-small" x="150" y="192" text-anchor="end" font-size="9.5">主线程</text>
  <rect class="g1-js" x="165" y="164" width="35" height="26"/>
  <text class="g1-small" x="182" y="181" font-size="8.5" text-anchor="middle">启</text>
  <rect class="g1-js" x="200" y="164" width="490" height="26"/>
  <text class="g1-small" x="445" y="181" font-size="9.5" text-anchor="middle">JS 自由跑</text>
  <rect class="g1-js" x="690" y="164" width="40" height="26"/>
  <text class="g1-small" x="710" y="181" font-size="8.5" text-anchor="middle">结</text>

  <text class="g1-small" x="150" y="222" text-anchor="end" font-size="9.5">后台线程</text>
  <rect class="g1-bg" x="200" y="206" width="490" height="26"/>
  <rect x="200" y="206" width="490" height="26" fill="url(#g1-hatch)"/>
  <text class="g1-lbl" x="445" y="223" font-size="10" text-anchor="middle" style="fill:#B03A2E">标记 / 清理（与 JS 并行）</text>

  <!-- ④ 并行压缩 -->
  <text class="g1-lbl" x="150" y="266" text-anchor="end">并行压缩</text>
  <rect class="g1-js" x="165" y="250" width="40" height="30"/>
  <text class="g1-small" x="185" y="270" font-size="9.5" text-anchor="middle">JS</text>
  <rect class="g1-mark" x="205" y="250" width="60" height="30"/>
  <rect x="205" y="250" width="60" height="30" fill="url(#g1-hatch)"/>
  <text class="g1-lbl" x="235" y="270" font-size="9" text-anchor="middle" style="fill:#B03A2E">多线程</text>
  <rect class="g1-js" x="265" y="250" width="465" height="30"/>
  <text class="g1-small" x="497" y="270" font-size="9.5" text-anchor="middle">JS 继续跑</text>
  <text class="g1-small" x="150" y="282" font-size="9.5" text-anchor="end">必停窗口最短</text>

</svg>
