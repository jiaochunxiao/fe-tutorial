<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 48 740 306" width="100%" role="img" aria-labelledby="px8t px8d">
  <title id="px8t">Proxy 的拦截层：外界操作先进 handler，再落到 target</title>
  <desc id="px8d">外界的读取、赋值、in 判断和 new 调用都先撞上 Proxy 的 handler。handler 里没拦的操作转发给 Reflect 执行默认行为，Reflect 必须带上 receiver 才能让继承链上 getter 的 this 指向实际操作对象。最终真正被读写的仍然是 target 对象。Vue3 的响应式就是在 get 里 track、set 里 trigger。</desc>

  <style>
    .px8-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .px8-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .px8-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .px8-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="px8-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <rect class="px8-box" x="120" y="60" width="200" height="36" rx="3"/>
  <text class="px8-t" x="220" y="83" font-size="9.5" text-anchor="middle">外界代码</text>

  <line x1="220" y1="96" x2="220" y2="114" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#px8-ink)"/>
  <text class="px8-mono" x="232" y="110" font-size="9">p.x · p.x = v · in · new p()</text>

  <rect class="px8-box" x="60" y="118" width="320" height="84" rx="3"/>
  <text class="px8-t" x="74" y="140" font-size="10">Proxy handler</text>
  <text class="px8-s" x="170" y="140" font-size="8.5">13 种拦截器，这里只看两个</text>
  <text class="px8-mono" x="74" y="168" font-size="9.5">get</text>
  <text class="px8-s" x="110" y="168" font-size="9">拦截读取 —— Vue3 在这里 track</text>
  <text class="px8-mono" x="74" y="190" font-size="9.5">set</text>
  <text class="px8-s" x="110" y="190" font-size="9">拦截赋值 —— 校验、通知更新</text>

  <line x1="380" y1="162" x2="434" y2="162" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#px8-ink)"/>
  <text class="px8-s" x="410" y="150" font-size="8.5" text-anchor="middle">默认行为</text>

  <rect class="px8-box" x="440" y="144" width="260" height="40" rx="3"/>
  <text class="px8-mono" x="452" y="169" font-size="8.5">Reflect.get(target, key, receiver)</text>

  <line x1="220" y1="202" x2="220" y2="236" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#px8-ink)"/>
  <line x1="570" y1="184" x2="570" y2="266" stroke="#1C1A17" stroke-width="1.4"/>
  <line x1="570" y1="266" x2="386" y2="266" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#px8-ink)"/>

  <rect class="px8-box" x="60" y="240" width="320" height="52" rx="3"/>
  <text class="px8-mono" x="74" y="272" font-size="10">target</text>
  <text class="px8-s" x="130" y="272" font-size="9">真正被读写的还是它</text>

  <text class="px8-s" x="40" y="318" font-size="9.5">转发时必须带 receiver —— 否则继承链上 getter / setter 的 this 会钉死在 target 上</text>
  <text class="px8-s" x="40" y="338" font-size="9.5">Vue3 = get 里 track（记住谁读了）+ set 里 trigger（通知谁重跑）+ 惰性深代理</text>
</svg>
