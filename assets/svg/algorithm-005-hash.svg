<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="100%" role="img" aria-labelledby="a5ht a5hd">
  <title id="a5ht">哈希表就是一个数组加一个把 key 变成下标的函数</title>
  <desc id="a5hd">左边三个 key 汇入一个 hash 函数，函数把 key 算成 0 到 6 的下标，再到数组对应的桶里取值，平均 O(1)。user:1 和 user:9 算出来都是下标 3，于是同一个桶里挂两个节点，这就是链地址法；另一种解法是开放寻址，往后找空位。负载因子超过阈值就全量 rehash，单次很贵但均摊仍是 O(1)。JS 里 Map 通常比普通对象更适合做算法题：键可以是任意类型、保持插入序、可直接迭代。</desc>

  <style>
    .a5h-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .a5h-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .a5h-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .a5h-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .a5h-m{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="a5h-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="a5h-t" x="40" y="26" font-size="8.5">哈希表 = 一个数组 + 一个把 key 变成下标的函数</text>

  <rect class="a5h-b" x="60" y="50" width="90" height="26" rx="2"/>
  <text class="a5h-m" x="105" y="67" font-size="7.5" text-anchor="middle">user:1</text>
  <rect class="a5h-b" x="60" y="86" width="90" height="26" rx="2"/>
  <text class="a5h-m" x="105" y="103" font-size="7.5" text-anchor="middle">user:9</text>
  <rect class="a5h-b" x="60" y="122" width="90" height="26" rx="2"/>
  <text class="a5h-m" x="105" y="139" font-size="7.5" text-anchor="middle">cart</text>

  <line x1="150" y1="63" x2="166" y2="63" stroke="#1C1A17" stroke-width="1.1"/>
  <line x1="150" y1="99" x2="166" y2="99" stroke="#1C1A17" stroke-width="1.1"/>
  <line x1="150" y1="135" x2="166" y2="135" stroke="#1C1A17" stroke-width="1.1"/>
  <line x1="166" y1="63" x2="166" y2="135" stroke="#1C1A17" stroke-width="1.1"/>
  <line x1="166" y1="99" x2="186" y2="99" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#a5h-ink)"/>

  <rect class="a5h-q" x="190" y="86" width="110" height="48" rx="2"/>
  <text class="a5h-m" x="245" y="106" font-size="8" text-anchor="middle">hash(key)</text>
  <text class="a5h-s" x="245" y="122" font-size="7" text-anchor="middle">% 7</text>

  <path d="M300 110 H333 V196" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#a5h-ink)"/>
  <path d="M300 110 H489 V196" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#a5h-ink)"/>

  <text class="a5h-s" x="40" y="192" font-size="7">下标</text>
  <text class="a5h-s" x="68" y="192" font-size="7">0</text>
  <text class="a5h-s" x="146" y="192" font-size="7">1</text>
  <text class="a5h-s" x="224" y="192" font-size="7">2</text>
  <text class="a5h-s" x="302" y="192" font-size="7" style="fill:#B03A2E">3</text>
  <text class="a5h-s" x="380" y="192" font-size="7">4</text>
  <text class="a5h-s" x="458" y="192" font-size="7" style="fill:#B03A2E">5</text>
  <text class="a5h-s" x="536" y="192" font-size="7">6</text>

  <rect class="a5h-b" x="60" y="200" width="78" height="44" rx="1"/>
  <rect class="a5h-b" x="138" y="200" width="78" height="44" rx="1"/>
  <rect class="a5h-b" x="216" y="200" width="78" height="44" rx="1"/>
  <rect class="a5h-b" x="294" y="200" width="78" height="44" rx="1"/>
  <rect class="a5h-b" x="372" y="200" width="78" height="44" rx="1"/>
  <rect class="a5h-b" x="450" y="200" width="78" height="44" rx="1"/>
  <rect class="a5h-b" x="528" y="200" width="78" height="44" rx="1"/>

  <rect class="a5h-q" x="298" y="204" width="70" height="16" rx="1"/>
  <text class="a5h-m" x="333" y="215" font-size="6.5" text-anchor="middle">user:1</text>
  <rect class="a5h-q" x="298" y="224" width="70" height="16" rx="1"/>
  <text class="a5h-m" x="333" y="235" font-size="6.5" text-anchor="middle">user:9</text>
  <rect class="a5h-q" x="454" y="204" width="70" height="16" rx="1"/>
  <text class="a5h-m" x="489" y="215" font-size="6.5" text-anchor="middle">cart</text>

  <text class="a5h-s" x="620" y="212" font-size="7" style="fill:#B03A2E">同桶挂链</text>
  <text class="a5h-s" x="620" y="226" font-size="7" style="fill:#B03A2E">= 链地址法</text>

  <text class="a5h-s" x="60" y="268" font-size="7.5">冲突两法：链地址法（同桶挂链，上图这样）｜开放寻址（往后找空位，删起来麻烦）</text>
  <text class="a5h-s" x="60" y="290" font-size="7.5">负载因子超过阈值就全量 rehash —— 单次很贵，均摊下来仍是 O(1)</text>

  <text class="a5h-t" x="40" y="314" font-size="8.5" style="fill:#B03A2E">用 O(n) 的空间买 O(1) 的查找：JS 里默认用 Map，任意键、保插入序、可迭代，还没有原型链污染。</text>
</svg>
