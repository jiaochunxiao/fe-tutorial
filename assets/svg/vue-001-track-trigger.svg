<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 228" width="100%" role="img" aria-labelledby="v1tt v1td">
  <title id="v1tt">读时记账、写时通知的响应式闭环</title>
  <desc id="v1td">组件渲染函数读到 state.count 时被 get 拦截，track 把这个渲染 effect 登记进依赖表；之后 state.count 被赋值，set 拦截触发 trigger，把依赖表里记过名的 effect 挨个重跑，重跑时又读一次，于是重新登记。所以写并不会直接改视图，它只是让 effect 重跑。trigger 也不是同步重跑，而是先把 effect 入队，在微任务里批量去重执行，一个同步块里改三个属性只重渲染一次。</desc>

  <style>
    .v1t-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .v1t-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .v1t-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .v1t-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .v1t-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="v1t-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="v1t-t" x="40" y="26" font-size="8.5">读时记账，写时通知 —— 中间那层代理只做两件事</text>

  <rect class="v1t-b" x="40" y="52" width="140" height="40" rx="2"/>
  <text class="v1t-t" x="110" y="70" font-size="8.5" text-anchor="middle">渲染函数</text>
  <text class="v1t-s" x="110" y="84" font-size="7" text-anchor="middle">读 state.count</text>

  <text class="v1t-s" x="208" y="66" font-size="7" text-anchor="middle">读</text>
  <line x1="180" y1="72" x2="236" y2="72" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v1t-ink)"/>

  <rect class="v1t-b" x="240" y="52" width="130" height="40" rx="2"/>
  <text class="v1t-t" x="305" y="70" font-size="8.5" text-anchor="middle">get 拦截</text>
  <text class="v1t-s" x="305" y="84" font-size="7" text-anchor="middle">Proxy / defineProperty</text>

  <text class="v1t-s" x="403" y="66" font-size="7" text-anchor="middle">track</text>
  <line x1="370" y1="72" x2="436" y2="72" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v1t-ink)"/>

  <rect class="v1t-q" x="440" y="52" width="230" height="88" rx="2"/>
  <text class="v1t-t" x="452" y="74" font-size="8.5">依赖表 targetMap</text>
  <text class="v1t-mono" x="452" y="94" font-size="7">count → Set {</text>
  <text class="v1t-mono" x="452" y="110" font-size="7">　渲染 effect · computed · watch</text>
  <text class="v1t-mono" x="452" y="126" font-size="7">}</text>

  <rect class="v1t-b" x="40" y="144" width="140" height="40" rx="2"/>
  <text class="v1t-t" x="110" y="162" font-size="8.5" text-anchor="middle">改值</text>
  <text class="v1t-mono" x="110" y="176" font-size="7" text-anchor="middle">count = 2</text>

  <text class="v1t-s" x="208" y="158" font-size="7" text-anchor="middle">写</text>
  <line x1="180" y1="164" x2="236" y2="164" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v1t-ink)"/>

  <rect class="v1t-b" x="240" y="144" width="130" height="40" rx="2"/>
  <text class="v1t-t" x="305" y="162" font-size="8.5" text-anchor="middle">set 拦截</text>
  <text class="v1t-s" x="305" y="176" font-size="7" text-anchor="middle">比对新旧值</text>

  <text class="v1t-s" x="403" y="158" font-size="7" text-anchor="middle">trigger</text>
  <line x1="370" y1="164" x2="436" y2="164" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v1t-ink)"/>

  <text class="v1t-t" x="40" y="200" font-size="8.5">写不直接改视图 —— 它让 Set 里的 effect 重跑，重跑时又读一次，于是重新登记。</text>
  <text class="v1t-t" x="40" y="216" font-size="8.5" style="fill:#B03A2E">trigger 先进调度队列，微任务里批量去重 —— 同步块里改 3 个属性只重渲染 1 次。</text>
</svg>
