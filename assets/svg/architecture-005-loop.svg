<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 275" width="100%" role="img" aria-labelledby="ar5lt ar5ld">
  <title id="ar5lt">监控是一条从采集到验证的闭环，不是日志打印</title>
  <desc id="ar5ld">顶部一条带子写三支柱：错误回答什么坏了、性能回答快不快、行为回答在干什么。中间六段流水：采集、上报、聚合、告警、定位、验证，分别是四张网兜住错误、sendBeacon 加批量队列、按指纹去重、按 P75 阈值告警、用版本与机型切片配合 sourcemap 还原到源码行、最后看错误率曲线是否回落。验证之后有一条虚线回到采集，闭环才合上。底部列出错误四张网：error、unhandledrejection、捕获阶段的资源错误、接口拦截。</desc>

  <style>
    .a5l-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .a5l-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .a5l-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .a5l-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .a5l-m{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="a5l-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="a5l-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="a5l-t" x="40" y="26" font-size="8.5">监控不是日志打印，是「采集 → 验证」的闭环</text>

  <rect class="a5l-q" x="40" y="44" width="660" height="28" rx="2"/>
  <text class="a5l-t" x="56" y="63" font-size="7.5">错误 · 什么坏了</text>
  <text class="a5l-t" x="270" y="63" font-size="7.5">性能 · 快不快</text>
  <text class="a5l-t" x="484" y="63" font-size="7.5">行为 · 在干什么</text>
  <text class="a5l-s" x="600" y="63" font-size="7">三支柱</text>

  <line x1="89" y1="72" x2="89" y2="96" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#a5l-ink)"/>

  <rect class="a5l-b" x="40" y="100" width="98" height="36" rx="2"/>
  <text class="a5l-t" x="89" y="115" font-size="7.5" text-anchor="middle">采集</text>
  <text class="a5l-s" x="89" y="128" font-size="6.5" text-anchor="middle">四张网</text>

  <rect class="a5l-b" x="152" y="100" width="98" height="36" rx="2"/>
  <text class="a5l-t" x="201" y="115" font-size="7.5" text-anchor="middle">上报</text>
  <text class="a5l-s" x="201" y="128" font-size="6.5" text-anchor="middle">sendBeacon + 批量</text>

  <rect class="a5l-b" x="264" y="100" width="98" height="36" rx="2"/>
  <text class="a5l-t" x="313" y="115" font-size="7.5" text-anchor="middle">聚合</text>
  <text class="a5l-s" x="313" y="128" font-size="6.5" text-anchor="middle">指纹去重</text>

  <rect class="a5l-b" x="376" y="100" width="98" height="36" rx="2"/>
  <text class="a5l-t" x="425" y="115" font-size="7.5" text-anchor="middle">告警</text>
  <text class="a5l-s" x="425" y="128" font-size="6.5" text-anchor="middle">P75 阈值</text>

  <rect class="a5l-b" x="488" y="100" width="98" height="36" rx="2"/>
  <text class="a5l-t" x="537" y="115" font-size="7.5" text-anchor="middle">定位</text>
  <text class="a5l-s" x="537" y="128" font-size="6.5" text-anchor="middle">切片 + sourcemap</text>

  <rect class="a5l-b" x="600" y="100" width="98" height="36" rx="2"/>
  <text class="a5l-t" x="649" y="115" font-size="7.5" text-anchor="middle">验证</text>
  <text class="a5l-s" x="649" y="128" font-size="6.5" text-anchor="middle">曲线回落</text>

  <line x1="140" y1="118" x2="148" y2="118" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#a5l-ink)"/>
  <line x1="252" y1="118" x2="260" y2="118" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#a5l-ink)"/>
  <line x1="364" y1="118" x2="372" y2="118" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#a5l-ink)"/>
  <line x1="476" y1="118" x2="484" y2="118" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#a5l-ink)"/>
  <line x1="588" y1="118" x2="596" y2="118" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#a5l-ink)"/>

  <path d="M649 136 V162 H89 V142" fill="none" stroke="#B03A2E" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#a5l-red)"/>
  <text class="a5l-s" x="360" y="176" font-size="7" text-anchor="middle" style="fill:#B03A2E">修完再回来量一次，闭环才合上</text>

  <text class="a5l-s" x="40" y="200" font-size="7.5">错误四张网</text>
  <rect class="a5l-b" x="112" y="188" width="146" height="26" rx="2"/>
  <text class="a5l-m" x="185" y="205" font-size="7" text-anchor="middle">error</text>
  <rect class="a5l-b" x="268" y="188" width="146" height="26" rx="2"/>
  <text class="a5l-m" x="341" y="205" font-size="7" text-anchor="middle">unhandledrejection</text>
  <rect class="a5l-b" x="424" y="188" width="136" height="26" rx="2"/>
  <text class="a5l-t" x="492" y="205" font-size="7" text-anchor="middle">资源（capture）</text>
  <rect class="a5l-b" x="570" y="188" width="130" height="26" rx="2"/>
  <text class="a5l-t" x="635" y="205" font-size="7" text-anchor="middle">接口拦截</text>

  <text class="a5l-t" x="40" y="252" font-size="8.5" style="fill:#B03A2E">上报自身永不抛错；sourcemap 只传私服 —— 传到 CDN 就等于源码泄露。</text>
</svg>
