<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 28 740 274" width="100%" role="img" aria-labelledby="ar5t ar5d">
  <title id="ar5t">arguments 与形参的镜像关系</title>
  <desc id="ar5d">调用 f(a, b) 时，实参同时进入两个世界：一个是 arguments 这个类数组对象，一个是形参列表。在非严格模式且参数确实传了的情况下，两者互为镜像——改 arguments[0] 形参跟着变，改形参 arguments 也跟着变。但只要开了严格模式，或者形参列表里出现了默认值、剩余参数，镜像就会断裂，两个世界从此各走各的。arguments.length 是实参个数，不是形参个数。</desc>

  <style>
    .ar5-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .ar5-cell{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.2}
    .ar5-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .ar5-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .ar5-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="ar5-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="ar5-start" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M10 0 L0 5 L10 10 Z" fill="#6E675A"/>
    </marker>
    <marker id="ar5-end" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6E675A"/>
    </marker>
  </defs>

  <text class="ar5-t" x="40" y="44" font-size="9">调用 f(a, b) —— 实参同时进入两个世界</text>

  <rect class="ar5-box" x="54" y="76" width="182" height="62" rx="3"/>
  <text class="ar5-mono" x="66" y="94" font-size="8.5">arguments</text>
  <rect class="ar5-cell" x="70" y="102" width="70" height="26" rx="2"/>
  <text class="ar5-mono" x="105" y="119" font-size="8.5" text-anchor="middle">[0] = 1</text>
  <rect class="ar5-cell" x="150" y="102" width="70" height="26" rx="2"/>
  <text class="ar5-mono" x="185" y="119" font-size="8.5" text-anchor="middle">[1] = 2</text>

  <rect class="ar5-box" x="54" y="196" width="182" height="62" rx="3"/>
  <text class="ar5-mono" x="66" y="214" font-size="8.5">形参</text>
  <rect class="ar5-cell" x="70" y="222" width="70" height="26" rx="2"/>
  <text class="ar5-mono" x="105" y="239" font-size="8.5" text-anchor="middle">a</text>
  <rect class="ar5-cell" x="150" y="222" width="70" height="26" rx="2"/>
  <text class="ar5-mono" x="185" y="239" font-size="8.5" text-anchor="middle">b</text>

  <text class="ar5-t" x="145" y="172" font-size="8" text-anchor="middle" style="fill:#B03A2E">镜像</text>
  <line x1="105" y1="140" x2="105" y2="194" stroke="#6E675A" stroke-width="1.2" stroke-dasharray="5 4" marker-start="url(#ar5-start)" marker-end="url(#ar5-end)"/>
  <line x1="185" y1="140" x2="185" y2="194" stroke="#6E675A" stroke-width="1.2" stroke-dasharray="5 4" marker-start="url(#ar5-start)" marker-end="url(#ar5-end)"/>

  <text class="ar5-t" x="262" y="112" font-size="8.5">length = 实参个数，不是形参个数</text>
  <text class="ar5-t" x="262" y="136" font-size="8.5" style="fill:#B03A2E">非严格 + 参数已传 → 两边互为镜像</text>
  <text class="ar5-s" x="262" y="154" font-size="8">改 arguments[0]，a 跟着变；反过来也一样</text>
  <text class="ar5-t" x="262" y="180" font-size="8.5" style="fill:#B03A2E">严格模式 / 默认值 / ...rest → 镜像断裂</text>
  <text class="ar5-s" x="262" y="198" font-size="8">从此两个世界各走各的，别再指望同步</text>
  <text class="ar5-s" x="262" y="224" font-size="8">默认值只在实参严格等于 undefined 时触发</text>
  <text class="ar5-s" x="262" y="242" font-size="8">传 null 不会触发默认值 —— 它是个「有值」</text>

  <line x1="40" y1="276" x2="40" y2="296" stroke="#B03A2E" stroke-width="2.4"/>
  <text class="ar5-t" x="54" y="288" font-size="9">函数是一等公民：能赋值、能传参、能返回、能存进对象和数组 —— 所以闭包和高阶函数才成立</text>
</svg>
