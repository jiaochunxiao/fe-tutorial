<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 290" width="100%" role="img" aria-labelledby="wp2t wp2d">
  <title id="wp2t">Webpack 的四阶段流水线，以及贯穿全程的 Plugin 挂钩</title>
  <desc id="wp2d">上面一条横带是 Plugin，基于 Tapable 事件流，挂在完整生命周期的每个钩子上，向下接到四个阶段。四阶段从左到右：entry 是入口；make 阶段用 Loader 链把每个文件转译成 JavaScript，再通过 AST 解析依赖递归建图；seal 阶段把模块按入口、动态 import、splitChunks 三个来源组织成 chunk，并做摇树和作用域提升；emit 阶段输出带 contenthash 的文件名、压缩、注入 HTML。最底下是产物骨架，一个模块表加一个内置的 require 运行时。</desc>

  <style>
    .wp2-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .wp2-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .wp2-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .wp2-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="wp2-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <rect x="40" y="52" width="650" height="28" rx="3" fill="#E7DEC8" stroke="#1C1A17" stroke-width="1.2"/>
  <text class="wp2-t" x="365" y="70" font-size="8.5" text-anchor="middle">Plugin（Tapable 事件流）—— 生命周期上每个钩子都能插一手</text>

  <line x1="110" y1="80" x2="110" y2="106" stroke="#6E675A" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="280" y1="80" x2="280" y2="106" stroke="#6E675A" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="450" y1="80" x2="450" y2="106" stroke="#6E675A" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="620" y1="80" x2="620" y2="106" stroke="#6E675A" stroke-width="1" stroke-dasharray="4 3"/>

  <rect class="wp2-box" x="40" y="110" width="140" height="64" rx="3"/>
  <text class="wp2-mono" x="110" y="130" font-size="10" text-anchor="middle">entry</text>
  <text class="wp2-s" x="110" y="148" font-size="8.5" text-anchor="middle">起点</text>
  <text class="wp2-s" x="110" y="164" font-size="8.5" text-anchor="middle">一个或多个入口</text>
  <line x1="180" y1="142" x2="206" y2="142" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#wp2-ink)"/>

  <rect class="wp2-box" x="210" y="110" width="140" height="64" rx="3"/>
  <text class="wp2-mono" x="280" y="130" font-size="10" text-anchor="middle">make</text>
  <text class="wp2-s" x="280" y="148" font-size="8.5" text-anchor="middle">Loader 链转译</text>
  <text class="wp2-s" x="280" y="164" font-size="8.5" text-anchor="middle">AST 递归建图</text>
  <line x1="350" y1="142" x2="376" y2="142" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#wp2-ink)"/>

  <rect class="wp2-box" x="380" y="110" width="140" height="64" rx="3"/>
  <text class="wp2-mono" x="450" y="130" font-size="10" text-anchor="middle">seal</text>
  <text class="wp2-s" x="450" y="148" font-size="8.5" text-anchor="middle">Modules → Chunks</text>
  <text class="wp2-s" x="450" y="164" font-size="8.5" text-anchor="middle">摇树 + 作用域提升</text>
  <line x1="520" y1="142" x2="546" y2="142" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#wp2-ink)"/>

  <rect class="wp2-box" x="550" y="110" width="140" height="64" rx="3"/>
  <text class="wp2-mono" x="620" y="130" font-size="10" text-anchor="middle">emit</text>
  <text class="wp2-s" x="620" y="148" font-size="8.5" text-anchor="middle">contenthash 文件名</text>
  <text class="wp2-s" x="620" y="164" font-size="8.5" text-anchor="middle">压缩 + HTML 注入</text>

  <text class="wp2-s" x="110" y="194" font-size="8" text-anchor="middle">一切皆模块</text>
  <text class="wp2-s" x="110" y="208" font-size="8" text-anchor="middle">css / 图片 / vue → js</text>

  <text class="wp2-s" x="280" y="194" font-size="8" text-anchor="middle">Loader 链右到左</text>
  <text class="wp2-s" x="280" y="208" font-size="8" text-anchor="middle">sass → css → style</text>

  <text class="wp2-s" x="450" y="194" font-size="8" text-anchor="middle">三来源：入口 / import() / 拆包</text>
  <text class="wp2-s" x="450" y="208" font-size="8" text-anchor="middle">拆包动机 = 变与不变分离</text>

  <text class="wp2-s" x="620" y="194" font-size="8" text-anchor="middle">内容变则文件名变</text>
  <text class="wp2-s" x="620" y="208" font-size="8" text-anchor="middle">配合强缓存长期有效</text>

  <rect x="40" y="232" width="650" height="34" rx="3" fill="#FBF7EE" stroke="#1C1A17" stroke-width="1.2"/>
  <text class="wp2-mono" x="365" y="253" font-size="9" text-anchor="middle">产物骨架 = (function (modules) { require(entry) })(模块表)</text>
</svg>
