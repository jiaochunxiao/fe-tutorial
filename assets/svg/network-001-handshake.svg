<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" width="100%" role="img" aria-labelledby="t4t t4d">
  <title id="t4t">TCP 三次握手时序</title>
  <desc id="t4d">客户端发出 SYN（seq=x），服务端回 SYN+ACK（seq=y，ack=x+1），客户端再回 ACK（ack=y+1），双方进入 ESTABLISHED。</desc>
  <defs>
    <marker id="t4-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="t4-cin" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <style>
    .t4-life{stroke:#CDC4AF;stroke-width:1.4;stroke-dasharray:3 5}
    .t4-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .t4-serif{font-family:'Noto Serif SC','Songti SC','SimSun',serif;fill:#1C1A17}
    .t4-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .t4-state{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;font-size:10.5px;fill:#6E675A;letter-spacing:.3px}
  </style>

  <!-- 端点 -->
  <text class="t4-serif" x="170" y="38" font-size="14" text-anchor="middle">客户端</text>
  <text class="t4-serif" x="570" y="38" font-size="14" text-anchor="middle">服务端</text>
  <line x1="128" y1="50" x2="212" y2="50" stroke="#1C1A17" stroke-width="1.4"/>
  <line x1="528" y1="50" x2="612" y2="50" stroke="#1C1A17" stroke-width="1.4"/>

  <!-- 生命线 -->
  <line class="t4-life" x1="170" y1="54" x2="170" y2="416"/>
  <line class="t4-life" x1="570" y1="54" x2="570" y2="416"/>

  <!-- ① SYN -->
  <line x1="176" y1="130" x2="562" y2="130" stroke="#1C1A17" stroke-width="1.8" marker-end="url(#t4-ink)"/>
  <text class="t4-mono" x="370" y="104" font-size="12.5" text-anchor="middle" font-weight="700">① SYN</text>
  <text class="t4-mono" x="370" y="119" font-size="11" text-anchor="middle" style="fill:#6E675A">seq = x</text>

  <!-- ② SYN + ACK -->
  <line x1="564" y1="235" x2="178" y2="235" stroke="#1C1A17" stroke-width="1.8" marker-end="url(#t4-ink)"/>
  <text class="t4-mono" x="370" y="209" font-size="12.5" text-anchor="middle" font-weight="700">② SYN + ACK</text>
  <text class="t4-mono" x="370" y="224" font-size="11" text-anchor="middle" style="fill:#6E675A">seq = y,  ack = x + 1</text>

  <!-- ③ ACK -->
  <line x1="176" y1="340" x2="562" y2="340" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#t4-cin)"/>
  <text class="t4-mono" x="370" y="314" font-size="12.5" text-anchor="middle" font-weight="700" style="fill:#B03A2E">③ ACK</text>
  <text class="t4-mono" x="370" y="329" font-size="11" text-anchor="middle" style="fill:#6E675A">ack = y + 1</text>

  <!-- 客户端状态 -->
  <text class="t4-state" x="152" y="88" text-anchor="end">CLOSE</text>
  <line x1="156" y1="84" x2="168" y2="84" stroke="#CDC4AF" stroke-width="1.2"/>
  <text class="t4-state" x="152" y="180" text-anchor="end">SYN_SENT</text>
  <line x1="156" y1="176" x2="168" y2="176" stroke="#CDC4AF" stroke-width="1.2"/>
  <text class="t4-state" x="152" y="392" text-anchor="end" style="fill:#B03A2E">ESTABLISHED</text>
  <line x1="156" y1="388" x2="168" y2="388" stroke="#B03A2E" stroke-width="1.2"/>

  <!-- 服务端状态 -->
  <text class="t4-state" x="588" y="88">LISTEN</text>
  <line x1="572" y1="84" x2="584" y2="84" stroke="#CDC4AF" stroke-width="1.2"/>
  <text class="t4-state" x="588" y="180">SYN_RCVD</text>
  <line x1="572" y1="176" x2="584" y2="176" stroke="#CDC4AF" stroke-width="1.2"/>
  <text class="t4-state" x="588" y="392" style="fill:#B03A2E">ESTABLISHED</text>
  <line x1="572" y1="388" x2="584" y2="388" stroke="#B03A2E" stroke-width="1.2"/>

  <!-- 建立 -->
  <line x1="170" y1="372" x2="570" y2="372" stroke="#B03A2E" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text class="t4-small" x="370" y="364" font-size="11" text-anchor="middle" style="fill:#B03A2E">连接建立，开始传数据</text>

  <!-- 时间轴 -->
  <line x1="690" y1="70" x2="690" y2="150" stroke="#6E675A" stroke-width="1.2" marker-end="url(#t4-ink)"/>
  <text class="t4-small" x="690" y="62" font-size="10" text-anchor="middle">时间</text>

</svg>
