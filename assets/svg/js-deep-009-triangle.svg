<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 322" width="100%" role="img" aria-labelledby="t1t t1d">
  <title id="t1t">原型三角关系</title>
  <desc id="t1d">构造函数 Person 通过 prototype 指向原型对象；实例 p 通过 [[Prototype]] 指向同一个原型对象；原型对象通过 constructor 指回 Person。</desc>
  <defs>
    <marker id="t1-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="t1-cin" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
    <marker id="t1-mut" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6E675A"/>
    </marker>
  </defs>

  <style>
    .t1-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.6}
    .t1-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .t1-serif{font-family:'Noto Serif SC','Songti SC','SimSun',serif;fill:#1C1A17}
    .t1-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <!-- Person -->
  <rect class="t1-box" x="56" y="52" width="186" height="64" rx="4"/>
  <text class="t1-mono" x="149" y="83" font-size="15" text-anchor="middle">Person</text>
  <text class="t1-small" x="149" y="101" font-size="11" text-anchor="middle">构造函数（函数）</text>

  <!-- Person.prototype -->
  <rect class="t1-box" x="464" y="52" width="200" height="64" rx="4"/>
  <text class="t1-mono" x="564" y="83" font-size="13" text-anchor="middle">Person.prototype</text>
  <text class="t1-small" x="564" y="101" font-size="11" text-anchor="middle">原型对象（实例共享）</text>

  <!-- p -->
  <rect class="t1-box" x="250" y="212" width="186" height="64" rx="4"/>
  <text class="t1-mono" x="343" y="243" font-size="15" text-anchor="middle">p</text>
  <text class="t1-small" x="343" y="261" font-size="11" text-anchor="middle">实例 = new Person()</text>

  <!-- Person → Person.prototype : prototype -->
  <line x1="244" y1="74" x2="458" y2="74" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#t1-ink)"/>
  <text class="t1-mono" x="351" y="64" font-size="11.5" text-anchor="middle" style="fill:#6E675A">prototype</text>

  <!-- Person.prototype → Person : constructor -->
  <line x1="458" y1="96" x2="244" y2="96" stroke="#6E675A" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#t1-mut)"/>
  <text class="t1-mono" x="351" y="113" font-size="11.5" text-anchor="middle" style="fill:#6E675A">constructor</text>

  <!-- p → Person.prototype : [[Prototype]] -->
  <path d="M400 212 C452 212 478 162 514 119" fill="none" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#t1-cin)"/>
  <text class="t1-mono" x="396" y="176" font-size="11.5" text-anchor="end" font-weight="700" style="fill:#B03A2E">[[Prototype]]</text>
  <text class="t1-mono" x="396" y="192" font-size="11.5" text-anchor="end" style="fill:#B03A2E">= __proto__</text>

  <!-- 注释 -->
  <text class="t1-small" x="56" y="308" font-size="11">prototype 只有函数才有　·　__proto__ 所有对象都有　·　constructor 是原型对象上的普通属性</text>
</svg>
