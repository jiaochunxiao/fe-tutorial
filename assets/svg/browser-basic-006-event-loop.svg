<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 272" width="100%" role="img" aria-labelledby="b6et b6ed">
  <title id="b6et">事件驱动的闭环：主线程、任务队列与异步执行者</title>
  <desc id="b6ed">主线程只有一条，同步代码在执行栈上跑，空闲了就去任务队列取下一个任务。发起 fetch 时主线程把活交给网络进程或定时器，自己立刻返回继续渲染；那边干完之后产生一条完成通知，通知被排进任务队列，等主线程空闲时才取出执行。整个循环解释了三个日常现象：零毫秒不是立即执行，并发发起取最慢的那个，回调时机由队列决定。</desc>

  <style>
    .b6e-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .b6e-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .b6e-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .b6e-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .b6e-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="b6e-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="b6e-t" x="40" y="26" font-size="8.5">异步不是并发 —— 是把活推出去，再把回调排队取回来</text>

  <rect class="b6e-b" x="60" y="46" width="180" height="96" rx="2"/>
  <text class="b6e-t" x="150" y="68" font-size="8.5" text-anchor="middle">主线程（唯一）</text>
  <text class="b6e-s" x="150" y="88" font-size="7.5" text-anchor="middle">执行栈：同步代码在这跑</text>
  <text class="b6e-s" x="150" y="104" font-size="7.5" text-anchor="middle">渲染也在这跑</text>
  <text class="b6e-s" x="150" y="124" font-size="7.5" text-anchor="middle">闲下来才去队列取任务</text>

  <rect class="b6e-q" x="290" y="66" width="140" height="34" rx="2"/>
  <text class="b6e-t" x="360" y="87" font-size="8.5" text-anchor="middle">任务队列</text>
  <line x1="290" y1="83" x2="248" y2="83" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#b6e-ink)"/>

  <rect class="b6e-b" x="486" y="66" width="190" height="34" rx="2"/>
  <text class="b6e-t" x="581" y="87" font-size="8.5" text-anchor="middle">各种完成通知</text>
  <line x1="486" y1="83" x2="434" y2="83" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#b6e-ink)"/>

  <path d="M150 142 V214 H284" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#b6e-ink)"/>
  <text class="b6e-s" x="160" y="186" font-size="7.5">发起 fetch，立刻返回 promise</text>

  <rect class="b6e-b" x="290" y="194" width="150" height="40" rx="2"/>
  <text class="b6e-t" x="365" y="212" font-size="8" text-anchor="middle">网络进程 · 定时器</text>
  <text class="b6e-s" x="365" y="226" font-size="7.5" text-anchor="middle">不在主线程上干活</text>

  <path d="M440 214 H580 V104" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#b6e-ink)"/>
  <text class="b6e-s" x="452" y="204" font-size="7.5">干完了 → 产生完成通知</text>

  <text class="b6e-t" x="40" y="258" font-size="8.5" style="fill:#B03A2E">零毫秒不是立即、并发取最慢、回调时机看队列 —— 三个现象都从这一圈来。</text>
</svg>
