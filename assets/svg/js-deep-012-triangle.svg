<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="100%" role="img" aria-labelledby="tr12t tr12d">
  <title id="tr12t">构造函数、原型、实例的三角关系</title>
  <desc id="tr12d">三个对象两两相连，但连的线性质不同。F 通过自己的 prototype 属性指向 F.prototype，这是普通属性访问，可写；F.prototype 通过 constructor 属性指回 F，也是普通属性；实例 f 通过内部槽 [[Prototype]] 指向 F.prototype，这是隐式的、只读的。另外 F 自己是函数，所以 F 的 [[Prototype]] 指向 Function.prototype，这条链和实例那条链是平行的，互不相干。</desc>

  <style>
    .tr12-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .tr12-pill{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.2}
    .tr12-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .tr12-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .tr12-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="tr12-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="tr12-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <rect class="tr12-pill" x="60" y="16" width="180" height="32" rx="3"/>
  <text class="tr12-mono" x="150" y="37" font-size="9" text-anchor="middle">Function.prototype</text>
  <line x1="150" y1="48" x2="150" y2="80" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#tr12-ink)"/>
  <text class="tr12-s" x="160" y="68" font-size="8">F 的 [[Prototype]]</text>

  <rect class="tr12-box" x="60" y="84" width="140" height="60" rx="3"/>
  <text class="tr12-mono" x="130" y="110" font-size="11" text-anchor="middle">F</text>
  <text class="tr12-s" x="130" y="128" font-size="8" text-anchor="middle">构造函数</text>

  <rect class="tr12-box" x="400" y="84" width="160" height="60" rx="3"/>
  <text class="tr12-mono" x="480" y="110" font-size="11" text-anchor="middle">F.prototype</text>
  <text class="tr12-s" x="480" y="128" font-size="8" text-anchor="middle">原型对象</text>

  <line x1="200" y1="100" x2="396" y2="100" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#tr12-ink)"/>
  <text class="tr12-mono" x="298" y="92" font-size="8" text-anchor="middle">.prototype</text>

  <line x1="400" y1="126" x2="204" y2="126" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#tr12-ink)"/>
  <text class="tr12-mono" x="298" y="142" font-size="8" text-anchor="middle">.constructor</text>

  <rect class="tr12-box" x="230" y="230" width="140" height="60" rx="3"/>
  <text class="tr12-mono" x="300" y="256" font-size="11" text-anchor="middle">f</text>
  <text class="tr12-s" x="300" y="274" font-size="8" text-anchor="middle">实例</text>

  <path d="M330 230 C330 180 390 158 436 148" fill="none" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#tr12-red)"/>
  <text class="tr12-mono" x="380" y="178" font-size="8" style="fill:#B03A2E">[[Prototype]]</text>

  <text class="tr12-s" x="592" y="112" font-size="8">函数也是对象</text>
  <text class="tr12-mono" x="592" y="132" font-size="8">F.[[Prototype]]</text>
  <text class="tr12-mono" x="592" y="146" font-size="8">= Function.prototype</text>
  <text class="tr12-s" x="592" y="168" font-size="8">这条链和实例那条平行，</text>
  <text class="tr12-s" x="592" y="182" font-size="8">互不相干 —— 最容易答错的一问</text>

  <line x1="40" y1="302" x2="40" y2="324" stroke="#B03A2E" stroke-width="2.4"/>
  <text class="tr12-s" x="54" y="316" font-size="8.5">F.prototype 自己还有一条链：F.prototype.[[Prototype]] → Object.prototype → null（原型链的尽头）</text>
</svg>
