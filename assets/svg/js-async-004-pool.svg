<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 322" width="100%" role="img" aria-labelledby="a4pt a4pd">
  <title id="a4pt">并发限制器的任务池模型</title>
  <desc id="a4pd">一个待办队列加固定数量的工人。队列上有一个共享游标 nextIndex，每个工人用 while 循环反复认领下一个任务：nextIndex++ 在单线程里不会被打断，所以天然免锁。工人各自串行 await 自己认领到的任务，结果按下标写回 results 数组，所以顺序稳定。等所有工人干完（Promise.all），再 resolve 整个结果数组。</desc>

  <style>
    .a4p-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.3}
    .a4p-cell{fill:#FBF7EE;stroke:#CDC4AF;stroke-width:1.1}
    .a4p-alt{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.3}
    .a4p-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .a4p-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .a4p-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="a4p-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="a4p-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="a4p-s" x="150" y="18" font-size="7.5" text-anchor="end" style="fill:#B03A2E">nextIndex</text>
  <line x1="158" y1="8" x2="158" y2="26" stroke="#B03A2E" stroke-width="1.3" marker-end="url(#a4p-red)"/>
  <text class="a4p-s" x="40" y="46" font-size="9">任务队列</text>

  <rect class="a4p-cell" x="130" y="28" width="56" height="26" rx="2"/>
  <rect class="a4p-cell" x="186" y="28" width="56" height="26" rx="2"/>
  <rect class="a4p-cell" x="242" y="28" width="56" height="26" rx="2"/>
  <rect class="a4p-cell" x="298" y="28" width="56" height="26" rx="2"/>
  <rect class="a4p-cell" x="354" y="28" width="56" height="26" rx="2"/>
  <rect class="a4p-cell" x="410" y="28" width="56" height="26" rx="2"/>
  <rect class="a4p-cell" x="466" y="28" width="56" height="26" rx="2"/>
  <rect class="a4p-cell" x="522" y="28" width="56" height="26" rx="2"/>
  <rect class="a4p-cell" x="578" y="28" width="56" height="26" rx="2"/>
  <text class="a4p-mono" x="158" y="45" font-size="8" text-anchor="middle">t1</text>
  <text class="a4p-mono" x="214" y="45" font-size="8" text-anchor="middle">t2</text>
  <text class="a4p-mono" x="270" y="45" font-size="8" text-anchor="middle">t3</text>
  <text class="a4p-mono" x="326" y="45" font-size="8" text-anchor="middle">t4</text>
  <text class="a4p-mono" x="382" y="45" font-size="8" text-anchor="middle">t5</text>
  <text class="a4p-mono" x="438" y="45" font-size="8" text-anchor="middle">t6</text>
  <text class="a4p-mono" x="494" y="45" font-size="8" text-anchor="middle">t7</text>
  <text class="a4p-mono" x="550" y="45" font-size="8" text-anchor="middle">t8</text>
  <text class="a4p-mono" x="606" y="45" font-size="8" text-anchor="middle">t9</text>
  <text class="a4p-s" x="646" y="45" font-size="8">…</text>

  <path d="M382 56 V72" fill="none" stroke="#B03A2E" stroke-width="1.5" marker-end="url(#a4p-red)"/>
  <text class="a4p-t" x="392" y="70" font-size="7.5" style="fill:#B03A2E">认领（nextIndex++，单线程免锁）</text>

  <text class="a4p-s" x="40" y="106" font-size="9">工人工位</text>
  <rect class="a4p-box" x="130" y="88" width="504" height="30" rx="3"/>
  <text class="a4p-mono" x="142" y="107" font-size="8.5">t1 → t4 → t7 …</text>
  <rect class="a4p-box" x="130" y="126" width="504" height="30" rx="3"/>
  <text class="a4p-mono" x="142" y="145" font-size="8.5">t2 → t5 → t8 …</text>
  <rect class="a4p-box" x="130" y="164" width="504" height="30" rx="3"/>
  <text class="a4p-mono" x="142" y="183" font-size="8.5">t3 → t6 → t9 …</text>
  <text class="a4p-s" x="474" y="107" font-size="8">干完手头的接着抢，不歇</text>
  <text class="a4p-s" x="474" y="145" font-size="8">每个工人内部是串行 await</text>
  <text class="a4p-s" x="474" y="183" font-size="8">同时在途的恒为 limit 个</text>

  <line x1="648" y1="88" x2="648" y2="194" stroke="#B03A2E" stroke-width="1.4"/>
  <line x1="648" y1="88" x2="654" y2="88" stroke="#B03A2E" stroke-width="1.4"/>
  <line x1="648" y1="194" x2="654" y2="194" stroke="#B03A2E" stroke-width="1.4"/>
  <text class="a4p-t" x="658" y="138" font-size="8" style="fill:#B03A2E">limit</text>
  <text class="a4p-mono" x="658" y="152" font-size="8" style="fill:#B03A2E">= 3</text>

  <path d="M382 200 V218" fill="none" stroke="#B03A2E" stroke-width="1.5" marker-end="url(#a4p-red)"/>
  <text class="a4p-t" x="392" y="214" font-size="7.5" style="fill:#B03A2E">按下标归还</text>

  <text class="a4p-s" x="40" y="246" font-size="9">结果槽位</text>
  <rect class="a4p-cell" x="130" y="228" width="56" height="26" rx="2"/>
  <rect class="a4p-cell" x="186" y="228" width="56" height="26" rx="2"/>
  <rect class="a4p-cell" x="242" y="228" width="56" height="26" rx="2"/>
  <rect class="a4p-cell" x="298" y="228" width="56" height="26" rx="2"/>
  <rect class="a4p-cell" x="354" y="228" width="56" height="26" rx="2"/>
  <rect class="a4p-cell" x="410" y="228" width="56" height="26" rx="2"/>
  <rect class="a4p-cell" x="466" y="228" width="56" height="26" rx="2"/>
  <rect class="a4p-cell" x="522" y="228" width="56" height="26" rx="2"/>
  <rect class="a4p-cell" x="578" y="228" width="56" height="26" rx="2"/>
  <text class="a4p-mono" x="158" y="245" font-size="7.5" text-anchor="middle">r0</text>
  <text class="a4p-mono" x="214" y="245" font-size="7.5" text-anchor="middle">r1</text>
  <text class="a4p-mono" x="270" y="245" font-size="7.5" text-anchor="middle">r2</text>
  <text class="a4p-mono" x="326" y="245" font-size="7.5" text-anchor="middle">r3</text>
  <text class="a4p-mono" x="382" y="245" font-size="7.5" text-anchor="middle">r4</text>
  <text class="a4p-mono" x="438" y="245" font-size="7.5" text-anchor="middle">r5</text>
  <text class="a4p-mono" x="494" y="245" font-size="7.5" text-anchor="middle">r6</text>
  <text class="a4p-mono" x="550" y="245" font-size="7.5" text-anchor="middle">r7</text>
  <text class="a4p-mono" x="606" y="245" font-size="7.5" text-anchor="middle">r8</text>
  <text class="a4p-s" x="646" y="245" font-size="8">顺序稳定</text>

  <path d="M382 256 V276" fill="none" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#a4p-ink)"/>
  <text class="a4p-s" x="392" y="272" font-size="7.5">Promise.all(workers) 全部完工</text>

  <rect class="a4p-alt" x="250" y="280" width="240" height="28" rx="3"/>
  <text class="a4p-mono" x="370" y="298" font-size="9" text-anchor="middle">resolve(results)</text>
</svg>
