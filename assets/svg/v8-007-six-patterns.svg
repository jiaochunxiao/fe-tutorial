<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 308" width="100%" role="img" aria-labelledby="v7t v7d">
  <title id="v7t">六种泄漏模式在 Retainers 里长什么样</title>
  <desc id="v7d">六行对照，每行左边是模式名，右边是从 GC 根到本该死亡对象的保留链，朱砂那一格是你的代码、也就是第一环。第一行全局积累：window 上挂了一个只增不减的数组。第二行监听未解绑：window 的监听器表指向 handler，handler 的闭包又拽着整个旧组件。第三行游离 DOM：缓存里存着一个已经从文档移除的节点，节点还活着。第四行闭包放大：onclick 的 Scope 里捕获了一个大对象。第五行无界栈：undoStack 里堆着无数份快照。第六行框架回调：store 里的回调指向组件树，整棵子树都无法回收。底部是排查五步法：先看曲线确认是楼梯型增长，再重复单一操作把泄漏放大成清晰斜率，然后前后对比快照找只增不减的对象，沿 Retainers 溯源定位到业务代码，修复后再重复操作验证内存回落。Node 端用 heapsnapshot-signal 拍快照，分析思路完全一致。</desc>

  <style>
    .v7-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .v7-r{fill:#FBF7EE;stroke:#B03A2E;stroke-width:1.3}
    .v7-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .v7-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .v7-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="v7-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="v7-t" x="30" y="26" font-size="8.5">六种模式：认链定锅 —— 朱砂那格就是你要改的代码</text>

  <!-- ① 全局积累 -->
  <text class="v7-t" x="30" y="61" font-size="8">① 全局积累</text>
  <rect class="v7-b" x="190" y="45" width="110" height="24" rx="2"/>
  <text class="v7-mono" x="245" y="61" font-size="7" text-anchor="middle">window</text>
  <line x1="300" y1="57" x2="314" y2="57" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v7-ink)"/>
  <rect class="v7-r" x="318" y="45" width="110" height="24" rx="2"/>
  <text class="v7-mono" x="373" y="61" font-size="7" text-anchor="middle" style="fill:#B03A2E">bigArray</text>
  <text class="v7-s" x="440" y="61" font-size="7">只增不减，越攒越大</text>

  <!-- ② 监听未解绑 -->
  <text class="v7-t" x="30" y="99" font-size="8">② 监听未解绑</text>
  <rect class="v7-b" x="190" y="83" width="110" height="24" rx="2"/>
  <text class="v7-mono" x="245" y="99" font-size="7" text-anchor="middle">window.listeners</text>
  <line x1="300" y1="95" x2="314" y2="95" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v7-ink)"/>
  <rect class="v7-b" x="318" y="83" width="110" height="24" rx="2"/>
  <text class="v7-mono" x="373" y="99" font-size="7" text-anchor="middle">handler</text>
  <line x1="428" y1="95" x2="442" y2="95" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v7-ink)"/>
  <rect class="v7-r" x="446" y="83" width="110" height="24" rx="2"/>
  <text class="v7-t" x="501" y="99" font-size="7" text-anchor="middle" style="fill:#B03A2E">旧组件实例</text>
  <text class="v7-s" x="568" y="99" font-size="7">整棵子树都拽着</text>

  <!-- ③ 游离 DOM -->
  <text class="v7-t" x="30" y="137" font-size="8">③ 游离 DOM</text>
  <rect class="v7-r" x="190" y="121" width="110" height="24" rx="2"/>
  <text class="v7-mono" x="245" y="137" font-size="7" text-anchor="middle" style="fill:#B03A2E">cache</text>
  <line x1="300" y1="133" x2="314" y2="133" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v7-ink)"/>
  <rect class="v7-b" x="318" y="121" width="110" height="24" rx="2"/>
  <text class="v7-t" x="373" y="137" font-size="7" text-anchor="middle">Detached 节点</text>
  <text class="v7-s" x="440" y="137" font-size="7">快照里搜 Detached 就能捞出来</text>

  <!-- ④ 闭包放大 -->
  <text class="v7-t" x="30" y="175" font-size="8">④ 闭包放大</text>
  <rect class="v7-b" x="190" y="159" width="110" height="24" rx="2"/>
  <text class="v7-mono" x="245" y="175" font-size="7" text-anchor="middle">onclick</text>
  <line x1="300" y1="171" x2="314" y2="171" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v7-ink)"/>
  <rect class="v7-r" x="318" y="159" width="110" height="24" rx="2"/>
  <text class="v7-mono" x="373" y="175" font-size="7" text-anchor="middle" style="fill:#B03A2E">Scope</text>
  <line x1="428" y1="171" x2="442" y2="171" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v7-ink)"/>
  <rect class="v7-b" x="446" y="159" width="110" height="24" rx="2"/>
  <text class="v7-t" x="501" y="175" font-size="7" text-anchor="middle">大对象</text>
  <text class="v7-s" x="568" y="175" font-size="7">只解构需要的值即可解</text>

  <!-- ⑤ 无界栈 -->
  <text class="v7-t" x="30" y="213" font-size="8">⑤ 无界栈 / 缓存</text>
  <rect class="v7-r" x="190" y="197" width="110" height="24" rx="2"/>
  <text class="v7-mono" x="245" y="213" font-size="7" text-anchor="middle" style="fill:#B03A2E">undoStack</text>
  <line x1="300" y1="209" x2="314" y2="209" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v7-ink)"/>
  <rect class="v7-b" x="318" y="197" width="110" height="24" rx="2"/>
  <text class="v7-mono" x="373" y="213" font-size="7" text-anchor="middle">snapshot × N</text>
  <text class="v7-s" x="440" y="213" font-size="7">没有上限，就是没有尽头</text>

  <!-- ⑥ 框架回调 -->
  <text class="v7-t" x="30" y="251" font-size="8">⑥ 框架回调</text>
  <rect class="v7-b" x="190" y="235" width="110" height="24" rx="2"/>
  <text class="v7-mono" x="245" y="251" font-size="7" text-anchor="middle">store</text>
  <line x1="300" y1="247" x2="314" y2="247" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v7-ink)"/>
  <rect class="v7-r" x="318" y="235" width="110" height="24" rx="2"/>
  <text class="v7-mono" x="373" y="251" font-size="7" text-anchor="middle" style="fill:#B03A2E">回调</text>
  <line x1="428" y1="247" x2="442" y2="247" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v7-ink)"/>
  <rect class="v7-b" x="446" y="235" width="110" height="24" rx="2"/>
  <text class="v7-mono" x="501" y="251" font-size="7" text-anchor="middle">Fiber</text>
  <line x1="556" y1="247" x2="570" y2="247" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v7-ink)"/>
  <rect class="v7-b" x="574" y="235" width="110" height="24" rx="2"/>
  <text class="v7-t" x="629" y="251" font-size="7" text-anchor="middle">整棵子树</text>

  <rect x="30" y="274" width="680" height="24" fill="#E7DEC8" opacity="0.55"/>
  <text class="v7-s" x="42" y="290" font-size="7.5">五步法：楼梯确认 → 重复放大斜率 → Comparison 快照 → Retainers 溯源 → 回落验证（Node 侧同套，用 --heapsnapshot-signal）</text>
</svg>
