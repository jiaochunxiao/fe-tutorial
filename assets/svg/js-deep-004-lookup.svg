<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" width="100%" role="img" aria-labelledby="q1t q1d">
  <title id="q1t">作用域链上的变量查找</title>
  <desc id="q1d">在 inner 里查找变量 a：先看 inner 自己的环境记录，没有；沿 [[Environment]] 往外的 middle 也没有，再往外的 outer 也没有；到全局环境才找到 a，查找就此停止。链的尽头是 null，如果走到那里还没找到，就抛 ReferenceError。</desc>

  <style>
    .q1-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .q1-end{fill:none;stroke:#CDC4AF;stroke-width:1.2;stroke-dasharray:5 4}
    .q1-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .q1-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="q1-cin" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
    <marker id="q1-mut" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6E675A"/>
    </marker>
  </defs>

  <text class="q1-small" x="88" y="36" font-size="10.5" text-anchor="middle" style="fill:#B03A2E">在这里查 a</text>

  <rect class="q1-box" x="40" y="56" width="600" height="48" rx="3"/>
  <text class="q1-mono" x="60" y="86" font-size="12.5">inner</text>
  <text class="q1-mono" x="170" y="86" font-size="11.5" style="fill:#6E675A">{ d: 4 }</text>
  <text class="q1-small" x="624" y="86" font-size="10.5" text-anchor="end">✗ 没有 a</text>

  <line x1="88" y1="104" x2="88" y2="128" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#q1-cin)"/>
  <text class="q1-small" x="102" y="122" font-size="9.5" style="fill:#B03A2E">沿 [[Environment]] 向外</text>

  <rect class="q1-box" x="40" y="132" width="600" height="48" rx="3"/>
  <text class="q1-mono" x="60" y="162" font-size="12.5">middle</text>
  <text class="q1-mono" x="170" y="162" font-size="11.5" style="fill:#6E675A">{ c: 3 }</text>
  <text class="q1-small" x="624" y="162" font-size="10.5" text-anchor="end">✗ 没有 a</text>

  <line x1="88" y1="180" x2="88" y2="204" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#q1-cin)"/>

  <rect class="q1-box" x="40" y="208" width="600" height="48" rx="3"/>
  <text class="q1-mono" x="60" y="238" font-size="12.5">outer</text>
  <text class="q1-mono" x="170" y="238" font-size="11.5" style="fill:#6E675A">{ b: 2 }</text>
  <text class="q1-small" x="624" y="238" font-size="10.5" text-anchor="end">✗ 没有 a</text>

  <line x1="88" y1="256" x2="88" y2="280" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#q1-cin)"/>

  <rect class="q1-box" x="40" y="284" width="600" height="48" rx="3"/>
  <text class="q1-mono" x="60" y="314" font-size="12.5">全局</text>
  <text class="q1-mono" x="170" y="314" font-size="11.5" style="fill:#B03A2E">{ a: 1 }</text>
  <text class="q1-small" x="624" y="314" font-size="10.5" text-anchor="end" style="fill:#B03A2E">✓ 命中，停</text>

  <line x1="88" y1="332" x2="88" y2="352" stroke="#6E675A" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#q1-mut)"/>

  <rect class="q1-end" x="40" y="356" width="96" height="32" rx="3"/>
  <text class="q1-mono" x="88" y="377" font-size="11" text-anchor="middle" style="fill:#6E675A">null</text>
  <text class="q1-small" x="152" y="377" font-size="10.5">链的尽头：全程没找到 → ReferenceError</text>

</svg>
