<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 320" width="100%" role="img" aria-labelledby="r1t r1d">
  <title id="r1t">建立一条加密连接的握手成本</title>
  <desc id="r1d">TCP 加 TLS 1.2 需要 3 个 RTT 才能发出首个请求；TCP 加 TLS 1.3 需要 2 个；QUIC 首次连接把传输握手与 TLS 握手合并，只需 1 个 RTT；QUIC 会话恢复时首个请求的数据可以随 Hello 一起发出，0 RTT。</desc>

  <style>
    .r1-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .r1-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .r1-tcp{fill:#EFE8D8;stroke:#1C1A17;stroke-width:1.2}
    .r1-tls{fill:#DDB9B1;stroke:#B03A2E;stroke-width:1.2}
    .r1-req{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.2}
  </style>

  <!-- 行 1：TCP + TLS 1.2 -->
  <text class="r1-mono" x="158" y="83" font-size="11" text-anchor="end">TCP + TLS 1.2</text>
  <rect class="r1-tcp" x="180" y="60" width="110" height="36"/>
  <text class="r1-mono" x="235" y="83" font-size="10.5" text-anchor="middle">TCP 握手</text>
  <rect class="r1-tls" x="290" y="60" width="110" height="36"/>
  <text class="r1-mono" x="345" y="83" font-size="10.5" text-anchor="middle">TLS ①</text>
  <rect class="r1-tls" x="400" y="60" width="110" height="36"/>
  <text class="r1-mono" x="455" y="83" font-size="10.5" text-anchor="middle">TLS ②</text>
  <rect class="r1-req" x="510" y="60" width="110" height="36"/>
  <text class="r1-mono" x="565" y="83" font-size="10.5" text-anchor="middle">首个请求</text>
  <text class="r1-mono" x="630" y="83" font-size="11" font-weight="700" style="fill:#B03A2E">3 RTT</text>

  <!-- 行 2：TCP + TLS 1.3 -->
  <text class="r1-mono" x="158" y="139" font-size="11" text-anchor="end">TCP + TLS 1.3</text>
  <rect class="r1-tcp" x="180" y="116" width="110" height="36"/>
  <text class="r1-mono" x="235" y="139" font-size="10.5" text-anchor="middle">TCP 握手</text>
  <rect class="r1-tls" x="290" y="116" width="110" height="36"/>
  <text class="r1-mono" x="345" y="139" font-size="10.5" text-anchor="middle">TLS 握手</text>
  <rect class="r1-req" x="400" y="116" width="110" height="36"/>
  <text class="r1-mono" x="455" y="139" font-size="10.5" text-anchor="middle">首个请求</text>
  <text class="r1-mono" x="520" y="139" font-size="11" font-weight="700" style="fill:#B03A2E">2 RTT</text>

  <!-- 行 3：QUIC 首次 -->
  <text class="r1-mono" x="158" y="195" font-size="11" text-anchor="end">QUIC 首次连接</text>
  <rect class="r1-tls" x="180" y="172" width="110" height="36"/>
  <text class="r1-mono" x="235" y="195" font-size="10.5" text-anchor="middle">握手（含 TLS）</text>
  <rect class="r1-req" x="290" y="172" width="110" height="36"/>
  <text class="r1-mono" x="345" y="195" font-size="10.5" text-anchor="middle">首个请求</text>
  <text class="r1-mono" x="410" y="195" font-size="11" font-weight="700" style="fill:#B03A2E">1 RTT</text>

  <!-- 行 4：QUIC 0-RTT -->
  <text class="r1-mono" x="158" y="251" font-size="11" text-anchor="end">QUIC 会话恢复</text>
  <rect class="r1-req" x="180" y="228" width="110" height="36"/>
  <text class="r1-mono" x="235" y="251" font-size="10.5" text-anchor="middle">请求 + Hello</text>
  <text class="r1-mono" x="300" y="251" font-size="11" font-weight="700" style="fill:#B03A2E">0 RTT</text>

  <!-- 时间轴 -->
  <line x1="180" y1="286" x2="620" y2="286" stroke="#6E675A" stroke-width="1.2"/>
  <line x1="180" y1="282" x2="180" y2="290" stroke="#6E675A" stroke-width="1.2"/>
  <line x1="290" y1="282" x2="290" y2="290" stroke="#6E675A" stroke-width="1.2"/>
  <line x1="400" y1="282" x2="400" y2="290" stroke="#6E675A" stroke-width="1.2"/>
  <line x1="510" y1="282" x2="510" y2="290" stroke="#6E675A" stroke-width="1.2"/>
  <line x1="620" y1="282" x2="620" y2="290" stroke="#6E675A" stroke-width="1.2"/>
  <text class="r1-small" x="180" y="306" font-size="10" text-anchor="middle">0</text>
  <text class="r1-small" x="290" y="306" font-size="10" text-anchor="middle">1</text>
  <text class="r1-small" x="400" y="306" font-size="10" text-anchor="middle">2</text>
  <text class="r1-small" x="510" y="306" font-size="10" text-anchor="middle">3</text>
  <text class="r1-small" x="620" y="306" font-size="10" text-anchor="middle">4 RTT</text>

</svg>
