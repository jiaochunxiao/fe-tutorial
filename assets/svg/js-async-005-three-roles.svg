<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 740 182" width="100%" role="img" aria-labelledby="el5t el5d">
  <title id="el5t">调用栈、任务队列与 Web API 的三方循环</title>
  <desc id="el5d">代码在主线程的调用栈上跑，遇到异步 API 就把它交给 Web API 托管；回调完成后被放进任务队列排队。调用栈清空之后，事件循环才从队列里取出下一个回调压栈执行。</desc>

  <style>
    .el5-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .el5-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .el5-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .el5-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="el5-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <rect class="el5-box" x="60" y="70" width="150" height="76" rx="3"/>
  <text class="el5-t" x="135" y="98" font-size="11.5" text-anchor="middle">调用栈</text>
  <text class="el5-s" x="135" y="118" font-size="9.5" text-anchor="middle">主线程，只有一个</text>

  <rect class="el5-box" x="295" y="70" width="170" height="76" rx="3"/>
  <text class="el5-t" x="380" y="98" font-size="11.5" text-anchor="middle">任务队列</text>
  <text class="el5-mono" x="380" y="118" font-size="9" text-anchor="middle">task queue</text>

  <rect class="el5-box" x="540" y="70" width="160" height="76" rx="3"/>
  <text class="el5-t" x="620" y="98" font-size="11.5" text-anchor="middle">Web API</text>
  <text class="el5-s" x="620" y="118" font-size="9.5" text-anchor="middle">定时器 / 网络 / IO</text>

  <line x1="291" y1="100" x2="214" y2="100" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#el5-ink)"/>
  <text class="el5-s" x="252" y="92" font-size="9" text-anchor="middle">取一个</text>

  <line x1="536" y1="100" x2="469" y2="100" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#el5-ink)"/>
  <text class="el5-s" x="502" y="92" font-size="9" text-anchor="middle">放入回调</text>

  <path d="M135 146 V186 H620 V150" fill="none" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#el5-ink)"/>
  <text class="el5-s" x="378" y="180" font-size="9.5" text-anchor="middle">遇到异步就交出去托管，主线程不等</text>

  <text class="el5-s" x="60" y="212" font-size="9.5">栈必须是空的，才会去取下一个——这就是「单线程不阻塞」的全部秘密</text>

</svg>
