<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 270" width="100%" role="img" aria-labelledby="dc3t dc3d">
  <title id="dc3t">深拷贝的环：靠 WeakMap 登记处剪断自引用</title>
  <desc id="dc3d">左边是源对象 a，它的 self 属性指回自己，形成一个环。中间是 WeakMap 登记处，记着「源对象 a 对应哪个拷贝」。右边是克隆出来的对象，它的 self 指向克隆自己，而不是指回源对象——环被剪断了。关键在于顺序：先新建空容器、立刻 map.set 登记，然后才开始递归。如果反过来先递归再登记，第二次走进 a 的时候表里还是空的，就会无限递归下去。</desc>

  <style>
    .dc3-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .dc3-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .dc3-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .dc3-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
    .dc3-mt{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="dc3-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="dc3-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <rect class="dc3-box" x="50" y="80" width="150" height="72" rx="3"/>
  <text class="dc3-mt" x="64" y="104" font-size="11">a</text>
  <text class="dc3-mono" x="64" y="126" font-size="9">x: 1</text>
  <text class="dc3-mono" x="64" y="144" font-size="9" style="fill:#B03A2E">self: a</text>

  <path d="M200 124 C250 124 250 192 120 192 C80 192 66 180 66 158" fill="none" stroke="#B03A2E" stroke-width="1.6" marker-end="url(#dc3-red)"/>
  <text class="dc3-s" x="120" y="208" font-size="8.5" text-anchor="middle">self 指回自己</text>

  <rect class="dc3-box" x="310" y="80" width="160" height="72" rx="3"/>
  <text class="dc3-mt" x="324" y="104" font-size="11">WeakMap</text>
  <text class="dc3-mono" x="324" y="126" font-size="9">a → clone</text>
  <text class="dc3-s" x="324" y="144" font-size="8.5">登记过就能查回来</text>

  <line x1="200" y1="100" x2="306" y2="100" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#dc3-ink)"/>
  <text class="dc3-s" x="253" y="92" font-size="8.5" text-anchor="middle">① 先登记</text>

  <line x1="470" y1="108" x2="536" y2="108" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#dc3-red)"/>
  <text class="dc3-s" x="503" y="100" font-size="8.5" text-anchor="middle" style="fill:#B03A2E">② 取回</text>

  <rect class="dc3-box" x="540" y="80" width="150" height="72" rx="3"/>
  <text class="dc3-mt" x="554" y="104" font-size="11">clone</text>
  <text class="dc3-mono" x="554" y="126" font-size="9">x: 1</text>
  <text class="dc3-mono" x="554" y="144" font-size="9" style="fill:#B03A2E">self: clone</text>

  <path d="M540 124 C490 124 490 192 620 192 C660 192 674 180 674 158" fill="none" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#dc3-ink)"/>
  <text class="dc3-s" x="620" y="208" font-size="8.5" text-anchor="middle">环被剪断，指向自己</text>

  <line x1="40" y1="232" x2="40" y2="262" stroke="#B03A2E" stroke-width="2.4"/>
  <text class="dc3-t" x="54" y="244" font-size="9">顺序：新建空容器 → map.set(源, 容器) → 才开始递归。反过来先递归再登记，第二次走进 a 时表里还是空的</text>
  <text class="dc3-s" x="54" y="260" font-size="8.5">四类分派：原始值直接返回 │ Date / RegExp / Map / Set 按类型重建 │ 对象 / 数组 新建 + 登记 + Reflect.ownKeys</text>
</svg>
