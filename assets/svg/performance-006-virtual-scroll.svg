<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 44 740 276" width="100%" role="img" aria-labelledby="vs6t vs6d">
  <title id="vs6t">虚拟滚动：撑高容器 + 渲染切片 + translateY 平移</title>
  <desc id="vs6d">滚动容器里放一个高度等于总行数乘行高的占位容器，只是为了撑出真实的滚动条，里面并不渲染全部内容。滚动时用 scrollTop 除以行高算出起始索引，加上缓冲取一个切片，只渲染这十几行，再用 translateY 把渲染窗口平移到正确位置。DOM 数量恒定，所以渲染成本和数据总量无关。</desc>

  <style>
    .vs6-frame{fill:none;stroke:#1C1A17;stroke-width:1.4}
    .vs6-row{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.2}
    .vs6-track{fill:#E7DEC8;stroke:none}
    .vs6-thumb{fill:#6E675A;stroke:none}
    .vs6-step{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .vs6-band{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.4}
    .vs6-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .vs6-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .vs6-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="vs6-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="vs6-s" x="56" y="66" font-size="9">viewport（overflow: auto）</text>
  <rect class="vs6-frame" x="56" y="78" width="324" height="204" rx="2"/>
  <rect class="vs6-track" x="362" y="82" width="8" height="196" rx="4"/>
  <rect class="vs6-thumb" x="362" y="118" width="8" height="70" rx="4"/>

  <rect class="vs6-row" x="68" y="92" width="288" height="32" rx="2"/>
  <text class="vs6-mono" x="80" y="112" font-size="9">Row[12]</text>
  <rect class="vs6-row" x="68" y="128" width="288" height="32" rx="2"/>
  <text class="vs6-mono" x="80" y="148" font-size="9">Row[13]</text>
  <rect class="vs6-row" x="68" y="164" width="288" height="32" rx="2"/>
  <text class="vs6-mono" x="80" y="184" font-size="9">Row[14]</text>
  <rect class="vs6-row" x="68" y="200" width="288" height="32" rx="2"/>
  <text class="vs6-mono" x="80" y="220" font-size="9">Row[15]</text>
  <rect class="vs6-row" x="68" y="236" width="288" height="32" rx="2"/>
  <text class="vs6-mono" x="80" y="256" font-size="9">Row[16]</text>

  <text class="vs6-s" x="56" y="300" font-size="9">只这五行存在于 DOM 里，其余九千多行只是 phantom 算出来的高度</text>

  <text class="vs6-t" x="404" y="66" font-size="9.5">滚动时只做三件事</text>

  <rect class="vs6-step" x="404" y="78" width="300" height="32" rx="3"/>
  <text class="vs6-mono" x="554" y="98" font-size="9" text-anchor="middle">scrollTop ÷ 行高 = 起点索引</text>
  <line x1="554" y1="110" x2="554" y2="120" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#vs6-ink)"/>

  <rect class="vs6-step" x="404" y="122" width="300" height="32" rx="3"/>
  <text class="vs6-mono" x="554" y="142" font-size="9" text-anchor="middle">切片 [start, end]，上下各留缓冲</text>
  <line x1="554" y1="154" x2="554" y2="164" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#vs6-ink)"/>

  <rect class="vs6-step" x="404" y="166" width="300" height="32" rx="3"/>
  <text class="vs6-mono" x="554" y="186" font-size="9" text-anchor="middle">translateY(start × 行高)</text>

  <rect class="vs6-band" x="404" y="214" width="300" height="34" rx="3"/>
  <text class="vs6-t" x="554" y="235" font-size="9.5" text-anchor="middle">DOM 数量恒定，与总行数无关</text>

  <text class="vs6-s" x="404" y="272" font-size="9">用 top 会每帧重排，用 transform 只走合成</text>
  <text class="vs6-s" x="404" y="292" font-size="9">变高行：预估 → 测量 → 前缀和 + 二分定位</text>
</svg>
