<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 84 740 144" width="100%" role="img" aria-labelledby="ll3t ll3d">
  <title id="ll3t">反转链表的一步：新线接上，旧线被覆盖</title>
  <desc id="ll3d">三个节点 A、B、C。A 的 next 已经是 null，说明 A 及其左边全部反转过来了；B 是当前节点 cur；C 是下一步要处理的节点，已经被暂存进 next。这一步要做的事只有一件：把 B 的 next 从 C 改成 A。红线是新接的线，灰虚线是被覆盖的旧线。关键在于旧线被覆盖之后 C 就再也找不回来了，所以必须先执行 next = cur.next 把 C 的地址存下来，才敢改指针。</desc>

  <style>
    .ll3-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .ll3-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .ll3-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .ll3-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="ll3-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
    <marker id="ll3-grey" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6E675A"/>
    </marker>
  </defs>

  <rect class="ll3-box" x="140" y="96" width="76" height="52" rx="3"/>
  <text class="ll3-t" x="178" y="120" font-size="12" text-anchor="middle">A</text>
  <text class="ll3-mono" x="178" y="138" font-size="8.5" text-anchor="middle">next = null</text>

  <rect class="ll3-box" x="306" y="96" width="76" height="52" rx="3"/>
  <text class="ll3-t" x="344" y="120" font-size="12" text-anchor="middle">B</text>
  <text class="ll3-mono" x="344" y="138" font-size="8.5" text-anchor="middle">cur</text>

  <rect class="ll3-box" x="472" y="96" width="76" height="52" rx="3"/>
  <text class="ll3-t" x="510" y="120" font-size="12" text-anchor="middle">C</text>
  <text class="ll3-mono" x="510" y="138" font-size="8.5" text-anchor="middle">next 暂存</text>

  <line x1="306" y1="122" x2="222" y2="122" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#ll3-red)"/>
  <text class="ll3-s" x="264" y="114" font-size="8.5" text-anchor="middle" style="fill:#B03A2E">新线</text>

  <line x1="382" y1="122" x2="466" y2="122" stroke="#6E675A" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ll3-grey)"/>
  <text class="ll3-s" x="424" y="114" font-size="8.5" text-anchor="middle">旧线</text>

  <line x1="40" y1="170" x2="40" y2="220" stroke="#B03A2E" stroke-width="2.4"/>
  <text class="ll3-t" x="54" y="182" font-size="9">这一步只做一件事：B.next 从 C 改成 A —— 红线接上，灰线就被覆盖了</text>
  <text class="ll3-t" x="54" y="198" font-size="9">覆盖之后 C 的地址只剩 next 这一个副本，所以「先存后路」不是习惯，是唯一活路</text>
  <text class="ll3-s" x="54" y="214" font-size="8.5">不变量：A 及其左侧已全部反转，B 及其右侧仍是原序</text>
</svg>
