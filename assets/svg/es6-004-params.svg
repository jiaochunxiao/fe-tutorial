<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 64 740 240" width="100%" role="img" aria-labelledby="pe4t pe4d">
  <title id="pe4t">形参列表的四个位置，以及箭头函数的四个「没有」</title>
  <desc id="pe4d">形参从左到右依次是：普通形参 a、带默认值的 b、解构加双层默认的 { x = 1 } = {}、以及收尾的 rest。函数对象的 length 只数到第一个带默认值的形参之前，所以这里 length 等于 1，rest 也不计入。箭头函数则没有自己的 this、arguments 和 prototype，也不能用 new 调用，this 沿词法作用域取。</desc>

  <style>
    .pe4-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .pe4-pill{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.2}
    .pe4-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .pe4-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .pe4-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <text class="pe4-mono" x="68" y="80" font-size="9.5" text-anchor="middle">f.length = 1</text>
  <path d="M40 96 L40 88 L96 88 L96 96" fill="none" stroke="#B03A2E" stroke-width="1.8"/>
  <text class="pe4-s" x="108" y="90" font-size="9">第一个默认值一出现，就不再往下数</text>

  <rect class="pe4-box" x="40" y="100" width="56" height="36" rx="3"/>
  <text class="pe4-mono" x="68" y="123" font-size="11" text-anchor="middle">a</text>

  <rect class="pe4-box" x="112" y="100" width="120" height="36" rx="3"/>
  <text class="pe4-mono" x="172" y="123" font-size="10" text-anchor="middle">b = a * 2</text>

  <rect class="pe4-box" x="248" y="100" width="140" height="36" rx="3"/>
  <text class="pe4-mono" x="318" y="123" font-size="10" text-anchor="middle">{ x = 1 } = {}</text>

  <rect class="pe4-box" x="404" y="100" width="84" height="36" rx="3"/>
  <text class="pe4-mono" x="446" y="123" font-size="10" text-anchor="middle">...rest</text>

  <text class="pe4-s" x="68" y="156" font-size="8.5" text-anchor="middle">普通形参</text>

  <text class="pe4-s" x="172" y="152" font-size="8.5" text-anchor="middle">undefined 才触发</text>
  <text class="pe4-s" x="172" y="166" font-size="8.5" text-anchor="middle">可引用前参</text>

  <text class="pe4-s" x="318" y="152" font-size="8.5" text-anchor="middle">解构 + 双层兜底</text>
  <text class="pe4-s" x="318" y="166" font-size="8.5" text-anchor="middle">里面那层也有默认</text>

  <text class="pe4-s" x="446" y="152" font-size="8.5" text-anchor="middle">真数组，不是类数组</text>
  <text class="pe4-s" x="446" y="166" font-size="8.5" text-anchor="middle">不计入 length</text>

  <line x1="40" y1="190" x2="700" y2="190" stroke="#CDC4AF" stroke-width="1"/>

  <text class="pe4-t" x="40" y="212" font-size="10">箭头函数：四个「没有」</text>
  <text class="pe4-s" x="196" y="212" font-size="9">this 沿词法作用域取，call / bind 改不动</text>

  <rect class="pe4-pill" x="40" y="224" width="150" height="30" rx="15"/>
  <text class="pe4-t" x="115" y="243" font-size="9.5" text-anchor="middle">没有自己的 this</text>
  <rect class="pe4-pill" x="200" y="224" width="150" height="30" rx="15"/>
  <text class="pe4-t" x="275" y="243" font-size="9.5" text-anchor="middle">没有 arguments</text>
  <rect class="pe4-pill" x="360" y="224" width="150" height="30" rx="15"/>
  <text class="pe4-t" x="435" y="243" font-size="9.5" text-anchor="middle">没有 prototype</text>
  <rect class="pe4-pill" x="520" y="224" width="150" height="30" rx="15"/>
  <text class="pe4-t" x="595" y="243" font-size="9.5" text-anchor="middle">不能 new</text>

  <text class="pe4-s" x="40" y="284" font-size="9.5">回调之王，方法之坑：对象方法里写箭头，this 拿到的是外层而不是对象自己</text>
</svg>
