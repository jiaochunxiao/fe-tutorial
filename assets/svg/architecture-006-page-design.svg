<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 326" width="100%" role="img" aria-labelledby="pd6t pd6d">
  <title id="pd6t">大促会场：实时性预算决定技术选型，每条链路都有 Plan B</title>
  <desc id="pd6d">上面三行按实时性预算分级。倒计时只需要一秒的粒度，所以本地计时、进页面时校时一次，每秒零请求；库存需要秒级，用 WebSocket 推送但只订阅可见区域，连接数等于可见行数而不是商品总量；价格标签分钟级就够，轮询一次三十秒。三行的代价依次是时钟漂移、屏外库存陈旧、最多旧三十秒。下面一行是容灾链：边缘缓存坏了回退兜底静态页，推送断了降级轮询，接口挂了展示本地快照。</desc>

  <defs>
    <marker id="pd6-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6E675A"/>
    </marker>
  </defs>

  <style>
    .pd6-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .pd6-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .pd6-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .pd6-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .pd6-fb{fill:#FBF7EE;stroke:#CDC4AF;stroke-width:1}
  </style>

  <text class="pd6-s" x="40" y="44" font-size="8.5">实时性预算</text>
  <text class="pd6-s" x="150" y="44" font-size="8.5">方案</text>
  <text class="pd6-s" x="470" y="44" font-size="8.5">代价</text>
  <text class="pd6-t" x="692" y="44" font-size="8.5" text-anchor="end" style="fill:#B03A2E">一秒都不多花</text>

  <text class="pd6-mono" x="40" y="82" font-size="9.5">≤ 1s</text>
  <text class="pd6-s" x="40" y="96" font-size="8.5">倒计时</text>
  <rect class="pd6-box" x="150" y="64" width="300" height="44" rx="3"/>
  <text class="pd6-t" x="164" y="82" font-size="9">本地计时，进页面校时一次</text>
  <text class="pd6-s" x="164" y="97" font-size="8.5">每秒 0 请求，服务端不参与</text>
  <text class="pd6-s" x="470" y="82" font-size="8.5">时钟漂移只能靠那一次校时兜住</text>

  <text class="pd6-mono" x="40" y="142" font-size="9.5">秒级</text>
  <text class="pd6-s" x="40" y="156" font-size="8.5">库存</text>
  <rect class="pd6-box" x="150" y="124" width="300" height="44" rx="3"/>
  <text class="pd6-t" x="164" y="142" font-size="9">WS 推送，只订可见区</text>
  <text class="pd6-s" x="164" y="157" font-size="8.5">连接数 = 可见行数，不随商品总量涨</text>
  <text class="pd6-s" x="470" y="142" font-size="8.5">屏外那些商品的库存是旧的</text>

  <text class="pd6-mono" x="40" y="202" font-size="9.5">分钟级</text>
  <text class="pd6-s" x="40" y="216" font-size="8.5">价格</text>
  <rect class="pd6-box" x="150" y="184" width="300" height="44" rx="3"/>
  <text class="pd6-t" x="164" y="202" font-size="9">轮询</text>
  <text class="pd6-s" x="164" y="217" font-size="8.5">一次请求 / 30s，标签不需要更实时</text>
  <text class="pd6-s" x="470" y="202" font-size="8.5">最多旧 30 秒，对这个场景够用</text>

  <text class="pd6-s" x="40" y="256" font-size="8.5">每条链路都要有 Plan B</text>

  <rect class="pd6-fb" x="48" y="268" width="88" height="40" rx="2"/>
  <text class="pd6-t" x="92" y="292" font-size="8.5" text-anchor="middle">边缘缓存</text>
  <text class="pd6-t" x="143" y="293" font-size="10" text-anchor="middle" style="fill:#B03A2E">✕</text>
  <line x1="152" y1="289" x2="161" y2="289" stroke="#6E675A" stroke-width="1.2" marker-end="url(#pd6-ink)"/>
  <rect class="pd6-fb" x="164" y="268" width="88" height="40" rx="2"/>
  <text class="pd6-t" x="208" y="292" font-size="8.5" text-anchor="middle">兜底静态页</text>

  <rect class="pd6-fb" x="268" y="268" width="88" height="40" rx="2"/>
  <text class="pd6-t" x="312" y="292" font-size="8.5" text-anchor="middle">WS 推送</text>
  <text class="pd6-t" x="363" y="293" font-size="10" text-anchor="middle" style="fill:#B03A2E">✕</text>
  <line x1="372" y1="289" x2="381" y2="289" stroke="#6E675A" stroke-width="1.2" marker-end="url(#pd6-ink)"/>
  <rect class="pd6-fb" x="384" y="268" width="88" height="40" rx="2"/>
  <text class="pd6-t" x="428" y="292" font-size="8.5" text-anchor="middle">降级轮询</text>

  <rect class="pd6-fb" x="488" y="268" width="88" height="40" rx="2"/>
  <text class="pd6-t" x="532" y="292" font-size="8.5" text-anchor="middle">接口</text>
  <text class="pd6-t" x="583" y="293" font-size="10" text-anchor="middle" style="fill:#B03A2E">✕</text>
  <line x1="592" y1="289" x2="601" y2="289" stroke="#6E675A" stroke-width="1.2" marker-end="url(#pd6-ink)"/>
  <rect class="pd6-fb" x="604" y="268" width="88" height="40" rx="2"/>
  <text class="pd6-t" x="648" y="292" font-size="8.5" text-anchor="middle">本地快照</text>
</svg>
