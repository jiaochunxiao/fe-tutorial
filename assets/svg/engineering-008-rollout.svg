<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 280" width="100%" role="img" aria-labelledby="e8gt e8gd">
  <title id="e8gt">灰度发布与回滚：两道安全网</title>
  <desc id="e8gd">灰度是让流量按比例一级级放大：百分之一、百分之十、百分之五十、最后全量，每一级都看错误率，不对就停。分流靠网关或 Nginx 按 cookie 和 uid 判断，前端把版本号上报到监控里才能对比新旧两版。回滚的前提是旧产物还在：资源层保留最近若干版哈希文件，回滚时只改 HTML 指针，用户下次协商就拿到旧的引用表，秒级生效。</desc>

  <style>
    .e8g-bar{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.2}
    .e8g-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.3}
    .e8g-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .e8g-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .e8g-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="e8g-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="e8g-t" x="40" y="30" font-size="9">灰度：一级一级放大，每级都看错误率</text>

  <text class="e8g-s" x="100" y="65" font-size="8" text-anchor="end">1%</text>
  <rect class="e8g-bar" x="112" y="48" width="24" height="24" rx="2"/>
  <text class="e8g-s" x="148" y="65" font-size="8">先内部，看错误率有没有抖</text>

  <text class="e8g-s" x="100" y="105" font-size="8" text-anchor="end">10%</text>
  <rect class="e8g-bar" x="112" y="88" width="70" height="24" rx="2"/>
  <text class="e8g-s" x="194" y="105" font-size="8">放白名单，对比新旧两版指标</text>

  <text class="e8g-s" x="100" y="145" font-size="8" text-anchor="end">50%</text>
  <rect class="e8g-bar" x="112" y="128" width="150" height="24" rx="2"/>
  <text class="e8g-s" x="274" y="145" font-size="8">一半一半，出问题还来得及收</text>

  <text class="e8g-s" x="100" y="185" font-size="8" text-anchor="end">100%</text>
  <rect class="e8g-bar" x="112" y="168" width="230" height="24" rx="2"/>
  <text class="e8g-s" x="354" y="185" font-size="8">全量上线</text>

  <text class="e8g-s" x="40" y="216" font-size="8">分流：网关 / Nginx 按 cookie、uid 判断走哪个版本</text>
  <text class="e8g-s" x="40" y="234" font-size="8">观测：把 <tspan class="e8g-mono" font-size="8">window.__APP_VERSION__</tspan> 上报进监控，才能分版本看错误率</text>

  <line x1="430" y1="40" x2="430" y2="240" stroke="#CDC4AF" stroke-width="1"/>

  <text class="e8g-t" x="452" y="30" font-size="9" style="fill:#B03A2E">回滚：改一个指针</text>
  <rect class="e8g-box" x="452" y="44" width="248" height="34" rx="3"/>
  <text class="e8g-t" x="466" y="65" font-size="8">① 旧哈希文件还在（保留 N 版）</text>
  <line x1="576" y1="78" x2="576" y2="96" stroke="#B03A2E" stroke-width="1.5" marker-end="url(#e8g-red)"/>
  <rect class="e8g-box" x="452" y="100" width="248" height="34" rx="3"/>
  <text class="e8g-t" x="466" y="121" font-size="8">② 把 HTML 指针拨回去</text>
  <line x1="576" y1="134" x2="576" y2="152" stroke="#B03A2E" stroke-width="1.5" marker-end="url(#e8g-red)"/>
  <rect class="e8g-box" x="452" y="156" width="248" height="34" rx="3"/>
  <text class="e8g-t" x="466" y="177" font-size="8">③ 用户下次协商就拿到旧引用表</text>
  <text class="e8g-s" x="452" y="212" font-size="8">秒级生效 —— 前提是第 ① 步还在</text>

  <line x1="40" y1="250" x2="700" y2="250" stroke="#CDC4AF" stroke-width="1"/>
  <text class="e8g-t" x="40" y="270" font-size="8.5" style="fill:#B03A2E">清理策略和回滚能力是同一件事：产物清得太狠，回滚就无从谈起（常见做法是保留最近 10 个版本）。</text>
</svg>
