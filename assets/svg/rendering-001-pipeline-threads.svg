<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 740 320" width="100%" role="img" aria-labelledby="rp1t rp1d">
  <title id="rp1t">渲染管线按线程分成三段</title>
  <desc id="rp1d">主线程上依次跑 DOM 与 CSSOM 合并成渲染树、布局算几何、绘制生成指令与图层；之后交给光栅线程把指令变成像素；最后由合成线程把图层拼成帧上屏。线程一换，主线程就能腾出手来。</desc>

  <style>
    .rp1-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .rp1-key{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.6}
    .rp1-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .rp1-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .rp1-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="rp1-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <line x1="24" y1="148" x2="716" y2="148" stroke="#CDC4AF" stroke-width="1" stroke-dasharray="4 5"/>
  <line x1="24" y1="248" x2="716" y2="248" stroke="#CDC4AF" stroke-width="1" stroke-dasharray="4 5"/>

  <text class="rp1-s" x="24" y="98" font-size="9.5">主线程</text>
  <text class="rp1-s" x="24" y="198" font-size="9.5">光栅线程组</text>
  <text class="rp1-s" x="24" y="298" font-size="9.5">合成线程</text>

  <rect class="rp1-box" x="104" y="64" width="130" height="56" rx="3"/>
  <text class="rp1-mono" x="169" y="88" font-size="9.5" text-anchor="middle">DOM + CSSOM</text>
  <text class="rp1-s" x="169" y="106" font-size="9" text-anchor="middle">解析产物</text>

  <line x1="238" y1="92" x2="260" y2="92" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#rp1-ink)"/>

  <rect class="rp1-key" x="264" y="64" width="130" height="56" rx="3"/>
  <text class="rp1-mono" x="329" y="88" font-size="9.5" text-anchor="middle">渲染树</text>
  <text class="rp1-s" x="329" y="106" font-size="9" text-anchor="middle">可见节点 + 样式</text>

  <line x1="398" y1="92" x2="420" y2="92" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#rp1-ink)"/>

  <rect class="rp1-box" x="424" y="64" width="130" height="56" rx="3"/>
  <text class="rp1-mono" x="489" y="88" font-size="9.5" text-anchor="middle">Layout</text>
  <text class="rp1-s" x="489" y="106" font-size="9" text-anchor="middle">算几何</text>

  <line x1="558" y1="92" x2="580" y2="92" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#rp1-ink)"/>

  <rect class="rp1-box" x="584" y="64" width="130" height="56" rx="3"/>
  <text class="rp1-mono" x="649" y="88" font-size="9.5" text-anchor="middle">Paint</text>
  <text class="rp1-s" x="649" y="106" font-size="9" text-anchor="middle">指令 + 分层</text>

  <line x1="649" y1="120" x2="649" y2="160" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#rp1-ink)"/>

  <rect class="rp1-box" x="584" y="164" width="130" height="56" rx="3"/>
  <text class="rp1-mono" x="649" y="188" font-size="9.5" text-anchor="middle">光栅化</text>
  <text class="rp1-s" x="649" y="206" font-size="9" text-anchor="middle">指令 → 像素</text>
  <text class="rp1-s" x="104" y="188" font-size="9.5">把绘制指令变成像素，交给 GPU 并行</text>
  <text class="rp1-s" x="104" y="208" font-size="9.5">主线程在这之后就能去跑下一帧的 JS 了</text>

  <line x1="649" y1="220" x2="649" y2="260" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#rp1-ink)"/>

  <rect class="rp1-box" x="584" y="264" width="130" height="56" rx="3"/>
  <text class="rp1-mono" x="649" y="288" font-size="9.5" text-anchor="middle">合成</text>
  <text class="rp1-s" x="649" y="306" font-size="9" text-anchor="middle">图层拼帧上屏</text>
  <text class="rp1-s" x="104" y="288" font-size="9.5">图层已光栅化时，滚动只是把它们挪位置重拼</text>
  <text class="rp1-s" x="104" y="308" font-size="9.5">所以主线程卡死，页面有时还能滚</text>

</svg>
