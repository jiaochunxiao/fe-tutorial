<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" width="100%" role="img" aria-labelledby="c1t c1d">
  <title id="c1t">class Dog extends Animal 建立的两条链</title>
  <desc id="c1d">class 继承会同时连出两条链：构造函数之间一条，Dog 的 [[Prototype]] 指向 Animal，所以 Dog.kind() 能找到 Animal 的静态方法；原型对象之间一条，instance 的 [[Prototype]] 指向 Dog.prototype，再指向 Animal.prototype，最后到 Object.prototype。构造函数各自还有一条 prototype 属性指向自己的原型对象。</desc>

  <style>
    .c1-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .c1-sans{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .c1-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
  </style>

  <defs>
    <marker id="c1-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="c1-cin" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <!-- 行标 -->
  <text class="c1-sans" x="4" y="48" font-size="10">构造函数</text>
  <text class="c1-sans" x="4" y="170" font-size="10">原型对象</text>
  <text class="c1-sans" x="4" y="286" font-size="10">实例</text>

  <!-- 构造函数层 -->
  <rect class="c1-box" x="90" y="58" width="150" height="42" rx="2"/>
  <text class="c1-mono" x="105" y="78" font-size="13">Dog</text>
  <text class="c1-sans" x="105" y="92" font-size="9.5">extends Animal</text>

  <rect class="c1-box" x="340" y="58" width="160" height="42" rx="2"/>
  <text class="c1-mono" x="355" y="78" font-size="13">Animal</text>
  <text class="c1-mono" x="355" y="92" font-size="9.5" style="fill:#6E675A">static kind() · create()</text>

  <!-- 静态链 -->
  <line x1="240" y1="79" x2="334" y2="79" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#c1-cin)"/>
  <text class="c1-mono" x="287" y="66" font-size="9.5" text-anchor="middle" style="fill:#B03A2E">[[Prototype]]</text>
  <text class="c1-sans" x="287" y="100" font-size="9" text-anchor="middle" style="fill:#6E675A">静态链</text>

  <text class="c1-sans" x="516" y="52" font-size="10">Dog.kind() 能用，是因为</text>
  <text class="c1-sans" x="516" y="66" font-size="10">构造函数之间也连着一条链</text>

  <!-- prototype 属性 -->
  <line x1="200" y1="100" x2="200" y2="176" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#c1-ink)"/>
  <text class="c1-mono" x="208" y="142" font-size="9.5" style="fill:#6E675A">prototype</text>

  <line x1="425" y1="100" x2="425" y2="176" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#c1-ink)"/>
  <text class="c1-mono" x="433" y="142" font-size="9.5" style="fill:#6E675A">prototype</text>

  <!-- 原型对象层 -->
  <rect class="c1-box" x="50" y="180" width="200" height="46" rx="2"/>
  <text class="c1-mono" x="65" y="200" font-size="12">Dog.prototype</text>
  <text class="c1-mono" x="65" y="215" font-size="10" style="fill:#6E675A">bark()</text>

  <rect class="c1-box" x="340" y="180" width="190" height="46" rx="2"/>
  <text class="c1-mono" x="355" y="200" font-size="12">Animal.prototype</text>
  <text class="c1-mono" x="355" y="215" font-size="10" style="fill:#6E675A">eat()</text>

  <rect class="c1-box" x="600" y="180" width="136" height="46" rx="2"/>
  <text class="c1-mono" x="612" y="200" font-size="11">Object.prototype</text>
  <text class="c1-mono" x="612" y="215" font-size="10" style="fill:#6E675A">toString() …</text>

  <line x1="250" y1="203" x2="334" y2="203" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#c1-cin)"/>
  <line x1="530" y1="203" x2="594" y2="203" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#c1-cin)"/>

  <!-- 实例层 -->
  <rect class="c1-box" x="50" y="296" width="200" height="46" rx="2"/>
  <text class="c1-mono" x="65" y="316" font-size="12">instance</text>
  <text class="c1-mono" x="65" y="331" font-size="9.5" style="fill:#6E675A">{ name, breed, #secret }</text>

  <line x1="120" y1="296" x2="120" y2="230" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#c1-cin)"/>
  <text class="c1-mono" x="128" y="268" font-size="9.5" style="fill:#B03A2E">[[Prototype]]</text>
</svg>
