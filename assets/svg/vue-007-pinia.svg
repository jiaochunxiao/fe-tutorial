<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" width="100%" role="img" aria-labelledby="pn7t pn7d">
  <title id="pn7t">Pinia 的创建链：defineStore → 单例 → effectScope → setup → 实例</title>
  <desc id="pn7d">左边是 Pinia 从定义到实例的五步竖链：defineStore 只是登记一个工厂函数，useStore 第一次调用时才真正创建并按下 id 缓存，创建时开一个独立的 effectScope 让 store 不随组件卸载而销毁，setup 在这个 scope 里跑一次得到 ref、computed 和普通函数，最后装配成 store 实例，带 state、getters、actions 和四个方法。右边是对照：Vuex 是五件套加嵌套模块树，两条通道 commit 和 dispatch；Pinia 只剩三件套加多个平级 store，直接调用。删掉 mutations 的根因是 Proxy 能追踪任意位置的同步写入，devtools 不再需要人工划出的边界。</desc>

  <style>
    .pn7-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .pn7-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .pn7-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .pn7-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="pn7-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <rect class="pn7-box" x="40" y="40" width="280" height="34" rx="3"/>
  <text class="pn7-mono" x="54" y="62" font-size="10">defineStore(id, setup)</text>
  <line x1="180" y1="74" x2="180" y2="98" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#pn7-ink)"/>

  <rect class="pn7-box" x="40" y="100" width="280" height="40" rx="3"/>
  <text class="pn7-mono" x="54" y="120" font-size="10">useStore()</text>
  <text class="pn7-s" x="54" y="134" font-size="8.5">首次调用才创建，之后按 id 命中缓存</text>
  <line x1="180" y1="140" x2="180" y2="164" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#pn7-ink)"/>

  <rect class="pn7-box" x="40" y="166" width="280" height="40" rx="3"/>
  <text class="pn7-mono" x="54" y="186" font-size="10">effectScope(true)</text>
  <text class="pn7-s" x="54" y="200" font-size="8.5">独立 scope，组件卸载了 store 还在</text>
  <line x1="180" y1="206" x2="180" y2="230" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#pn7-ink)"/>

  <rect class="pn7-box" x="40" y="232" width="280" height="40" rx="3"/>
  <text class="pn7-mono" x="54" y="252" font-size="10">setup()</text>
  <text class="pn7-s" x="54" y="266" font-size="8.5">跑一次，产出 ref / computed / 函数</text>
  <line x1="180" y1="272" x2="180" y2="296" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#pn7-ink)"/>

  <rect class="pn7-box" x="40" y="298" width="280" height="64" rx="3"/>
  <text class="pn7-mono" x="54" y="320" font-size="10">state · getters · actions</text>
  <text class="pn7-mono" x="54" y="338" font-size="10">$subscribe · $onAction · $reset</text>
  <text class="pn7-s" x="54" y="354" font-size="8.5">state 可直接改，也能 $patch 批量改</text>

  <text class="pn7-s" x="380" y="52" font-size="8.5">设计对照</text>

  <rect class="pn7-box" x="380" y="62" width="320" height="88" rx="3"/>
  <text class="pn7-mono" x="394" y="84" font-size="10">state · getters · mutations</text>
  <text class="pn7-mono" x="394" y="102" font-size="10">actions · modules（嵌套树）</text>
  <text class="pn7-s" x="394" y="122" font-size="8.5">两条通道：commit 同步、dispatch 异步</text>
  <text class="pn7-s" x="394" y="140" font-size="8.5">Vuex 五件套</text>

  <line x1="540" y1="150" x2="540" y2="182" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#pn7-ink)"/>
  <text class="pn7-s" x="552" y="170" font-size="8.5">删掉两层</text>

  <rect class="pn7-box" x="380" y="184" width="320" height="78" rx="3"/>
  <text class="pn7-mono" x="394" y="206" font-size="10">state · getters · actions</text>
  <text class="pn7-mono" x="394" y="224" font-size="10">多个平级 store</text>
  <text class="pn7-s" x="394" y="244" font-size="8.5">直接调用，action 里 this 直达 state</text>

  <line x1="40" y1="382" x2="40" y2="410" stroke="#B03A2E" stroke-width="2.4"/>
  <text class="pn7-t" x="54" y="394" font-size="9">删 mutations 的根因：Proxy 能追踪任意位置的同步写入</text>
  <text class="pn7-t" x="54" y="408" font-size="9">devtools 不再需要「mutation」这条人工划出来的边界</text>
</svg>
