<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 314" width="100%" role="img" aria-labelledby="cd5t cd5d">
  <title id="cd5t">层叠的四级判定与 specificity 三元组</title>
  <desc id="cd5d">左栏是从高到低四级判定：第一级来源与重要性，作者 important 高于作者正常声明，再高于用户样式与浏览器默认；第二级层叠层，后声明的 layer 整体压过先声明的层；第三级优先级，也就是 A B C 三元组按字典序比较；第四级出现顺序，全部打平时后写的赢。高级先比，同级才往下比，不是加分求和。底部虚线注明继承只是替补，不参与这四级比较。右栏把三元组拆开：A 数 ID 个数、B 数类与属性与伪类个数、C 数元素与伪元素个数，以 #main .title 为例得到 (1,1,0)。再往下是字典序的威力：(1,0,0) 大于 (0,99,99)，一个 ID 碾压任意多个类。最后列出特殊计分：通配符与组合符计零，where 计零而 is 与 not 取括号内最高，行内 style 相当于第四维，important 直接跳出选择器体系。</desc>

  <style>
    .cd5-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .cd5-c{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .cd5-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .cd5-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .cd5-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <text class="cd5-t" x="40" y="24" font-size="8.5">四级判定：高级先比，同级才往下比</text>
  <text class="cd5-t" x="390" y="24" font-size="8.5">specificity 拆成三格数数</text>

  <rect class="cd5-b" x="40" y="40" width="320" height="48" rx="2"/>
  <text class="cd5-mono" x="52" y="58" font-size="8.5" style="fill:#B03A2E">①</text>
  <text class="cd5-t" x="72" y="58" font-size="9">来源与重要性</text>
  <text class="cd5-s" x="52" y="76" font-size="7.5">作者 !important &gt; 作者正常 &gt; 用户 &gt; 浏览器默认</text>

  <rect class="cd5-b" x="40" y="98" width="320" height="48" rx="2"/>
  <text class="cd5-mono" x="52" y="116" font-size="8.5" style="fill:#B03A2E">②</text>
  <text class="cd5-t" x="72" y="116" font-size="9">层叠层 @layer</text>
  <text class="cd5-s" x="52" y="134" font-size="7.5">后声明的层整体压过先声明的层</text>

  <rect class="cd5-b" x="40" y="156" width="320" height="48" rx="2"/>
  <text class="cd5-mono" x="52" y="174" font-size="8.5" style="fill:#B03A2E">③</text>
  <text class="cd5-t" x="72" y="174" font-size="9">优先级 (A,B,C)</text>
  <text class="cd5-s" x="52" y="192" font-size="7.5">字典序比较，不是加分求和</text>

  <rect class="cd5-b" x="40" y="214" width="320" height="48" rx="2"/>
  <text class="cd5-mono" x="52" y="232" font-size="8.5" style="fill:#B03A2E">④</text>
  <text class="cd5-t" x="72" y="232" font-size="9">出现顺序</text>
  <text class="cd5-s" x="52" y="250" font-size="7.5">以上全打平 → 后写的赢</text>

  <text class="cd5-s" x="40" y="282" font-size="7.5" style="fill:#B03A2E">继承只是替补：直接命中 &gt; 继承值，不参与上面四级</text>

  <rect class="cd5-b" x="390" y="40" width="96" height="56" rx="2"/>
  <text class="cd5-mono" x="438" y="58" font-size="9" text-anchor="middle" style="fill:#B03A2E">A</text>
  <text class="cd5-t" x="438" y="74" font-size="7.5" text-anchor="middle">ID 个数</text>
  <text class="cd5-mono" x="438" y="88" font-size="7" text-anchor="middle" style="fill:#6E675A">#main</text>

  <rect class="cd5-b" x="496" y="40" width="96" height="56" rx="2"/>
  <text class="cd5-mono" x="544" y="58" font-size="9" text-anchor="middle" style="fill:#B03A2E">B</text>
  <text class="cd5-t" x="544" y="74" font-size="7.5" text-anchor="middle">类 · 属性 · 伪类</text>
  <text class="cd5-mono" x="544" y="88" font-size="7" text-anchor="middle" style="fill:#6E675A">.card</text>

  <rect class="cd5-b" x="602" y="40" width="96" height="56" rx="2"/>
  <text class="cd5-mono" x="650" y="58" font-size="9" text-anchor="middle" style="fill:#B03A2E">C</text>
  <text class="cd5-t" x="650" y="74" font-size="7.5" text-anchor="middle">元素 · 伪元素</text>
  <text class="cd5-mono" x="650" y="88" font-size="7" text-anchor="middle" style="fill:#6E675A">div</text>

  <rect class="cd5-b" x="390" y="108" width="320" height="44" rx="2"/>
  <text class="cd5-mono" x="402" y="126" font-size="8.5">#main .title</text>
  <text class="cd5-s" x="402" y="142" font-size="7.5" style="fill:#B03A2E">A=1 B=1 C=0 → (1,1,0)，赢过下面所有类组合</text>

  <rect class="cd5-c" x="390" y="168" width="320" height="44" rx="2"/>
  <text class="cd5-mono" x="402" y="186" font-size="9">(1,0,0) &gt; (0,99,99)</text>
  <text class="cd5-s" x="402" y="202" font-size="7.5">逐位比较、不进位 —— 一个 ID 碾压任意多个类</text>

  <text class="cd5-t" x="390" y="232" font-size="8.5">特殊计分（最容易算错的地方）</text>
  <text class="cd5-s" x="390" y="248" font-size="7.5">* 与组合符（空格 &gt; + ~）= 0</text>
  <text class="cd5-s" x="390" y="262" font-size="7.5">:where() = 0；:is() / :not() 取括号内最高</text>
  <text class="cd5-s" x="390" y="276" font-size="7.5">行内 style = 第四维，高于一切选择器</text>
  <text class="cd5-s" x="390" y="290" font-size="7.5">!important 跳出选择器体系，回到第 ① 级</text>
</svg>
