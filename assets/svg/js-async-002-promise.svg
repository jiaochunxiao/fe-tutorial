<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 212" width="100%" role="img" aria-labelledby="p2t p2d">
  <title id="p2t">Promise 的三个状态与两条迁移</title>
  <desc id="p2d">Promise 从 pending 开始，调用 resolve 迁移到 fulfilled 并带上落定值，调用 reject 迁移到 rejected 并带上拒绝原因。两个落定状态之间不能互转，一旦落定就永久定格，再调 resolve 或 reject 都不会生效。</desc>

  <style>
    .p2-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .p2-pend{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.4}
    .p2-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .p2-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="p2-cin" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="p2-small" x="124" y="112" font-size="9.5" text-anchor="end">初始状态</text>
  <rect class="p2-pend" x="140" y="80" width="132" height="56" rx="3"/>
  <text class="p2-mono" x="206" y="114" font-size="12.5" text-anchor="middle">pending</text>

  <path d="M272 96 C320 96 330 54 382 54" fill="none" stroke="#B03A2E" stroke-width="1.6" marker-end="url(#p2-cin)"/>
  <text class="p2-mono" x="378" y="45" font-size="9.5" text-anchor="end" style="fill:#B03A2E">resolve(value)</text>

  <path d="M272 120 C320 120 330 170 382 170" fill="none" stroke="#B03A2E" stroke-width="1.6" marker-end="url(#p2-cin)"/>
  <text class="p2-mono" x="378" y="190" font-size="9.5" text-anchor="end" style="fill:#B03A2E">reject(reason)</text>

  <rect class="p2-box" x="386" y="26" width="252" height="56" rx="3"/>
  <text class="p2-mono" x="402" y="50" font-size="12">fulfilled</text>
  <text class="p2-small" x="402" y="70" font-size="9.5">落定值 value</text>

  <rect class="p2-box" x="386" y="142" width="252" height="56" rx="3"/>
  <text class="p2-mono" x="402" y="166" font-size="12">rejected</text>
  <text class="p2-small" x="402" y="186" font-size="9.5">拒绝原因 reason</text>

</svg>
