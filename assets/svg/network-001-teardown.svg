<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 530" width="100%" role="img" aria-labelledby="t5t t5d">
  <title id="t5t">TCP 四次挥手时序</title>
  <desc id="t5d">客户端发 FIN，服务端回 ACK 进入半关闭状态继续发剩余数据；服务端发完再发 FIN，客户端回 ACK 并进入 TIME_WAIT，等 2MSL 后关闭。</desc>
  <defs>
    <marker id="t5-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="t5-cin" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <style>
    .t5-life{stroke:#CDC4AF;stroke-width:1.4;stroke-dasharray:3 5}
    .t5-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .t5-serif{font-family:'Noto Serif SC','Songti SC','SimSun',serif;fill:#1C1A17}
    .t5-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .t5-state{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;font-size:10.5px;fill:#6E675A;letter-spacing:.3px}
  </style>

  <!-- 端点 -->
  <text class="t5-serif" x="170" y="38" font-size="14" text-anchor="middle">客户端（主动关闭方）</text>
  <text class="t5-serif" x="570" y="38" font-size="14" text-anchor="middle">服务端（被动关闭方）</text>
  <line x1="128" y1="50" x2="212" y2="50" stroke="#1C1A17" stroke-width="1.4"/>
  <line x1="528" y1="50" x2="612" y2="50" stroke="#1C1A17" stroke-width="1.4"/>

  <!-- 生命线 -->
  <line class="t5-life" x1="170" y1="54" x2="170" y2="512"/>
  <line class="t5-life" x1="570" y1="54" x2="570" y2="478"/>

  <!-- 半关闭带 -->
  <rect x="182" y="206" width="376" height="76" fill="#E7DEC8"/>
  <text class="t5-small" x="370" y="238" font-size="11" text-anchor="middle">半关闭 —— 服务端还能继续发剩余数据</text>
  <text class="t5-mono" x="370" y="258" font-size="10.5" text-anchor="middle" style="fill:#6E675A">客户端已不再发，但仍能收</text>

  <!-- ① FIN -->
  <line x1="176" y1="110" x2="562" y2="110" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#t5-cin)"/>
  <text class="t5-mono" x="370" y="86" font-size="12.5" text-anchor="middle" font-weight="700" style="fill:#B03A2E">① FIN</text>
  <text class="t5-mono" x="370" y="100" font-size="10.5" text-anchor="middle" style="fill:#6E675A">seq = u（我的数据发完了）</text>

  <!-- ② ACK -->
  <line x1="564" y1="190" x2="178" y2="190" stroke="#1C1A17" stroke-width="1.8" marker-end="url(#t5-ink)"/>
  <text class="t5-mono" x="370" y="168" font-size="12.5" text-anchor="middle" font-weight="700">② ACK</text>
  <text class="t5-mono" x="370" y="182" font-size="10.5" text-anchor="middle" style="fill:#6E675A">ack = u + 1（知道了）</text>

  <!-- ③ FIN -->
  <line x1="564" y1="300" x2="178" y2="300" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#t5-cin)"/>
  <text class="t5-mono" x="370" y="318" font-size="12.5" text-anchor="middle" font-weight="700" style="fill:#B03A2E">③ FIN</text>
  <text class="t5-mono" x="370" y="332" font-size="10.5" text-anchor="middle" style="fill:#6E675A">seq = w（我也发完了）</text>

  <!-- ④ ACK -->
  <line x1="176" y1="390" x2="562" y2="390" stroke="#1C1A17" stroke-width="1.8" marker-end="url(#t5-ink)"/>
  <text class="t5-mono" x="370" y="368" font-size="12.5" text-anchor="middle" font-weight="700">④ ACK</text>
  <text class="t5-mono" x="370" y="382" font-size="10.5" text-anchor="middle" style="fill:#6E675A">ack = w + 1</text>

  <!-- 客户端状态 -->
  <text class="t5-state" x="152" y="86" text-anchor="end">ESTABLISHED</text>
  <line x1="156" y1="82" x2="168" y2="82" stroke="#CDC4AF" stroke-width="1.2"/>
  <text class="t5-state" x="152" y="150" text-anchor="end">FIN_WAIT_1</text>
  <line x1="156" y1="146" x2="168" y2="146" stroke="#CDC4AF" stroke-width="1.2"/>
  <text class="t5-state" x="152" y="238" text-anchor="end">FIN_WAIT_2</text>
  <line x1="156" y1="234" x2="168" y2="234" stroke="#CDC4AF" stroke-width="1.2"/>
  <text class="t5-state" x="152" y="424" text-anchor="end" style="fill:#B03A2E">TIME_WAIT</text>
  <line x1="156" y1="420" x2="168" y2="420" stroke="#B03A2E" stroke-width="1.2"/>
  <text class="t5-state" x="152" y="504" text-anchor="end">CLOSE</text>
  <line x1="156" y1="500" x2="168" y2="500" stroke="#CDC4AF" stroke-width="1.2"/>

  <!-- 服务端状态 -->
  <text class="t5-state" x="588" y="86">ESTABLISHED</text>
  <line x1="572" y1="82" x2="584" y2="82" stroke="#CDC4AF" stroke-width="1.2"/>
  <text class="t5-state" x="588" y="150">CLOSE_WAIT</text>
  <line x1="572" y1="146" x2="584" y2="146" stroke="#CDC4AF" stroke-width="1.2"/>
  <text class="t5-state" x="588" y="348">LAST_ACK</text>
  <line x1="572" y1="344" x2="584" y2="344" stroke="#CDC4AF" stroke-width="1.2"/>
  <text class="t5-state" x="588" y="468">CLOSE</text>
  <line x1="572" y1="464" x2="584" y2="464" stroke="#CDC4AF" stroke-width="1.2"/>

  <!-- 2MSL -->
  <line x1="170" y1="440" x2="170" y2="488" stroke="#B03A2E" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#t5-cin)"/>
  <text class="t5-mono" x="182" y="462" font-size="10.5" font-weight="700" style="fill:#B03A2E">2MSL</text>
  <text class="t5-small" x="182" y="477" font-size="10">≈ 60 秒</text>

</svg>
