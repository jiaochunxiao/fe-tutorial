<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 212" width="100%" role="img" aria-labelledby="n10ct n10cd">
  <title id="n10ct">建连与请求响应的四段，以及状态码的四种去向</title>
  <desc id="n10cd">一条龙串起前五篇：先做 TCP 三次握手，花一个 RTT；如果是 HTTPS，再走 TLS 握手，一到零个 RTT；然后发送 HTTP 请求，带上方法、头和体；服务器内部经过网关、应用到数据库处理完返回。响应回来按状态码分流：200 继续往下渲染，301 或 302 回到第三步重新导航到 Location，304 说明缓存还能用直接复用，4xx 与 5xx 走错误页。HTTP/2 之后这条连接会被后续几十个请求复用，握手只付一次。</desc>

  <style>
    .n10c-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .n10c-c{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .n10c-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .n10c-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .n10c-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="n10c-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="n10c-t" x="40" y="26" font-size="8.5">修路 → 取货 → 分流：一条龙串起前五篇</text>

  <rect class="n10c-b" x="40" y="50" width="150" height="40" rx="2"/>
  <text class="n10c-t" x="115" y="68" font-size="8.5" text-anchor="middle">TCP 三次握手</text>
  <text class="n10c-s" x="115" y="82" font-size="7.5" text-anchor="middle">1 RTT</text>
  <line x1="190" y1="70" x2="206" y2="70" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#n10c-ink)"/>

  <rect class="n10c-b" x="210" y="50" width="150" height="40" rx="2"/>
  <text class="n10c-t" x="285" y="68" font-size="8.5" text-anchor="middle">TLS 握手</text>
  <text class="n10c-s" x="285" y="82" font-size="7.5" text-anchor="middle">1-RTT / 0-RTT</text>
  <line x1="360" y1="70" x2="376" y2="70" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#n10c-ink)"/>

  <rect class="n10c-b" x="380" y="50" width="150" height="40" rx="2"/>
  <text class="n10c-t" x="455" y="68" font-size="8.5" text-anchor="middle">HTTP 请求</text>
  <text class="n10c-s" x="455" y="82" font-size="7.5" text-anchor="middle">方法 · 头 · 体</text>
  <line x1="530" y1="70" x2="546" y2="70" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#n10c-ink)"/>

  <rect class="n10c-b" x="550" y="50" width="150" height="40" rx="2"/>
  <text class="n10c-t" x="625" y="68" font-size="8.5" text-anchor="middle">服务器处理</text>
  <text class="n10c-s" x="625" y="82" font-size="7.5" text-anchor="middle">网关 → 应用 → DB</text>

  <path d="M625 90 V120 H115" fill="none" stroke="#1C1A17" stroke-width="1.1"/>
  <line x1="115" y1="120" x2="115" y2="144" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#n10c-ink)"/>
  <line x1="285" y1="120" x2="285" y2="144" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#n10c-ink)"/>
  <line x1="455" y1="120" x2="455" y2="144" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#n10c-ink)"/>
  <line x1="625" y1="120" x2="625" y2="144" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#n10c-ink)"/>
  <text class="n10c-s" x="370" y="113" font-size="7.5" text-anchor="middle">状态码分流</text>

  <rect class="n10c-c" x="40" y="148" width="150" height="30" rx="2"/>
  <text class="n10c-t" x="115" y="167" font-size="7.5" text-anchor="middle">200 → 继续渲染</text>

  <rect class="n10c-c" x="210" y="148" width="150" height="30" rx="2"/>
  <text class="n10c-t" x="285" y="167" font-size="7.5" text-anchor="middle">301 / 302 → 回到 ③</text>

  <rect class="n10c-c" x="380" y="148" width="150" height="30" rx="2"/>
  <text class="n10c-t" x="455" y="167" font-size="7.5" text-anchor="middle">304 → 复用缓存</text>

  <rect class="n10c-c" x="550" y="148" width="150" height="30" rx="2"/>
  <text class="n10c-t" x="625" y="167" font-size="7.5" text-anchor="middle">4xx / 5xx → 错误页</text>

  <text class="n10c-t" x="40" y="200" font-size="8.5" style="fill:#B03A2E">HTTP/2 之后这条连接会被后续几十个请求复用 —— 握手只付一次。</text>
</svg>
