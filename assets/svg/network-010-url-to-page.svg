<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 660" width="100%" role="img" aria-labelledby="u1t u1d">
  <title id="u1t">从输入 URL 到首帧上屏的八个阶段</title>
  <desc id="u1d">八个阶段依次是：一、URL 解析与 HSTS 检查；二、缓存闸门；三、DNS 解析；四、建立连接并发出请求；五、解析文档，构建 DOM 与 CSSOM；六、合成渲染树；七、布局计算；八、绘制与合成上屏，随后进入事件循环的稳态。缓存命中时可以从第二阶段直接跳过 DNS 与连接请求，进入第五阶段。</desc>

  <style>
    .u1-serif{font-family:'Noto Serif SC','Songti SC','SimSun',serif;fill:#1C1A17}
    .u1-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .u1-sans{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .u1-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .u1-num{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17;font-weight:700}
  </style>

  <defs>
    <marker id="u1-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="u1-cin" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <!-- ① URL 解析 -->
  <circle class="u1-box" cx="30" cy="39" r="11"/>
  <text class="u1-num" x="30" y="43" font-size="10.5" text-anchor="middle">1</text>
  <rect class="u1-box" x="56" y="16" width="400" height="46" rx="2"/>
  <text class="u1-serif" x="74" y="36" font-size="13">URL 解析 · HSTS 检查</text>
  <text class="u1-mono" x="74" y="53" font-size="10.5" style="fill:#6E675A">https://a.com/p?q=1 → 协议 / 主机 / 端口 / 路径</text>
  <line x1="256" y1="62" x2="256" y2="88" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#u1-ink)"/>

  <!-- ② 缓存闸门 -->
  <circle class="u1-box" cx="30" cy="113" r="11"/>
  <text class="u1-num" x="30" y="117" font-size="10.5" text-anchor="middle">2</text>
  <rect class="u1-box" x="56" y="90" width="400" height="46" rx="2"/>
  <text class="u1-serif" x="74" y="110" font-size="13">缓存闸门</text>
  <text class="u1-sans" x="74" y="127" font-size="10.5">Service Worker → 内存 → 强缓存 → 协商 304</text>
  <line x1="256" y1="136" x2="256" y2="162" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#u1-ink)"/>

  <!-- 缓存命中的捷径：从 ② 绕到 ⑤ 之前汇入主线 -->
  <path d="M456 113 H706 V298 H262" fill="none" stroke="#B03A2E" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#u1-cin)"/>
  <text class="u1-sans" x="560" y="291" font-size="10" text-anchor="middle" style="fill:#B03A2E">命中 → 跳过 ③④</text>

  <!-- ③ DNS -->
  <circle class="u1-box" cx="30" cy="187" r="11"/>
  <text class="u1-num" x="30" y="191" font-size="10.5" text-anchor="middle">3</text>
  <rect class="u1-box" x="56" y="164" width="400" height="46" rx="2"/>
  <text class="u1-serif" x="74" y="184" font-size="13">DNS 解析</text>
  <text class="u1-sans" x="74" y="201" font-size="10.5">a.com → 1.2.3.4（浏览器缓存 → 系统 → 递归查询）</text>
  <line x1="256" y1="210" x2="256" y2="236" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#u1-ink)"/>

  <!-- ④ 连接与请求 -->
  <circle class="u1-box" cx="30" cy="261" r="11"/>
  <text class="u1-num" x="30" y="265" font-size="10.5" text-anchor="middle">4</text>
  <rect class="u1-box" x="56" y="238" width="400" height="46" rx="2"/>
  <text class="u1-serif" x="74" y="258" font-size="13">建立连接 · 发出请求</text>
  <text class="u1-sans" x="74" y="275" font-size="10.5">TCP 三次握手 → TLS 握手 → HTTP 请求</text>
  <text class="u1-sans" x="474" y="265" font-size="10" style="fill:#6E675A">301 回 ① · 304 复用 · 200 新资源</text>
  <line x1="256" y1="284" x2="256" y2="310" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#u1-ink)"/>

  <!-- ⑤ 解析文档 -->
  <circle class="u1-box" cx="30" cy="335" r="11"/>
  <text class="u1-num" x="30" y="339" font-size="10.5" text-anchor="middle">5</text>
  <rect class="u1-box" x="56" y="312" width="400" height="46" rx="2"/>
  <text class="u1-serif" x="74" y="332" font-size="13">解析文档</text>
  <text class="u1-mono" x="74" y="349" font-size="10.5" style="fill:#6E675A">字节 → 字符 → Token → 节点 → DOM</text>
  <text class="u1-sans" x="474" y="339" font-size="10" style="fill:#6E675A">CSS 阻塞渲染 · 同步 JS 暂停解析</text>
  <line x1="256" y1="358" x2="256" y2="384" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#u1-ink)"/>

  <!-- ⑥ 渲染树 -->
  <circle class="u1-box" cx="30" cy="409" r="11"/>
  <text class="u1-num" x="30" y="413" font-size="10.5" text-anchor="middle">6</text>
  <rect class="u1-box" x="56" y="386" width="400" height="46" rx="2"/>
  <text class="u1-serif" x="74" y="406" font-size="13">渲染树</text>
  <text class="u1-sans" x="74" y="423" font-size="10.5">DOM × CSSOM，只留可见节点 + 最终样式</text>
  <line x1="256" y1="432" x2="256" y2="458" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#u1-ink)"/>

  <!-- ⑦ 布局 -->
  <circle class="u1-box" cx="30" cy="483" r="11"/>
  <text class="u1-num" x="30" y="487" font-size="10.5" text-anchor="middle">7</text>
  <rect class="u1-box" x="56" y="460" width="400" height="46" rx="2"/>
  <text class="u1-serif" x="74" y="480" font-size="13">布局 Layout</text>
  <text class="u1-sans" x="74" y="497" font-size="10.5">算几何：每个盒子的大小与位置</text>
  <line x1="256" y1="506" x2="256" y2="532" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#u1-ink)"/>

  <!-- ⑧ 绘制与合成 -->
  <circle class="u1-box" cx="30" cy="557" r="11"/>
  <text class="u1-num" x="30" y="561" font-size="10.5" text-anchor="middle">8</text>
  <rect class="u1-box" x="56" y="534" width="400" height="46" rx="2"/>
  <text class="u1-serif" x="74" y="554" font-size="13">绘制与合成</text>
  <text class="u1-sans" x="74" y="571" font-size="10.5">绘制指令 → 图层 → GPU 合成上屏</text>
  <line x1="256" y1="580" x2="256" y2="604" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#u1-ink)"/>

  <!-- 稳态 -->
  <rect x="56" y="606" width="400" height="36" rx="2" fill="none" stroke="#6E675A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text class="u1-sans" x="256" y="629" font-size="10.5" text-anchor="middle">首帧上屏 → 事件循环 + 渲染节拍进入稳态</text>
</svg>
