<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" width="100%" role="img" aria-labelledby="t7t t7d">
  <title id="t7t">WebSocket 的 HTTP 升级握手</title>
  <desc id="t7d">客户端发一个带 Upgrade websocket 头的 GET 请求，附 Sec-WebSocket-Key；服务器回 101 Switching Protocols，附 Sec-WebSocket-Accept（Key 加固定 GUID 的 SHA-1）。此后同一条 TCP 连接改为双向收发帧。</desc>
  <defs>
    <marker id="t7-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="t7-cin" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <style>
    .t7-life{stroke:#CDC4AF;stroke-width:1.4;stroke-dasharray:3 5}
    .t7-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .t7-serif{font-family:'Noto Serif SC','Songti SC','SimSun',serif;fill:#1C1A17}
    .t7-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <!-- 端点 -->
  <text class="t7-serif" x="170" y="38" font-size="14" text-anchor="middle">客户端</text>
  <text class="t7-serif" x="570" y="38" font-size="14" text-anchor="middle">服务端</text>
  <line x1="128" y1="50" x2="212" y2="50" stroke="#1C1A17" stroke-width="1.4"/>
  <line x1="528" y1="50" x2="612" y2="50" stroke="#1C1A17" stroke-width="1.4"/>

  <!-- 生命线 -->
  <line class="t7-life" x1="170" y1="54" x2="170" y2="420"/>
  <line class="t7-life" x1="570" y1="54" x2="570" y2="420"/>

  <!-- ① 升级请求 -->
  <text class="t7-mono" x="370" y="100" font-size="12.5" text-anchor="middle" font-weight="700">① GET /chat HTTP/1.1（一个普通 HTTP 请求）</text>
  <text class="t7-mono" x="370" y="118" font-size="10.5" text-anchor="middle" style="fill:#6E675A">Upgrade: websocket　·　Connection: Upgrade</text>
  <text class="t7-mono" x="370" y="136" font-size="10.5" text-anchor="middle" style="fill:#6E675A">Sec-WebSocket-Key: dGhlIHNhbXBs…（随机基串）</text>
  <text class="t7-mono" x="370" y="154" font-size="10.5" text-anchor="middle" style="fill:#6E675A">Sec-WebSocket-Version: 13</text>
  <line x1="176" y1="176" x2="562" y2="176" stroke="#1C1A17" stroke-width="1.8" marker-end="url(#t7-ink)"/>

  <!-- ② 101 -->
  <text class="t7-mono" x="370" y="214" font-size="12.5" text-anchor="middle" font-weight="700" style="fill:#B03A2E">② 101 Switching Protocols</text>
  <text class="t7-mono" x="370" y="232" font-size="10.5" text-anchor="middle" style="fill:#6E675A">Upgrade: websocket　·　Connection: Upgrade</text>
  <text class="t7-mono" x="370" y="250" font-size="10.5" text-anchor="middle" style="fill:#6E675A">Sec-WebSocket-Accept: s3pPLMBiT…</text>
  <text class="t7-small" x="370" y="268" font-size="10" text-anchor="middle">＝ SHA-1（Key + 固定 GUID）→ 证明对端真的懂 WebSocket</text>
  <text class="t7-small" x="370" y="284" font-size="10" text-anchor="middle" style="fill:#6E675A">1xx 不是最终响应，而是「协议已切换」的通知</text>
  <line x1="564" y1="306" x2="178" y2="306" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#t7-cin)"/>

  <!-- 协议分界：标签在线上方，线保持完整 -->
  <text class="t7-small" x="370" y="330" font-size="10.5" text-anchor="middle" style="fill:#B03A2E">同一条 TCP 连接，此后只说 WebSocket 语</text>
  <line x1="110" y1="340" x2="630" y2="340" stroke="#B03A2E" stroke-width="2"/>

  <!-- 双向帧 -->
  <text class="t7-mono" x="370" y="376" font-size="10.5" text-anchor="middle" style="fill:#B03A2E">帧（文本 / 二进制 / ping·pong·close）双向自由收发</text>
  <line x1="176" y1="392" x2="562" y2="392" stroke="#B03A2E" stroke-width="1.6" marker-end="url(#t7-cin)"/>
  <line x1="564" y1="392" x2="178" y2="392" stroke="#B03A2E" stroke-width="1.6" marker-end="url(#t7-cin)"/>
  <text class="t7-small" x="370" y="416" font-size="10" text-anchor="middle">没有「请求-响应」概念：两端随时主动发，也不需要轮询</text>

</svg>
