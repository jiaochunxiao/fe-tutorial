<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" role="img" aria-labelledby="h1t h1d">
  <title id="h1t">打包器的构建期与运行期</title>
  <desc id="h1d">构建期在 Node 里：读文件得到源码，找依赖得到 deps，转译并广度遍历把所有模块收进 graph 数组。generate 把 graph 拼成一个自执行函数，里面是模块运行时和模块表两半。运行期在浏览器里：require 按 id 从模块表取出函数执行，相对路径靠 mapping 翻译成 id。</desc>

  <style>
    .h1-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .h1-key{fill:#FBF7EE;stroke:#B03A2E;stroke-width:1.6}
    .h1-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .h1-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="h1-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="h1-cin" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="h1-small" x="40" y="38" font-size="10.5" style="fill:#B03A2E">构建期 · 在 Node 里跑</text>

  <rect class="h1-box" x="40" y="62" width="96" height="42" rx="3"/>
  <text class="h1-mono" x="88" y="88" font-size="11.5" text-anchor="middle">src/*.js</text>
  <line x1="140" y1="83" x2="172" y2="83" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#h1-ink)"/>
  <text class="h1-small" x="156" y="54" font-size="9.5" text-anchor="middle">readFile</text>

  <rect class="h1-box" x="176" y="62" width="86" height="42" rx="3"/>
  <text class="h1-mono" x="219" y="88" font-size="11.5" text-anchor="middle">源码</text>
  <line x1="266" y1="83" x2="298" y2="83" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#h1-ink)"/>
  <text class="h1-small" x="282" y="54" font-size="9.5" text-anchor="middle">① 找依赖</text>

  <rect class="h1-box" x="302" y="62" width="86" height="42" rx="3"/>
  <text class="h1-mono" x="345" y="88" font-size="11.5" text-anchor="middle">deps</text>
  <line x1="392" y1="83" x2="424" y2="83" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#h1-ink)"/>
  <text class="h1-small" x="408" y="54" font-size="9.5" text-anchor="middle">② 转译 + BFS</text>

  <rect class="h1-key" x="428" y="62" width="110" height="42" rx="3"/>
  <text class="h1-mono" x="483" y="88" font-size="11.5" text-anchor="middle">graph</text>

  <path d="M483 104 V140 H380 V172" fill="none" stroke="#B03A2E" stroke-width="1.6" marker-end="url(#h1-cin)"/>
  <text class="h1-small" x="492" y="132" font-size="10" style="fill:#B03A2E">③ generate</text>

  <text class="h1-small" x="40" y="152" font-size="10.5" style="fill:#B03A2E">运行期 · 在浏览器里跑</text>

  <rect class="h1-box" x="40" y="176" width="300" height="92" rx="3"/>
  <text class="h1-mono" x="56" y="198" font-size="11" style="fill:#6E675A">模块运行时</text>
  <text class="h1-mono" x="56" y="222" font-size="9.8">require(id)</text>
  <text class="h1-mono" x="56" y="242" font-size="9.8">  [fn, map] = modules[id]</text>
  <text class="h1-mono" x="56" y="262" font-size="9.8">  fn(module, exports, rel =&gt; require(map[rel]))</text>

  <line x1="344" y1="222" x2="412" y2="222" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#h1-ink)"/>
  <text class="h1-small" x="378" y="212" font-size="9.5" text-anchor="middle">modules[id]</text>

  <rect class="h1-box" x="420" y="176" width="300" height="92" rx="3"/>
  <text class="h1-mono" x="436" y="198" font-size="11" style="fill:#6E675A">模块表</text>
  <text class="h1-mono" x="436" y="222" font-size="9.8">0: [fn, {"./utils.js": 1}]</text>
  <text class="h1-mono" x="436" y="242" font-size="9.8">1: [fn, {"./constant.js": 2}]</text>
  <text class="h1-mono" x="436" y="262" font-size="9.8">2: [fn, {}]</text>

  <text class="h1-small" x="40" y="298" font-size="10.5">两半被拼进同一个自执行函数：浏览器一加载就执行 require(0)，从入口模块开始跑，mapping 负责把相对路径翻译成 id。</text>

</svg>
