<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 740 250" width="100%" role="img" aria-labelledby="bf3t bf3d">
  <title id="bf3t">BFC 是一间隔开的包间</title>
  <desc id="bf3d">BFC 内部自成一套规则：垂直堆叠、相邻 margin 在内部折叠、高度包含浮动子元素。同时它与外界隔离：外面的浮动进不来，里面的浮动出不去，边界也不会和外部浮动重叠。</desc>

  <style>
    .bf3-room{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.6}
    .bf3-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .bf3-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .bf3-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="bf3-mut" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6E675A"/>
    </marker>
  </defs>

  <rect class="bf3-room" x="160" y="56" width="420" height="210" rx="10"/>
  <text class="bf3-mono" x="370" y="84" font-size="12" text-anchor="middle">BFC</text>
  <text class="bf3-s" x="370" y="104" font-size="9.5" text-anchor="middle">独立包间：里面一套规则，外面一套规则</text>

  <text class="bf3-s" x="190" y="136" font-size="9.5" style="fill:#B03A2E">①</text>
  <text class="bf3-t" x="210" y="136" font-size="10.5">内部垂直堆叠，块级元素老老实实往下排</text>
  <text class="bf3-s" x="190" y="160" font-size="9.5" style="fill:#B03A2E">②</text>
  <text class="bf3-t" x="210" y="160" font-size="10.5">内部相邻 margin 折叠，但折不出边界</text>
  <text class="bf3-s" x="190" y="184" font-size="9.5" style="fill:#B03A2E">③</text>
  <text class="bf3-t" x="210" y="184" font-size="10.5">边界不与外部浮动重叠，各占各的地</text>
  <text class="bf3-s" x="190" y="208" font-size="9.5" style="fill:#B03A2E">④</text>
  <text class="bf3-t" x="210" y="208" font-size="10.5">高度包含浮动子元素，不用额外清浮动</text>

  <text class="bf3-s" x="40" y="146" font-size="9.5">外面的浮动</text>
  <line x1="112" y1="152" x2="152" y2="152" stroke="#6E675A" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#bf3-mut)"/>
  <line x1="158" y1="136" x2="158" y2="168" stroke="#B03A2E" stroke-width="1.8"/>
  <text class="bf3-s" x="40" y="176" font-size="9.5" style="fill:#B03A2E">进不来</text>

  <line x1="500" y1="152" x2="574" y2="152" stroke="#6E675A" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#bf3-mut)"/>
  <line x1="580" y1="136" x2="580" y2="168" stroke="#B03A2E" stroke-width="1.8"/>
  <text class="bf3-s" x="592" y="146" font-size="9.5">里面的浮动</text>
  <text class="bf3-s" x="592" y="176" font-size="9.5" style="fill:#B03A2E">出不去</text>

</svg>
