<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 392" width="100%" role="img" aria-labelledby="nw8t nw8d">
  <title id="nw8t">new 的四步：建对象、连原型、绑 this、判返回值</title>
  <desc id="nw8d">四步竖链。第一步创建一个全新的空对象；第二步把这个对象的原型指向构造函数的 prototype，这一步就是 instanceof 判定的来源；第三步以这个对象为 this 执行函数体，属性都挂在实例上；第四步判定构造函数的返回值——返回对象或函数就用它替换掉 this，返回原始值或者干脆没返回就忽略，仍然用第一步那个对象。所以只有第四步会劫持结果，这也是手写 new 时必须做返回值判断的原因。</desc>

  <style>
    .nw8-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .nw8-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .nw8-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .nw8-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="nw8-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="nw8-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <rect class="nw8-box" x="60" y="44" width="320" height="44" rx="3"/>
  <text class="nw8-t" x="74" y="64" font-size="9.5">① obj = {}</text>
  <text class="nw8-s" x="74" y="80" font-size="8.5">一个全新的空对象，什么都没有</text>
  <line x1="220" y1="88" x2="220" y2="106" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#nw8-ink)"/>

  <rect class="nw8-box" x="60" y="108" width="320" height="44" rx="3"/>
  <text class="nw8-t" x="74" y="128" font-size="9.5">② obj.[[Prototype]] = Foo.prototype</text>
  <text class="nw8-s" x="74" y="144" font-size="8.5">原型链接 —— 这一步是 instanceof 的来源</text>
  <line x1="380" y1="130" x2="446" y2="130" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#nw8-red)"/>
  <text class="nw8-s" x="413" y="122" font-size="8.5" text-anchor="middle" style="fill:#B03A2E">连上</text>

  <rect class="nw8-box" x="450" y="108" width="160" height="44" rx="3"/>
  <text class="nw8-mono" x="530" y="135" font-size="9.5" text-anchor="middle">Foo.prototype</text>
  <text class="nw8-s" x="450" y="176" font-size="8.5">instanceof 判的就是这条线</text>

  <line x1="220" y1="152" x2="220" y2="170" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#nw8-ink)"/>

  <rect class="nw8-box" x="60" y="172" width="320" height="44" rx="3"/>
  <text class="nw8-t" x="74" y="192" font-size="9.5">③ this = obj，执行 Foo 函数体</text>
  <text class="nw8-s" x="74" y="208" font-size="8.5">this.x = 1 之类的赋值全落在这个对象上</text>
  <line x1="220" y1="216" x2="220" y2="234" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#nw8-ink)"/>

  <rect class="nw8-box" x="60" y="236" width="320" height="44" rx="3"/>
  <text class="nw8-t" x="74" y="256" font-size="9.5">④ 判定返回值</text>
  <text class="nw8-s" x="74" y="272" font-size="8.5">返回值是对象 / 函数 ？ 用它 ： 用 obj</text>

  <path d="M140 280 V306" fill="none" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#nw8-red)"/>
  <path d="M322 280 V306" fill="none" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#nw8-ink)"/>

  <rect class="nw8-box" x="60" y="310" width="170" height="42" rx="3"/>
  <text class="nw8-t" x="74" y="328" font-size="9">返回对象 / 函数</text>
  <text class="nw8-t" x="74" y="344" font-size="8.5" style="fill:#B03A2E">劫持：new 的结果被换掉</text>

  <rect class="nw8-box" x="240" y="310" width="180" height="42" rx="3"/>
  <text class="nw8-t" x="254" y="328" font-size="9">返回原始值 / 没返回</text>
  <text class="nw8-s" x="254" y="344" font-size="8.5">忽略（null 也一样），仍用 obj</text>

  <line x1="40" y1="372" x2="40" y2="390" stroke="#B03A2E" stroke-width="2.4"/>
  <text class="nw8-t" x="54" y="384" font-size="9">四步里只有第④步会「劫持」结果 —— 前三步都是无条件的，第④步是唯一的岔路</text>
</svg>
