<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 270" width="100%" role="img" aria-labelledby="h8pt h8pd">
  <title id="h8pt">从 h 调用到真实 DOM，更新时再走一遍 patch</title>
  <desc id="h8pd">第一行是初次挂载：h 函数产出 vnode 树，mount 把它变成真实 DOM，并把生成的元素回挂到 vnode 的 el 上。数据变化后，同一形状的 vnode 树被重新生成，patch 拿新旧两棵对比，分四路处理：类型变了替换子树，文本变了改 textContent，属性变了走 patchProp，子节点则用 key 索引表做复用移动、新建和删除。key 就是节点的身份证，必须唯一、稳定，绝不能用 index。</desc>

  <style>
    .h8p-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .h8p-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .h8p-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .h8p-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .h8p-m{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="h8p-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="h8p-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="h8p-t" x="40" y="26" font-size="8.5">初次挂载造一遍，更新时再比一遍 —— 形状不变，比较才有意义</text>

  <text class="h8p-s" x="40" y="42" font-size="7">初次</text>
  <rect class="h8p-b" x="40" y="44" width="150" height="34" rx="2"/>
  <text class="h8p-m" x="115" y="65" font-size="7.5" text-anchor="middle">h(标签, 属性, 子)</text>
  <line x1="192" y1="61" x2="208" y2="61" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h8p-ink)"/>
  <rect class="h8p-b" x="214" y="44" width="150" height="34" rx="2"/>
  <text class="h8p-t" x="289" y="65" font-size="8" text-anchor="middle">vnode 树</text>
  <line x1="366" y1="61" x2="382" y2="61" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h8p-ink)"/>
  <rect class="h8p-b" x="388" y="44" width="150" height="34" rx="2"/>
  <text class="h8p-t" x="463" y="65" font-size="8" text-anchor="middle">mount</text>
  <line x1="540" y1="61" x2="556" y2="61" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h8p-ink)"/>
  <rect class="h8p-q" x="562" y="44" width="130" height="34" rx="2"/>
  <text class="h8p-t" x="627" y="65" font-size="8" text-anchor="middle">真实 DOM</text>

  <line x1="289" y1="78" x2="289" y2="114" stroke="#CDC4AF" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="h8p-s" x="299" y="102" font-size="7">同一棵树的形状</text>

  <text class="h8p-s" x="40" y="118" font-size="7">更新</text>
  <rect class="h8p-b" x="40" y="120" width="150" height="34" rx="2"/>
  <text class="h8p-t" x="115" y="141" font-size="8" text-anchor="middle">新数据</text>
  <line x1="192" y1="137" x2="208" y2="137" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h8p-ink)"/>
  <rect class="h8p-b" x="214" y="120" width="150" height="34" rx="2"/>
  <text class="h8p-t" x="289" y="141" font-size="8" text-anchor="middle">新 vnode 树</text>
  <line x1="366" y1="137" x2="382" y2="137" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h8p-ink)"/>
  <rect class="h8p-q" x="388" y="120" width="150" height="34" rx="2"/>
  <text class="h8p-t" x="463" y="141" font-size="8" text-anchor="middle">patch(旧, 新)</text>

  <line x1="463" y1="154" x2="463" y2="170" stroke="#1C1A17" stroke-width="1.1"/>
  <line x1="115" y1="170" x2="610" y2="170" stroke="#1C1A17" stroke-width="1.1"/>
  <line x1="115" y1="170" x2="115" y2="186" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h8p-ink)"/>
  <line x1="280" y1="170" x2="280" y2="186" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h8p-ink)"/>
  <line x1="445" y1="170" x2="445" y2="186" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h8p-ink)"/>
  <line x1="610" y1="170" x2="610" y2="186" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h8p-ink)"/>

  <rect class="h8p-b" x="40" y="190" width="150" height="34" rx="2"/>
  <text class="h8p-t" x="115" y="205" font-size="7.5" text-anchor="middle">类型变</text>
  <text class="h8p-s" x="115" y="218" font-size="6.5" text-anchor="middle">替换子树</text>
  <rect class="h8p-b" x="205" y="190" width="150" height="34" rx="2"/>
  <text class="h8p-t" x="280" y="205" font-size="7.5" text-anchor="middle">文本变</text>
  <text class="h8p-s" x="280" y="218" font-size="6.5" text-anchor="middle">改 textContent</text>
  <rect class="h8p-b" x="370" y="190" width="150" height="34" rx="2"/>
  <text class="h8p-t" x="445" y="205" font-size="7.5" text-anchor="middle">属性变</text>
  <text class="h8p-s" x="445" y="218" font-size="6.5" text-anchor="middle">patchProp</text>
  <rect class="h8p-b" x="535" y="190" width="150" height="34" rx="2"/>
  <text class="h8p-t" x="610" y="205" font-size="7.5" text-anchor="middle">子节点变</text>
  <text class="h8p-s" x="610" y="218" font-size="6.5" text-anchor="middle">key 索引表</text>

  <text class="h8p-t" x="40" y="256" font-size="8.5" style="fill:#B03A2E">key 是节点的身份证：唯一、稳定、禁用 index —— 用 index 等于没有 key。</text>
</svg>
