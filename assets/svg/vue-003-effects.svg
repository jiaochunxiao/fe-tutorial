<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 234" width="100%" role="img" aria-labelledby="v3et v3ed">
  <title id="v3et">三类 effect 共用一套账本，差异在调度策略</title>
  <desc id="v3ed">渲染 effect、computed effect、watch 与 watchEffect 共用同一套 track 与 trigger 账本，区别只在于依赖变化之后各自被怎么调度。渲染 effect 依赖变了就批量重渲染，同步块里改多少次都只跑一次；computed 依赖变了只把 dirty 标脏，真正取值时才重新计算并写入缓存，惰性与缓存是一体的；watch 依赖变了把回调入队，显式声明监听源并拿到新旧值；watchEffect 自动收集依赖并立即执行一次，靠 onCleanup 在重跑前清理上一次副作用。</desc>

  <style>
    .v3e-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .v3e-h{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .v3e-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .v3e-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .v3e-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="v3e-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="v3e-t" x="40" y="26" font-size="8.5">同一套账本，三种调度 —— 这是 computed 与 watch 唯一的分野</text>

  <rect class="v3e-b" x="250" y="40" width="240" height="34" rx="2"/>
  <text class="v3e-t" x="370" y="61" font-size="8.5" text-anchor="middle">track / trigger 账本</text>

  <path d="M370 74 V88 H140 M370 88 H600" fill="none" stroke="#1C1A17" stroke-width="1"/>
  <line x1="140" y1="88" x2="140" y2="100" stroke="#1C1A17" stroke-width="1" marker-end="url(#v3e-ink)"/>
  <line x1="370" y1="88" x2="370" y2="100" stroke="#1C1A17" stroke-width="1" marker-end="url(#v3e-ink)"/>
  <line x1="600" y1="88" x2="600" y2="100" stroke="#1C1A17" stroke-width="1" marker-end="url(#v3e-ink)"/>

  <rect class="v3e-h" x="40" y="104" width="200" height="28" rx="2"/>
  <text class="v3e-t" x="140" y="122" font-size="8" text-anchor="middle">渲染 effect</text>
  <rect class="v3e-b" x="40" y="132" width="200" height="68" rx="2" style="fill:none"/>
  <text class="v3e-s" x="52" y="150" font-size="7">依赖变 → 批量重渲染</text>
  <text class="v3e-s" x="52" y="166" font-size="7">同步块里改 N 次</text>
  <text class="v3e-s" x="52" y="182" font-size="7">也只跑 1 次</text>

  <rect class="v3e-h" x="270" y="104" width="200" height="28" rx="2"/>
  <text class="v3e-t" x="370" y="122" font-size="8" text-anchor="middle">computed effect</text>
  <rect class="v3e-b" x="270" y="132" width="200" height="68" rx="2" style="fill:none"/>
  <text class="v3e-s" x="282" y="150" font-size="7">依赖变 → 只标 dirty</text>
  <text class="v3e-s" x="282" y="166" font-size="7">取值时才计算并缓存</text>
  <text class="v3e-s" x="282" y="182" font-size="7">惰性与缓存是一体的</text>

  <rect class="v3e-h" x="500" y="104" width="200" height="28" rx="2"/>
  <text class="v3e-t" x="600" y="122" font-size="8" text-anchor="middle">watch / watchEffect</text>
  <rect class="v3e-b" x="500" y="132" width="200" height="68" rx="2" style="fill:none"/>
  <text class="v3e-s" x="512" y="150" font-size="7">依赖变 → 回调入队</text>
  <text class="v3e-s" x="512" y="166" font-size="7">watch：显式源 + 新旧值</text>
  <text class="v3e-s" x="512" y="182" font-size="7">watchEffect：自动 + cleanup</text>

  <text class="v3e-t" x="40" y="224" font-size="8.5" style="fill:#B03A2E">computed 的「缓存」不是优化技巧，是调度策略的必然结果 —— 它根本没被通知去重算。</text>
</svg>
