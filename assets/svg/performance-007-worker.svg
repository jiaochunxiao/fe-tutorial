<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 740 268" width="100%" role="img" aria-labelledby="ww7t ww7d">
  <title id="ww7t">主线程与 Worker 的双向通道</title>
  <desc id="ww7d">主线程和 Worker 各有自己的事件循环和全局对象，之间只能靠 postMessage 传结构化克隆的数据，来回各一次。Worker 里没有 DOM 也没有 window。大数据量时可以把 ArrayBuffer 的所有权直接移交过去，避免拷贝。</desc>

  <style>
    .ww7-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .ww7-key{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.6}
    .ww7-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .ww7-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .ww7-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="ww7-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <rect class="ww7-box" x="60" y="56" width="210" height="100" rx="3"/>
  <text class="ww7-t" x="76" y="82" font-size="11">主线程</text>
  <text class="ww7-s" x="76" y="102" font-size="9">DOM、渲染、事件循环都在这儿</text>
  <text class="ww7-s" x="76" y="122" font-size="9">UI 卡不卡就看它忙不忙</text>

  <rect class="ww7-box" x="470" y="56" width="210" height="100" rx="3"/>
  <text class="ww7-t" x="486" y="82" font-size="11">Worker 线程</text>
  <text class="ww7-s" x="486" y="102" font-size="9">自己的事件循环与全局对象</text>
  <text class="ww7-s" x="486" y="122" font-size="9" style="fill:#B03A2E">没有 DOM，也没有 window</text>

  <line x1="274" y1="86" x2="466" y2="86" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#ww7-ink)"/>
  <text class="ww7-s" x="370" y="78" font-size="9" text-anchor="middle">postMessage（结构化克隆）</text>

  <line x1="466" y1="132" x2="274" y2="132" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#ww7-ink)"/>
  <text class="ww7-s" x="370" y="150" font-size="9" text-anchor="middle">postMessage（结果）</text>

  <rect class="ww7-box" x="120" y="192" width="180" height="40" rx="3"/>
  <text class="ww7-mono" x="210" y="217" font-size="10" text-anchor="middle">ArrayBuffer</text>

  <line x1="304" y1="212" x2="396" y2="212" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#ww7-ink)"/>
  <text class="ww7-s" x="350" y="204" font-size="8.5" text-anchor="middle">transfer 移交所有权</text>
  <text class="ww7-s" x="350" y="230" font-size="8.5" text-anchor="middle" style="fill:#B03A2E">零拷贝</text>

  <rect class="ww7-key" x="400" y="192" width="180" height="40" rx="3"/>
  <text class="ww7-s" x="490" y="217" font-size="10" text-anchor="middle">Worker 里处理</text>

  <text class="ww7-s" x="60" y="268" font-size="9.5">判断标准：超过 50ms 的纯计算、数据能序列化，才值得搬；小任务或需要碰 DOM，别搬</text>

</svg>
