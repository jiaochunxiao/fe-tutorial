<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 214" width="100%" role="img" aria-labelledby="n3ht n3hd">
  <title id="n3ht">HTTP/1.1 的整块串行与 HTTP/2 的帧交织</title>
  <desc id="n3hd">HTTP/1.1 的报文是文本流，一个响应必须整块发完才能发下一个，所以第二个请求只能排队等——这就是队头阻塞。HTTP/2 把报文拆成二进制帧，帧头标明它属于哪个流，于是同一条连接上多个流的帧可以自由交错，接收方按流号重新拼装。一条连接就被用满了，不用再开六条。</desc>

  <style>
    .n3h-blk{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.3}
    .n3h-a{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .n3h-b{fill:#E7DEC8;stroke:#B03A2E;stroke-width:1.1}
    .n3h-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .n3h-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .n3h-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="n3h-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="n3h-s" x="40" y="52" font-size="8.5">HTTP/1.1</text>
  <text class="n3h-s" x="40" y="66" font-size="7.5">文本流</text>
  <rect class="n3h-blk" x="130" y="30" width="230" height="44" rx="3"/>
  <text class="n3h-t" x="245" y="57" font-size="8.5" text-anchor="middle">完整报文 A</text>
  <rect class="n3h-blk" x="366" y="30" width="230" height="44" rx="3"/>
  <text class="n3h-t" x="481" y="57" font-size="8.5" text-anchor="middle">完整报文 B</text>
  <text class="n3h-t" x="610" y="57" font-size="8" style="fill:#B03A2E">必须整块、按序</text>
  <line x1="130" y1="86" x2="596" y2="86" stroke="#CDC4AF" stroke-width="1" marker-end="url(#n3h-ink)"/>
  <text class="n3h-s" x="130" y="100" font-size="7.5">B 只能等 A 发完 —— 这就是队头阻塞</text>

  <line x1="40" y1="122" x2="700" y2="122" stroke="#CDC4AF" stroke-width="1"/>

  <text class="n3h-s" x="40" y="152" font-size="8.5">HTTP/2</text>
  <text class="n3h-s" x="40" y="166" font-size="7.5">二进制帧</text>
  <rect class="n3h-a" x="130" y="134" width="64" height="30" rx="2"/>
  <text class="n3h-mono" x="162" y="153" font-size="7.5" text-anchor="middle">A头</text>
  <rect class="n3h-b" x="198" y="134" width="64" height="30" rx="2"/>
  <text class="n3h-mono" x="230" y="153" font-size="7.5" text-anchor="middle">B头</text>
  <rect class="n3h-a" x="266" y="134" width="64" height="30" rx="2"/>
  <text class="n3h-mono" x="298" y="153" font-size="7.5" text-anchor="middle">A0</text>
  <rect class="n3h-b" x="334" y="134" width="64" height="30" rx="2"/>
  <text class="n3h-mono" x="366" y="153" font-size="7.5" text-anchor="middle">B0</text>
  <rect class="n3h-a" x="402" y="134" width="64" height="30" rx="2"/>
  <text class="n3h-mono" x="434" y="153" font-size="7.5" text-anchor="middle">A1</text>
  <rect class="n3h-b" x="470" y="134" width="64" height="30" rx="2"/>
  <text class="n3h-mono" x="502" y="153" font-size="7.5" text-anchor="middle">B1</text>
  <rect class="n3h-a" x="538" y="134" width="64" height="30" rx="2"/>
  <text class="n3h-mono" x="570" y="153" font-size="7.5" text-anchor="middle">A2</text>
  <rect class="n3h-b" x="606" y="134" width="64" height="30" rx="2"/>
  <text class="n3h-mono" x="638" y="153" font-size="7.5" text-anchor="middle">B2</text>
  <line x1="130" y1="176" x2="670" y2="176" stroke="#CDC4AF" stroke-width="1" marker-end="url(#n3h-ink)"/>
  <text class="n3h-s" x="130" y="190" font-size="7.5">同一连接上多个流自由交错，接收方按 stream id 重组</text>

  <text class="n3h-t" x="40" y="210" font-size="8.5" style="fill:#B03A2E">一条连接被用满了 —— 不用再靠「开六条 TCP」硬撑并发。</text>
</svg>
