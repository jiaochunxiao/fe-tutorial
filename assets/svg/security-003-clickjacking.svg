<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 740 264" width="100%" role="img" aria-labelledby="cj3t cj3d">
  <title id="cj3t">点击劫持：透明 iframe 叠在诱饵按钮上</title>
  <desc id="cj3d">恶意页面在抽奖按钮的位置上盖了一个透明的银行转账页 iframe，两个按钮完全重合。用户以为点的是立即抽奖，实际点击穿透到 iframe 里的确认转账。银行页带着用户自己的 Cookie 加载，所以服务器认为这是本人操作。</desc>

  <style>
    .cj3-page{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.6}
    .cj3-frame{fill:none;stroke:#6E675A;stroke-width:1.2;stroke-dasharray:5 4}
    .cj3-btn{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.4}
    .cj3-hit{fill:none;stroke:#B03A2E;stroke-width:1.8;stroke-dasharray:5 4}
    .cj3-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .cj3-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .cj3-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="cj3-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <rect class="cj3-page" x="40" y="46" width="360" height="212" rx="4"/>
  <text class="cj3-mono" x="56" y="70" font-size="10">evil.com</text>
  <text class="cj3-t" x="220" y="100" font-size="11" text-anchor="middle">抽奖大转盘</text>
  <text class="cj3-s" x="220" y="120" font-size="9" text-anchor="middle">用户看到的只有这一层</text>

  <rect class="cj3-frame" x="120" y="136" width="200" height="106" rx="2"/>
  <text class="cj3-mono" x="128" y="152" font-size="8.5">bank.com/transfer</text>
  <text class="cj3-s" x="312" y="152" font-size="8.5" text-anchor="end" style="fill:#B03A2E">opacity: 0</text>

  <rect class="cj3-btn" x="150" y="182" width="140" height="40" rx="3"/>
  <text class="cj3-t" x="220" y="207" font-size="10.5" text-anchor="middle">立即抽奖</text>
  <rect class="cj3-hit" x="150" y="182" width="140" height="40" rx="3"/>
  <text class="cj3-s" x="220" y="236" font-size="8.5" text-anchor="middle" style="fill:#B03A2E">确认转账 · 位置与上面那个完全重合</text>

  <line x1="404" y1="202" x2="446" y2="202" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#cj3-ink)"/>

  <text class="cj3-s" x="458" y="176" font-size="9.5">用户以为点了「立即抽奖」</text>
  <text class="cj3-s" x="458" y="198" font-size="9.5" style="fill:#B03A2E">实际点到了「确认转账」</text>
  <text class="cj3-s" x="458" y="220" font-size="9.5">而银行页带着用户自己的 Cookie</text>
  <text class="cj3-s" x="458" y="242" font-size="9.5">服务器看来这就是本人操作</text>

</svg>
