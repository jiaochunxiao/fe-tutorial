<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 26 740 156" width="100%" role="img" aria-labelledby="rd7t rd7d">
  <title id="rd7t">Redux 的单向数据流闭环</title>
  <desc id="rd7d">视图 dispatch 一个 action，reducer 按它算出新 state，store 拿到新 state 后通知订阅者，视图据此重渲染；重渲染后的界面又接住用户交互，产生下一次 dispatch。整条链只有一个方向，回头的路是用户交互而不是数据。</desc>

  <style>
    .rd7-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .rd7-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .rd7-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .rd7-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="rd7-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <rect class="rd7-box" x="40" y="44" width="150" height="60" rx="3"/>
  <text class="rd7-t" x="115" y="79" font-size="11.5" text-anchor="middle">视图</text>

  <line x1="194" y1="74" x2="246" y2="74" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#rd7-ink)"/>
  <text class="rd7-mono" x="220" y="124" font-size="8.5" text-anchor="middle">dispatch(action)</text>

  <rect class="rd7-box" x="250" y="44" width="150" height="60" rx="3"/>
  <text class="rd7-t" x="325" y="72" font-size="11.5" text-anchor="middle">reducer</text>
  <text class="rd7-s" x="325" y="90" font-size="9" text-anchor="middle">纯函数</text>

  <line x1="404" y1="74" x2="456" y2="74" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#rd7-ink)"/>
  <text class="rd7-mono" x="430" y="124" font-size="8.5" text-anchor="middle">newState</text>

  <rect class="rd7-box" x="460" y="44" width="150" height="60" rx="3"/>
  <text class="rd7-t" x="535" y="72" font-size="11.5" text-anchor="middle">store</text>
  <text class="rd7-s" x="535" y="90" font-size="9" text-anchor="middle">唯一数据源</text>

  <path d="M535 104 V168 H115 V108" fill="none" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#rd7-ink)"/>
  <text class="rd7-s" x="330" y="160" font-size="9.5" text-anchor="middle">通知订阅者，视图重渲染</text>
  <text class="rd7-s" x="126" y="142" font-size="9.5">用户交互</text>

</svg>
