<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" role="img" aria-labelledby="v1t v1d">
  <title id="v1t">V8 从源码到机器码的五站旅程</title>
  <desc id="v1d">源码经 Parser 变成 AST，经 Ignition 变成字节码，默认由解释器逐条执行，执行时顺带收集类型反馈。函数变热之后，TurboFan 用类型反馈投机编译出机器码，此后直接跑机器码。一旦运行时发现类型假设被打破，就触发 Deopt 回退到字节码，优化成果作废，可以重新变热再优化。</desc>

  <style>
    .v1-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.6}
    .v1-key{fill:#FBF7EE;stroke:#B03A2E;stroke-width:1.6}
    .v1-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .v1-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="v1-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="v1-cin" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <!-- 第一站：Parser -->
  <rect class="v1-box" x="36" y="64" width="84" height="52" rx="3"/>
  <text class="v1-mono" x="78" y="96" font-size="13.5" text-anchor="middle">源码</text>
  <line x1="120" y1="90" x2="166" y2="90" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#v1-ink)"/>
  <text class="v1-small" x="144" y="54" font-size="10" text-anchor="middle">① Parser</text>

  <!-- AST -->
  <rect class="v1-box" x="172" y="64" width="76" height="52" rx="3"/>
  <text class="v1-mono" x="210" y="96" font-size="13.5" text-anchor="middle">AST</text>
  <line x1="248" y1="90" x2="294" y2="90" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#v1-ink)"/>
  <text class="v1-small" x="272" y="54" font-size="10" text-anchor="middle">② Ignition</text>

  <!-- 字节码 -->
  <rect class="v1-box" x="300" y="64" width="96" height="52" rx="3"/>
  <text class="v1-mono" x="348" y="96" font-size="13" text-anchor="middle">字节码</text>
  <line x1="396" y1="90" x2="442" y2="90" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#v1-ink)"/>

  <!-- ③ 解释执行 -->
  <rect class="v1-box" x="448" y="64" width="124" height="52" rx="3"/>
  <text class="v1-mono" x="510" y="96" font-size="13" text-anchor="middle">③ 解释执行</text>
  <text class="v1-small" x="510" y="134" font-size="10" text-anchor="middle">逐条执行 · 慢 · 顺带收集类型反馈</text>

  <!-- ④ TurboFan 下行 -->
  <line x1="370" y1="116" x2="370" y2="206" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#v1-ink)"/>
  <text class="v1-small" x="384" y="168" font-size="10.5">④ TurboFan（热点后）</text>

  <!-- ⑤ Deopt 上行 -->
  <line x1="326" y1="212" x2="326" y2="122" stroke="#B03A2E" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#v1-cin)"/>
  <text class="v1-small" x="312" y="168" font-size="10.5" text-anchor="end" style="fill:#B03A2E">⑤ Deopt（假设被打破）</text>

  <!-- 机器码 -->
  <rect class="v1-key" x="300" y="212" width="96" height="52" rx="3"/>
  <text class="v1-mono" x="348" y="244" font-size="13" text-anchor="middle">机器码</text>
  <line x1="396" y1="238" x2="442" y2="238" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#v1-ink)"/>
  <text class="v1-small" x="452" y="242" font-size="10.5">原生执行 · 快</text>

</svg>
