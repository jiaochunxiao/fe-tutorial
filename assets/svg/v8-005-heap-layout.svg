<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 296" width="100%" role="img" aria-labelledby="h1t h1d">
  <title id="h1t">V8 的堆分区</title>
  <desc id="h1d">V8 堆分成两代：新生代容量小、回收频繁，内部再分 From 与 To 两个半空间；老生代容量大、单次回收成本高，内含指针区与数据区。对象从新生代晋升到老生代。另外还有独立的大对象空间与代码空间。</desc>

  <style>
    .h1-outer{fill:none;stroke:#1C1A17;stroke-width:1.4}
    .h1-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .h1-half{fill:#FBF7EE;stroke:#CDC4AF;stroke-width:1.2}
    .h1-special{fill:#E7DEC8;stroke:#6E675A;stroke-width:1.2;stroke-dasharray:5 4}
    .h1-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .h1-serif{font-family:'Noto Serif SC','Songti SC','SimSun',serif;fill:#1C1A17}
    .h1-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="h1-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <rect class="h1-outer" x="40" y="40" width="660" height="246" rx="3"/>
  <text class="h1-serif" x="56" y="64" font-size="12" font-weight="700">V8 堆</text>

  <rect class="h1-box" x="56" y="76" width="250" height="100" rx="3"/>
  <text class="h1-serif" x="68" y="96" font-size="11.5" font-weight="700">新生代</text>
  <text class="h1-small" x="68" y="110" font-size="9.5">容量小 · 回收频繁 · 存活率低</text>
  <rect class="h1-half" x="68" y="120" width="110" height="46" rx="2"/>
  <text class="h1-mono" x="123" y="140" font-size="10.5" text-anchor="middle">From</text>
  <text class="h1-small" x="123" y="156" font-size="9" text-anchor="middle">正在使用</text>
  <rect class="h1-half" x="188" y="120" width="110" height="46" rx="2"/>
  <text class="h1-mono" x="243" y="140" font-size="10.5" text-anchor="middle">To</text>
  <text class="h1-small" x="243" y="156" font-size="9" text-anchor="middle">空闲</text>

  <line x1="306" y1="126" x2="350" y2="126" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#h1-ink)"/>
  <text class="h1-small" x="328" y="118" font-size="9" text-anchor="middle">晋升</text>

  <rect class="h1-box" x="356" y="76" width="328" height="100" rx="3"/>
  <text class="h1-serif" x="368" y="96" font-size="11.5" font-weight="700">老生代</text>
  <text class="h1-small" x="368" y="110" font-size="9.5">容量大 · 回收频率低 · 单次成本高</text>
  <rect class="h1-half" x="368" y="120" width="148" height="46" rx="2"/>
  <text class="h1-mono" x="442" y="140" font-size="10.5" text-anchor="middle">指针区</text>
  <text class="h1-small" x="442" y="156" font-size="9" text-anchor="middle">存对象引用</text>
  <rect class="h1-half" x="524" y="120" width="148" height="46" rx="2"/>
  <text class="h1-mono" x="598" y="140" font-size="10.5" text-anchor="middle">数据区</text>
  <text class="h1-small" x="598" y="156" font-size="9" text-anchor="middle">存原始值</text>

  <rect class="h1-special" x="56" y="192" width="628" height="40" rx="2"/>
  <text class="h1-small" x="68" y="217" font-size="10">大对象空间 —— 超过阈值（约 500KB）的对象直接进这里，独立分配、独立回收，不走新生代</text>

  <rect class="h1-special" x="56" y="240" width="628" height="34" rx="2"/>
  <text class="h1-small" x="68" y="262" font-size="10">代码空间 —— 存放即时编译后的机器码，与业务对象分开管理</text>

</svg>
