<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" width="100%" role="img" aria-labelledby="h1t h1d">
  <title id="h1t">myCall 五步与 myBind 的五步加三个赠品</title>
  <desc id="h1d">左栏是 myCall 的五步：先把 ctx 包装，null 或 undefined 回退到 globalThis；再用 Symbol 生成一个临时键把原函数挂上去；然后以 ctx 点键的方式调用，这是唯一能自定义 this 的姿势，也就是隐式绑定，是整个实现的核心；调用完 delete 掉临时键；最后 return 结果，漏掉 return 是高频扣分点。myApply 只差第二参数，可以是数组、类数组或不传。右栏是 myBind 的五步：用闭包把 ctx 锁死所以改不动；调用时把预置参数拼在前面形成偏函数；用 this instanceof bound 判断是不是 new 调用，是的话让 this 让位给实例；原型桥接用 Object.create 复制原函数原型，否则实例拿不到原型上的方法；最后返回这个 bound 函数。</desc>

  <style>
    .h1-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .h1-c{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .h1-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .h1-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .h1-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <text class="h1-t" x="30" y="24" font-size="8.5">两个手写题共用一个内核，其余全是边界</text>

  <rect class="h1-b" x="30" y="38" width="330" height="196" rx="2"/>
  <text class="h1-mono" x="44" y="60" font-size="9">myCall / myApply</text>
  <text class="h1-s" x="348" y="60" font-size="7.5" text-anchor="end">五步</text>

  <text class="h1-mono" x="44" y="86" font-size="7.5" style="fill:#B03A2E">①</text>
  <text class="h1-mono" x="64" y="86" font-size="7.5">包装 ctx：null → globalThis</text>
  <text class="h1-s" x="348" y="86" font-size="7" text-anchor="end">严格模式也得管</text>

  <text class="h1-mono" x="44" y="112" font-size="7.5" style="fill:#B03A2E">②</text>
  <text class="h1-mono" x="64" y="112" font-size="7.5">ctx[Symbol()] = this</text>
  <text class="h1-s" x="348" y="112" font-size="7" text-anchor="end">防撞键</text>

  <text class="h1-mono" x="44" y="138" font-size="7.5" style="fill:#B03A2E">③</text>
  <text class="h1-mono" x="64" y="138" font-size="7.5">ctx[键](...args)</text>
  <text class="h1-s" x="348" y="138" font-size="7" text-anchor="end" style="fill:#B03A2E">隐式绑定 · 核心</text>

  <text class="h1-mono" x="44" y="164" font-size="7.5" style="fill:#B03A2E">④</text>
  <text class="h1-mono" x="64" y="164" font-size="7.5">delete ctx[键]</text>
  <text class="h1-s" x="348" y="164" font-size="7" text-anchor="end">收尾要干净</text>

  <text class="h1-mono" x="44" y="190" font-size="7.5" style="fill:#B03A2E">⑤</text>
  <text class="h1-mono" x="64" y="190" font-size="7.5">return result</text>
  <text class="h1-s" x="348" y="190" font-size="7" text-anchor="end">漏 return 高频扣分</text>

  <text class="h1-s" x="44" y="216" font-size="7">apply 只差第二参数：数组 / 类数组 / 不传</text>

  <rect class="h1-b" x="380" y="38" width="330" height="196" rx="2"/>
  <text class="h1-mono" x="394" y="60" font-size="9">myBind</text>
  <text class="h1-s" x="698" y="60" font-size="7.5" text-anchor="end">五步 + 三个赠品</text>

  <text class="h1-mono" x="394" y="86" font-size="7.5" style="fill:#B03A2E">①</text>
  <text class="h1-mono" x="414" y="86" font-size="7.5">闭包存 ctx</text>
  <text class="h1-s" x="698" y="86" font-size="7" text-anchor="end">赠品一：改不动</text>

  <text class="h1-mono" x="394" y="112" font-size="7.5" style="fill:#B03A2E">②</text>
  <text class="h1-mono" x="414" y="112" font-size="7.5">[...preset, ...args]</text>
  <text class="h1-s" x="698" y="112" font-size="7" text-anchor="end">赠品二：偏函数</text>

  <text class="h1-mono" x="394" y="138" font-size="7.5" style="fill:#B03A2E">③</text>
  <text class="h1-mono" x="414" y="138" font-size="7.5">this instanceof bound</text>
  <text class="h1-s" x="698" y="138" font-size="7" text-anchor="end">new 豁免：this 让位</text>

  <text class="h1-mono" x="394" y="164" font-size="7.5" style="fill:#B03A2E">④</text>
  <text class="h1-mono" x="414" y="164" font-size="7.5">Object.create(fn.prototype)</text>
  <text class="h1-s" x="698" y="164" font-size="7" text-anchor="end">原型桥接</text>

  <text class="h1-mono" x="394" y="190" font-size="7.5" style="fill:#B03A2E">⑤</text>
  <text class="h1-mono" x="414" y="190" font-size="7.5">return bound</text>
  <text class="h1-s" x="698" y="190" font-size="7" text-anchor="end">返回新函数</text>

  <text class="h1-s" x="394" y="216" font-size="7">不桥接 → 实例的 __proto__ 直通 Object.prototype，原型方法全断</text>

  <rect x="30" y="250" width="680" height="24" fill="#E7DEC8" opacity="0.55"/>
  <text class="h1-s" x="42" y="266" font-size="7.5">共同内核：把函数挂到目标对象上、以「方法调用」的形式执行 —— 隐式绑定是唯一能自定义 this 的姿势</text>
</svg>
