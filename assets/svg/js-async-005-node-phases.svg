<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 24 740 286" width="100%" role="img" aria-labelledby="el5nt el5nd">
  <title id="el5nt">Node.js 事件循环的六个阶段</title>
  <desc id="el5nd">六个阶段按固定顺序转一圈：timers 跑定时器回调，pending callbacks 跑系统级错误回调，idle/prepare 内部使用，poll 取新 I/O 事件并执行其回调，check 跑 setImmediate，close callbacks 跑 close 事件。转完一圈回到 timers，就是一次 tick。</desc>

  <style>
    .el5n-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .el5n-key{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.6}
    .el5n-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .el5n-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .el5n-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="el5n-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <rect class="el5n-box" x="150" y="40" width="280" height="32" rx="2"/>
  <text class="el5n-mono" x="166" y="61" font-size="10.5">timers</text>
  <text class="el5n-s" x="450" y="61" font-size="9.5">setTimeout / setInterval 回调</text>

  <rect class="el5n-box" x="150" y="80" width="280" height="32" rx="2"/>
  <text class="el5n-mono" x="166" y="101" font-size="10.5">pending callbacks</text>
  <text class="el5n-s" x="450" y="101" font-size="9.5">系统级错误回调，如 TCP ECONNREFUSED</text>

  <rect class="el5n-box" x="150" y="120" width="280" height="32" rx="2"/>
  <text class="el5n-mono" x="166" y="141" font-size="10.5">idle, prepare</text>
  <text class="el5n-s" x="450" y="141" font-size="9.5">内部使用，业务代码碰不到</text>

  <rect class="el5n-key" x="150" y="160" width="280" height="32" rx="2"/>
  <text class="el5n-mono" x="166" y="181" font-size="10.5">poll</text>
  <text class="el5n-s" x="450" y="181" font-size="9.5" style="fill:#B03A2E">取新 I/O 事件并执行，核心阶段</text>

  <rect class="el5n-box" x="150" y="200" width="280" height="32" rx="2"/>
  <text class="el5n-mono" x="166" y="221" font-size="10.5">check</text>
  <text class="el5n-s" x="450" y="221" font-size="9.5">setImmediate 回调</text>

  <rect class="el5n-box" x="150" y="240" width="280" height="32" rx="2"/>
  <text class="el5n-mono" x="166" y="261" font-size="10.5">close callbacks</text>
  <text class="el5n-s" x="450" y="261" font-size="9.5">socket 关闭等 close 事件</text>

  <path d="M150 256 H92 V56 H146" fill="none" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#el5n-ink)"/>
  <text class="el5n-s" x="60" y="292" font-size="9.5">转完一圈 = 一次 tick，然后回到 timers 重来</text>

</svg>
