<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 460" width="100%" role="img" aria-labelledby="t5t t5d">
  <title id="t5t">TLS 1.3 握手时序</title>
  <desc id="t5d">客户端先发 ClientHello，携带随机数 Rc 与临时公钥 key_share；服务端回 ServerHello 并紧接着发出加密的 Certificate、CertificateVerify、Finished 一个 flight；客户端回 Finished 后双方各自算出同一把会话密钥，开始对称加密传输。全程只需一个 RTT。</desc>
  <defs>
    <marker id="t5-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="t5-cin" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <style>
    .t5-life{stroke:#CDC4AF;stroke-width:1.4;stroke-dasharray:3 5}
    .t5-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .t5-serif{font-family:'Noto Serif SC','Songti SC','SimSun',serif;fill:#1C1A17}
    .t5-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .t5-enc{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;font-size:10px;fill:#6E675A;letter-spacing:.2px}
  </style>

  <!-- 端点 -->
  <text class="t5-serif" x="170" y="38" font-size="14" text-anchor="middle">客户端</text>
  <text class="t5-serif" x="570" y="38" font-size="14" text-anchor="middle">服务端</text>
  <line x1="128" y1="50" x2="212" y2="50" stroke="#1C1A17" stroke-width="1.4"/>
  <line x1="528" y1="50" x2="612" y2="50" stroke="#1C1A17" stroke-width="1.4"/>

  <!-- 生命线 -->
  <line class="t5-life" x1="170" y1="54" x2="170" y2="452"/>
  <line class="t5-life" x1="570" y1="54" x2="570" y2="452"/>

  <!-- ① ClientHello -->
  <line x1="176" y1="132" x2="562" y2="132" stroke="#1C1A17" stroke-width="1.8" marker-end="url(#t5-ink)"/>
  <text class="t5-mono" x="370" y="100" font-size="12.5" text-anchor="middle" font-weight="700">① ClientHello</text>
  <text class="t5-mono" x="370" y="116" font-size="10.5" text-anchor="middle" style="fill:#6E675A">支持的版本 / 密码套件 · 随机数 Rc · key_share（临时公钥）</text>

  <!-- ② ServerHello -->
  <line x1="564" y1="212" x2="178" y2="212" stroke="#1C1A17" stroke-width="1.8" marker-end="url(#t5-ink)"/>
  <text class="t5-mono" x="370" y="188" font-size="12.5" text-anchor="middle" font-weight="700">② ServerHello</text>
  <text class="t5-mono" x="370" y="204" font-size="10.5" text-anchor="middle" style="fill:#6E675A">选定套件 · 随机数 Rs · key_share（服务端临时公钥）</text>

  <!-- ③ 加密 flight（一个 flight 携带三条消息） -->
  <line x1="564" y1="300" x2="178" y2="300" stroke="#1C1A17" stroke-width="1.8" marker-end="url(#t5-ink)"/>
  <text class="t5-mono" x="370" y="246" font-size="12.5" text-anchor="middle" font-weight="700">③ 加密 flight（此后全部加密）</text>
  <text class="t5-mono" x="370" y="264" font-size="10.5" text-anchor="middle" style="fill:#6E675A">Certificate → CertificateVerify → Finished</text>
  <text class="t5-mono" x="370" y="282" font-size="10.5" text-anchor="middle" style="fill:#6E675A">证书链验签 · 私钥签名证明身份 · 握手校验值</text>

  <!-- ④ Finished -->
  <line x1="176" y1="392" x2="562" y2="392" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#t5-cin)"/>
  <text class="t5-mono" x="370" y="360" font-size="12.5" text-anchor="middle" font-weight="700" style="fill:#B03A2E">④ Finished</text>
  <text class="t5-mono" x="370" y="378" font-size="10.5" text-anchor="middle" style="fill:#6E675A">客户端回校验值，握手结束</text>

  <!-- 会话密钥 -->
  <line x1="170" y1="418" x2="570" y2="418" stroke="#B03A2E" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text class="t5-small" x="370" y="412" font-size="10.5" text-anchor="middle" style="fill:#B03A2E">双方各自算出同一把会话密钥（ECDHE，密钥从未上线传输）</text>

  <!-- 应用数据 -->
  <line x1="176" y1="444" x2="562" y2="444" stroke="#B03A2E" stroke-width="1.6" marker-end="url(#t5-cin)"/>
  <line x1="564" y1="444" x2="178" y2="444" stroke="#B03A2E" stroke-width="1.6" marker-end="url(#t5-cin)"/>
  <text class="t5-mono" x="370" y="438" font-size="10.5" text-anchor="middle" style="fill:#B03A2E">Application Data（对称加密 + AEAD 认证标签）</text>

  <!-- 1 RTT 括号 -->
  <path d="M640 132 H654 V392 H640" fill="none" stroke="#6E675A" stroke-width="1.2"/>
  <line x1="634" y1="132" x2="654" y2="132" stroke="#6E675A" stroke-width="1.2"/>
  <line x1="634" y1="392" x2="654" y2="392" stroke="#6E675A" stroke-width="1.2"/>
  <text class="t5-small" x="662" y="256" font-size="10.5" style="fill:#6E675A">1 RTT</text>
  <text class="t5-small" x="662" y="272" font-size="9.5" style="fill:#6E675A">TLS 1.2 需</text>
  <text class="t5-small" x="662" y="284" font-size="9.5" style="fill:#6E675A">2 RTT</text>

</svg>
