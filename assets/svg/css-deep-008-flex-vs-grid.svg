<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 218" width="100%" role="img" aria-labelledby="g8t g8d">
  <title id="g8t">Flex 一维排列与 Grid 二维矩阵的对比</title>
  <desc id="g8d">左边 Flex 的两行项目各自决定宽度，第二行的边界与第一行的列边界对不齐。右边 Grid 的三列轨道锁定了整列的宽度，第二行的项目跨两列时边界仍然落在既有轨道线上。</desc>

  <style>
    .g8-cell{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .g8-key{fill:#FBF7EE;stroke:#B03A2E;stroke-width:1.5}
    .g8-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .g8-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .g8-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <text class="g8-t" x="40" y="34" font-size="12.5">Flex — 一维</text>
  <text class="g8-s" x="40" y="54" font-size="9.5">一条线上的排列，行与行各算各的</text>

  <rect class="g8-cell" x="40" y="72" width="84" height="44" rx="2"/>
  <text class="g8-mono" x="82" y="99" font-size="11" text-anchor="middle">item</text>
  <rect class="g8-cell" x="134" y="72" width="84" height="44" rx="2"/>
  <text class="g8-mono" x="176" y="99" font-size="11" text-anchor="middle">item</text>
  <rect class="g8-cell" x="228" y="72" width="84" height="44" rx="2"/>
  <text class="g8-mono" x="270" y="99" font-size="11" text-anchor="middle">item</text>

  <rect class="g8-cell" x="40" y="128" width="130" height="44" rx="2"/>
  <text class="g8-mono" x="105" y="155" font-size="11" text-anchor="middle">item</text>
  <rect class="g8-cell" x="180" y="128" width="132" height="44" rx="2"/>
  <text class="g8-mono" x="246" y="155" font-size="11" text-anchor="middle">item</text>

  <text class="g8-s" x="40" y="196" font-size="9.5">第二行的边界落在第一行的轨道中间</text>

  <line x1="360" y1="30" x2="360" y2="200" stroke="#CDC4AF" stroke-width="1" stroke-dasharray="4 5"/>

  <text class="g8-t" x="408" y="34" font-size="12.5">Grid — 二维</text>
  <text class="g8-s" x="408" y="54" font-size="9.5">行 × 列的矩阵，列宽被整列锁死</text>

  <rect class="g8-cell" x="408" y="72" width="84" height="44" rx="2"/>
  <text class="g8-mono" x="450" y="99" font-size="11" text-anchor="middle">a</text>
  <rect class="g8-cell" x="502" y="72" width="84" height="44" rx="2"/>
  <text class="g8-mono" x="544" y="99" font-size="11" text-anchor="middle">b</text>
  <rect class="g8-cell" x="596" y="72" width="84" height="44" rx="2"/>
  <text class="g8-mono" x="638" y="99" font-size="11" text-anchor="middle">c</text>

  <rect class="g8-key" x="408" y="128" width="178" height="44" rx="2"/>
  <text class="g8-s" x="497" y="155" font-size="10" text-anchor="middle" style="fill:#B03A2E">跨 2 列</text>
  <rect class="g8-cell" x="596" y="128" width="84" height="44" rx="2"/>
  <text class="g8-mono" x="638" y="155" font-size="11" text-anchor="middle">d</text>

  <text class="g8-s" x="408" y="196" font-size="9.5">跨列时边界仍然落在既有轨道线上</text>

</svg>
