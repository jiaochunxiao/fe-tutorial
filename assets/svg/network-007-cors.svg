<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 244" width="100%" role="img" aria-labelledby="n7ct n7cd">
  <title id="n7ct">CORS 的三种情形：简单请求、预检、带 Cookie</title>
  <desc id="n7cd">简单请求直接带着 Origin 发出去，服务器回 Allow-Origin，浏览器再校验一遍，不匹配就拦下响应。非简单请求要先发 OPTIONS 探路，服务器回一份放行清单，浏览器按 Max-Age 缓存一段时间，之后才发真实请求。带 Cookie 的请求三个条件缺一不可：前端设 credentials 为 include，服务端不能再用星号而必须写精确 Origin 并允许 credentials，Cookie 本身还要 SameSite 为 None 且带 Secure。</desc>

  <style>
    .n7c-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.3}
    .n7c-alt{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.3}
    .n7c-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .n7c-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .n7c-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="n7c-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="n7c-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="n7c-t" x="40" y="28" font-size="8.5">简单请求</text>
  <line x1="140" y1="24" x2="280" y2="24" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#n7c-ink)"/>
  <text class="n7c-mono" x="146" y="18" font-size="7">请求 + Origin</text>
  <rect class="n7c-box" x="284" y="8" width="120" height="32" rx="3"/>
  <text class="n7c-t" x="344" y="28" font-size="8" text-anchor="middle">服务器</text>
  <line x1="404" y1="24" x2="540" y2="24" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#n7c-ink)"/>
  <text class="n7c-mono" x="410" y="18" font-size="7">200 + Allow-Origin</text>
  <text class="n7c-t" x="548" y="28" font-size="8" style="fill:#B03A2E">浏览器校验 → 通过才给 JS</text>

  <line x1="40" y1="52" x2="700" y2="52" stroke="#CDC4AF" stroke-width="1"/>

  <text class="n7c-t" x="40" y="80" font-size="8.5" style="fill:#B03A2E">预检请求</text>
  <line x1="140" y1="76" x2="280" y2="76" stroke="#B03A2E" stroke-width="1.4" marker-end="url(#n7c-red)"/>
  <text class="n7c-mono" x="146" y="70" font-size="7">OPTIONS 探路</text>
  <rect class="n7c-box" x="284" y="56" width="120" height="62" rx="3"/>
  <text class="n7c-t" x="344" y="91" font-size="8" text-anchor="middle">服务器</text>
  <line x1="404" y1="76" x2="540" y2="76" stroke="#B03A2E" stroke-width="1.4" marker-end="url(#n7c-red)"/>
  <text class="n7c-mono" x="410" y="70" font-size="7">放行清单 + Max-Age</text>
  <text class="n7c-s" x="548" y="80" font-size="7.5">缓存这段时间，不再探</text>

  <line x1="140" y1="106" x2="280" y2="106" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#n7c-ink)"/>
  <text class="n7c-mono" x="146" y="100" font-size="7">真实请求</text>
  <line x1="404" y1="106" x2="540" y2="106" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#n7c-ink)"/>
  <text class="n7c-mono" x="410" y="100" font-size="7">200 + Allow-Origin</text>

  <line x1="40" y1="132" x2="700" y2="132" stroke="#CDC4AF" stroke-width="1"/>

  <text class="n7c-t" x="40" y="158" font-size="8.5">带 Cookie</text>
  <text class="n7c-s" x="140" y="158" font-size="7.5">三个条件缺一不可</text>

  <rect class="n7c-box" x="140" y="170" width="170" height="34" rx="3"/>
  <text class="n7c-t" x="154" y="186" font-size="8">① 前端</text>
  <text class="n7c-mono" x="154" y="199" font-size="7">credentials: 'include'</text>

  <rect class="n7c-box" x="322" y="170" width="210" height="34" rx="3"/>
  <text class="n7c-t" x="336" y="186" font-size="8">② 服务端</text>
  <text class="n7c-mono" x="336" y="199" font-size="7">精确 Origin + Allow-Credentials</text>

  <rect class="n7c-box" x="544" y="170" width="156" height="34" rx="3"/>
  <text class="n7c-t" x="558" y="186" font-size="8">③ Cookie</text>
  <text class="n7c-mono" x="558" y="199" font-size="7">SameSite=None; Secure</text>

  <text class="n7c-t" x="40" y="228" font-size="8.5" style="fill:#B03A2E">带 Cookie 时 Allow-Origin 不能再写 <tspan class="n7c-mono" font-size="8.5">*</tspan> —— 星号和 credentials 天生互斥。</text>
  <text class="n7c-s" x="40" y="242" font-size="8">另外：CORS 是浏览器的规矩，服务器照样收到了请求 —— 所以它挡不住 CSRF，那是另一件事。</text>
</svg>
