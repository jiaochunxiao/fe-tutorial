<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 200" width="100%" role="img" aria-labelledby="h2ct h2cd">
  <title id="h2ct">instanceof 是逐级上溯比对，链上任何一层命中都算数</title>
  <desc id="h2cd">数组实例的原型是 Array.prototype，再往上是 Object.prototype，最后是 null。instanceof 从实例的原型出发，一层层和构造函数的 prototype 比对：查 Array 时第一层就命中，查 Object 时第一层不等、继续爬到第二层才命中，所以两个都返回 true。只有当整条链爬到 null 都没有命中，才返回 false。这也解释了为什么查询的代价随链深度增长。</desc>

  <style>
    .h2c-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .h2c-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .h2c-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .h2c-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .h2c-m{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="h2c-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="h2c-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="h2c-t" x="40" y="26" font-size="8.5">为什么 [] instanceof Object 也是 true —— 把链走一遍就明白了</text>

  <path d="M115 42 H655" fill="none" stroke="#B03A2E" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#h2c-red)"/>
  <text class="h2c-s" x="118" y="58" font-size="7" style="fill:#B03A2E">instanceof 从原型出发，逐级上溯</text>
  <line x1="295" y1="42" x2="295" y2="68" stroke="#B03A2E" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="475" y1="42" x2="475" y2="68" stroke="#B03A2E" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="655" y1="42" x2="655" y2="68" stroke="#B03A2E" stroke-width="1" stroke-dasharray="3 3"/>

  <rect class="h2c-b" x="40" y="72" width="150" height="36" rx="2"/>
  <text class="h2c-m" x="115" y="94" font-size="7.5" text-anchor="middle">[1, 2, 3]</text>

  <line x1="192" y1="90" x2="216" y2="90" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h2c-ink)"/>
  <rect class="h2c-b" x="220" y="72" width="150" height="36" rx="2"/>
  <text class="h2c-m" x="295" y="94" font-size="7.5" text-anchor="middle">Array.prototype</text>

  <line x1="372" y1="90" x2="396" y2="90" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h2c-ink)"/>
  <rect class="h2c-q" x="400" y="72" width="150" height="36" rx="2"/>
  <text class="h2c-m" x="475" y="94" font-size="7.5" text-anchor="middle">Object.prototype</text>

  <line x1="552" y1="90" x2="576" y2="90" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h2c-ink)"/>
  <rect class="h2c-b" x="580" y="72" width="120" height="36" rx="2"/>
  <text class="h2c-m" x="640" y="94" font-size="7.5" text-anchor="middle">null</text>

  <text class="h2c-s" x="295" y="126" font-size="7" text-anchor="middle">查 Array：第 1 层就命中</text>
  <text class="h2c-s" x="475" y="126" font-size="7" text-anchor="middle">查 Object：第 1 层不等，爬到这层命中</text>
  <text class="h2c-s" x="640" y="126" font-size="7" text-anchor="middle">爬到 null 还没中 → false</text>

  <text class="h2c-t" x="40" y="160" font-size="8.5" style="fill:#B03A2E">所以它是「比对到 null 为止」的循环，不是一次比较 —— 代价随链深度增长。</text>
  <text class="h2c-s" x="40" y="180" font-size="7.5">而 new 只写一次指针，代价是常数：写的时候一步，读的时候一个循环。</text>
</svg>
