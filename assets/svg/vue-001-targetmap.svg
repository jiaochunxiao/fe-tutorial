<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 192" width="100%" role="img" aria-labelledby="v1mt v1md">
  <title id="v1mt">targetMap 的三层嵌套结构</title>
  <desc id="v1md">依赖表叫 targetMap，是一个三层嵌套：最外层是 WeakMap，键是响应式对象，所以对象被回收时依赖自动消失，不会内存泄漏；往里一层是 Map，键是属性名，比如 count；再往里是 Set，装的是所有读过这个属性的 effect，可能是渲染 effect、computed 的 effect，也可能是用户写的 watch。track 时往对应的 Set 里 add，trigger 时遍历这个 Set 逐个执行。</desc>

  <style>
    .v1m-w{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.2}
    .v1m-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .v1m-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .v1m-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .v1m-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="v1m-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="v1m-t" x="40" y="26" font-size="8.5">三层嵌套：对象 → 属性 → effect 集合</text>

  <rect class="v1m-w" x="40" y="58" width="150" height="66" rx="2"/>
  <text class="v1m-mono" x="52" y="78" font-size="8">WeakMap</text>
  <text class="v1m-s" x="52" y="94" font-size="7">键：响应式对象</text>
  <text class="v1m-s" x="52" y="108" font-size="7">对象回收即自动释放</text>

  <text class="v1m-s" x="208" y="84" font-size="7" text-anchor="middle">state</text>
  <line x1="190" y1="91" x2="226" y2="91" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v1m-ink)"/>

  <rect class="v1m-b" x="230" y="58" width="150" height="66" rx="2"/>
  <text class="v1m-mono" x="242" y="78" font-size="8">Map</text>
  <text class="v1m-s" x="242" y="94" font-size="7">键：属性名</text>
  <text class="v1m-s" x="242" y="108" font-size="7">count / flag / list …</text>

  <text class="v1m-s" x="398" y="84" font-size="7" text-anchor="middle">count</text>
  <line x1="380" y1="91" x2="416" y2="91" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v1m-ink)"/>

  <rect class="v1m-b" x="420" y="58" width="130" height="66" rx="2"/>
  <text class="v1m-mono" x="432" y="78" font-size="8">Set</text>
  <text class="v1m-s" x="432" y="94" font-size="7">值：effect 集合</text>
  <text class="v1m-s" x="432" y="108" font-size="7">自动去重</text>

  <text class="v1m-s" x="566" y="84" font-size="7" text-anchor="middle">add</text>
  <line x1="550" y1="91" x2="582" y2="91" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v1m-ink)"/>

  <rect class="v1m-b" x="586" y="52" width="114" height="24" rx="2"/>
  <text class="v1m-s" x="643" y="68" font-size="7.5" text-anchor="middle">渲染 effect</text>
  <rect class="v1m-b" x="586" y="80" width="114" height="24" rx="2"/>
  <text class="v1m-s" x="643" y="96" font-size="7.5" text-anchor="middle">computed effect</text>
  <rect class="v1m-b" x="586" y="108" width="114" height="24" rx="2"/>
  <text class="v1m-s" x="643" y="124" font-size="7.5" text-anchor="middle">watch effect</text>

  <text class="v1m-t" x="40" y="156" font-size="8.5">track 往对应的 Set 里 add；trigger 遍历这个 Set 逐个执行。</text>
  <text class="v1m-t" x="40" y="176" font-size="8.5" style="fill:#B03A2E">最外层用 WeakMap 是有意的 —— 对象被回收，整条依赖跟着消失，不会漏。</text>
</svg>
