<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 224" width="100%" role="img" aria-labelledby="r6tt r6td">
  <title id="r6tt">连续两次加一只加一：快照与覆盖两个原因</title>
  <desc id="r6td">左边是对象式更新：连着写两次 setCount(count + 1)，两次读到的 count 都是本次渲染的快照常量零，于是两次都往队列里塞了数字一，后一个覆盖前一个，最终结果是一。右边是函数式更新：两次塞进队列的是函数而不是值，flush 时依次执行零加一得一、再加一得二，链式叠加，最终结果是二。所以只加一有两个原因，一半是快照常量，一半是对象式更新相互覆盖，缺一不可。</desc>

  <style>
    .r6t-p{fill:#FBF7EE;stroke:#CDC4AF;stroke-width:1}
    .r6t-c{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .r6t-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .r6t-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .r6t-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="r6t-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6E675A"/>
    </marker>
    <marker id="r6t-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="r6t-t" x="40" y="24" font-size="8.5">连写两次 +1，结果却只加了一 —— 两个原因各占一半</text>

  <rect class="r6t-p" x="40" y="38" width="320" height="156" rx="2" style="stroke:#B03A2E"/>
  <text class="r6t-t" x="52" y="58" font-size="8.5" style="fill:#B03A2E">对象式更新</text>
  <text class="r6t-mono" x="52" y="80" font-size="7.5">setCount(count + 1)</text>
  <text class="r6t-mono" x="52" y="96" font-size="7.5">setCount(count + 1)</text>
  <text class="r6t-s" x="52" y="114" font-size="7">两次读到的 count 都是快照 0 → 塞进队列的都是 1</text>

  <rect class="r6t-c" x="60" y="126" width="44" height="24" rx="2"/>
  <text class="r6t-mono" x="82" y="142" font-size="8" text-anchor="middle">0</text>
  <line x1="104" y1="138" x2="134" y2="138" stroke="#B03A2E" stroke-width="1.1" marker-end="url(#r6t-red)"/>
  <rect class="r6t-c" x="140" y="126" width="44" height="24" rx="2"/>
  <text class="r6t-mono" x="162" y="142" font-size="8" text-anchor="middle">1</text>
  <line x1="184" y1="138" x2="214" y2="138" stroke="#B03A2E" stroke-width="1.1" marker-end="url(#r6t-red)"/>
  <rect class="r6t-c" x="220" y="126" width="44" height="24" rx="2" style="stroke:#B03A2E"/>
  <text class="r6t-mono" x="242" y="142" font-size="8" text-anchor="middle" style="fill:#B03A2E">1</text>
  <text class="r6t-s" x="272" y="142" font-size="7" style="fill:#B03A2E">覆盖</text>

  <text class="r6t-t" x="52" y="176" font-size="8" style="fill:#B03A2E">最终 count = 1</text>

  <rect class="r6t-p" x="380" y="38" width="320" height="156" rx="2"/>
  <text class="r6t-t" x="392" y="58" font-size="8.5">函数式更新</text>
  <text class="r6t-mono" x="392" y="80" font-size="7.5">setCount(c =&gt; c + 1)</text>
  <text class="r6t-mono" x="392" y="96" font-size="7.5">setCount(c =&gt; c + 1)</text>
  <text class="r6t-s" x="392" y="114" font-size="7">塞进队列的是函数，flush 时依次执行，读的是最新值</text>

  <rect class="r6t-c" x="400" y="126" width="44" height="24" rx="2"/>
  <text class="r6t-mono" x="422" y="142" font-size="8" text-anchor="middle">0</text>
  <line x1="444" y1="138" x2="474" y2="138" stroke="#6E675A" stroke-width="1.1" marker-end="url(#r6t-ink)"/>
  <rect class="r6t-c" x="480" y="126" width="44" height="24" rx="2"/>
  <text class="r6t-mono" x="502" y="142" font-size="8" text-anchor="middle">1</text>
  <line x1="524" y1="138" x2="554" y2="138" stroke="#6E675A" stroke-width="1.1" marker-end="url(#r6t-ink)"/>
  <rect class="r6t-c" x="560" y="126" width="44" height="24" rx="2"/>
  <text class="r6t-mono" x="582" y="142" font-size="8" text-anchor="middle">2</text>
  <text class="r6t-s" x="612" y="142" font-size="7">叠加</text>

  <text class="r6t-t" x="392" y="176" font-size="8">最终 count = 2</text>

  <text class="r6t-t" x="40" y="216" font-size="8.5" style="fill:#B03A2E">快照常量解释了「为什么读到旧值」，对象式覆盖解释了「为什么不是 1 + 1」—— 缺一不可。</text>
</svg>
