<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 740 186" width="100%" role="img" aria-labelledby="fx7t fx7d">
  <title id="fx7t">Flex 容器的主轴与交叉轴</title>
  <desc id="fx7d">row 方向时主轴水平向右，justify-content 沿着主轴分配项目位置；交叉轴垂直于主轴、竖直向下，align-items 沿着交叉轴对齐项目。改变 flex-direction 就等于把这两根轴一起转。</desc>

  <style>
    .fx7-box{fill:none;stroke:#1C1A17;stroke-width:1.6}
    .fx7-item{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.3}
    .fx7-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .fx7-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .fx7-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="fx7-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <rect class="fx7-box" x="140" y="40" width="440" height="110" rx="2"/>
  <rect class="fx7-item" x="205" y="58" width="90" height="74" rx="2"/>
  <rect class="fx7-item" x="315" y="58" width="90" height="74" rx="2"/>
  <rect class="fx7-item" x="425" y="58" width="90" height="74" rx="2"/>

  <line x1="140" y1="176" x2="578" y2="176" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#fx7-ink)"/>
  <text class="fx7-t" x="360" y="168" font-size="10" text-anchor="middle">主轴 main axis</text>
  <text class="fx7-s" x="360" y="196" font-size="9.5" text-anchor="middle">justify-content 管这一段</text>

  <line x1="608" y1="40" x2="608" y2="148" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#fx7-ink)"/>
  <text class="fx7-t" x="622" y="86" font-size="10">交叉轴</text>
  <text class="fx7-s" x="622" y="104" font-size="9.5">align-items 管这一段</text>

</svg>
