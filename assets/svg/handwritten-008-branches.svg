<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 254" width="100%" role="img" aria-labelledby="h8bt h8bd">
  <title id="h8bt">patch 的判定顺序：先比类型，再比子节点</title>
  <desc id="h8bd">新旧两个 vnode 先比类型。类型不同就删旧建新，整棵子树换掉，后面的比较全部省了；类型相同才复用，继续做属性 diff 和子节点 diff。子节点 diff 先用 key 建一张索引表，然后三路出口：旧表里找得到的复用并移动，新表里新增的 mount，旧表里剩下的 remove。</desc>

  <style>
    .h8b-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .h8b-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .h8b-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .h8b-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="h8b-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="h8b-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="h8b-t" x="40" y="26" font-size="8.5">patch 的判定顺序：先比类型，再比子节点</text>

  <rect class="h8b-q" x="300" y="42" width="140" height="30" rx="2"/>
  <text class="h8b-t" x="370" y="61" font-size="8" text-anchor="middle">n1 vs n2</text>

  <path d="M330 72 L190 94" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h8b-ink)"/>
  <path d="M410 72 L550 94" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h8b-ink)"/>

  <rect class="h8b-b" x="60" y="98" width="260" height="42" rx="2"/>
  <text class="h8b-t" x="190" y="116" font-size="8" text-anchor="middle">类型相同 → patch 复用</text>
  <text class="h8b-s" x="190" y="131" font-size="7" text-anchor="middle">属性 diff + 子节点 diff</text>

  <rect class="h8b-b" x="420" y="98" width="260" height="42" rx="2"/>
  <text class="h8b-t" x="550" y="116" font-size="8" text-anchor="middle">类型不同 → 删旧建新</text>
  <text class="h8b-s" x="550" y="131" font-size="7" text-anchor="middle">整棵子树换掉，不再往下比</text>

  <line x1="190" y1="140" x2="190" y2="162" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h8b-ink)"/>
  <text class="h8b-s" x="200" y="156" font-size="7">子节点先建 key 索引表</text>

  <path d="M190 166 V176 H110 V188" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h8b-ink)"/>
  <path d="M190 166 V176 H370 V188" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h8b-ink)"/>
  <path d="M190 166 V176 H630 V188" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h8b-ink)"/>

  <rect class="h8b-b" x="40" y="192" width="180" height="32" rx="2"/>
  <text class="h8b-t" x="130" y="212" font-size="7.5" text-anchor="middle">旧表里有 → patch + move</text>
  <rect class="h8b-b" x="280" y="192" width="180" height="32" rx="2"/>
  <text class="h8b-t" x="370" y="212" font-size="7.5" text-anchor="middle">新表里多的 → mount</text>
  <rect class="h8b-b" x="540" y="192" width="180" height="32" rx="2"/>
  <text class="h8b-t" x="630" y="212" font-size="7.5" text-anchor="middle">旧表里剩的 → remove</text>

  <text class="h8b-t" x="40" y="240" font-size="8" style="fill:#B03A2E">类型不同那一路走得最快也最贵：省掉所有比较，代价是整棵子树重建。</text>
</svg>
