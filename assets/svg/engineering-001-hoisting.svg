<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 306" width="100%" role="img" aria-labelledby="e1ht e1hd">
  <title id="e1ht">扁平化安装：谁被提升到顶层，谁被迫下沉</title>
  <desc id="e1hd">你的项目直接依赖 A 和 C，A 要 B@1，C 要 B@2。npm v3 起的扁平化会把能放的都放到 node_modules 顶层，于是 B@1 被提升上来，A 和 C 都能直接 require 到它；B@2 与它冲突，只能下沉到 C 自己的 node_modules 里。副作用是：你的代码可以 require 一个根本没在 package.json 里声明的包，今天能跑只是因为别人恰好把它顶上来了。</desc>

  <style>
    .e1h-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .e1h-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .e1h-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="e1h-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="e1h-s" x="40" y="24" font-size="8.5">你的依赖：A（要 B@1）、C（要 B@2）</text>

  <text class="e1h-mono" x="44" y="48" font-size="9">node_modules/</text>
  <line x1="52" y1="56" x2="52" y2="196" stroke="#CDC4AF" stroke-width="1.2"/>

  <line x1="52" y1="76" x2="64" y2="76" stroke="#CDC4AF" stroke-width="1.2"/>
  <text class="e1h-mono" x="70" y="80" font-size="9">A/</text>

  <line x1="52" y1="104" x2="64" y2="104" stroke="#CDC4AF" stroke-width="1.2"/>
  <text class="e1h-mono" x="70" y="108" font-size="9">C/</text>

  <line x1="84" y1="112" x2="84" y2="168" stroke="#CDC4AF" stroke-width="1.2"/>
  <line x1="84" y1="140" x2="96" y2="140" stroke="#CDC4AF" stroke-width="1.2"/>
  <text class="e1h-mono" x="102" y="144" font-size="8.5">node_modules/</text>
  <line x1="84" y1="168" x2="96" y2="168" stroke="#CDC4AF" stroke-width="1.2"/>
  <text class="e1h-mono" x="102" y="172" font-size="8.5" style="fill:#B03A2E">B/</text>
  <line x1="128" y1="168" x2="182" y2="168" stroke="#B03A2E" stroke-width="1.2" marker-end="url(#e1h-red)"/>
  <text class="e1h-t" x="190" y="172" font-size="8.5" style="fill:#B03A2E">B@2 与顶层冲突，只能下沉到 C 的私有目录</text>

  <line x1="52" y1="196" x2="64" y2="196" stroke="#CDC4AF" stroke-width="1.2"/>
  <text class="e1h-mono" x="70" y="200" font-size="9" style="fill:#B03A2E">B/</text>
  <line x1="96" y1="196" x2="150" y2="196" stroke="#B03A2E" stroke-width="1.2" marker-end="url(#e1h-red)"/>
  <text class="e1h-t" x="158" y="200" font-size="8.5" style="fill:#B03A2E">A 的 B@1 被提升到顶层 —— A 和 C 都能直接 require 它</text>

  <line x1="40" y1="216" x2="700" y2="216" stroke="#CDC4AF" stroke-width="1"/>

  <text class="e1h-t" x="40" y="240" font-size="9" style="fill:#B03A2E">幽灵依赖</text>
  <text class="e1h-s" x="40" y="262" font-size="8.5">你的代码 <tspan class="e1h-mono" font-size="8.5">require('B')</tspan> 能跑，可 package.json 里根本没写 B。</text>
  <text class="e1h-s" x="40" y="280" font-size="8.5">今天能跑，是因为 A 恰好把它顶上来了；哪天 A 升级换了依赖，你就 404。</text>
  <text class="e1h-s" x="470" y="262" font-size="8.5">扁平化不是 bug，是为了去重</text>
  <text class="e1h-s" x="470" y="280" font-size="8.5">和兼容旧包 —— 代价是抹掉了边界</text>
</svg>
