<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" role="img" aria-labelledby="p1t p1d">
  <title id="p1t">浏览器的多进程架构</title>
  <desc id="p1d">浏览器进程位于顶层，总管 UI、输入、网络调度、权限与子进程管理；它通过 IPC 向下管理渲染进程、GPU 进程与网络插件扩展进程。每个渲染进程内部有主线程、合成线程、光栅线程与 IO 线程；站点隔离让跨站 iframe 单独开渲染进程。</desc>
  <defs>
    <marker id="p1-mut" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6E675A"/>
    </marker>
  </defs>

  <style>
    .p1-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.6}
    .p1-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .p1-serif{font-family:'Noto Serif SC','Songti SC','SimSun',serif;fill:#1C1A17}
    .p1-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <!-- 顶层：浏览器进程 -->
  <rect class="p1-box" x="230" y="36" width="300" height="54" rx="4"/>
  <text class="p1-serif" x="380" y="60" font-size="13.5" text-anchor="middle" font-weight="700">浏览器进程（总管）</text>
  <text class="p1-small" x="380" y="78" font-size="10.5" text-anchor="middle">UI · 输入 · 网络调度 · 权限 · 子进程管理</text>

  <!-- IPC -->
  <line x1="380" y1="90" x2="380" y2="120" stroke="#1C1A17" stroke-width="1.6"/>
  <text class="p1-mono" x="392" y="106" font-size="10.5">IPC —— 沙箱内没有系统直权，一切向总管申请</text>

  <!-- 总线 -->
  <line x1="66" y1="120" x2="694" y2="120" stroke="#1C1A17" stroke-width="1.6"/>
  <line x1="134" y1="120" x2="134" y2="144" stroke="#1C1A17" stroke-width="1.4"/>
  <line x1="298" y1="120" x2="298" y2="144" stroke="#1C1A17" stroke-width="1.4"/>
  <line x1="462" y1="120" x2="462" y2="144" stroke="#1C1A17" stroke-width="1.4"/>
  <line x1="626" y1="120" x2="626" y2="144" stroke="#1C1A17" stroke-width="1.4"/>

  <!-- 子进程 -->
  <rect class="p1-box" x="66" y="144" width="136" height="62" rx="4"/>
  <text class="p1-serif" x="134" y="168" font-size="12.5" text-anchor="middle" font-weight="700">渲染进程 A</text>
  <text class="p1-small" x="134" y="186" font-size="10" text-anchor="middle">tab1 · a.com</text>

  <rect class="p1-box" x="230" y="144" width="136" height="62" rx="4"/>
  <text class="p1-serif" x="298" y="168" font-size="12.5" text-anchor="middle" font-weight="700">渲染进程 B</text>
  <text class="p1-small" x="298" y="186" font-size="10" text-anchor="middle">tab2 · b.com</text>

  <rect class="p1-box" x="394" y="144" width="136" height="62" rx="4"/>
  <text class="p1-serif" x="462" y="168" font-size="12.5" text-anchor="middle" font-weight="700">GPU 进程</text>
  <text class="p1-small" x="462" y="186" font-size="10" text-anchor="middle">栅格化 · 合成上屏</text>

  <rect class="p1-box" x="558" y="144" width="136" height="62" rx="4"/>
  <text class="p1-serif" x="626" y="168" font-size="12.5" text-anchor="middle" font-weight="700">网络 / 插件</text>
  <text class="p1-small" x="626" y="186" font-size="10" text-anchor="middle">扩展进程</text>

  <!-- 两条虚线指到下方注解 -->
  <line x1="134" y1="206" x2="134" y2="232" stroke="#6E675A" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#p1-mut)"/>
  <line x1="298" y1="206" x2="298" y2="232" stroke="#6E675A" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#p1-mut)"/>

  <!-- 底部注解条 -->
  <rect x="66" y="232" width="628" height="48" rx="3" fill="none" stroke="#CDC4AF" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="404" y1="240" x2="404" y2="272" stroke="#CDC4AF" stroke-width="1"/>
  <text class="p1-small" x="82" y="261" font-size="10.5">进程内：主线程（JS + GUI）· 合成 · 光栅 · IO 线程</text>
  <text class="p1-small" x="420" y="261" font-size="10.5">站点隔离：跨站 iframe 单独开进程</text>

</svg>
