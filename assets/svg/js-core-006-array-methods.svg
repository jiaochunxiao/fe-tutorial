<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 740 290" width="100%" role="img" aria-labelledby="ar6t ar6d">
  <title id="ar6t">数组方法按「改不改原数组」分成两枝</title>
  <desc id="ar6d">九个原地方法会修改原数组：push、pop、shift、unshift、splice、sort、reverse、fill、copyWithin。其余方法不动原数组：读取类的 find、findIndex、indexOf、includes、some、every，产出新数组的 slice、concat、map、filter、toSorted，以及聚合的 reduce、join 和遍历的 forEach、for...of。所有拷贝都是浅拷贝，sort 默认按字符串字典序且原地修改。</desc>

  <style>
    .ar6-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .ar6-mut{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.4}
    .ar6-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .ar6-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .ar6-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="ar6-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <rect class="ar6-box" x="36" y="132" width="90" height="36" rx="3"/>
  <text class="ar6-t" x="81" y="155" font-size="9.5" text-anchor="middle">数组方法</text>

  <line x1="126" y1="150" x2="160" y2="150" stroke="#1C1A17" stroke-width="1.4"/>
  <line x1="160" y1="96" x2="160" y2="204" stroke="#1C1A17" stroke-width="1.4"/>
  <line x1="160" y1="96" x2="186" y2="96" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#ar6-ink)"/>
  <line x1="160" y1="204" x2="186" y2="204" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#ar6-ink)"/>

  <rect class="ar6-mut" x="192" y="70" width="514" height="52" rx="3"/>
  <text class="ar6-t" x="206" y="90" font-size="10">会改原数组</text>
  <text class="ar6-s" x="278" y="90" font-size="9">九个原地方法，返回的往往是长度或被删元素</text>
  <text class="ar6-mono" x="206" y="110" font-size="9.5">push pop shift unshift · splice · sort reverse · fill copyWithin</text>

  <rect class="ar6-box" x="192" y="178" width="514" height="92" rx="3"/>
  <text class="ar6-t" x="206" y="198" font-size="10">原数组不动，返回新结果</text>

  <text class="ar6-s" x="206" y="220" font-size="9">读取</text>
  <text class="ar6-mono" x="252" y="220" font-size="9.5">find findIndex indexOf includes some every</text>

  <text class="ar6-s" x="206" y="238" font-size="9">新数组</text>
  <text class="ar6-mono" x="252" y="238" font-size="9.5">slice concat map filter · toSorted</text>

  <text class="ar6-s" x="206" y="256" font-size="9">聚合</text>
  <text class="ar6-mono" x="252" y="256" font-size="9.5">reduce join</text>
  <text class="ar6-s" x="400" y="256" font-size="9">遍历</text>
  <text class="ar6-mono" x="446" y="256" font-size="9.5">forEach for...of</text>

  <text class="ar6-s" x="36" y="296" font-size="9.5">拷贝一律是浅的 —— 嵌套引用两边仍然共享</text>
  <text class="ar6-s" x="36" y="314" font-size="9.5">sort 默认按字符串字典序且原地改：安全姿势 [...arr].sort((a, b) =&gt; a - b)</text>
</svg>
