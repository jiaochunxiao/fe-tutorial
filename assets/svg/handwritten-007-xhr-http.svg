<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 296" width="100%" role="img" aria-labelledby="h7xt h7xd">
  <title id="h7xt">XHR 的状态机，和 HttpClient 补上的三件套</title>
  <desc id="h7xd">上排是 XHR 的四步：open、setRequestHeader、send，然后 readyState 从 0 走到 4。到达 4 之后按 status 分三种结局：2xx 走 resolve，4xx 与 5xx 走 reject，status 为 0 说明跨域被拦或超时，要靠 ontimeout、onerror、onabort 分辨。下排是 HttpClient 的流水线：请求拦截器后注册先执行，进 fetch 配 AbortController 做超时，res.ok 判定后统一解包 JSON，再走响应拦截器（先注册先执行）到业务层；任何一步失败都掉进 response 错误拦截器链并 throw。</desc>

  <style>
    .h7x-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .h7x-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .h7x-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .h7x-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="h7x-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="h7x-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="h7x-t" x="40" y="26" font-size="8.5">XHR 的状态机，和 HttpClient 补上的三件套</text>

  <rect class="h7x-b" x="40" y="44" width="150" height="34" rx="2"/>
  <text class="h7x-t" x="115" y="65" font-size="8" text-anchor="middle">open(method, url)</text>
  <line x1="192" y1="61" x2="206" y2="61" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h7x-ink)"/>
  <rect class="h7x-b" x="210" y="44" width="150" height="34" rx="2"/>
  <text class="h7x-t" x="285" y="65" font-size="8" text-anchor="middle">setRequestHeader</text>
  <line x1="362" y1="61" x2="376" y2="61" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h7x-ink)"/>
  <rect class="h7x-b" x="380" y="44" width="150" height="34" rx="2"/>
  <text class="h7x-t" x="455" y="65" font-size="8" text-anchor="middle">send(body)</text>
  <line x1="532" y1="61" x2="546" y2="61" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h7x-ink)"/>
  <rect class="h7x-q" x="550" y="44" width="150" height="34" rx="2"/>
  <text class="h7x-t" x="625" y="65" font-size="8" text-anchor="middle">readyState 0 → 4</text>

  <line x1="625" y1="78" x2="625" y2="94" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h7x-ink)"/>

  <rect class="h7x-q" x="40" y="98" width="660" height="38" rx="2"/>
  <text class="h7x-s" x="56" y="121" font-size="7.5">status 判定</text>
  <text class="h7x-t" x="150" y="121" font-size="7.5">2xx → resolve</text>
  <text class="h7x-t" x="330" y="121" font-size="7.5">4xx / 5xx → reject</text>
  <text class="h7x-t" x="510" y="121" font-size="7.5">0 → 跨域或超时，看 ontimeout / onerror / onabort</text>

  <text class="h7x-s" x="40" y="164" font-size="7.5">HttpClient（axios 骨架）</text>

  <rect class="h7x-b" x="40" y="172" width="100" height="40" rx="2"/>
  <text class="h7x-t" x="90" y="188" font-size="7.5" text-anchor="middle">请求拦截器</text>
  <text class="h7x-s" x="90" y="202" font-size="6.5" text-anchor="middle">后注册先执行</text>

  <rect class="h7x-b" x="152" y="172" width="100" height="40" rx="2"/>
  <text class="h7x-t" x="202" y="188" font-size="7.5" text-anchor="middle">fetch</text>
  <text class="h7x-s" x="202" y="202" font-size="6.5" text-anchor="middle">AbortController</text>

  <rect class="h7x-b" x="264" y="172" width="100" height="40" rx="2"/>
  <text class="h7x-t" x="314" y="188" font-size="7.5" text-anchor="middle">res.ok 判定</text>
  <text class="h7x-s" x="314" y="202" font-size="6.5" text-anchor="middle">非 ok 走错误链</text>

  <rect class="h7x-b" x="376" y="172" width="100" height="40" rx="2"/>
  <text class="h7x-t" x="426" y="188" font-size="7.5" text-anchor="middle">统一解包</text>
  <text class="h7x-s" x="426" y="202" font-size="6.5" text-anchor="middle">res.json()</text>

  <rect class="h7x-b" x="488" y="172" width="100" height="40" rx="2"/>
  <text class="h7x-t" x="538" y="188" font-size="7.5" text-anchor="middle">响应拦截器</text>
  <text class="h7x-s" x="538" y="202" font-size="6.5" text-anchor="middle">先注册先执行</text>

  <rect class="h7x-q" x="600" y="172" width="100" height="40" rx="2"/>
  <text class="h7x-t" x="650" y="196" font-size="7.5" text-anchor="middle">业务层</text>

  <line x1="142" y1="192" x2="148" y2="192" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h7x-ink)"/>
  <line x1="254" y1="192" x2="260" y2="192" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h7x-ink)"/>
  <line x1="366" y1="192" x2="372" y2="192" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h7x-ink)"/>
  <line x1="478" y1="192" x2="484" y2="192" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h7x-ink)"/>
  <line x1="590" y1="192" x2="596" y2="192" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h7x-ink)"/>

  <path d="M314 212 V232" fill="none" stroke="#B03A2E" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#h7x-red)"/>
  <rect class="h7x-b" x="264" y="236" width="300" height="30" rx="2" stroke="#B03A2E"/>
  <text class="h7x-t" x="414" y="255" font-size="7.5" text-anchor="middle" style="fill:#B03A2E">response 错误拦截器链 → throw</text>

  <text class="h7x-t" x="40" y="288" font-size="8.5" style="fill:#B03A2E">一个团队只需要一套心智模型：XHR 翻译成 Promise，fetch 补齐超时、错误、拦截器。</text>
</svg>
