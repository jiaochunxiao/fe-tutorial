<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 344" width="100%" role="img" aria-labelledby="ai6t ai6d">
  <title id="ai6t">异步的闭环：主线程发起、别人干活、回调排队、主线程再取</title>
  <desc id="ai6d">主线程一次只能跑一个任务。它发起异步请求后立刻返回，不等结果，拿到的只是一张凭证。真正干活的是别的线程或进程，干完把回调放进任务队列。主线程把手上的活做完、空闲下来，才去队列里取下一个。队列分两段：微任务在前，宏任务在后。底部是形态演进的三站：回调、Promise、async/await，解决的是同一件事——把「等」写得不那么难看。</desc>

  <style>
    .ai6-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .ai6-pill{fill:#FBF7EE;stroke:#CDC4AF;stroke-width:1}
    .ai6-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .ai6-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .ai6-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="ai6-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="ai6-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <rect class="ai6-box" x="40" y="56" width="200" height="76" rx="3"/>
  <text class="ai6-t" x="54" y="80" font-size="9.5">主线程</text>
  <text class="ai6-s" x="54" y="98" font-size="8.5">一次只跑一个任务</text>
  <text class="ai6-s" x="54" y="114" font-size="8.5">跑完才去队列里取下一个</text>

  <rect class="ai6-box" x="520" y="56" width="180" height="76" rx="3"/>
  <text class="ai6-t" x="534" y="80" font-size="9.5">任务队列</text>
  <text class="ai6-mono" x="534" y="98" font-size="8">微任务：then 回调</text>
  <text class="ai6-mono" x="534" y="116" font-size="8">宏任务：timeout 回调</text>

  <rect class="ai6-box" x="250" y="186" width="200" height="70" rx="3"/>
  <text class="ai6-t" x="264" y="210" font-size="9.5">别的线程 / 进程</text>
  <text class="ai6-s" x="264" y="228" font-size="8.5">fetch、定时器、IO</text>
  <text class="ai6-s" x="264" y="244" font-size="8.5">真正在干活的是它</text>

  <path d="M150 132 C150 168 196 186 286 186" fill="none" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#ai6-red)"/>
  <text class="ai6-s" x="56" y="166" font-size="8.5" style="fill:#B03A2E">发起异步，立刻返回</text>

  <path d="M410 186 C470 186 520 168 578 138" fill="none" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#ai6-ink)"/>
  <text class="ai6-s" x="432" y="166" font-size="8.5">干完了，回调入队</text>

  <line x1="520" y1="94" x2="246" y2="94" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#ai6-ink)"/>
  <text class="ai6-s" x="383" y="86" font-size="8.5" text-anchor="middle">空闲就取一个执行</text>

  <text class="ai6-s" x="40" y="316" font-size="8.5">形态演进</text>
  <rect class="ai6-pill" x="150" y="292" width="160" height="32" rx="16"/>
  <text class="ai6-t" x="230" y="312" font-size="8.5" text-anchor="middle">回调 · 嵌套 + 错误手传</text>
  <line x1="310" y1="308" x2="336" y2="308" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#ai6-ink)"/>
  <rect class="ai6-pill" x="340" y="292" width="160" height="32" rx="16"/>
  <text class="ai6-t" x="420" y="312" font-size="8.5" text-anchor="middle">Promise · 链式 + 冒泡</text>
  <line x1="500" y1="308" x2="526" y2="308" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#ai6-ink)"/>
  <rect class="ai6-pill" x="530" y="292" width="160" height="32" rx="16"/>
  <text class="ai6-t" x="610" y="312" font-size="8.5" text-anchor="middle">async / await · 同步写法</text>
</svg>
