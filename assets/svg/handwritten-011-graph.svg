<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 200" width="100%" role="img" aria-labelledby="h11gt h11gd">
  <title id="h11gt">三个文件、两条 import，构成打包器要爬的那张图</title>
  <desc id="h11gd">index.js 从 utils.js 里 import 了 add，utils.js 又从 constant.js 里 import 了 MULTIPLY，constant.js 是叶子节点。打包器在构建期从入口出发做一次深度优先遍历，把每个文件记成一条 id、依赖列表、代码的记录，运行期再用一个很小的 require 按 id 从表里取出函数执行。这就是「把每个文件包成一个函数」的全部含义。</desc>

  <style>
    .h11g-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .h11g-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .h11g-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .h11g-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .h11g-m{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="h11g-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="h11g-t" x="40" y="26" font-size="8.5">三个文件、两条 import —— 这就是打包器要爬的那张图</text>

  <rect class="h11g-q" x="40" y="58" width="160" height="40" rx="2"/>
  <text class="h11g-m" x="120" y="76" font-size="8" text-anchor="middle">index.js</text>
  <text class="h11g-s" x="120" y="90" font-size="6.5" text-anchor="middle">入口</text>

  <line x1="202" y1="78" x2="246" y2="78" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h11g-ink)"/>
  <text class="h11g-s" x="224" y="50" font-size="6.5" text-anchor="middle">import add</text>

  <rect class="h11g-b" x="250" y="58" width="160" height="40" rx="2"/>
  <text class="h11g-m" x="330" y="76" font-size="8" text-anchor="middle">utils.js</text>
  <text class="h11g-s" x="330" y="90" font-size="6.5" text-anchor="middle">export add</text>

  <line x1="412" y1="78" x2="456" y2="78" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h11g-ink)"/>
  <text class="h11g-s" x="434" y="50" font-size="6.5" text-anchor="middle">import MULTIPLY</text>

  <rect class="h11g-b" x="460" y="58" width="160" height="40" rx="2"/>
  <text class="h11g-m" x="540" y="76" font-size="8" text-anchor="middle">constant.js</text>
  <text class="h11g-s" x="540" y="90" font-size="6.5" text-anchor="middle">叶子节点，最先打包</text>

  <rect class="h11g-b" x="86" y="112" width="68" height="22" rx="1"/>
  <text class="h11g-m" x="120" y="127" font-size="7" text-anchor="middle">id: 0</text>
  <rect class="h11g-b" x="296" y="112" width="68" height="22" rx="1"/>
  <text class="h11g-m" x="330" y="127" font-size="7" text-anchor="middle">id: 1</text>
  <rect class="h11g-b" x="506" y="112" width="68" height="22" rx="1"/>
  <text class="h11g-m" x="540" y="127" font-size="7" text-anchor="middle">id: 2</text>

  <text class="h11g-s" x="630" y="127" font-size="6.5">DFS 的访问序</text>

  <text class="h11g-t" x="40" y="162" font-size="8">构建期：从入口 DFS，每个文件记成一条 { id, deps, code }</text>
  <text class="h11g-s" x="40" y="180" font-size="7.5">运行期：一个几十行的 require 按 id 从这张表里取函数、执行、缓存导出值 —— 模块机制被内嵌进了产物。</text>
</svg>
