<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 315" width="100%" role="img" aria-labelledby="ar2tt ar2td">
  <title id="ar2tt">五类状态各有各的家，先分类再选型</title>
  <desc id="ar2td">五行分诊表。服务端状态的真身在服务器、前端只是缓存，交给 React Query 或 SWR，反模式是拿 Redux 手写缓存。URL 状态如筛选分页放 route.query，反模式是塞进组件 state 丢掉分享与回退。全局客户端状态用轻量 store，尺度是兄弟共享先上提即可。局部状态留在 useState 或 ref，别提前上提。派生状态用 computed 或 memo 算出来，反模式是存两份再用 effect 同步。底部三问体检：是不是唯一事实源、变更路径是否明确、刷新与回退是否符合预期。</desc>

  <style>
    .a2t-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .a2t-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .a2t-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .a2t-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="a2t-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="a2t-t" x="40" y="26" font-size="8.5">先分类，再选型 —— 每类状态都有一个「天然的家」</text>

  <rect class="a2t-b" x="40" y="48" width="110" height="30" rx="2"/>
  <text class="a2t-t" x="95" y="67" font-size="8" text-anchor="middle">服务端状态</text>
  <line x1="152" y1="63" x2="184" y2="63" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#a2t-ink)"/>
  <rect class="a2t-q" x="190" y="48" width="200" height="30" rx="2"/>
  <text class="a2t-t" x="290" y="67" font-size="8" text-anchor="middle">缓存层 · React Query / SWR</text>
  <text class="a2t-s" x="404" y="67" font-size="7.5" style="fill:#B03A2E">反模式：Redux 手写缓存</text>

  <rect class="a2t-b" x="40" y="86" width="110" height="30" rx="2"/>
  <text class="a2t-t" x="95" y="105" font-size="8" text-anchor="middle">URL 状态</text>
  <line x1="152" y1="101" x2="184" y2="101" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#a2t-ink)"/>
  <rect class="a2t-q" x="190" y="86" width="200" height="30" rx="2"/>
  <text class="a2t-t" x="290" y="105" font-size="8" text-anchor="middle">route.query</text>
  <text class="a2t-s" x="404" y="105" font-size="7.5" style="fill:#B03A2E">反模式：组件 state（丢掉分享与回退）</text>

  <rect class="a2t-b" x="40" y="124" width="110" height="30" rx="2"/>
  <text class="a2t-t" x="95" y="143" font-size="8" text-anchor="middle">全局客户端</text>
  <line x1="152" y1="139" x2="184" y2="139" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#a2t-ink)"/>
  <rect class="a2t-q" x="190" y="124" width="200" height="30" rx="2"/>
  <text class="a2t-t" x="290" y="143" font-size="8" text-anchor="middle">轻 store · Pinia / Zustand</text>
  <text class="a2t-s" x="404" y="143" font-size="7.5">尺度：兄弟共享先上提，够不着才上全局</text>

  <rect class="a2t-b" x="40" y="162" width="110" height="30" rx="2"/>
  <text class="a2t-t" x="95" y="181" font-size="8" text-anchor="middle">局部状态</text>
  <line x1="152" y1="177" x2="184" y2="177" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#a2t-ink)"/>
  <rect class="a2t-q" x="190" y="162" width="200" height="30" rx="2"/>
  <text class="a2t-t" x="290" y="181" font-size="8" text-anchor="middle">useState / ref</text>
  <text class="a2t-s" x="404" y="181" font-size="7.5">尺度：别提前上提（YAGNI）</text>

  <rect class="a2t-b" x="40" y="200" width="110" height="30" rx="2"/>
  <text class="a2t-t" x="95" y="219" font-size="8" text-anchor="middle">派生状态</text>
  <line x1="152" y1="215" x2="184" y2="215" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#a2t-ink)"/>
  <rect class="a2t-q" x="190" y="200" width="200" height="30" rx="2"/>
  <text class="a2t-t" x="290" y="219" font-size="8" text-anchor="middle">computed / memo</text>
  <text class="a2t-s" x="404" y="219" font-size="7.5" style="fill:#B03A2E">反模式：存两份 + effect 同步</text>

  <text class="a2t-s" x="40" y="254" font-size="7.5">三问体检</text>
  <rect class="a2t-b" x="100" y="240" width="190" height="30" rx="2"/>
  <text class="a2t-t" x="195" y="259" font-size="7.5" text-anchor="middle">① 是不是唯一事实源？</text>
  <rect class="a2t-b" x="300" y="240" width="190" height="30" rx="2"/>
  <text class="a2t-t" x="395" y="259" font-size="7.5" text-anchor="middle">② 变更通知路径明确吗？</text>
  <rect class="a2t-b" x="500" y="240" width="200" height="30" rx="2"/>
  <text class="a2t-t" x="600" y="259" font-size="7.5" text-anchor="middle">③ 刷新、回退符合预期吗？</text>

  <text class="a2t-t" x="40" y="298" font-size="8.5" style="fill:#B03A2E">把接口当缓存管理，而不是把缓存当接口存 —— 多数状态灾难都出在这一句上。</text>
</svg>
