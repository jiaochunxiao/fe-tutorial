<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 226" width="100%" role="img" aria-labelledby="r1t r1d">
  <title id="r1t">渲染管线</title>
  <desc id="r1d">DOM 与 CSSOM 合并成渲染树，再经布局算几何、绘制生成指令与图层，最后由 GPU 合成上屏。</desc>
  <defs>
    <marker id="r1-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <style>
    .r1-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.6}
    .r1-key{fill:#FBF7EE;stroke:#B03A2E;stroke-width:1.6}
    .r1-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .r1-serif{font-family:'Noto Serif SC','Songti SC','SimSun',serif;fill:#1C1A17}
    .r1-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <!-- 两个输入 -->
  <text class="r1-small" x="105" y="36" font-size="10.5" text-anchor="middle">HTML 解析</text>
  <rect class="r1-box" x="40" y="48" width="130" height="48" rx="4"/>
  <text class="r1-mono" x="105" y="78" font-size="13.5" text-anchor="middle">DOM</text>

  <text class="r1-small" x="105" y="128" font-size="10.5" text-anchor="middle">CSS 解析</text>
  <rect class="r1-box" x="40" y="140" width="130" height="48" rx="4"/>
  <text class="r1-mono" x="105" y="170" font-size="13.5" text-anchor="middle">CSSOM</text>

  <!-- 渲染树 -->
  <rect class="r1-key" x="210" y="92" width="130" height="52" rx="4"/>
  <text class="r1-mono" x="275" y="116" font-size="13" text-anchor="middle">渲染树</text>
  <text class="r1-mono" x="275" y="133" font-size="9.5" text-anchor="middle" style="fill:#B03A2E">Render Tree</text>
  <text class="r1-small" x="275" y="164" font-size="10" text-anchor="middle">可见节点 + 最终样式</text>

  <!-- Layout -->
  <rect class="r1-box" x="370" y="92" width="110" height="52" rx="4"/>
  <text class="r1-mono" x="425" y="116" font-size="13" text-anchor="middle">Layout</text>
  <text class="r1-mono" x="425" y="133" font-size="9.5" text-anchor="middle" style="fill:#6E675A">布局 / 重排</text>
  <text class="r1-small" x="425" y="164" font-size="10" text-anchor="middle">几何：大小与位置</text>

  <!-- Paint -->
  <rect class="r1-box" x="510" y="92" width="110" height="52" rx="4"/>
  <text class="r1-mono" x="565" y="116" font-size="13" text-anchor="middle">Paint</text>
  <text class="r1-mono" x="565" y="133" font-size="9.5" text-anchor="middle" style="fill:#6E675A">绘制 / 重绘</text>
  <text class="r1-small" x="565" y="164" font-size="10" text-anchor="middle">绘制指令 + 图层</text>

  <!-- 合成 -->
  <rect class="r1-box" x="650" y="92" width="90" height="52" rx="4"/>
  <text class="r1-mono" x="695" y="116" font-size="13" text-anchor="middle">合成</text>
  <text class="r1-mono" x="695" y="133" font-size="9.5" text-anchor="middle" style="fill:#6E675A">Composite</text>
  <text class="r1-small" x="695" y="164" font-size="10" text-anchor="middle">GPU 拼帧上屏</text>

  <!-- 连线 -->
  <path d="M170 72 C192 72 192 110 206 110" fill="none" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#r1-ink)"/>
  <path d="M170 164 C192 164 192 126 206 126" fill="none" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#r1-ink)"/>
  <line x1="342" y1="118" x2="366" y2="118" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#r1-ink)"/>
  <line x1="482" y1="118" x2="506" y2="118" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#r1-ink)"/>
  <line x1="622" y1="118" x2="646" y2="118" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#r1-ink)"/>

  <!-- 脚注 -->
  <text class="r1-small" x="40" y="212" font-size="11">改几何触发 Layout（重排），只改颜色触发 Paint（重绘），只动 transform / opacity 可以只走合成。</text>
</svg>
