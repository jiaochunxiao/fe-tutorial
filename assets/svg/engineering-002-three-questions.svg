<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 252" width="100%" role="img" aria-labelledby="e2qt e2qd">
  <title id="e2qt">开篇三个疑问与它们的答案</title>
  <desc id="e2qd">看到三个文件，是因为产物被拆成了业务、依赖、运行时三个 chunk，动机是变与不变分离，三方库长期不动可以长期缓存。文件名像乱码，是因为用了 contenthash 内容指纹，内容不变文件名就不变，强缓存才敢设一年。业务代码和依赖「你中有我」，是因为默认把所有模块打进一个包，解法是 splitChunks。三个疑问其实是同一件事的三面：产物结构就是配置的投影。</desc>

  <style>
    .e2q-b{fill:#FBF7EE;stroke:#CDC4AF;stroke-width:1}
    .e2q-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .e2q-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .e2q-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="e2q-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6E675A"/>
    </marker>
  </defs>

  <text class="e2q-t" x="40" y="24" font-size="8.5">开篇的三个疑问，其实是同一件事的三面</text>

  <text class="e2q-s" x="40" y="48" font-size="7.5">你看到的现象</text>
  <text class="e2q-s" x="250" y="48" font-size="7.5">实际是什么</text>
  <text class="e2q-s" x="540" y="48" font-size="7.5">本质</text>

  <text class="e2q-t" x="40" y="79" font-size="8.5">为什么是三个文件？</text>
  <line x1="216" y1="75" x2="242" y2="75" stroke="#6E675A" stroke-width="1" marker-end="url(#e2q-ink)"/>
  <rect class="e2q-b" x="250" y="58" width="280" height="34" rx="2"/>
  <text class="e2q-t" x="262" y="79" font-size="8">三个 Chunk：业务 · 依赖 · 运行时</text>
  <text class="e2q-t" x="540" y="79" font-size="8" style="fill:#B03A2E">变与不变分离</text>

  <text class="e2q-t" x="40" y="135" font-size="8.5">文件名为什么像乱码？</text>
  <line x1="216" y1="131" x2="242" y2="131" stroke="#6E675A" stroke-width="1" marker-end="url(#e2q-ink)"/>
  <rect class="e2q-b" x="250" y="114" width="280" height="34" rx="2"/>
  <text class="e2q-mono" x="262" y="135" font-size="7.5">contenthash 内容指纹</text>
  <text class="e2q-t" x="540" y="135" font-size="8" style="fill:#B03A2E">内容不变就不换名</text>

  <text class="e2q-t" x="40" y="191" font-size="8.5">为什么「你中有我」？</text>
  <line x1="216" y1="187" x2="242" y2="187" stroke="#6E675A" stroke-width="1" marker-end="url(#e2q-ink)"/>
  <rect class="e2q-b" x="250" y="170" width="280" height="34" rx="2"/>
  <text class="e2q-t" x="262" y="191" font-size="8">默认单包，全量混居在一起</text>
  <text class="e2q-t" x="540" y="191" font-size="8" style="fill:#B03A2E">splitChunks 拆开</text>

  <text class="e2q-t" x="40" y="240" font-size="8.5" style="fill:#B03A2E">产物结构是配置的投影 —— 读懂 dist，就读懂了构建策略。</text>
</svg>
