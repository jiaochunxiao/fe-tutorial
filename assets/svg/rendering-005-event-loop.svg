<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" width="100%" role="img" aria-labelledby="e1t e1d">
  <title id="e1t">一轮事件循环与帧预算</title>
  <desc id="e1d">一轮循环依次是取宏任务、清微任务、渲染机会判定、渲染步骤，再回到起点。渲染机会不满足时跳过渲染直接进入下一轮。下方是一帧 16.7 毫秒内主线程各阶段的预算分配。</desc>
  <defs>
    <marker id="e1-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="e1-cin" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <style>
    .e1-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.6}
    .e1-key{fill:#FBF7EE;stroke:#B03A2E;stroke-width:1.6}
    .e1-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .e1-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <!-- 循环四步 -->
  <rect class="e1-box" x="40" y="56" width="130" height="48" rx="4"/>
  <text class="e1-mono" x="105" y="86" font-size="12" text-anchor="middle">① 取宏任务</text>

  <rect class="e1-box" x="200" y="56" width="130" height="48" rx="4"/>
  <text class="e1-mono" x="265" y="86" font-size="12" text-anchor="middle">② 清微任务</text>

  <rect class="e1-key" x="360" y="56" width="160" height="48" rx="4"/>
  <text class="e1-mono" x="440" y="80" font-size="12" text-anchor="middle" font-weight="700" style="fill:#B03A2E">③ 渲染机会判定</text>
  <text class="e1-small" x="440" y="96" font-size="9.5" text-anchor="middle">时间 / 可见 / 有变化</text>

  <rect class="e1-box" x="550" y="56" width="160" height="48" rx="4"/>
  <text class="e1-mono" x="630" y="80" font-size="12" text-anchor="middle">④ 渲染步骤</text>
  <text class="e1-small" x="630" y="96" font-size="9.5" text-anchor="middle">rAF → Style → … → 合成</text>

  <line x1="172" y1="80" x2="196" y2="80" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#e1-ink)"/>
  <line x1="332" y1="80" x2="356" y2="80" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#e1-ink)"/>
  <line x1="522" y1="80" x2="546" y2="80" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#e1-ink)"/>

  <!-- 跳过渲染（虚线） -->
  <path d="M400 106 V126 H76 V108" fill="none" stroke="#6E675A" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#e1-ink)"/>
  <text class="e1-small" x="396" y="120" font-size="10" text-anchor="end" style="fill:#6E675A">不满足 → 跳过渲染，直接进下一轮</text>

  <!-- 正常回环 -->
  <path d="M630 106 V152 H136 V108" fill="none" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#e1-ink)"/>
  <text class="e1-small" x="156" y="146" font-size="10">满足 → 渲染完再回到 ①</text>

  <!-- 帧预算 -->
  <text class="e1-mono" x="40" y="196" font-size="11.5" font-weight="700">一帧预算 16.7ms（60Hz）· 全部跑在同一个主线程</text>

  <rect x="40" y="206" width="204" height="46" fill="#F0DCD6" stroke="#1C1A17" stroke-width="1.2"/>
  <text class="e1-mono" x="142" y="234" font-size="10.5" text-anchor="middle" font-weight="700" style="fill:#B03A2E">任务 + 微任务</text>

  <rect x="244" y="206" width="41" height="46" fill="#FBF7EE" stroke="#1C1A17" stroke-width="1.2"/>
  <text class="e1-mono" x="264.5" y="234" font-size="9.5" text-anchor="middle">rAF</text>

  <rect x="285" y="206" width="81" height="46" fill="#FBF7EE" stroke="#1C1A17" stroke-width="1.2"/>
  <text class="e1-mono" x="325.5" y="234" font-size="10" text-anchor="middle">Style</text>

  <rect x="366" y="206" width="122" height="46" fill="#FBF7EE" stroke="#1C1A17" stroke-width="1.2"/>
  <text class="e1-mono" x="427" y="234" font-size="10" text-anchor="middle">Layout</text>

  <rect x="488" y="206" width="122" height="46" fill="#FBF7EE" stroke="#1C1A17" stroke-width="1.2"/>
  <text class="e1-mono" x="549" y="234" font-size="10" text-anchor="middle">Paint</text>

  <rect x="610" y="206" width="61" height="46" fill="#FBF7EE" stroke="#1C1A17" stroke-width="1.2"/>
  <text class="e1-mono" x="640.5" y="234" font-size="10" text-anchor="middle">合成</text>

  <rect x="671" y="206" width="49" height="46" fill="#EFE8D8" stroke="#1C1A17" stroke-width="1.2"/>
  <text class="e1-mono" x="695.5" y="234" font-size="9" text-anchor="middle" style="fill:#6E675A">空闲</text>


  <!-- 脚注 -->
  <text class="e1-small" x="40" y="292" font-size="11">任务超过 50ms 就是长任务：主线程被占住，本帧预算爆掉 → 渲染机会被跳过 → 掉帧与输入延迟（LCP / INP 双杀）。</text>
</svg>
