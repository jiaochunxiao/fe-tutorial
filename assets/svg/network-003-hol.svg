<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" role="img" aria-labelledby="h1t h1d">
  <title id="h1t">HTTP/1.1 与 HTTP/2 的队头阻塞</title>
  <desc id="h1d">HTTP/1.1 用多条连接，每条连接上的请求串行排队；HTTP/2 只用一条连接，多个流的帧交错发送、接收端按流 ID 重组，应用层不再排队；但所有流共享同一条 TCP 连接，丢一个包会让整条连接的所有流一起等待重传。</desc>
  <defs>
    <pattern id="h1-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#B03A2E" stroke-width="1.4" opacity="0.5"/>
    </pattern>
    <marker id="h1-cin" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <style>
    .h1-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .h1-serif{font-family:'Noto Serif SC','Songti SC','SimSun',serif;fill:#1C1A17}
    .h1-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .h1-lane{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.2}
    .h1-a{fill:#DDB9B1;stroke:#B03A2E;stroke-width:1.2}
    .h1-b{fill:#EFE8D8;stroke:#1C1A17;stroke-width:1.2}
  </style>

  <!-- ① HTTP/1.1 -->
  <text class="h1-serif" x="40" y="40" font-size="13" font-weight="700">① HTTP/1.1 —— 6 条连接，每条串行</text>

  <text class="h1-mono" x="158" y="73" font-size="10" text-anchor="end" style="fill:#6E675A">c1</text>
  <rect class="h1-lane" x="170" y="58" width="62" height="20"/>
  <text class="h1-mono" x="201" y="73" font-size="11" text-anchor="middle">A</text>
  <rect class="h1-lane" x="234" y="58" width="62" height="20"/>
  <text class="h1-mono" x="265" y="73" font-size="11" text-anchor="middle">A</text>
  <rect class="h1-lane" x="298" y="58" width="62" height="20"/>
  <text class="h1-mono" x="329" y="73" font-size="11" text-anchor="middle">C</text>
  <rect class="h1-lane" x="362" y="58" width="62" height="20"/>
  <text class="h1-mono" x="393" y="73" font-size="11" text-anchor="middle">C</text>

  <text class="h1-mono" x="158" y="101" font-size="10" text-anchor="end" style="fill:#6E675A">c2</text>
  <rect class="h1-lane" x="170" y="86" width="62" height="20"/>
  <text class="h1-mono" x="201" y="101" font-size="11" text-anchor="middle">B</text>
  <rect class="h1-lane" x="234" y="86" width="62" height="20"/>
  <text class="h1-mono" x="265" y="101" font-size="11" text-anchor="middle">B</text>
  <rect class="h1-lane" x="298" y="86" width="62" height="20"/>
  <text class="h1-mono" x="329" y="101" font-size="11" text-anchor="middle">D</text>
  <rect class="h1-lane" x="362" y="86" width="62" height="20"/>
  <text class="h1-mono" x="393" y="101" font-size="11" text-anchor="middle">D</text>

  <text class="h1-mono" x="158" y="129" font-size="10" text-anchor="end" style="fill:#6E675A">c3</text>
  <rect class="h1-lane" x="170" y="114" width="62" height="20"/>
  <text class="h1-mono" x="201" y="129" font-size="11" text-anchor="middle">E</text>
  <rect class="h1-lane" x="234" y="114" width="62" height="20"/>
  <text class="h1-mono" x="265" y="129" font-size="11" text-anchor="middle">F</text>
  <text class="h1-small" x="306" y="129" font-size="10">……排队</text>

  <text class="h1-small" x="446" y="88" font-size="10.5">每条车道一次一辆</text>
  <text class="h1-small" x="446" y="104" font-size="10.5">→ 排队 · 绕路（域名分片再开 6 条）</text>

  <line x1="40" y1="152" x2="720" y2="152" stroke="#CDC4AF" stroke-width="1"/>

  <!-- ② HTTP/2 -->
  <text class="h1-serif" x="40" y="180" font-size="13" font-weight="700">② HTTP/2 —— 1 条连接，帧交错</text>
  <text class="h1-mono" x="158" y="220" font-size="10" text-anchor="end" style="fill:#6E675A">1 条</text>

  <rect class="h1-a" x="170" y="204" width="58" height="32"/>
  <text class="h1-mono" x="199" y="225" font-size="11" text-anchor="middle">A</text>
  <rect class="h1-b" x="228" y="204" width="58" height="32"/>
  <text class="h1-mono" x="257" y="225" font-size="11" text-anchor="middle">B</text>
  <rect class="h1-a" x="286" y="204" width="58" height="32"/>
  <text class="h1-mono" x="315" y="225" font-size="11" text-anchor="middle">A</text>
  <rect class="h1-lane" x="344" y="204" width="58" height="32"/>
  <text class="h1-mono" x="373" y="225" font-size="11" text-anchor="middle">C</text>
  <rect class="h1-b" x="402" y="204" width="58" height="32"/>
  <text class="h1-mono" x="431" y="225" font-size="11" text-anchor="middle">B</text>
  <rect class="h1-a" x="460" y="204" width="58" height="32"/>
  <text class="h1-mono" x="489" y="225" font-size="11" text-anchor="middle">A</text>
  <rect class="h1-lane" x="518" y="204" width="58" height="32"/>
  <text class="h1-mono" x="547" y="225" font-size="11" text-anchor="middle">C</text>
  <rect class="h1-b" x="576" y="204" width="58" height="32"/>
  <text class="h1-mono" x="605" y="225" font-size="11" text-anchor="middle">B</text>

  <text class="h1-small" x="170" y="258" font-size="10.5">帧头标明「属于哪个流」→ 接收端按流 ID 重组 → 应用层没有排队</text>

  <line x1="40" y1="278" x2="720" y2="278" stroke="#CDC4AF" stroke-width="1"/>

  <!-- ③ 丢包 -->
  <text class="h1-serif" x="40" y="306" font-size="13" font-weight="700" style="fill:#B03A2E">③ HTTP/2 + 丢一个 TCP 包 —— 阻塞下移到传输层</text>
  <text class="h1-mono" x="158" y="346" font-size="10" text-anchor="end" style="fill:#6E675A">1 条</text>

  <rect class="h1-a" x="170" y="330" width="58" height="32"/>
  <text class="h1-mono" x="199" y="351" font-size="11" text-anchor="middle">A</text>
  <rect class="h1-b" x="228" y="330" width="58" height="32"/>
  <text class="h1-mono" x="257" y="351" font-size="11" text-anchor="middle">B</text>
  <rect class="h1-a" x="286" y="330" width="58" height="32"/>
  <text class="h1-mono" x="315" y="351" font-size="11" text-anchor="middle">A</text>

  <rect x="344" y="330" width="290" height="32" fill="url(#h1-hatch)" stroke="#B03A2E" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text class="h1-mono" x="489" y="351" font-size="10.5" text-anchor="middle" style="fill:#B03A2E">全部流一起等这一个包重传</text>

  <text class="h1-small" x="170" y="382" font-size="10.5" style="fill:#B03A2E">TCP 是字节流，丢包后的数据必须按序交付——后面的帧即使完好也只能干等</text>

</svg>
