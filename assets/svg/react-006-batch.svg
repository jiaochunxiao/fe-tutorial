<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 248" width="100%" role="img" aria-labelledby="r6bt r6bd">
  <title id="r6bt">多次 setState 攒进队列，同步代码结束后合并成一次渲染</title>
  <desc id="r6bd">一个事件里连着调三次 setState，它们各自同步地把更新排进更新队列，然后什么都不发生；等到同步代码跑完，React 才一次性 flush，只做一次 render 加 commit。所以「异步」的其实是渲染，setState 本身是同步的入队操作。React 17 只在合成事件回调里合并，setTimeout、Promise、原生事件里的调用会各自触发渲染；React 18 的自动批处理任何上下文都合并，需要立刻生效时用 flushSync 强制冲刷。</desc>

  <style>
    .r6b-c{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .r6b-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .r6b-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .r6b-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .r6b-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="r6b-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="r6b-t" x="40" y="26" font-size="8.5">三次调用，一次渲染 —— 中间隔着的就是「同步代码跑完」</text>

  <rect class="r6b-c" x="40" y="48" width="120" height="24" rx="2"/>
  <text class="r6b-mono" x="100" y="64" font-size="7.5" text-anchor="middle">setCount(1)</text>
  <rect class="r6b-c" x="40" y="84" width="120" height="24" rx="2"/>
  <text class="r6b-mono" x="100" y="100" font-size="7.5" text-anchor="middle">setFlag(true)</text>
  <rect class="r6b-c" x="40" y="120" width="120" height="24" rx="2"/>
  <text class="r6b-mono" x="100" y="136" font-size="7.5" text-anchor="middle">setX('a')</text>

  <line x1="160" y1="60" x2="196" y2="60" stroke="#1C1A17" stroke-width="1" marker-end="url(#r6b-ink)"/>
  <line x1="160" y1="96" x2="196" y2="96" stroke="#1C1A17" stroke-width="1" marker-end="url(#r6b-ink)"/>
  <line x1="160" y1="132" x2="196" y2="132" stroke="#1C1A17" stroke-width="1" marker-end="url(#r6b-ink)"/>
  <line x1="200" y1="60" x2="200" y2="132" stroke="#1C1A17" stroke-width="1"/>

  <line x1="200" y1="96" x2="226" y2="96" stroke="#1C1A17" stroke-width="1" marker-end="url(#r6b-ink)"/>

  <rect class="r6b-q" x="230" y="56" width="160" height="80" rx="2"/>
  <text class="r6b-t" x="310" y="92" font-size="8.5" text-anchor="middle">更新队列</text>
  <text class="r6b-s" x="310" y="108" font-size="7" text-anchor="middle">函数式更新在队列内链式叠加</text>

  <text class="r6b-s" x="418" y="88" font-size="7" text-anchor="middle">同步代码结束</text>
  <line x1="390" y1="96" x2="446" y2="96" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#r6b-ink)"/>

  <rect class="r6b-q" x="450" y="56" width="250" height="80" rx="2"/>
  <text class="r6b-t" x="575" y="92" font-size="8.5" text-anchor="middle">批量 flush</text>
  <text class="r6b-s" x="575" y="108" font-size="7" text-anchor="middle">一次 render + 一次 commit</text>

  <line x1="40" y1="150" x2="700" y2="150" stroke="#CDC4AF" stroke-width="1"/>

  <rect class="r6b-c" x="40" y="162" width="90" height="24" rx="2"/>
  <text class="r6b-t" x="85" y="178" font-size="7.5" text-anchor="middle">React 17</text>
  <text class="r6b-s" x="146" y="178" font-size="7.5">只在合成事件内合并；setTimeout / Promise / 原生事件各自渲染</text>

  <rect class="r6b-c" x="40" y="196" width="90" height="24" rx="2"/>
  <text class="r6b-t" x="85" y="212" font-size="7.5" text-anchor="middle">React 18</text>
  <text class="r6b-s" x="146" y="212" font-size="7.5">任何上下文都合并；需要立刻生效就用 flushSync 冲刷</text>

  <text class="r6b-t" x="40" y="242" font-size="8.5" style="fill:#B03A2E">「异步」的是渲染，不是 setState —— 它同步入队，只是不马上画。</text>
</svg>
