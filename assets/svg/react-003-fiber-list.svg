<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 238" width="100%" role="img" aria-labelledby="r3lt r3ld">
  <title id="r3lt">递归栈与 Fiber 三指针的差别</title>
  <desc id="r3ld">React 15 用递归渲染，父子关系靠调用栈维系，「现在走到哪」这个进度存在栈帧里，想暂停根本拿不出来，所以没法中断。React 16 换成链表，每个 Fiber 节点自己带着三个指针：child 指向第一个子节点、sibling 指向下一个兄弟、return 指向父节点。有了这三个指针，遍历整棵树不需要递归，一个 while 循环按深度优先走：进 child、没有 child 就走 sibling、没有 sibling 就回 return，每一步的下一站都写在节点上，所以循环随时可以 break，记住当前节点下次从它继续。</desc>

  <style>
    .r3l-f{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .r3l-n{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .r3l-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .r3l-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .r3l-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="r3l-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="r3l-t" x="40" y="26" font-size="8.5">能不能暂停，取决于「进度」存在哪里</text>

  <text class="r3l-t" x="50" y="48" font-size="8.5">React 15 · 递归</text>
  <rect class="r3l-f" x="50" y="58" width="190" height="30" rx="1"/>
  <text class="r3l-mono" x="145" y="77" font-size="8" text-anchor="middle">App</text>
  <rect class="r3l-f" x="50" y="92" width="190" height="30" rx="1"/>
  <text class="r3l-mono" x="145" y="111" font-size="8" text-anchor="middle">Page</text>
  <rect class="r3l-f" x="50" y="126" width="190" height="30" rx="1"/>
  <text class="r3l-mono" x="145" y="145" font-size="8" text-anchor="middle">Header</text>
  <text class="r3l-s" x="50" y="176" font-size="7.5">栈帧里存着「现在走到哪」</text>
  <text class="r3l-t" x="50" y="194" font-size="8" style="fill:#B03A2E">想暂停？栈帧拿不出来 ✕</text>

  <line x1="360" y1="46" x2="360" y2="200" stroke="#CDC4AF" stroke-width="1"/>

  <text class="r3l-t" x="380" y="48" font-size="8.5">React 16+ · 链表</text>
  <rect class="r3l-n" x="380" y="58" width="110" height="96" rx="2"/>
  <text class="r3l-mono" x="392" y="79" font-size="7.5">child</text>
  <text class="r3l-mono" x="392" y="109" font-size="7.5">sibling</text>
  <text class="r3l-mono" x="392" y="139" font-size="7.5">return</text>

  <line x1="490" y1="76" x2="506" y2="76" stroke="#1C1A17" stroke-width="1" marker-end="url(#r3l-ink)"/>
  <line x1="490" y1="106" x2="506" y2="106" stroke="#1C1A17" stroke-width="1" marker-end="url(#r3l-ink)"/>
  <line x1="490" y1="136" x2="506" y2="136" stroke="#1C1A17" stroke-width="1" marker-end="url(#r3l-ink)"/>
  <text class="r3l-s" x="514" y="79" font-size="8">第一个子节点</text>
  <text class="r3l-s" x="514" y="109" font-size="8">下一个兄弟</text>
  <text class="r3l-s" x="514" y="139" font-size="8">父节点</text>

  <text class="r3l-s" x="380" y="176" font-size="7.5">三个指针写在节点自己身上</text>
  <text class="r3l-t" x="380" y="194" font-size="8" style="fill:#B03A2E">while 循环里随时可以 break ✓</text>

  <text class="r3l-t" x="40" y="226" font-size="8.5">遍历不再需要递归：进 child、无 child 走 sibling、无 sibling 回 return —— 记住当前节点，下次从它继续。</text>
</svg>
