<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" width="100%" role="img" aria-labelledby="e8ct e8cd">
  <title id="e8ct">内容哈希缓存闭环：为什么 HTML 不缓存、资源缓存一年</title>
  <desc id="e8cd">HTML 设成 no-cache，每次访问都协商一次，拿到的永远是最新的「引用表」。表里引用的 app.9f2c.js 因为内容没变，强缓存直接命中。发版之后新 HTML 引用的是 app.77aa.js，哈希变了 URL 就变了，所以天然是一个新请求，一定会拉新的。而旧的 app.9f2c.js 对还开着的老标签页依然有效——老页面引用的就是它。</desc>

  <style>
    .e8c-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.3}
    .e8c-alt{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.3}
    .e8c-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .e8c-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .e8c-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="e8c-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="e8c-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="e8c-s" x="40" y="42" font-size="8.5">再次访问</text>
  <rect class="e8c-box" x="120" y="24" width="140" height="36" rx="3"/>
  <text class="e8c-mono" x="190" y="40" font-size="8" text-anchor="middle">HTML</text>
  <text class="e8c-s" x="190" y="53" font-size="7.5" text-anchor="middle">no-cache</text>
  <line x1="260" y1="42" x2="306" y2="42" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#e8c-ink)"/>
  <text class="e8c-s" x="283" y="36" font-size="7.5" text-anchor="middle">协商</text>

  <rect class="e8c-box" x="310" y="24" width="180" height="36" rx="3"/>
  <text class="e8c-mono" x="400" y="40" font-size="8" text-anchor="middle">新 HTML</text>
  <text class="e8c-s" x="400" y="53" font-size="7.5" text-anchor="middle">引用 app.9f2c.js</text>
  <line x1="490" y1="42" x2="536" y2="42" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#e8c-ink)"/>
  <text class="e8c-s" x="513" y="36" font-size="7.5" text-anchor="middle">引用</text>

  <rect class="e8c-alt" x="540" y="24" width="160" height="36" rx="3"/>
  <text class="e8c-mono" x="620" y="40" font-size="8" text-anchor="middle">app.9f2c.js</text>
  <text class="e8c-s" x="620" y="53" font-size="7.5" text-anchor="middle" style="fill:#B03A2E">强缓存命中，直接用</text>

  <line x1="40" y1="88" x2="700" y2="88" stroke="#CDC4AF" stroke-width="1"/>

  <text class="e8c-s" x="40" y="120" font-size="8.5">发版之后</text>
  <rect class="e8c-box" x="120" y="102" width="180" height="36" rx="3"/>
  <text class="e8c-mono" x="210" y="118" font-size="8" text-anchor="middle">新 HTML</text>
  <text class="e8c-s" x="210" y="131" font-size="7.5" text-anchor="middle">引用 app.77aa.js</text>
  <line x1="300" y1="120" x2="346" y2="120" stroke="#B03A2E" stroke-width="1.5" marker-end="url(#e8c-red)"/>
  <text class="e8c-s" x="323" y="114" font-size="7.5" text-anchor="middle" style="fill:#B03A2E">新哈希</text>

  <rect class="e8c-alt" x="350" y="102" width="160" height="36" rx="3"/>
  <text class="e8c-mono" x="430" y="118" font-size="8" text-anchor="middle">app.77aa.js</text>
  <text class="e8c-s" x="430" y="131" font-size="7.5" text-anchor="middle">URL 变了，缓存里没有</text>
  <text class="e8c-t" x="528" y="124" font-size="8" style="fill:#B03A2E">→ 天然新请求，一定拉新的</text>

  <line x1="40" y1="166" x2="700" y2="166" stroke="#CDC4AF" stroke-width="1"/>

  <text class="e8c-s" x="40" y="198" font-size="8.5">老标签页</text>
  <rect class="e8c-box" x="120" y="180" width="180" height="36" rx="3"/>
  <text class="e8c-mono" x="210" y="196" font-size="8" text-anchor="middle">旧 HTML（已加载）</text>
  <text class="e8c-s" x="210" y="209" font-size="7.5" text-anchor="middle">内存里就是它</text>
  <line x1="300" y1="198" x2="346" y2="198" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#e8c-ink)"/>
  <rect class="e8c-box" x="350" y="180" width="160" height="36" rx="3"/>
  <text class="e8c-mono" x="430" y="196" font-size="8" text-anchor="middle">app.9f2c.js</text>
  <text class="e8c-s" x="430" y="209" font-size="7.5" text-anchor="middle">旧产物还在，照常可用</text>

  <text class="e8c-s" x="40" y="246" font-size="8.5">哈希变了 URL 就变了 —— 这就是强缓存敢设一年的唯一理由：文件永不覆盖，只新增。</text>
  <text class="e8c-s" x="40" y="266" font-size="8.5">代价是旧产物会堆积，清理策略要留足余量，否则回滚时无旧可回。</text>
  <text class="e8c-t" x="40" y="290" font-size="8.5" style="fill:#B03A2E">一句话：可变的东西不缓存，缓存的东西不可变。</text>
</svg>
