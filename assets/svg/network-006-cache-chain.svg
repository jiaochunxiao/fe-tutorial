<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 286" width="100%" role="img" aria-labelledby="n6ct n6cd">
  <title id="n6ct">浏览器缓存的两级与一次协商</title>
  <desc id="n6cd">请求发出后先看内存缓存，那里是进程内的副本，脚本和图片常常秒取；再看磁盘缓存，这是强缓存的常驻形态，max-age 没过就直接用，一个字节的请求都不发。只有当强缓存过期或者设了 no-cache，才真的发 HTTP 请求，并带上 If-None-Match 或 If-Modified-Since。服务器比对后如果没变就回 304，浏览器复用本地副本，只省了 body；变了就回 200 加新资源，按新响应头重新入库。</desc>

  <style>
    .n6c-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.3}
    .n6c-hit{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.3}
    .n6c-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .n6c-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .n6c-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="n6c-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="n6c-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <rect class="n6c-box" x="270" y="14" width="200" height="30" rx="3"/>
  <text class="n6c-t" x="370" y="34" font-size="9" text-anchor="middle">发起请求</text>
  <line x1="370" y1="44" x2="370" y2="58" stroke="#1C1A17" stroke-width="1.4"/>
  <line x1="165" y1="58" x2="395" y2="58" stroke="#1C1A17" stroke-width="1.4"/>
  <line x1="165" y1="58" x2="165" y2="72" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#n6c-ink)"/>
  <line x1="395" y1="58" x2="395" y2="72" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#n6c-ink)"/>

  <rect class="n6c-hit" x="60" y="76" width="210" height="42" rx="3"/>
  <text class="n6c-t" x="165" y="94" font-size="8.5" text-anchor="middle">内存缓存</text>
  <text class="n6c-s" x="165" y="108" font-size="7.5" text-anchor="middle">会话级，脚本/图片秒取</text>

  <rect class="n6c-hit" x="290" y="76" width="210" height="42" rx="3"/>
  <text class="n6c-t" x="395" y="94" font-size="8.5" text-anchor="middle">磁盘缓存</text>
  <text class="n6c-s" x="395" y="108" font-size="7.5" text-anchor="middle">max-age 未过 → 直接用</text>

  <text class="n6c-t" x="520" y="98" font-size="8" style="fill:#B03A2E">命中就一个字节都不发</text>

  <path d="M165 118 V136 H370" fill="none" stroke="#1C1A17" stroke-width="1.4"/>
  <path d="M395 118 V136 H370" fill="none" stroke="#1C1A17" stroke-width="1.4"/>
  <line x1="370" y1="136" x2="370" y2="146" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#n6c-ink)"/>
  <text class="n6c-s" x="404" y="132" font-size="7.5">过期 / no-cache 才往下走</text>

  <rect class="n6c-box" x="170" y="150" width="400" height="36" rx="3"/>
  <text class="n6c-t" x="184" y="172" font-size="8.5">发起 HTTP 请求</text>
  <text class="n6c-mono" x="290" y="172" font-size="7.5">If-None-Match / If-Modified-Since</text>

  <path d="M250 186 V208 H190 V218" fill="none" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#n6c-ink)"/>
  <path d="M490 186 V208 H550 V218" fill="none" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#n6c-ink)"/>

  <rect class="n6c-box" x="60" y="222" width="260" height="38" rx="3"/>
  <text class="n6c-t" x="74" y="240" font-size="8.5">304 Not Modified</text>
  <text class="n6c-s" x="74" y="254" font-size="7.5">复用本地副本 —— 只省了 body</text>

  <rect class="n6c-box" x="420" y="222" width="260" height="38" rx="3"/>
  <text class="n6c-t" x="434" y="240" font-size="8.5">200 + 新资源</text>
  <text class="n6c-s" x="434" y="254" font-size="7.5">按新响应头重新入库</text>

  <text class="n6c-s" x="40" y="280" font-size="8.5">强缓存省的是「整个请求」，协商缓存省的是「响应体」—— 304 依然要走一趟网络。</text>
</svg>
