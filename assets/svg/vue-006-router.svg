<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 48 740 200" width="100%" role="img" aria-labelledby="vr6t vr6d">
  <title id="vr6t">hash 与 history 两种路由：谁会让浏览器真的发出请求</title>
  <desc id="vr6d">hash 模式改的是井号后面的内容，只触发 hashchange，永远不出网，刷新也安全。history 模式用 pushState 改地址栏但不发请求、也不触发事件，所以要手动 render；前进后退由 popstate 驱动。唯一的坑是刷新或直接访问深链接，浏览器会真的请求那个路径，服务器必须把未命中的路径回退到 index.html。</desc>

  <style>
    .vr6-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.3}
    .vr6-bad{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.3}
    .vr6-tag{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1}
    .vr6-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .vr6-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .vr6-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="vr6-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="vr6-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <rect class="vr6-tag" x="40" y="71" width="56" height="22" rx="2"/>
  <text class="vr6-mono" x="68" y="86" font-size="8.5" text-anchor="middle">hash</text>

  <rect class="vr6-box" x="104" y="64" width="130" height="36" rx="3"/>
  <text class="vr6-mono" x="169" y="87" font-size="8.5" text-anchor="middle">改 location.hash</text>
  <line x1="238" y1="82" x2="262" y2="82" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#vr6-ink)"/>
  <rect class="vr6-box" x="266" y="64" width="120" height="36" rx="3"/>
  <text class="vr6-mono" x="326" y="87" font-size="8.5" text-anchor="middle">hashchange</text>
  <line x1="390" y1="82" x2="414" y2="82" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#vr6-ink)"/>
  <rect class="vr6-box" x="418" y="64" width="90" height="36" rx="3"/>
  <text class="vr6-mono" x="463" y="87" font-size="8.5" text-anchor="middle">render</text>
  <text class="vr6-s" x="522" y="86" font-size="9"># 之后不出网，刷新也安全</text>

  <rect class="vr6-tag" x="40" y="123" width="56" height="22" rx="2"/>
  <text class="vr6-mono" x="68" y="138" font-size="8" text-anchor="middle">history</text>

  <rect class="vr6-box" x="104" y="116" width="130" height="36" rx="3"/>
  <text class="vr6-mono" x="169" y="139" font-size="8.5" text-anchor="middle">pushState</text>
  <line x1="238" y1="134" x2="262" y2="134" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#vr6-ink)"/>
  <rect class="vr6-box" x="266" y="116" width="120" height="36" rx="3"/>
  <text class="vr6-mono" x="326" y="139" font-size="8.5" text-anchor="middle">render</text>
  <text class="vr6-s" x="400" y="138" font-size="9">不发请求也不发事件 —— 前进后退才走 popstate</text>

  <rect class="vr6-tag" x="40" y="175" width="56" height="22" rx="2"/>
  <text class="vr6-mono" x="68" y="190" font-size="8" text-anchor="middle">history</text>

  <rect class="vr6-box" x="104" y="168" width="130" height="36" rx="3"/>
  <text class="vr6-t" x="169" y="191" font-size="9" text-anchor="middle">刷新 / 直链</text>
  <line x1="238" y1="186" x2="262" y2="186" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#vr6-red)"/>
  <rect class="vr6-box" x="266" y="168" width="120" height="36" rx="3"/>
  <text class="vr6-t" x="326" y="191" font-size="9" text-anchor="middle">真实请求</text>
  <line x1="390" y1="186" x2="414" y2="186" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#vr6-red)"/>
  <rect class="vr6-bad" x="418" y="168" width="90" height="36" rx="3"/>
  <text class="vr6-mono" x="463" y="191" font-size="9" text-anchor="middle" style="fill:#B03A2E">404</text>
  <line x1="512" y1="186" x2="536" y2="186" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#vr6-ink)"/>
  <rect class="vr6-box" x="540" y="168" width="130" height="36" rx="3"/>
  <text class="vr6-mono" x="605" y="191" font-size="8.5" text-anchor="middle">try_files 兜底</text>

  <text class="vr6-s" x="40" y="228" font-size="9.5">hash 零配置；history 的 URL 干净但要服务器兜底 —— 选型就看这一条</text>
</svg>
