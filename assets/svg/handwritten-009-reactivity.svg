<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 740 322" width="100%" role="img" aria-labelledby="mv9t mv9d">
  <title id="mv9t">响应式的双向账本：track 记账与 trigger 查账</title>
  <desc id="mv9d">渲染 effect 执行时读到的每个属性都被 get 拦截，交给 track 把当前 effect 写进 targetMap 这本账；写入属性时 set 拦截交给 trigger，按 target 和 key 从账本里查出依赖它的 effect 重跑，产生新 vnode 再 patch 到 DOM。</desc>

  <style>
    .mv9-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .mv9-key{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.6}
    .mv9-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .mv9-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .mv9-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="mv9-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <rect class="mv9-box" x="170" y="36" width="400" height="52" rx="3"/>
  <text class="mv9-t" x="188" y="58" font-size="11.5">渲染 effect</text>
  <text class="mv9-s" x="188" y="76" font-size="10">render() 里读到的每个属性，都会被记上一笔</text>

  <line x1="250" y1="88" x2="250" y2="132" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#mv9-ink)"/>
  <text class="mv9-s" x="240" y="118" font-size="9" text-anchor="end">get 拦截</text>

  <line x1="490" y1="88" x2="490" y2="132" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#mv9-ink)"/>
  <text class="mv9-s" x="500" y="118" font-size="9">set 拦截</text>

  <rect class="mv9-box" x="170" y="136" width="160" height="44" rx="3"/>
  <text class="mv9-mono" x="250" y="163" font-size="10" text-anchor="middle">track(target, key)</text>

  <rect class="mv9-box" x="410" y="136" width="160" height="44" rx="3"/>
  <text class="mv9-mono" x="490" y="163" font-size="10" text-anchor="middle">trigger(target, key)</text>

  <line x1="250" y1="180" x2="250" y2="204" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#mv9-ink)"/>
  <text class="mv9-s" x="240" y="198" font-size="9" text-anchor="end">写进账本</text>

  <line x1="490" y1="180" x2="490" y2="204" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#mv9-ink)"/>
  <text class="mv9-s" x="500" y="198" font-size="9">按 target + key 查</text>

  <rect class="mv9-key" x="120" y="208" width="500" height="54" rx="3"/>
  <text class="mv9-mono" x="138" y="230" font-size="10.5">targetMap : WeakMap → Map → Set</text>
  <text class="mv9-mono" x="138" y="250" font-size="9.5" style="fill:#6E675A">{ target: { count: Set&lt;effect&gt; } }</text>

  <line x1="370" y1="262" x2="370" y2="290" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#mv9-ink)"/>
  <text class="mv9-s" x="382" y="284" font-size="9">把 Set 里的 effect 取出来重跑</text>

  <rect class="mv9-box" x="190" y="294" width="360" height="44" rx="3"/>
  <text class="mv9-t" x="370" y="321" font-size="10.5" text-anchor="middle">新 vnode → patch → DOM 更新</text>

</svg>
