<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 244" width="100%" role="img" aria-labelledby="r1t r1d">
  <title id="r1t">可达性分析：从根走得到的才活着</title>
  <desc id="r1d">上排是一条从根出发的引用链：根指向 objA，objA 指向 objB，objB 指向 objC，沿途每个对象都活着。下排 objX 与 objY 互相引用，但从根没有任何一条路径能走到它们，整片都是垃圾。</desc>

  <style>
    .r1-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.6}
    .r1-root{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.6}
    .r1-dead{fill:#E7DEC8;stroke:#CDC4AF;stroke-width:1.4}
    .r1-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .r1-serif{font-family:'Noto Serif SC','Songti SC','SimSun',serif;fill:#1C1A17}
    .r1-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="r1-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="r1-mut" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6E675A"/>
    </marker>
  </defs>

  <text class="r1-small" x="52" y="68" font-size="10.5" text-anchor="end">活</text>
  <text class="r1-small" x="52" y="168" font-size="10.5" text-anchor="end">垃圾</text>

  <rect class="r1-root" x="64" y="40" width="118" height="46" rx="3"/>
  <text class="r1-serif" x="123" y="62" font-size="12.5" font-weight="700" text-anchor="middle">根</text>
  <text class="r1-small" x="123" y="77" font-size="9.5" text-anchor="middle">全局 · 栈 · 闭包</text>

  <line x1="184" y1="63" x2="214" y2="63" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#r1-ink)"/>
  <rect class="r1-box" x="220" y="40" width="96" height="46" rx="3"/>
  <text class="r1-mono" x="268" y="68" font-size="12" text-anchor="middle">objA</text>

  <line x1="318" y1="63" x2="348" y2="63" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#r1-ink)"/>
  <rect class="r1-box" x="354" y="40" width="96" height="46" rx="3"/>
  <text class="r1-mono" x="402" y="68" font-size="12" text-anchor="middle">objB</text>

  <line x1="452" y1="63" x2="482" y2="63" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#r1-ink)"/>
  <rect class="r1-box" x="488" y="40" width="96" height="46" rx="3"/>
  <text class="r1-mono" x="536" y="68" font-size="12" text-anchor="middle">objC</text>

  <rect class="r1-dead" x="220" y="140" width="96" height="46" rx="3"/>
  <text class="r1-mono" x="268" y="168" font-size="12" text-anchor="middle" style="fill:#6E675A">objX</text>

  <line x1="318" y1="152" x2="348" y2="152" stroke="#6E675A" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#r1-mut)"/>
  <line x1="348" y1="174" x2="318" y2="174" stroke="#6E675A" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#r1-mut)"/>
  <rect class="r1-dead" x="354" y="140" width="96" height="46" rx="3"/>
  <text class="r1-mono" x="402" y="168" font-size="12" text-anchor="middle" style="fill:#6E675A">objY</text>

  <text class="r1-small" x="470" y="162" font-size="11" style="fill:#B03A2E">没有一条路从根通到这里</text>
  <text class="r1-small" x="470" y="178" font-size="9.5">互相指着也没用，整片回收</text>

  <text class="r1-small" x="40" y="224" font-size="10.5">判定只看一件事：能不能从根沿着引用走到它 —— 走得到是活，走不到就是垃圾，哪怕它正被别的垃圾指着。</text>

</svg>
