<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 26 740 196" width="100%" role="img" aria-labelledby="rd7mt rd7md">
  <title id="rd7mt">Redux 中间件的洋葱结构</title>
  <desc id="rd7md">dispatch 从最外层进入，依次穿过 logger、thunk，最后落到原生 dispatch。每一层都能在 next 之前做一件事、在 next 之后再做一件事，所以像洋葱一样把核心包在中间。最内层才是真正改 state 并通知订阅者的地方。</desc>

  <style>
    .rd7m-ring{fill:none;stroke:#1C1A17;stroke-width:1.4}
    .rd7m-core{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.6}
    .rd7m-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .rd7m-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .rd7m-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="rd7m-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <rect class="rd7m-ring" x="70" y="40" width="560" height="170" rx="8"/>
  <text class="rd7m-mono" x="86" y="62" font-size="10">logger</text>
  <text class="rd7m-s" x="614" y="62" font-size="9" text-anchor="end">next 之前打一条</text>
  <text class="rd7m-s" x="614" y="198" font-size="9" text-anchor="end">next 之后再打一条</text>

  <rect class="rd7m-ring" x="130" y="72" width="440" height="106" rx="6"/>
  <text class="rd7m-mono" x="146" y="94" font-size="10">thunk</text>
  <text class="rd7m-s" x="554" y="94" font-size="9" text-anchor="end">函数 action 就执行它，否则 next</text>

  <rect class="rd7m-core" x="230" y="102" width="240" height="48" rx="3"/>
  <text class="rd7m-t" x="350" y="131" font-size="11.5" text-anchor="middle">原生 dispatch</text>

  <line x1="30" y1="126" x2="226" y2="126" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#rd7m-ink)"/>
  <text class="rd7m-mono" x="28" y="116" font-size="8.5">dispatch</text>

  <line x1="474" y1="126" x2="656" y2="126" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#rd7m-ink)"/>
  <text class="rd7m-mono" x="668" y="130" font-size="9">store</text>

</svg>
