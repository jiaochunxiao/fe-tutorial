<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 236" width="100%" role="img" aria-labelledby="g6t g6d">
  <title id="g6t">生成器的一次 next 与暂停恢复</title>
  <desc id="g6d">调用 next 时生成器从暂停处恢复执行，一直跑到下一个 yield 就冻结现场，把 yield 后面的表达式值装进 {value, done: false} 送出去。下一次 next 传入的参数会成为那个 yield 表达式的值，继续往下跑。跑到 return 或函数结束，返回 {value, done: true}。</desc>

  <style>
    .g6-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .g6-key{fill:#FBF7EE;stroke:#B03A2E;stroke-width:1.6}
    .g6-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .g6-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="g6-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="g6-cin" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <rect class="g6-box" x="36" y="62" width="118" height="52" rx="3"/>
  <text class="g6-mono" x="95" y="94" font-size="11.5" text-anchor="middle">next(v)</text>
  <line x1="158" y1="88" x2="188" y2="88" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#g6-ink)"/>

  <rect class="g6-box" x="192" y="62" width="146" height="52" rx="3"/>
  <text class="g6-mono" x="265" y="94" font-size="11.5" text-anchor="middle">从暂停处恢复</text>
  <line x1="342" y1="88" x2="372" y2="88" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#g6-ink)"/>

  <rect class="g6-key" x="376" y="62" width="118" height="52" rx="3"/>
  <text class="g6-mono" x="435" y="94" font-size="11.5" text-anchor="middle">停在 yield</text>
  <line x1="498" y1="88" x2="528" y2="88" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#g6-ink)"/>

  <rect class="g6-box" x="532" y="62" width="168" height="52" rx="3"/>
  <text class="g6-mono" x="548" y="92" font-size="10.5">return / 跑完</text>

  <line x1="616" y1="114" x2="616" y2="146" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#g6-ink)"/>
  <rect class="g6-box" x="528" y="150" width="172" height="58" rx="3"/>
  <text class="g6-mono" x="546" y="175" font-size="10">{"value": 返回值,</text>
  <text class="g6-mono" x="546" y="193" font-size="10">"done": true}</text>

  <line x1="436" y1="114" x2="436" y2="146" stroke="#B03A2E" stroke-width="1.6" marker-end="url(#g6-cin)"/>
  <text class="g6-small" x="446" y="137" font-size="9" style="fill:#B03A2E">冻结现场</text>
  <rect class="g6-box" x="356" y="150" width="160" height="58" rx="3"/>
  <text class="g6-mono" x="374" y="175" font-size="10">{"value": X,</text>
  <text class="g6-mono" x="374" y="193" font-size="10">"done": false}</text>

  <path d="M356 179 H95 V120" fill="none" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#g6-ink)"/>
  <text class="g6-small" x="226" y="171" font-size="9.5" text-anchor="middle">再调 next(v2)：v2 成为 yield 表达式的值</text>

</svg>
