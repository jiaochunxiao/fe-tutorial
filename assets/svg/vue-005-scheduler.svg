<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 282" width="100%" role="img" aria-labelledby="v5st v5sd">
  <title id="v5st">调度器把 N 次变更攒成一次渲染，nextTick 排在最后</title>
  <desc id="v5sd">同步修改数据 N 次，每次只是触发 trigger，渲染 effect 不会立刻执行，而是进入队列并去重。等同步代码执行完、到了微任务时机，才一次性 flush 队列，每个组件只跑一次更新，DOM 批量更新完成。nextTick 的回调排在这一趟 flush 之后执行。所以一个同步块里改多少次数据，最优渲染次数都是 1，因为中间状态在同步代码结束前根本不可见。</desc>

  <style>
    .v5s-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .v5s-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .v5s-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .v5s-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="v5s-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="v5s-t" x="40" y="26" font-size="8.5">数据变了不等于立刻渲染 —— 中间隔着一次攒单</text>

  <rect class="v5s-b" x="100" y="48" width="340" height="34" rx="2"/>
  <text class="v5s-t" x="270" y="69" font-size="8.5" text-anchor="middle">同步修改数据 × N</text>
  <text class="v5s-s" x="470" y="69" font-size="7.5">同一轮事件循环里改几次都一样</text>

  <line x1="270" y1="82" x2="270" y2="102" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v5s-ink)"/>
  <text class="v5s-s" x="282" y="98" font-size="7">trigger 逐个触发</text>

  <rect class="v5s-q" x="100" y="106" width="340" height="34" rx="2"/>
  <text class="v5s-t" x="270" y="127" font-size="8.5" text-anchor="middle">渲染 effect 入队并去重</text>
  <text class="v5s-s" x="470" y="127" font-size="7.5">队列去重，同一组件只留一个</text>

  <line x1="270" y1="140" x2="270" y2="160" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v5s-ink)"/>
  <text class="v5s-s" x="282" y="156" font-size="7">同步代码结束 · 微任务时机</text>

  <rect class="v5s-b" x="100" y="164" width="340" height="34" rx="2"/>
  <text class="v5s-t" x="270" y="185" font-size="8.5" text-anchor="middle">flush 队列：每个组件只跑一次</text>
  <text class="v5s-s" x="470" y="185" font-size="7.5">最优渲染次数 = 1</text>

  <line x1="270" y1="198" x2="270" y2="218" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v5s-ink)"/>
  <text class="v5s-s" x="282" y="214" font-size="7">render → diff → patch</text>

  <rect class="v5s-b" x="100" y="222" width="340" height="34" rx="2"/>
  <text class="v5s-t" x="270" y="243" font-size="8.5" text-anchor="middle">DOM 批量更新完成 → nextTick 回调</text>
  <text class="v5s-s" x="470" y="243" font-size="7.5">此刻读 DOM 才是新的</text>

  <text class="v5s-t" x="40" y="272" font-size="8.5" style="fill:#B03A2E">直觉是快递攒单：一个同步块里的变更合并成一单，一趟车送完 —— nextTick 是「这趟车发完通知我」。</text>
</svg>
