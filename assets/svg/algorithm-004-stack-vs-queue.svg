<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 18 740 218" width="100%" role="img" aria-labelledby="sq4t sq4d">
  <title id="sq4t">栈的后进先出与队列的先进先出</title>
  <desc id="sq4d">栈只有一个开口，push 和 pop 都发生在同一端，所以最后进去的最先出来。队列两端各管一头，从左边进、从右边出，所以先进去的先出来。</desc>

  <style>
    .sq4-wall{fill:none;stroke:#1C1A17;stroke-width:1.6}
    .sq4-item{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .sq4-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .sq4-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .sq4-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="sq4-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="sq4-t" x="80" y="30" font-size="11.5">栈 · LIFO</text>

  <path class="sq4-wall" d="M80 70 V200 H200 V70" style="fill:none"/>
  <rect class="sq4-item" x="84" y="164" width="112" height="32" rx="2"/>
  <text class="sq4-mono" x="140" y="185" font-size="10.5" text-anchor="middle">1</text>
  <rect class="sq4-item" x="84" y="128" width="112" height="32" rx="2"/>
  <text class="sq4-mono" x="140" y="149" font-size="10.5" text-anchor="middle">2</text>
  <rect class="sq4-item" x="84" y="92" width="112" height="32" rx="2"/>
  <text class="sq4-mono" x="140" y="113" font-size="10.5" text-anchor="middle">3</text>

  <line x1="126" y1="46" x2="126" y2="84" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#sq4-ink)"/>
  <text class="sq4-s" x="118" y="42" font-size="9" text-anchor="end">push</text>
  <line x1="154" y1="84" x2="154" y2="46" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#sq4-ink)"/>
  <text class="sq4-s" x="162" y="42" font-size="9">pop</text>

  <text class="sq4-s" x="206" y="106" font-size="9">栈顶</text>
  <text class="sq4-s" x="140" y="222" font-size="9.5" text-anchor="middle">只在一端进出，最近的先走</text>

  <line x1="310" y1="26" x2="310" y2="228" stroke="#CDC4AF" stroke-width="1" stroke-dasharray="4 5"/>

  <text class="sq4-t" x="420" y="30" font-size="11.5">队列 · FIFO</text>

  <path class="sq4-wall" d="M420 100 H640 M420 168 H640" style="fill:none"/>
  <rect class="sq4-item" x="430" y="104" width="60" height="60" rx="2"/>
  <text class="sq4-mono" x="460" y="139" font-size="10.5" text-anchor="middle">1</text>
  <rect class="sq4-item" x="500" y="104" width="60" height="60" rx="2"/>
  <text class="sq4-mono" x="530" y="139" font-size="10.5" text-anchor="middle">2</text>
  <rect class="sq4-item" x="570" y="104" width="60" height="60" rx="2"/>
  <text class="sq4-mono" x="600" y="139" font-size="10.5" text-anchor="middle">3</text>

  <line x1="378" y1="134" x2="416" y2="134" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#sq4-ink)"/>
  <text class="sq4-s" x="397" y="94" font-size="9" text-anchor="middle">enqueue</text>
  <line x1="644" y1="134" x2="682" y2="134" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#sq4-ink)"/>
  <text class="sq4-s" x="663" y="94" font-size="9" text-anchor="middle">dequeue</text>

  <text class="sq4-s" x="530" y="222" font-size="9.5" text-anchor="middle">一端进一端出，先来的先走</text>

</svg>
