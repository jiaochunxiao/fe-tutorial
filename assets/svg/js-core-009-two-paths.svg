<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 290" width="100%" role="img" aria-labelledby="e9t e9d">
  <title id="e9t">同步错误与异步错误的两条去向</title>
  <desc id="e9d">try 代码块里同步抛出的错误会进入 catch，之后无论走哪条路都要过 finally。而 setTimeout 或事件回调里抛出的错误发生时 try 已经结束、调用栈已经不在了，它从网眼漏过去，只能落到全局 error 事件或 unhandledrejection。</desc>

  <style>
    .e9-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .e9-key{fill:#FBF7EE;stroke:#B03A2E;stroke-width:1.5}
    .e9-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .e9-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .e9-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="e9-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="e9-mut" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6E675A"/>
    </marker>
  </defs>

  <rect class="e9-box" x="48" y="64" width="180" height="48" rx="3"/>
  <text class="e9-t" x="64" y="94" font-size="10.5">try 里的同步 throw</text>
  <line x1="232" y1="88" x2="268" y2="88" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#e9-ink)"/>
  <text class="e9-s" x="250" y="60" font-size="9" text-anchor="middle">同步才过</text>

  <rect class="e9-key" x="272" y="64" width="150" height="48" rx="3"/>
  <text class="e9-mono" x="347" y="93" font-size="11.5" text-anchor="middle">catch (e)</text>
  <line x1="426" y1="88" x2="462" y2="88" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#e9-ink)"/>

  <rect class="e9-box" x="466" y="64" width="150" height="48" rx="3"/>
  <text class="e9-mono" x="541" y="93" font-size="11.5" text-anchor="middle">finally</text>

  <rect class="e9-box" x="48" y="196" width="180" height="48" rx="3"/>
  <text class="e9-t" x="64" y="226" font-size="10.5">异步回调里的 throw</text>

  <line x1="232" y1="220" x2="462" y2="220" stroke="#6E675A" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#e9-mut)"/>
  <text class="e9-s" x="336" y="211" font-size="9" text-anchor="middle">栈已经不在了，从网眼漏过去</text>

  <rect class="e9-box" x="466" y="188" width="170" height="64" rx="3"/>
  <text class="e9-t" x="482" y="212" font-size="10.5">全局 error 事件</text>
  <text class="e9-mono" x="482" y="234" font-size="9.5" style="fill:#6E675A">unhandledrejection</text>

  <text class="e9-s" x="48" y="40" font-size="9.5" letter-spacing="1.2">一条路进 catch，另一条路直接到底</text>

</svg>
