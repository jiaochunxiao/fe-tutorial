<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" width="100%" role="img" aria-labelledby="bb4t bb4d">
  <title id="bb4t">四件套选型决策树</title>
  <desc id="bb4d">从顶部的唯一问题出发：这份数据要不要随每个请求发出去。答是，只有 Cookie 一个去处，因为它会随同域每个请求自动出现在请求头里，容量约 4KB，是会话凭证的专属位置，代价是每条请求都背着它跑。答否，再看容量与同步性：小且同步就是约 5MB 的字符串键值存储，其中永久保存且跨标签页共享、能借 storage 事件做广播的选 localStorage，标签页隔离、关页即焚的选 sessionStorage；大且需要异步的选 IndexedDB，数百 MB 以上、带事务与索引、可存对象与 Blob。底部一条铁律：Cookie 只放凭证，业务数据不要塞进去；另有两位新成员 Cache API 与 OPFS。</desc>

  <style>
    .bb4-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .bb4-c{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .bb4-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .bb4-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .bb4-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="bb4-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="bb4-t" x="40" y="24" font-size="8.5">一个问题定生死，两个维度分天下</text>

  <rect class="bb4-c" x="250" y="40" width="240" height="40" rx="2"/>
  <text class="bb4-t" x="370" y="64" font-size="9" text-anchor="middle">这份数据要不要随每个请求发出去？</text>

  <path d="M370 80 V95 H180 V106" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#bb4-ink)"/>
  <path d="M370 95 H560 V106" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#bb4-ink)"/>
  <text class="bb4-s" x="196" y="92" font-size="7.5">是</text>
  <text class="bb4-s" x="540" y="92" font-size="7.5" text-anchor="end">否</text>

  <rect class="bb4-b" x="60" y="110" width="240" height="40" rx="2"/>
  <text class="bb4-mono" x="72" y="126" font-size="8.5">Cookie</text>
  <text class="bb4-s" x="72" y="141" font-size="7.5">4KB · 会话凭证的专属位置</text>

  <rect class="bb4-b" x="440" y="110" width="240" height="40" rx="2"/>
  <text class="bb4-t" x="452" y="126" font-size="8.5">再看：多大？同步还是异步？</text>
  <text class="bb4-s" x="452" y="141" font-size="7.5">同域共享，不随请求走</text>

  <path d="M560 150 V165 H435 V176" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#bb4-ink)"/>
  <path d="M560 165 H635 V176" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#bb4-ink)"/>
  <text class="bb4-s" x="450" y="162" font-size="7.5">小 · 同步</text>
  <text class="bb4-s" x="642" y="162" font-size="7.5">大 · 异步</text>

  <rect class="bb4-b" x="350" y="180" width="170" height="40" rx="2"/>
  <text class="bb4-t" x="435" y="196" font-size="8.5" text-anchor="middle">~5MB 字符串 KV</text>
  <text class="bb4-s" x="435" y="211" font-size="7.5" text-anchor="middle">两个坑：阻塞 · 只存字符串</text>

  <rect class="bb4-b" x="560" y="180" width="150" height="40" rx="2"/>
  <text class="bb4-mono" x="635" y="196" font-size="8.5" text-anchor="middle">IndexedDB</text>
  <text class="bb4-s" x="635" y="211" font-size="7.5" text-anchor="middle">事务 · 索引 · Blob</text>

  <path d="M435 220 V235 H355 V246" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#bb4-ink)"/>
  <path d="M435 235 H515 V246" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#bb4-ink)"/>

  <rect class="bb4-b" x="280" y="250" width="150" height="40" rx="2"/>
  <text class="bb4-mono" x="355" y="266" font-size="8" text-anchor="middle">localStorage</text>
  <text class="bb4-s" x="355" y="281" font-size="7.5" text-anchor="middle">永久 · 跨标签页共享</text>

  <rect class="bb4-b" x="440" y="250" width="150" height="40" rx="2"/>
  <text class="bb4-mono" x="515" y="266" font-size="8" text-anchor="middle">sessionStorage</text>
  <text class="bb4-s" x="515" y="281" font-size="7.5" text-anchor="middle">标签页隔离 · 关页即焚</text>

  <text class="bb4-s" x="60" y="168" font-size="7.5" style="fill:#B03A2E">代价：每条请求都背着它跑</text>
  <text class="bb4-s" x="60" y="184" font-size="7.5">storage 事件 = 免费的跨页广播</text>
  <text class="bb4-s" x="60" y="200" font-size="7.5">新补：Cache API（SW）· OPFS（WASM）</text>

  <rect x="40" y="306" width="660" height="24" fill="#E7DEC8" opacity="0.55"/>
  <text class="bb4-s" x="52" y="322" font-size="7.5">铁律：Cookie 只放凭证，业务数据别塞进去 —— 敏感 token 也不该落在可被同页 JS 读到的存储里</text>
</svg>
