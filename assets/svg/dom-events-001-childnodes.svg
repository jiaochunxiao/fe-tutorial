<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 252" width="100%" role="img" aria-labelledby="dt1t dt1d">
  <title id="dt1t">childNodes 与 children 的差别：空白文本节点也算孩子</title>
  <desc id="dt1d">左边是一段 ul 包含两个 li 的 HTML 源码，源码里的换行和缩进本身也是节点。右上角是 ul.childNodes，一共五个节点：空白文本、li、空白文本、li、空白文本，所以 firstChild 拿到的是那格空白而不是第一个 li。右下角是 ul.children，只有两个节点，两个 li，因为 children 只取元素。这就是为什么取元素要用 children 而不是 childNodes。</desc>

  <style>
    .dt1-el{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .dt1-tx{fill:#E7DEC8;stroke:#CDC4AF;stroke-width:1}
    .dt1-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .dt1-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .dt1-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
    .dt1-code{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="dt1-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <rect x="40" y="64" width="230" height="96" rx="3" fill="#FBF7EE" stroke="#CDC4AF" stroke-width="1"/>
  <text class="dt1-code" x="56" y="86" font-size="9" xml:space="preserve">&lt;ul&gt;</text>
  <text class="dt1-code" x="56" y="106" font-size="9" xml:space="preserve">  &lt;li&gt;a&lt;/li&gt;</text>
  <text class="dt1-code" x="56" y="126" font-size="9" xml:space="preserve">  &lt;li&gt;b&lt;/li&gt;</text>
  <text class="dt1-code" x="56" y="146" font-size="9" xml:space="preserve">&lt;/ul&gt;</text>

  <path d="M270 112 H292 V94 H386" fill="none" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#dt1-ink)"/>
  <path d="M292 112 V176 H386" fill="none" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#dt1-ink)"/>

  <text class="dt1-mono" x="390" y="68" font-size="8.5">ul.childNodes —— 5 个</text>
  <rect class="dt1-tx" x="390" y="76" width="58" height="36" rx="2"/>
  <text class="dt1-t" x="419" y="91" font-size="8" text-anchor="middle">Text</text>
  <text class="dt1-s" x="419" y="104" font-size="7.5" text-anchor="middle">空白</text>
  <rect class="dt1-el" x="453" y="76" width="58" height="36" rx="2"/>
  <text class="dt1-t" x="482" y="91" font-size="8" text-anchor="middle">li</text>
  <text class="dt1-s" x="482" y="104" font-size="7.5" text-anchor="middle">a</text>
  <rect class="dt1-tx" x="516" y="76" width="58" height="36" rx="2"/>
  <text class="dt1-t" x="545" y="91" font-size="8" text-anchor="middle">Text</text>
  <text class="dt1-s" x="545" y="104" font-size="7.5" text-anchor="middle">空白</text>
  <rect class="dt1-el" x="579" y="76" width="58" height="36" rx="2"/>
  <text class="dt1-t" x="608" y="91" font-size="8" text-anchor="middle">li</text>
  <text class="dt1-s" x="608" y="104" font-size="7.5" text-anchor="middle">b</text>
  <rect class="dt1-tx" x="642" y="76" width="58" height="36" rx="2"/>
  <text class="dt1-t" x="671" y="91" font-size="8" text-anchor="middle">Text</text>
  <text class="dt1-s" x="671" y="104" font-size="7.5" text-anchor="middle">空白</text>

  <text class="dt1-mono" x="390" y="150" font-size="8.5">ul.children —— 2 个</text>
  <rect class="dt1-el" x="390" y="158" width="58" height="36" rx="2"/>
  <text class="dt1-t" x="419" y="173" font-size="8" text-anchor="middle">li</text>
  <text class="dt1-s" x="419" y="186" font-size="7.5" text-anchor="middle">a</text>
  <rect class="dt1-el" x="453" y="158" width="58" height="36" rx="2"/>
  <text class="dt1-t" x="482" y="173" font-size="8" text-anchor="middle">li</text>
  <text class="dt1-s" x="482" y="186" font-size="7.5" text-anchor="middle">b</text>

  <line x1="40" y1="208" x2="40" y2="232" stroke="#B03A2E" stroke-width="2.4"/>
  <text class="dt1-t" x="54" y="220" font-size="9">ul.firstChild 拿到的就是第一格空白 —— 取元素用 children，不是 childNodes</text>
  <text class="dt1-s" x="54" y="236" font-size="8.5">nodeType 1 是元素、3 是文本；换行缩进在源码里看得见，在 DOM 里就是一个真实的节点</text>
</svg>
