<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="100%" role="img" aria-labelledby="v7st v7sd">
  <title id="v7st">一份数据多处读写，组件树自己撑不住</title>
  <desc id="v7sd">上半部分是有 Store 的样子：组件 A 往 Store 里写，Store 作为响应式单例自动通知组件 B、C、D 更新，读写方互相不认识，只认识仓库。下半部分是没有 Store 的样子：一份状态要跨越五层组件，props 得逐层往下递，事件得逐层往上抛，中间每一层都被迫当搬运工。所以状态管理的必要性不来自「数据多」，而来自「同一份数据被多个不相邻的组件读写」。</desc>

  <style>
    .v7s-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .v7s-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .v7s-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .v7s-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .v7s-m{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="v7s-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="v7s-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="v7s-t" x="40" y="26" font-size="8.5">有 Store：读写双方互不认识，只认识仓库</text>

  <rect class="v7s-b" x="60" y="117" width="130" height="46" rx="2"/>
  <text class="v7s-t" x="125" y="137" font-size="8.5" text-anchor="middle">组件 A</text>
  <text class="v7s-s" x="125" y="152" font-size="7.5" text-anchor="middle">读 + 写</text>

  <rect class="v7s-q" x="290" y="98" width="172" height="84" rx="2"/>
  <text class="v7s-t" x="376" y="122" font-size="9.5" text-anchor="middle">Store</text>
  <text class="v7s-s" x="376" y="139" font-size="7.5" text-anchor="middle">响应式单例</text>
  <text class="v7s-m" x="376" y="160" font-size="7" text-anchor="middle" style="fill:#6E675A">state / getters / actions</text>

  <line x1="192" y1="140" x2="286" y2="140" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v7s-ink)"/>
  <text class="v7s-s" x="239" y="132" font-size="7" text-anchor="middle">写</text>

  <path d="M462 140 H512 V82 H554" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v7s-ink)"/>
  <line x1="462" y1="140" x2="554" y2="140" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v7s-ink)"/>
  <path d="M462 140 H512 V198 H554" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v7s-ink)"/>
  <text class="v7s-s" x="466" y="132" font-size="7">自动通知</text>

  <rect class="v7s-b" x="560" y="66" width="130" height="32" rx="2"/>
  <text class="v7s-t" x="625" y="86" font-size="8.5" text-anchor="middle">组件 B · 只读</text>
  <rect class="v7s-b" x="560" y="124" width="130" height="32" rx="2"/>
  <text class="v7s-t" x="625" y="144" font-size="8.5" text-anchor="middle">组件 C · 只读</text>
  <rect class="v7s-b" x="560" y="182" width="130" height="32" rx="2"/>
  <text class="v7s-t" x="625" y="202" font-size="8.5" text-anchor="middle">组件 D · 只读</text>

  <text class="v7s-s" x="40" y="228" font-size="8" style="fill:#B03A2E">没有 Store：一份状态要跨五层</text>

  <rect class="v7s-b" x="60" y="240" width="72" height="26" rx="2"/>
  <text class="v7s-t" x="96" y="257" font-size="7.5" text-anchor="middle">App</text>
  <rect class="v7s-b" x="148" y="240" width="72" height="26" rx="2"/>
  <text class="v7s-t" x="184" y="257" font-size="7.5" text-anchor="middle">Layout</text>
  <rect class="v7s-b" x="236" y="240" width="72" height="26" rx="2"/>
  <text class="v7s-t" x="272" y="257" font-size="7.5" text-anchor="middle">Page</text>
  <rect class="v7s-b" x="324" y="240" width="72" height="26" rx="2"/>
  <text class="v7s-t" x="360" y="257" font-size="7.5" text-anchor="middle">List</text>
  <rect class="v7s-b" x="412" y="240" width="72" height="26" rx="2"/>
  <text class="v7s-t" x="448" y="257" font-size="7.5" text-anchor="middle">Item</text>

  <line x1="134" y1="253" x2="144" y2="253" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v7s-ink)"/>
  <line x1="222" y1="253" x2="232" y2="253" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v7s-ink)"/>
  <line x1="310" y1="253" x2="320" y2="253" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v7s-ink)"/>
  <line x1="398" y1="253" x2="408" y2="253" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v7s-ink)"/>

  <path d="M448 276 H96" fill="none" stroke="#B03A2E" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#v7s-red)"/>
  <text class="v7s-s" x="272" y="288" font-size="7" text-anchor="middle" style="fill:#B03A2E">事件逐层往上抛</text>

  <text class="v7s-s" x="512" y="250" font-size="7.5">props 逐层往下递</text>
  <text class="v7s-s" x="512" y="264" font-size="7.5">每加一层，中间那层</text>
  <text class="v7s-s" x="512" y="276" font-size="7.5">就得当一次搬运工</text>

  <text class="v7s-t" x="40" y="312" font-size="8.5" style="fill:#B03A2E">所以需要状态管理的判据不是「数据多」，而是「同一份数据被多个不相邻的组件读写」。</text>
</svg>
