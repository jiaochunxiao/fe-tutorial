<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 292" width="100%" role="img" aria-labelledby="n2t n2d">
  <title id="n2t">HTTP 请求报文与响应报文的四段结构</title>
  <desc id="n2d">请求报文与响应报文骨架相同，自上而下都是起始行、头部、一个空行、消息体。差别只在第一行：请求写方法、路径和版本，响应写版本、状态码和短语。请求向右发出，响应向左返回。</desc>

  <style>
    .n2-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .n2-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .n2-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="n2-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="n2-mut" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6E675A"/>
    </marker>
  </defs>

  <text class="n2-small" x="193" y="30" font-size="11" text-anchor="middle">请求报文</text>
  <text class="n2-small" x="563" y="30" font-size="11" text-anchor="middle">响应报文</text>

  <!-- 左侧行名 -->
  <text class="n2-small" x="64" y="68" font-size="10.5" text-anchor="end">起始行</text>
  <text class="n2-small" x="64" y="136" font-size="10.5" text-anchor="end">头部</text>
  <text class="n2-small" x="64" y="197" font-size="10.5" text-anchor="end">空行</text>
  <text class="n2-small" x="64" y="229" font-size="10.5" text-anchor="end">体</text>

  <!-- 请求：起始行 -->
  <rect class="n2-box" x="76" y="48" width="234" height="32" rx="2"/>
  <text class="n2-mono" x="86" y="69" font-size="10.5">POST /api/orders HTTP/1.1</text>

  <!-- 请求：头部 -->
  <rect class="n2-box" x="76" y="84" width="234" height="96" rx="2"/>
  <text class="n2-mono" x="86" y="105" font-size="10.5">Host: shop.example.com</text>
  <text class="n2-mono" x="86" y="129" font-size="10.5">Content-Type: application/json</text>
  <text class="n2-mono" x="86" y="153" font-size="10.5">Authorization: Bearer xxx</text>

  <!-- 请求：空行 -->
  <line x1="76" y1="192" x2="310" y2="192" stroke="#CDC4AF" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- 请求：体 -->
  <rect class="n2-box" x="76" y="204" width="234" height="40" rx="2"/>
  <text class="n2-mono" x="86" y="229" font-size="10.5">{"sku": "A001", "count": 2}</text>

  <!-- 响应：起始行 -->
  <rect class="n2-box" x="446" y="48" width="234" height="32" rx="2"/>
  <text class="n2-mono" x="456" y="69" font-size="10.5">HTTP/1.1 200 OK</text>

  <!-- 响应：头部 -->
  <rect class="n2-box" x="446" y="84" width="234" height="96" rx="2"/>
  <text class="n2-mono" x="456" y="105" font-size="10.5">Content-Type: application/json</text>
  <text class="n2-mono" x="456" y="129" font-size="10.5">Cache-Control: max-age=60</text>
  <text class="n2-mono" x="456" y="153" font-size="10.5">Set-Cookie: sid=abc; HttpOnly</text>

  <!-- 响应：空行 -->
  <line x1="446" y1="192" x2="680" y2="192" stroke="#CDC4AF" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- 响应：体 -->
  <rect class="n2-box" x="446" y="204" width="234" height="40" rx="2"/>
  <text class="n2-mono" x="456" y="229" font-size="10.5">{"orderId": "98765"}</text>

  <!-- 两条方向箭头 -->
  <line x1="316" y1="110" x2="438" y2="110" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#n2-ink)"/>
  <text class="n2-small" x="377" y="100" font-size="10.5" text-anchor="middle">请求</text>
  <line x1="440" y1="154" x2="318" y2="154" stroke="#6E675A" stroke-width="1.6" marker-end="url(#n2-mut)"/>
  <text class="n2-small" x="377" y="172" font-size="10.5" text-anchor="middle">响应</text>

  <text class="n2-small" x="76" y="274" font-size="10.5">空行是头与体之间唯一的分界——少写这一个换行，后面的体就会被当成头继续读下去。</text>

</svg>
