<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 276" width="100%" role="img" aria-labelledby="t2gt t2gd">
  <title id="t2gt">泛型是类型的参数，推断发生在调用点</title>
  <desc id="t2gd">fn 声明成 fn&lt;T&gt;(v: T): T，调用 fn(1) 时 T 推断成 number，调用 fn('a') 时推断成 string，输入与输出的类型关系被这一处声明锁死。extends 约束表达「T 至少长什么样」，比如 T extends { id: string } 之后就能安全访问 t.id。keyof 与 T[K] 的组合是类型安全属性操作的经典写法，拼错键在编译期就报错，消灭魔法字符串。泛型有四大落点：函数、接口如 ApiResponse&lt;T&gt;、类如 Stack&lt;T&gt;、以及多参与默认值。</desc>

  <style>
    .t2g-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .t2g-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .t2g-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .t2g-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .t2g-m{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="t2g-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="t2g-t" x="40" y="26" font-size="8.5">泛型 = 类型的参数 —— 它建立的是两个类型之间的关系</text>

  <rect class="t2g-q" x="290" y="42" width="180" height="34" rx="2"/>
  <text class="t2g-m" x="380" y="63" font-size="8" text-anchor="middle">fn&lt;T&gt;(v: T): T</text>

  <path d="M340 76 L290 104" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#t2g-ink)"/>
  <path d="M420 76 L470 104" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#t2g-ink)"/>
  <text class="t2g-s" x="380" y="96" font-size="6.5" text-anchor="middle">调用时推断 T</text>

  <rect class="t2g-b" x="170" y="108" width="170" height="30" rx="2"/>
  <text class="t2g-m" x="255" y="127" font-size="7" text-anchor="middle">fn(1) → T = number</text>
  <rect class="t2g-b" x="420" y="108" width="170" height="30" rx="2"/>
  <text class="t2g-m" x="505" y="127" font-size="7" text-anchor="middle">fn('a') → T = string</text>
  <text class="t2g-s" x="604" y="122" font-size="6.5">输出跟着输入变，</text>
  <text class="t2g-s" x="604" y="133" font-size="6.5">不用写两遍重载</text>

  <rect class="t2g-b" x="40" y="156" width="320" height="34" rx="2"/>
  <text class="t2g-m" x="56" y="177" font-size="7">&lt;T extends { id: string }&gt;</text>
  <text class="t2g-s" x="244" y="177" font-size="6.5">约束：T 至少有 id</text>
  <text class="t2g-s" x="40" y="202" font-size="6.5">有了约束，函数体里才能安全访问 t.id —— 约束解锁受控的成员访问。</text>

  <rect class="t2g-q" x="40" y="212" width="660" height="30" rx="2"/>
  <text class="t2g-m" x="56" y="231" font-size="7">&lt;T, K extends keyof T&gt;(obj: T, key: K): T[K]</text>
  <text class="t2g-s" x="360" y="231" font-size="6.5">K 是 T 的键联合，返回值按键精确取值 —— 拼错键编译期就拦</text>

  <text class="t2g-t" x="40" y="264" font-size="8.5" style="fill:#B03A2E">四大落点：函数 / 接口 ApiResponse&lt;T&gt; / 类 Stack&lt;T&gt; / 多参带默认 —— 但绝不用 any 顶替泛型。</text>
</svg>
