<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 200" width="100%" role="img" aria-labelledby="n5ct n5cd">
  <title id="n5ct">证书链：签发往下走，验签往上走</title>
  <desc id="n5cd">根证书是预装在操作系统或浏览器里的信任锚，它签发中间 CA 的证书，中间 CA 再签发站点证书。浏览器拿到站点证书后是反着走的：用中间 CA 的公钥去解站点证书上的签名，验证通过说明中间 CA 认过它；再用根 CA 的公钥解中间 CA 的签名。整条链走到信任锚为止，任何一环验不过，这条链就作废。所以自签证书一定报警告——它不在链上。</desc>

  <style>
    .n5c-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.3}
    .n5c-anchor{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.3}
    .n5c-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .n5c-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .n5c-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="n5c-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="n5c-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="n5c-s" x="40" y="34" font-size="7.5" style="fill:#B03A2E">签发 →（证书上写着「我认它」）</text>
  <rect class="n5c-anchor" x="40" y="44" width="160" height="46" rx="3"/>
  <text class="n5c-t" x="120" y="66" font-size="8.5" text-anchor="middle">根 CA</text>
  <text class="n5c-s" x="120" y="80" font-size="7.5" text-anchor="middle">预装的信任锚</text>
  <line x1="200" y1="60" x2="256" y2="60" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#n5c-ink)"/>
  <text class="n5c-mono" x="228" y="54" font-size="7" text-anchor="middle">签发</text>

  <rect class="n5c-box" x="260" y="44" width="160" height="46" rx="3"/>
  <text class="n5c-t" x="340" y="66" font-size="8.5" text-anchor="middle">中间 CA</text>
  <text class="n5c-s" x="340" y="80" font-size="7.5" text-anchor="middle">它的证书由根签</text>
  <line x1="420" y1="60" x2="476" y2="60" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#n5c-ink)"/>
  <text class="n5c-mono" x="448" y="54" font-size="7" text-anchor="middle">签发</text>

  <rect class="n5c-box" x="480" y="44" width="180" height="46" rx="3"/>
  <text class="n5c-t" x="570" y="66" font-size="8.5" text-anchor="middle">站点证书</text>
  <text class="n5c-s" x="570" y="80" font-size="7.5" text-anchor="middle">你访问的那个域名</text>

  <text class="n5c-s" x="40" y="118" font-size="7.5">← 验签（用上级公钥解下级的签名）</text>
  <line x1="476" y1="130" x2="420" y2="130" stroke="#B03A2E" stroke-width="1.4" marker-end="url(#n5c-red)"/>
  <text class="n5c-s" x="448" y="146" font-size="7" text-anchor="middle">验签</text>
  <line x1="256" y1="130" x2="200" y2="130" stroke="#B03A2E" stroke-width="1.4" marker-end="url(#n5c-red)"/>
  <text class="n5c-s" x="228" y="146" font-size="7" text-anchor="middle">验签</text>
  <text class="n5c-t" x="490" y="132" font-size="7.5" style="fill:#B03A2E">一直验到信任锚为止</text>

  <line x1="40" y1="164" x2="700" y2="164" stroke="#CDC4AF" stroke-width="1"/>
  <text class="n5c-s" x="40" y="182" font-size="8">任何一环验不过，整条链作废 —— 所以自签证书必然报警告：它接不到任何一个信任锚上。</text>
  <text class="n5c-t" x="40" y="198" font-size="8.5" style="fill:#B03A2E">注意方向：签发是「上级给下级签」，验签是「下级拿上级的公钥验」—— 一上一下，别弄反。</text>
</svg>
