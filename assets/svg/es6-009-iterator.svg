<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 206" width="100%" role="img" aria-labelledby="e69t e69d">
  <title id="e69t">迭代协议：可迭代对象、迭代器、一次一个值</title>
  <desc id="e69d">可迭代对象身上挂着一个 Symbol.iterator 方法，调用它得到一个迭代器；迭代器就是一个带 next 方法的游标，每次调用返回 value 和 done 两个字段，直到 done 变成 true。for of、展开运算符、解构、Array.from 全都建立在这套协议上，所以只要你实现了它，你的对象就能被这些语法直接消费。</desc>

  <style>
    .e69-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .e69-alt{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.4}
    .e69-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .e69-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .e69-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="e69-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="e69-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <rect class="e69-box" x="40" y="48" width="170" height="46" rx="3"/>
  <text class="e69-t" x="125" y="76" font-size="9" text-anchor="middle">可迭代对象</text>
  <text class="e69-s" x="125" y="106" font-size="7.5" text-anchor="middle">能被遍历的东西</text>

  <line x1="210" y1="71" x2="266" y2="71" stroke="#1C1A17" stroke-width="1.5" marker-end="url(#e69-ink)"/>
  <text class="e69-mono" x="238" y="60" font-size="7.5" text-anchor="middle">[Symbol.iterator]()</text>

  <rect class="e69-box" x="270" y="48" width="150" height="46" rx="3"/>
  <text class="e69-t" x="345" y="76" font-size="9" text-anchor="middle">迭代器</text>
  <text class="e69-s" x="345" y="106" font-size="7.5" text-anchor="middle">游标，自己不改数据</text>

  <line x1="420" y1="71" x2="476" y2="71" stroke="#1C1A17" stroke-width="1.5" marker-end="url(#e69-ink)"/>
  <text class="e69-mono" x="448" y="60" font-size="7.5" text-anchor="middle">next()</text>

  <rect class="e69-alt" x="480" y="48" width="180" height="46" rx="3"/>
  <text class="e69-mono" x="570" y="70" font-size="8.5" text-anchor="middle">{ value, done }</text>
  <text class="e69-s" x="570" y="84" font-size="7.5" text-anchor="middle">一次吐一个</text>
  <text class="e69-s" x="570" y="106" font-size="7.5" text-anchor="middle">done 变 true 就结束</text>

  <path d="M570 118 V140 H360 V140" fill="none" stroke="#B03A2E" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#e69-red)"/>
  <text class="e69-s" x="400" y="134" font-size="7.5" style="fill:#B03A2E">再调一次 next()，游标前进</text>

  <line x1="40" y1="160" x2="700" y2="160" stroke="#CDC4AF" stroke-width="1"/>
  <text class="e69-s" x="40" y="180" font-size="8.5">实现这两个协议，你的对象就能直接被 <tspan class="e69-mono" font-size="8.5">for of</tspan>、展开、解构、<tspan class="e69-mono" font-size="8.5">Array.from</tspan> 消费 —— 它们全是这套协议的语法糖。</text>
  <text class="e69-t" x="40" y="198" font-size="8.5" style="fill:#B03A2E">注意分工：可迭代是「能被遍历」，迭代器是「记住走到哪了」。数组是前者，每次遍历都造一个新的后者。</text>
</svg>
