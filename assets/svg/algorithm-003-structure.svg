<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 310" width="100%" role="img" aria-labelledby="a3st a3sd">
  <title id="a3st">数组靠连续，链表靠指针，代价正好反过来</title>
  <desc id="a3sd">上一条泳道是数组：元素在连续内存里排成一排，一个下标乘上元素大小就是地址，随机访问 O(1)，但往中间插一个要整体搬家 O(n)。下一条泳道是链表：节点散落在内存各处，不知道第 n 个在哪，只能顺着指针走 O(n)，但拿到位置之后插删只改两根指针 O(1)。所以链表的全部难度都在指针操作的不变量上，插入一个节点只需两步：先让新节点的 next 指向后半段，再把前驱的 next 改成新节点，旧的那根线自动失效。</desc>

  <style>
    .a3s-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .a3s-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .a3s-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .a3s-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="a3s-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="a3s-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="a3s-t" x="40" y="26" font-size="8.5">数组靠连续，链表靠指针 —— 代价正好反过来</text>

  <text class="a3s-t" x="40" y="64" font-size="8.5">数组</text>
  <rect class="a3s-q" x="96" y="48" width="54" height="30" rx="1"/>
  <text class="a3s-t" x="123" y="67" font-size="8" text-anchor="middle">1</text>
  <rect class="a3s-b" x="150" y="48" width="54" height="30" rx="1"/>
  <text class="a3s-t" x="177" y="67" font-size="8" text-anchor="middle">2</text>
  <rect class="a3s-b" x="204" y="48" width="54" height="30" rx="1"/>
  <text class="a3s-t" x="231" y="67" font-size="8" text-anchor="middle">3</text>
  <rect class="a3s-b" x="258" y="48" width="54" height="30" rx="1"/>
  <text class="a3s-t" x="285" y="67" font-size="8" text-anchor="middle">4</text>

  <text class="a3s-s" x="123" y="90" font-size="7" text-anchor="middle">0</text>
  <text class="a3s-s" x="177" y="90" font-size="7" text-anchor="middle">1</text>
  <text class="a3s-s" x="231" y="90" font-size="7" text-anchor="middle">2</text>
  <text class="a3s-s" x="285" y="90" font-size="7" text-anchor="middle">3</text>

  <text class="a3s-s" x="376" y="58" font-size="7.5">连续内存 —— 下标乘元素大小就是地址</text>
  <text class="a3s-s" x="376" y="74" font-size="7.5">随机访问 O(1)；中间插一个要整体搬家 O(n)</text>

  <text class="a3s-t" x="40" y="122" font-size="8.5">链表</text>
  <rect class="a3s-b" x="96" y="102" width="40" height="28" rx="1"/>
  <text class="a3s-t" x="116" y="120" font-size="7.5" text-anchor="middle">1</text>
  <rect class="a3s-b" x="160" y="112" width="40" height="28" rx="1"/>
  <text class="a3s-t" x="180" y="130" font-size="7.5" text-anchor="middle">2</text>
  <rect class="a3s-b" x="224" y="100" width="40" height="28" rx="1"/>
  <text class="a3s-t" x="244" y="118" font-size="7.5" text-anchor="middle">3</text>
  <rect class="a3s-b" x="288" y="110" width="40" height="28" rx="1"/>
  <text class="a3s-t" x="308" y="128" font-size="7.5" text-anchor="middle">4</text>
  <text class="a3s-s" x="336" y="124" font-size="7">null</text>

  <line x1="136" y1="116" x2="156" y2="122" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#a3s-ink)"/>
  <line x1="200" y1="124" x2="220" y2="116" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#a3s-ink)"/>
  <line x1="264" y1="112" x2="284" y2="120" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#a3s-ink)"/>

  <text class="a3s-s" x="376" y="114" font-size="7.5">分散节点 —— 不知道第 n 个在哪，只能顺着指针走 O(n)</text>
  <text class="a3s-s" x="376" y="130" font-size="7.5">拿到位置后插删只改两根指针 O(1)</text>

  <text class="a3s-t" x="40" y="170" font-size="8.5">插入一个节点只需两步：先接新的，再断旧的</text>

  <rect class="a3s-b" x="60" y="190" width="44" height="26" rx="1"/>
  <text class="a3s-t" x="82" y="207" font-size="7.5" text-anchor="middle">A</text>
  <rect class="a3s-b" x="220" y="190" width="44" height="26" rx="1"/>
  <text class="a3s-t" x="242" y="207" font-size="7.5" text-anchor="middle">B</text>
  <rect class="a3s-q" x="140" y="240" width="44" height="26" rx="1"/>
  <text class="a3s-t" x="162" y="257" font-size="7.5" text-anchor="middle">X</text>
  <line x1="104" y1="203" x2="216" y2="203" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#a3s-ink)"/>
  <path d="M184 253 H216 V220" fill="none" stroke="#B03A2E" stroke-width="1.1" marker-end="url(#a3s-red)"/>
  <text class="a3s-s" x="60" y="292" font-size="7.5">① X.next = B —— 新节点先接管后半段</text>

  <rect class="a3s-b" x="410" y="190" width="44" height="26" rx="1"/>
  <text class="a3s-t" x="432" y="207" font-size="7.5" text-anchor="middle">A</text>
  <rect class="a3s-b" x="570" y="190" width="44" height="26" rx="1"/>
  <text class="a3s-t" x="592" y="207" font-size="7.5" text-anchor="middle">B</text>
  <rect class="a3s-q" x="490" y="240" width="44" height="26" rx="1"/>
  <text class="a3s-t" x="512" y="257" font-size="7.5" text-anchor="middle">X</text>
  <line x1="454" y1="203" x2="566" y2="203" stroke="#CDC4AF" stroke-width="1.1" stroke-dasharray="4 3"/>
  <line x1="486" y1="199" x2="494" y2="207" stroke="#6E675A" stroke-width="1.1"/>
  <line x1="486" y1="207" x2="494" y2="199" stroke="#6E675A" stroke-width="1.1"/>
  <path d="M432 216 V253 H486" fill="none" stroke="#B03A2E" stroke-width="1.1" marker-end="url(#a3s-red)"/>
  <text class="a3s-s" x="390" y="292" font-size="7.5">② A.next = X —— 旧线没人走了，不必手动清</text>
</svg>
