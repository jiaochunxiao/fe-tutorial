<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 290" width="100%" role="img" aria-labelledby="v3t v3d">
  <title id="v3t">内联缓存：一次比较换掉一次查表</title>
  <desc id="v3d">每个属性访问点带一个缓存槽。第一次执行走慢路径：查形状表得到 x 的偏移，把形状和偏移写进槽里。以后执行先比一次 p 的 Map 是不是缓存里那个形状，命中就直接按偏移取值，两条指令完成；不命中就退回慢路径并更新缓存，见过太多形状之后放弃缓存，退化为通用查找。</desc>

  <style>
    .v3-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .v3-hit{fill:#FBF7EE;stroke:#B03A2E;stroke-width:1.6}
    .v3-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .v3-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="v3-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="v3-cin" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <rect class="v3-box" x="40" y="84" width="150" height="60" rx="3"/>
  <text class="v3-mono" x="58" y="106" font-size="12.5">p</text>
  <text class="v3-mono" x="58" y="126" font-size="9.5" style="fill:#6E675A">[Map=C2][x][y]</text>

  <rect class="v3-box" x="40" y="180" width="150" height="60" rx="3"/>
  <text class="v3-mono" x="58" y="202" font-size="12">IC 槽</text>
  <text class="v3-mono" x="58" y="222" font-size="9.5" style="fill:#6E675A">C2 · offset 0</text>
  <text class="v3-small" x="40" y="262" font-size="9.5">第一次执行时把（形状, 偏移）写进这个槽</text>

  <rect class="v3-box" x="250" y="112" width="180" height="56" rx="3"/>
  <text class="v3-mono" x="340" y="146" font-size="11.5" text-anchor="middle">p.Map === C2 ?</text>

  <path d="M190 114 C220 114 220 132 246 132" fill="none" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#v3-ink)"/>
  <path d="M190 210 C220 210 220 158 246 158" fill="none" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#v3-ink)"/>

  <rect class="v3-hit" x="500" y="40" width="190" height="60" rx="3"/>
  <text class="v3-mono" x="516" y="66" font-size="11.5" style="fill:#B03A2E">读 [p + 0]</text>
  <text class="v3-small" x="516" y="86" font-size="9.5">一次比较 + 一次取址，两条指令</text>

  <rect class="v3-box" x="500" y="190" width="190" height="80" rx="3"/>
  <text class="v3-mono" x="516" y="214" font-size="11.5">慢路径</text>
  <text class="v3-small" x="516" y="234" font-size="9.5">查形状表得 offset</text>
  <text class="v3-small" x="516" y="252" font-size="9.5">更新缓存 / 太多形状则转 mega</text>

  <path d="M430 128 C466 128 466 76 496 76" fill="none" stroke="#B03A2E" stroke-width="1.6" marker-end="url(#v3-cin)"/>
  <text class="v3-small" x="472" y="66" font-size="9.5" text-anchor="middle" style="fill:#B03A2E">命中</text>

  <path d="M430 156 C466 156 466 226 496 226" fill="none" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#v3-ink)"/>
  <text class="v3-small" x="472" y="246" font-size="9.5" text-anchor="middle">不命中</text>

</svg>
