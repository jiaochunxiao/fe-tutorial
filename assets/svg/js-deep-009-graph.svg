<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 672" width="100%" role="img" aria-labelledby="t3t t3d">
  <title id="t3t">完整原型链路图</title>
  <desc id="t3d">左侧是实例链：p 经 __proto__ 指向 Person.prototype，再指向 Object.prototype，最终到达 null。中间三个构造函数 Person、Object、Function 经 __proto__ 都指向 Function.prototype，其中 Function 的 __proto__ 指向自己的 prototype。Function.prototype 再经 __proto__ 指向 Object.prototype。</desc>
  <defs>
    <marker id="t3-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="t3-cin" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
    <marker id="t3-mut" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6E675A"/>
    </marker>
  </defs>

  <style>
    .t3-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.6}
    .t3-null{fill:#FBF7EE;stroke:#6E675A;stroke-width:1.4;stroke-dasharray:6 4}
    .t3-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .t3-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .t3-edge{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;font-size:10.5px;fill:#B03A2E}
    .t3-edge2{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;font-size:10.5px;fill:#6E675A}
  </style>

  <!-- ══ 节点 ══ -->
  <!-- p -->
  <rect class="t3-box" x="24" y="60" width="160" height="56" rx="4"/>
  <text class="t3-mono" x="104" y="86" font-size="13.5" text-anchor="middle">p</text>
  <text class="t3-small" x="104" y="104" font-size="10.5" text-anchor="middle">实例</text>

  <!-- Person -->
  <rect class="t3-box" x="300" y="60" width="160" height="56" rx="4"/>
  <text class="t3-mono" x="380" y="86" font-size="13.5" text-anchor="middle">Person</text>
  <text class="t3-small" x="380" y="104" font-size="10.5" text-anchor="middle">构造函数</text>

  <!-- Person.prototype -->
  <rect class="t3-box" x="576" y="60" width="180" height="56" rx="4"/>
  <text class="t3-mono" x="666" y="86" font-size="12.5" text-anchor="middle">Person.prototype</text>
  <text class="t3-small" x="666" y="104" font-size="10.5" text-anchor="middle">原型对象</text>

  <!-- Object -->
  <rect class="t3-box" x="300" y="210" width="160" height="56" rx="4"/>
  <text class="t3-mono" x="380" y="236" font-size="13.5" text-anchor="middle">Object</text>
  <text class="t3-small" x="380" y="254" font-size="10.5" text-anchor="middle">构造函数</text>

  <!-- Object.prototype -->
  <rect class="t3-box" x="576" y="210" width="180" height="56" rx="4"/>
  <text class="t3-mono" x="666" y="236" font-size="12.5" text-anchor="middle">Object.prototype</text>
  <text class="t3-small" x="666" y="254" font-size="10.5" text-anchor="middle">所有对象的共同祖先</text>

  <!-- Function -->
  <rect class="t3-box" x="300" y="360" width="160" height="56" rx="4"/>
  <text class="t3-mono" x="380" y="386" font-size="13.5" text-anchor="middle">Function</text>
  <text class="t3-small" x="380" y="404" font-size="10.5" text-anchor="middle">构造函数</text>

  <!-- Function.prototype -->
  <rect class="t3-box" x="576" y="360" width="180" height="56" rx="4"/>
  <text class="t3-mono" x="666" y="386" font-size="12.5" text-anchor="middle">Function.prototype</text>
  <text class="t3-small" x="666" y="404" font-size="10.5" text-anchor="middle">所有函数的共同祖先</text>

  <!-- null -->
  <rect class="t3-null" x="576" y="520" width="80" height="40" rx="4"/>
  <text class="t3-mono" x="616" y="545" font-size="13" text-anchor="middle" style="fill:#6E675A">null</text>

  <!-- ══ 边 ══ -->
  <!-- E1 p → Person.prototype -->
  <path d="M104 60 V30 H666 V54" fill="none" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#t3-cin)"/>
  <text class="t3-edge" x="380" y="23" text-anchor="middle">__proto__</text>

  <!-- E2 Person → Person.prototype -->
  <line x1="462" y1="74" x2="572" y2="74" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#t3-ink)"/>
  <text class="t3-edge2" x="517" y="66" font-size="10" text-anchor="middle">prototype</text>

  <!-- E3 Person.prototype → Person -->
  <line x1="572" y1="102" x2="466" y2="102" stroke="#6E675A" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#t3-mut)"/>
  <text class="t3-edge2" x="517" y="117" font-size="10" text-anchor="middle">constructor</text>

  <!-- E4 Person → Function.prototype（绕左侧走底，兼作 Object 的汇流主干） -->
  <path d="M300 88 H250 V438 H600 V422" fill="none" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#t3-cin)"/>
  <text class="t3-edge" x="410" y="430" text-anchor="middle">__proto__</text>

  <!-- E5 Person.prototype → Object.prototype -->
  <line x1="666" y1="118" x2="666" y2="204" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#t3-cin)"/>
  <text class="t3-edge" x="678" y="165" font-size="10">__proto__</text>

  <!-- E6 Object → Object.prototype -->
  <line x1="462" y1="238" x2="572" y2="238" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#t3-ink)"/>

  <!-- E7 Object.prototype → Object -->
  <line x1="572" y1="258" x2="466" y2="258" stroke="#6E675A" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#t3-mut)"/>

  <!-- E8 Object → Function.prototype（并入同一主干） -->
  <line x1="300" y1="238" x2="252" y2="238" stroke="#B03A2E" stroke-width="1.8"/>

  <!-- E9 Object.prototype → null -->
  <path d="M756 238 H770 V540 H662" fill="none" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#t3-cin)"/>
  <text class="t3-edge" x="676" y="500" font-size="10">__proto__</text>

  <!-- E10 Function → Function.prototype -->
  <line x1="462" y1="388" x2="572" y2="388" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#t3-ink)"/>

  <!-- E11 Function.prototype → Function -->
  <line x1="572" y1="408" x2="466" y2="408" stroke="#6E675A" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#t3-mut)"/>

  <!-- E12 Function → Function.prototype（自环） -->
  <path d="M420 360 C420 322 560 322 630 356" fill="none" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#t3-cin)"/>
  <text class="t3-edge" x="500" y="306" font-size="10" text-anchor="middle">__proto__（指向自己）</text>

  <!-- E13 Function.prototype → Object.prototype -->
  <line x1="700" y1="358" x2="700" y2="268" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#t3-cin)"/>

  <!-- ══ 旁注 ══ -->
  <text class="t3-small" x="24" y="404" font-size="11">函数本身也是对象，</text>
  <text class="t3-small" x="24" y="422" font-size="11">所以 Person.__proto__</text>
  <text class="t3-small" x="24" y="440" font-size="11">也指向 Function.prototype。</text>

  <!-- ══ 图例 ══ -->
  <line x1="24" y1="612" x2="56" y2="612" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#t3-ink)"/>
  <text class="t3-small" x="66" y="616" font-size="11">prototype —— 函数自带，new 时用来建立实例的原型</text>

  <line x1="24" y1="634" x2="56" y2="634" stroke="#6E675A" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#t3-mut)"/>
  <text class="t3-small" x="66" y="638" font-size="11">constructor —— 原型对象指回构造函数（重写原型会丢，可手动补）</text>

  <line x1="24" y1="656" x2="56" y2="656" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#t3-cin)"/>
  <text class="t3-small" x="66" y="660" font-size="11">__proto__ —— 即 [[Prototype]]，所有对象都有，也是属性查找的行走方向</text>
</svg>
