<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 404" width="100%" role="img" aria-labelledby="v6gt v6gd">
  <title id="v6gt">一次导航要过九道关，前七道都能改主意</title>
  <desc id="v6gd">导航从触发到结束共九步：先走组件内的 beforeRouteLeave，再走全局 beforeEach，然后是组件复用时才触发的 beforeRouteUpdate、只写在路由配置里的 beforeEnter、拿不到 this 的 beforeRouteEnter、全局 beforeResolve，全部放行之后才确认导航、换掉 URL 并渲染新组件，最后执行 afterEach 收尾。其中离开守卫到 beforeResolve 这五道关，任何一环返回一个地址都能把导航改道，这是登录拦截的落点；而 afterEach 执行时 URL 已经换完，拦不住任何东西，只适合埋点、改标题这类事后工作。</desc>

  <style>
    .v6g-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .v6g-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .v6g-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .v6g-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .v6g-m{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="v6g-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="v6g-t" x="40" y="26" font-size="8.5">一次导航 = 一条异步中间件链，逐环 next() 放行</text>

  <rect class="v6g-q" x="80" y="48" width="320" height="26" rx="2"/>
  <text class="v6g-t" x="240" y="65" font-size="8.5" text-anchor="middle">导航触发</text>
  <line x1="400" y1="61" x2="434" y2="61" stroke="#CDC4AF" stroke-width="1"/>
  <text class="v6g-s" x="440" y="64" font-size="7.5">router.push / 点 router-link / 后退</text>

  <rect class="v6g-b" x="80" y="82" width="320" height="26" rx="2"/>
  <text class="v6g-t" x="240" y="99" font-size="8.5" text-anchor="middle">beforeRouteLeave · 组件内</text>
  <line x1="400" y1="95" x2="434" y2="95" stroke="#CDC4AF" stroke-width="1"/>
  <text class="v6g-s" x="440" y="98" font-size="7.5">只有这个组件即将离开时才有：弹「未保存」</text>

  <rect class="v6g-b" x="80" y="116" width="320" height="26" rx="2"/>
  <text class="v6g-t" x="240" y="133" font-size="8.5" text-anchor="middle">beforeEach · 全局</text>
  <line x1="400" y1="129" x2="434" y2="129" stroke="#CDC4AF" stroke-width="1"/>
  <text class="v6g-s" x="440" y="132" font-size="7.5">登录拦截、权限校验的主战场</text>

  <rect class="v6g-b" x="80" y="150" width="320" height="26" rx="2"/>
  <text class="v6g-t" x="240" y="167" font-size="8.5" text-anchor="middle">beforeRouteUpdate · 组件内</text>
  <line x1="400" y1="163" x2="434" y2="163" stroke="#CDC4AF" stroke-width="1"/>
  <text class="v6g-s" x="440" y="166" font-size="7.5">/user/1 → /user/2 复用同一组件才触发</text>

  <rect class="v6g-b" x="80" y="184" width="320" height="26" rx="2"/>
  <text class="v6g-t" x="240" y="201" font-size="8.5" text-anchor="middle">beforeEnter · 路由配置</text>
  <line x1="400" y1="197" x2="434" y2="197" stroke="#CDC4AF" stroke-width="1"/>
  <text class="v6g-s" x="440" y="200" font-size="7.5">写在路由表里，进不了组件</text>

  <rect class="v6g-b" x="80" y="218" width="320" height="26" rx="2"/>
  <text class="v6g-t" x="240" y="235" font-size="8.5" text-anchor="middle">beforeRouteEnter · 组件内</text>
  <line x1="400" y1="231" x2="434" y2="231" stroke="#CDC4AF" stroke-width="1"/>
  <text class="v6g-s" x="440" y="234" font-size="7.5">拿不到 this —— 实例还没创建</text>

  <rect class="v6g-b" x="80" y="252" width="320" height="26" rx="2"/>
  <text class="v6g-t" x="240" y="269" font-size="8.5" text-anchor="middle">beforeResolve · 全局</text>
  <line x1="400" y1="265" x2="434" y2="265" stroke="#CDC4AF" stroke-width="1"/>
  <text class="v6g-s" x="440" y="268" font-size="7.5">最后一个还能改道的钩子</text>

  <rect class="v6g-q" x="80" y="286" width="320" height="26" rx="2"/>
  <text class="v6g-t" x="240" y="303" font-size="8.5" text-anchor="middle">确认导航：换 URL、渲染新组件</text>
  <line x1="400" y1="299" x2="434" y2="299" stroke="#CDC4AF" stroke-width="1"/>
  <text class="v6g-s" x="440" y="302" font-size="7.5">到这里就回不去了</text>

  <rect class="v6g-b" x="80" y="320" width="320" height="26" rx="2"/>
  <text class="v6g-t" x="240" y="337" font-size="8.5" text-anchor="middle">afterEach · 全局</text>
  <line x1="400" y1="333" x2="434" y2="333" stroke="#CDC4AF" stroke-width="1"/>
  <text class="v6g-s" x="440" y="336" font-size="7.5">拦不住导航：只适合埋点、改标题</text>

  <line x1="64" y1="95" x2="64" y2="265" stroke="#B03A2E" stroke-width="1.1"/>
  <line x1="64" y1="95" x2="76" y2="95" stroke="#B03A2E" stroke-width="1.1"/>
  <line x1="64" y1="129" x2="76" y2="129" stroke="#B03A2E" stroke-width="1.1"/>
  <line x1="64" y1="163" x2="76" y2="163" stroke="#B03A2E" stroke-width="1.1"/>
  <line x1="64" y1="197" x2="76" y2="197" stroke="#B03A2E" stroke-width="1.1"/>
  <line x1="64" y1="231" x2="76" y2="231" stroke="#B03A2E" stroke-width="1.1"/>
  <line x1="64" y1="265" x2="76" y2="265" stroke="#B03A2E" stroke-width="1.1"/>

  <text class="v6g-t" x="40" y="364" font-size="8.5" style="fill:#B03A2E">朱线那六道关，任何一环 return 一个地址，这次导航就改道了 —— 登录拦截就挂在这里。</text>
  <text class="v6g-s" x="40" y="384" font-size="8">afterEach 跑的时候 URL 都换完了，它拦不住谁；反过来，正因为它一定跑得到，埋点放这儿最稳。</text>
</svg>
