<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 740 238" width="100%" role="img" aria-labelledby="in10t in10d">
  <title id="in10t">继承之后的两条链：实例链与静态链</title>
  <desc id="in10d">实例 d 的原型链是 Dog.prototype、Animal.prototype、Object.prototype，最后到 null；每一层各自带着自己的方法。构造函数这一侧另有一条静态链 Dog、Animal、Function.prototype，所以子类构造函数能直接用父类的静态方法。两条链互不相干。</desc>

  <style>
    .in10-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .in10-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .in10-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .in10-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="in10-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <rect class="in10-box" x="44" y="70" width="70" height="56" rx="3"/>
  <text class="in10-mono" x="79" y="103" font-size="11" text-anchor="middle">d</text>
  <line x1="118" y1="98" x2="152" y2="98" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#in10-ink)"/>

  <rect class="in10-box" x="156" y="70" width="130" height="56" rx="3"/>
  <text class="in10-mono" x="172" y="96" font-size="10.5">Dog.prototype</text>
  <text class="in10-s" x="172" y="114" font-size="9">bark</text>
  <line x1="290" y1="98" x2="324" y2="98" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#in10-ink)"/>

  <rect class="in10-box" x="328" y="70" width="150" height="56" rx="3"/>
  <text class="in10-mono" x="344" y="96" font-size="10.5">Animal.prototype</text>
  <text class="in10-s" x="344" y="114" font-size="9">eat</text>
  <line x1="482" y1="98" x2="516" y2="98" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#in10-ink)"/>

  <rect class="in10-box" x="520" y="70" width="150" height="56" rx="3"/>
  <text class="in10-mono" x="536" y="96" font-size="10.5">Object.prototype</text>
  <text class="in10-s" x="536" y="114" font-size="9">toString</text>
  <line x1="674" y1="98" x2="706" y2="98" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#in10-ink)"/>
  <text class="in10-mono" x="712" y="102" font-size="10">null</text>

  <text class="in10-s" x="156" y="146" font-size="9">Dog.prototype.constructor 又指回 Dog</text>

  <text class="in10-s" x="44" y="178" font-size="9.5">构造函数这侧另有一条静态链</text>

  <rect class="in10-box" x="156" y="188" width="90" height="46" rx="3"/>
  <text class="in10-mono" x="201" y="216" font-size="10.5" text-anchor="middle">Dog</text>
  <line x1="250" y1="211" x2="286" y2="211" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#in10-ink)"/>

  <rect class="in10-box" x="290" y="188" width="100" height="46" rx="3"/>
  <text class="in10-mono" x="340" y="216" font-size="10.5" text-anchor="middle">Animal</text>
  <line x1="394" y1="211" x2="430" y2="211" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#in10-ink)"/>

  <rect class="in10-box" x="434" y="188" width="170" height="46" rx="3"/>
  <text class="in10-mono" x="519" y="216" font-size="10.5" text-anchor="middle">Function.prototype</text>

  <text class="in10-s" x="44" y="266" font-size="9.5">两条链互不相干：一条管实例上找不到的属性，一条管构造函数自己身上的静态方法</text>

</svg>
