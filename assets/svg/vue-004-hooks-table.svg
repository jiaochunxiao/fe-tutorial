<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 226" width="100%" role="img" aria-labelledby="v4ht v4hd">
  <title id="v4ht">四幕各能拿到什么，以及该在那里做什么</title>
  <desc id="v4hd">创建期：响应式数据已就绪但没有 DOM，适合初始化数据与发起请求，服务端渲染时除外。挂载期：DOM 已经存在，子组件也已全部挂载完，适合操作 DOM、初始化依赖 DOM 的第三方库。更新期：beforeUpdate 时数据已经新了但 DOM 还是旧的，updated 之后 DOM 才变新，适合处理依赖新 DOM 的后续逻辑。卸载期：beforeUnmount 时实例仍然完整，适合解绑事件、清理定时器、断开订阅。</desc>

  <style>
    .v4h-b{fill:#FBF7EE;stroke:#CDC4AF;stroke-width:1}
    .v4h-c{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .v4h-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .v4h-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .v4h-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <text class="v4h-t" x="40" y="24" font-size="8.5">同一个问题问四次：这一刻我能碰到什么？</text>

  <text class="v4h-s" x="40" y="46" font-size="7.5">幕</text>
  <text class="v4h-s" x="200" y="46" font-size="7.5">能拿到什么</text>
  <text class="v4h-s" x="450" y="46" font-size="7.5">该在这里做什么</text>

  <rect class="v4h-c" x="40" y="54" width="120" height="32" rx="1"/>
  <text class="v4h-t" x="100" y="74" font-size="8" text-anchor="middle">创建</text>
  <rect class="v4h-b" x="166" y="54" width="270" height="32" rx="1"/>
  <text class="v4h-s" x="178" y="74" font-size="7.5">响应式数据就绪，没有 DOM</text>
  <text class="v4h-s" x="450" y="74" font-size="7.5">初始化数据、发起首屏请求</text>

  <rect class="v4h-c" x="40" y="92" width="120" height="32" rx="1"/>
  <text class="v4h-t" x="100" y="112" font-size="8" text-anchor="middle">挂载</text>
  <rect class="v4h-b" x="166" y="92" width="270" height="32" rx="1"/>
  <text class="v4h-s" x="178" y="112" font-size="7.5">DOM 已存在，子组件也挂完了</text>
  <text class="v4h-s" x="450" y="112" font-size="7.5">操作 DOM、初始化三方库</text>

  <rect class="v4h-c" x="40" y="130" width="120" height="32" rx="1"/>
  <text class="v4h-t" x="100" y="150" font-size="8" text-anchor="middle">更新</text>
  <rect class="v4h-b" x="166" y="130" width="270" height="32" rx="1"/>
  <text class="v4h-s" x="178" y="150" font-size="7.5">数据已新，DOM 还是旧的</text>
  <text class="v4h-s" x="450" y="150" font-size="7.5">要读新 DOM 得等 updated</text>

  <rect class="v4h-c" x="40" y="168" width="120" height="32" rx="1"/>
  <text class="v4h-t" x="100" y="188" font-size="8" text-anchor="middle">卸载</text>
  <rect class="v4h-b" x="166" y="168" width="270" height="32" rx="1"/>
  <text class="v4h-s" x="178" y="188" font-size="7.5">实例仍然完整，一切还连着</text>
  <text class="v4h-s" x="450" y="188" font-size="7.5">解绑事件、清定时器、断订阅</text>

  <text class="v4h-t" x="40" y="218" font-size="8.5" style="fill:#B03A2E">记忆锚点：只有挂载期有 DOM 可碰，只有更新期「数据新 DOM 旧」——其余都是清理与准备。</text>
</svg>
