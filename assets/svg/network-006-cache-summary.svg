<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 244" width="100%" role="img" aria-labelledby="n6st n6sd">
  <title id="n6st">缓存的三道闸门：Service Worker、强缓存、协商</title>
  <desc id="n6sd">一个请求从发出到真正落到网络，要过三道闸门。第一道是 Service Worker，它是可编程的缓存，能完全接管请求。第二道是强缓存，内存或磁盘里的副本只要 max-age 没过就直接返回，连请求都不发。第三道是协商缓存，带上 ETag 或 Last-Modified 去问服务器，没变回 304 复用副本，变了回 200 拿新资源。每往下一层，代价就多一分。</desc>

  <style>
    .n6s-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.3}
    .n6s-alt{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.3}
    .n6s-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .n6s-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .n6s-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="n6s-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <rect class="n6s-box" x="60" y="24" width="240" height="36" rx="3"/>
  <text class="n6s-t" x="74" y="46" font-size="8.5">Service Worker</text>
  <text class="n6s-s" x="176" y="46" font-size="7.5">可编程缓存</text>
  <text class="n6s-s" x="318" y="40" font-size="8">命中就返回，完全由你写的策略决定</text>
  <text class="n6s-s" x="318" y="54" font-size="7.5">未命中 ↓</text>

  <rect class="n6s-alt" x="60" y="82" width="240" height="36" rx="3"/>
  <text class="n6s-t" x="74" y="104" font-size="8.5">强缓存</text>
  <text class="n6s-mono" x="128" y="104" font-size="7.5">max-age 未过</text>
  <text class="n6s-s" x="318" y="98" font-size="8">直接用内存/磁盘副本 —— 不发请求</text>
  <text class="n6s-s" x="318" y="112" font-size="7.5">过期 / no-cache ↓</text>

  <rect class="n6s-box" x="60" y="140" width="240" height="36" rx="3"/>
  <text class="n6s-t" x="74" y="162" font-size="8.5">协商缓存</text>
  <text class="n6s-mono" x="134" y="162" font-size="7.5">ETag / Last-Modified</text>
  <text class="n6s-s" x="318" y="156" font-size="8">要发请求，但可能只回 304</text>

  <line x1="48" y1="30" x2="48" y2="176" stroke="#B03A2E" stroke-width="2"/>
  <text class="n6s-s" x="40" y="196" font-size="7.5">代价递增 ↓</text>

  <rect class="n6s-box" x="430" y="140" width="250" height="36" rx="3"/>
  <text class="n6s-t" x="444" y="156" font-size="8">304 → 复用副本</text>
  <text class="n6s-t" x="444" y="170" font-size="8">200 → 新资源 + 新指纹</text>
  <line x1="300" y1="158" x2="426" y2="158" stroke="#B03A2E" stroke-width="1.4" marker-end="url(#n6s-red)"/>

  <line x1="40" y1="210" x2="700" y2="210" stroke="#CDC4AF" stroke-width="1"/>
  <text class="n6s-t" x="40" y="230" font-size="8.5" style="fill:#B03A2E">记忆口诀：SW 是「我写的规则」，强缓存是「别问」，协商缓存是「问一句就好」。</text>
</svg>
