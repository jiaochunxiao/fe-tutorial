<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 272" width="100%" role="img" aria-labelledby="t3mt t3md">
  <title id="t3mt">映射类型是类型的 map，条件类型是类型的三元</title>
  <desc id="t3md">映射类型遍历键重建类型，写法是 K in keyof T 加 T[K]，配加减 readonly 与可选修饰符，再用 as 做键重映射，写成 as never 就等于删键。条件类型是类型层面的三元表达式，裸的 T 遇到联合类型会逐成员分发再合并，Exclude 与 Extract 就是靠这个分发实现的；never 在分发里像橡皮擦，把成员抹掉；用元组包一层 [T] extends [U] 可以阻止分发。两大支柱组合出全部工具类型，比如 Omit 就是 Pick 加 Exclude。</desc>

  <style>
    .t3m-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .t3m-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .t3m-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .t3m-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .t3m-m{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <text class="t3m-t" x="40" y="26" font-size="8.5">两大支柱：一个遍历键，一个做判断 —— 工具类型全是它俩拼的</text>

  <rect class="t3m-b" x="40" y="42" width="330" height="150" rx="2"/>
  <text class="t3m-t" x="56" y="62" font-size="8.5">映射类型 · 类型的 map</text>
  <text class="t3m-m" x="56" y="82" font-size="7.5">{ [K in keyof T]: T[K] }</text>
  <text class="t3m-s" x="56" y="102" font-size="7">遍历 T 的每个键，重建一个同形状的类型</text>
  <rect class="t3m-q" x="56" y="112" width="140" height="24" rx="1"/>
  <text class="t3m-m" x="126" y="128" font-size="6.5" text-anchor="middle">±readonly ±?</text>
  <rect class="t3m-q" x="204" y="112" width="150" height="24" rx="1"/>
  <text class="t3m-m" x="279" y="128" font-size="6.5" text-anchor="middle">as `get${Capitalize}`</text>
  <text class="t3m-s" x="56" y="152" font-size="6.5">加/去只读、加/去可选，是修饰符</text>
  <text class="t3m-s" x="56" y="168" font-size="6.5">as 重映射键；写成 as never 等于删键</text>
  <text class="t3m-s" x="56" y="184" font-size="6.5">Readonly / Partial / Record 都是它</text>

  <rect class="t3m-b" x="386" y="42" width="314" height="150" rx="2"/>
  <text class="t3m-t" x="402" y="62" font-size="8.5">条件类型 · 类型的三元</text>
  <text class="t3m-m" x="402" y="82" font-size="7.5">T extends U ? X : Y</text>
  <text class="t3m-s" x="402" y="102" font-size="7">像三元表达式，只是算在类型上</text>
  <rect class="t3m-q" x="402" y="112" width="130" height="24" rx="1"/>
  <text class="t3m-m" x="467" y="128" font-size="6.5" text-anchor="middle">裸 T → 分发</text>
  <rect class="t3m-q" x="540" y="112" width="146" height="24" rx="1"/>
  <text class="t3m-m" x="613" y="128" font-size="6.5" text-anchor="middle">[T] extends [U] 阻断</text>
  <text class="t3m-s" x="402" y="152" font-size="6.5">裸 T 遇联合类型逐成员判定再合并</text>
  <text class="t3m-s" x="402" y="168" font-size="6.5">never 在分发里是橡皮擦，抹掉成员</text>
  <text class="t3m-s" x="402" y="184" font-size="6.5">Exclude / Extract 就是分发的产物</text>

  <text class="t3m-t" x="40" y="216" font-size="8">组合范例</text>
  <rect class="t3m-b" x="40" y="224" width="660" height="30" rx="2"/>
  <text class="t3m-m" x="56" y="243" font-size="7">Omit&lt;T, K&gt; = Pick&lt;T, Exclude&lt;keyof T, K&gt;&gt;</text>
  <text class="t3m-s" x="366" y="243" font-size="6.5">映射 + 条件，一行拼出来 —— 这就是「会写工具类型」的起点</text>
</svg>
