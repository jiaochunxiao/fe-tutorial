<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 240" width="100%" role="img" aria-labelledby="r5ct r5cd">
  <title id="r5ct">闭包陷阱：effect 是当次渲染快照的囚徒</title>
  <desc id="r5cd">每次渲染都会生成一份快照，渲染一里 count 是零，渲染二里是一，渲染三里是二，effect 拿到的是它那一轮的快照，不会自动变新。两个经典症状：setCount(count+1) 连着调两次只加一，因为两次读到的都是同一个旧值；依赖写空数组配 setInterval，定时器里永远用第一轮的旧值计算。四条逃生通道：改用函数式更新、把依赖写全让 effect 重建、用 ref 持有最新值、或者改用 useReducer。</desc>

  <style>
    .r5c-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .r5c-p{fill:#FBF7EE;stroke:#CDC4AF;stroke-width:1}
    .r5c-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .r5c-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .r5c-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="r5c-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="r5c-t" x="40" y="24" font-size="8.5">每次渲染 = 一份快照，effect 只认它自己那份</text>

  <rect class="r5c-b" x="40" y="38" width="170" height="40" rx="2"/>
  <text class="r5c-t" x="125" y="56" font-size="8.5" text-anchor="middle">渲染 1</text>
  <text class="r5c-mono" x="125" y="70" font-size="7.5" text-anchor="middle">count = 0</text>

  <line x1="210" y1="58" x2="240" y2="58" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#r5c-ink)"/>

  <rect class="r5c-b" x="245" y="38" width="170" height="40" rx="2"/>
  <text class="r5c-t" x="330" y="56" font-size="8.5" text-anchor="middle">渲染 2</text>
  <text class="r5c-mono" x="330" y="70" font-size="7.5" text-anchor="middle">count = 1</text>

  <line x1="415" y1="58" x2="445" y2="58" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#r5c-ink)"/>

  <rect class="r5c-b" x="450" y="38" width="170" height="40" rx="2"/>
  <text class="r5c-t" x="535" y="56" font-size="8.5" text-anchor="middle">渲染 3</text>
  <text class="r5c-mono" x="535" y="70" font-size="7.5" text-anchor="middle">count = 2</text>

  <text class="r5c-s" x="636" y="62" font-size="7.5">互不影响</text>

  <text class="r5c-t" x="40" y="104" font-size="8.5" style="fill:#B03A2E">effect 拿到的是它那一轮的快照 —— 状态更新了，快照不会跟着变。</text>

  <rect class="r5c-p" x="40" y="116" width="320" height="38" rx="2"/>
  <text class="r5c-mono" x="52" y="133" font-size="7.5">setCount(count + 1) × 2</text>
  <text class="r5c-s" x="52" y="147" font-size="7.5">两次读到的都是同一个旧值 → 只 +1</text>

  <rect class="r5c-p" x="380" y="116" width="320" height="38" rx="2"/>
  <text class="r5c-mono" x="392" y="133" font-size="7.5">useEffect(fn, []) + setInterval</text>
  <text class="r5c-s" x="392" y="147" font-size="7.5">定时器里永远用第一轮的旧值算</text>

  <text class="r5c-t" x="40" y="176" font-size="8.5">四条逃生通道</text>

  <rect class="r5c-b" x="40" y="186" width="160" height="28" rx="2"/>
  <text class="r5c-t" x="120" y="204" font-size="8" text-anchor="middle">① 函数式更新</text>
  <rect class="r5c-b" x="213" y="186" width="160" height="28" rx="2"/>
  <text class="r5c-t" x="293" y="204" font-size="8" text-anchor="middle">② 写全依赖</text>
  <rect class="r5c-b" x="386" y="186" width="160" height="28" rx="2"/>
  <text class="r5c-t" x="466" y="204" font-size="8" text-anchor="middle">③ ref.current</text>
  <rect class="r5c-b" x="559" y="186" width="141" height="28" rx="2"/>
  <text class="r5c-t" x="629" y="204" font-size="8" text-anchor="middle">④ useReducer</text>

  <text class="r5c-t" x="40" y="232" font-size="8.5">effect 是「声明式同步」，不是生命周期钩子 —— 它同步的是「这一份快照」。</text>
</svg>
