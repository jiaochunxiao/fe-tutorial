<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 344" width="100%" role="img" aria-labelledby="c4t c4d">
  <title id="c4t">ToPrimitive：对象转原始值的三次尝试</title>
  <desc id="c4d">对象参与运算时先转成原始值。第一步看有没有 Symbol.toPrimitive，有就调用它并直接采用返回值。没有就调用 valueOf，返回值是原始值就用它。还不是原始值就调用 toString，是原始值就用它。三个都没能给出原始值，抛 TypeError。</desc>

  <style>
    .c4-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .c4-key{fill:#FBF7EE;stroke:#B03A2E;stroke-width:1.6}
    .c4-end{fill:none;stroke:#CDC4AF;stroke-width:1.2;stroke-dasharray:5 4}
    .c4-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .c4-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="c4-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="c4-cin" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <rect class="c4-key" x="40" y="48" width="380" height="52" rx="3"/>
  <text class="c4-mono" x="60" y="79" font-size="12.5">① Symbol.toPrimitive</text>
  <text class="c4-small" x="400" y="78" font-size="9.5" text-anchor="end">有就一票否决</text>

  <line x1="420" y1="74" x2="436" y2="74" stroke="#B03A2E" stroke-width="1.6" marker-end="url(#c4-cin)"/>
  <text class="c4-small" x="444" y="78" font-size="10.5">有 → 调它，返回值直接用</text>

  <line x1="88" y1="100" x2="88" y2="124" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#c4-ink)"/>
  <text class="c4-small" x="100" y="118" font-size="9.5">没有这个方法</text>

  <rect class="c4-box" x="40" y="124" width="380" height="52" rx="3"/>
  <text class="c4-mono" x="60" y="155" font-size="12.5">② valueOf()</text>
  <line x1="420" y1="150" x2="436" y2="150" stroke="#B03A2E" stroke-width="1.6" marker-end="url(#c4-cin)"/>
  <text class="c4-small" x="444" y="154" font-size="10.5">是原始值 → 用它，结束</text>

  <line x1="88" y1="176" x2="88" y2="200" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#c4-ink)"/>
  <text class="c4-small" x="100" y="194" font-size="9.5">返回的还是对象</text>

  <rect class="c4-box" x="40" y="200" width="380" height="52" rx="3"/>
  <text class="c4-mono" x="60" y="231" font-size="12.5">③ toString()</text>
  <line x1="420" y1="226" x2="436" y2="226" stroke="#B03A2E" stroke-width="1.6" marker-end="url(#c4-cin)"/>
  <text class="c4-small" x="444" y="230" font-size="10.5">是原始值 → 用它，结束</text>

  <line x1="88" y1="252" x2="88" y2="276" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#c4-ink)"/>
  <text class="c4-small" x="100" y="270" font-size="9.5">也不是</text>

  <rect class="c4-end" x="40" y="276" width="380" height="44" rx="3"/>
  <text class="c4-mono" x="60" y="298" font-size="11" style="fill:#B03A2E">④ 都失败</text>
  <text class="c4-mono" x="60" y="313" font-size="9.5" style="fill:#6E675A">TypeError: Cannot convert object to primitive value</text>

</svg>
