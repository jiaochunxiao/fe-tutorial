<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="100%" role="img" aria-labelledby="bb2t bb2d">
  <title id="bb2t">渲染进程里的四条线程与绘制流水线</title>
  <desc id="bb2d">主线程同时承担 JS 执行、样式、布局、绘制计算与事件循环，它把绘制指令交给光栅线程组变成像素，图块再交给合成线程拼成帧。IO 线程负责与浏览器进程收发 IPC，回调经任务队列回到主线程。滚动时若图块已光栅化，合成线程自己挪位置拼贴，完全不经过主线程。</desc>

  <style>
    .bb2-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .bb2-key{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.6}
    .bb2-wrap{fill:none;stroke:#CDC4AF;stroke-width:1}
    .bb2-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .bb2-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .bb2-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="bb2-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="bb2-ink-l" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10 0 L0 5 L10 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <rect class="bb2-wrap" x="20" y="34" width="716" height="350" rx="4"/>
  <text class="bb2-s" x="36" y="25" font-size="10.5" letter-spacing="1.6">渲染进程</text>

  <rect class="bb2-key" x="52" y="78" width="180" height="116" rx="3"/>
  <text class="bb2-t" x="68" y="104" font-size="12.5">主线程</text>
  <text class="bb2-s" x="68" y="130" font-size="10.5">JS 执行</text>
  <text class="bb2-s" x="68" y="148" font-size="10.5">DOM / 样式 / 布局 / 绘制</text>
  <text class="bb2-s" x="68" y="166" font-size="10.5">事件循环</text>

  <rect class="bb2-box" x="296" y="92" width="140" height="88" rx="3"/>
  <text class="bb2-t" x="312" y="118" font-size="11.5">光栅线程组</text>
  <text class="bb2-s" x="312" y="140" font-size="10">指令 → 像素</text>
  <text class="bb2-s" x="312" y="158" font-size="10">GPU 加速</text>

  <rect class="bb2-box" x="496" y="92" width="148" height="88" rx="3"/>
  <text class="bb2-t" x="512" y="118" font-size="11.5">合成线程</text>
  <text class="bb2-s" x="512" y="140" font-size="10">把图块拼成帧</text>
  <text class="bb2-s" x="512" y="158" font-size="10">滚动可独立响应</text>

  <line x1="236" y1="136" x2="292" y2="136" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#bb2-ink)"/>
  <line x1="440" y1="136" x2="492" y2="136" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#bb2-ink)"/>

  <line x1="570" y1="180" x2="570" y2="198" stroke="#B03A2E" stroke-width="1.2"/>
  <text class="bb2-s" x="570" y="214" font-size="9.5" text-anchor="middle" style="fill:#B03A2E">滚动只是把现成图块挪位置</text>
  <text class="bb2-s" x="570" y="229" font-size="9.5" text-anchor="middle" style="fill:#B03A2E">主线程卡死也照样滚</text>

  <rect class="bb2-box" x="52" y="300" width="180" height="68" rx="3"/>
  <text class="bb2-t" x="68" y="326" font-size="11.5">IO 线程</text>
  <text class="bb2-s" x="68" y="348" font-size="10">与浏览器进程收发 IPC</text>

  <line x1="142" y1="296" x2="142" y2="200" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#bb2-ink)"/>
  <text class="bb2-s" x="152" y="250" font-size="9.5">回调入队</text>

  <rect class="bb2-box" x="496" y="300" width="148" height="68" rx="3"/>
  <text class="bb2-t" x="512" y="326" font-size="11.5">浏览器进程</text>
  <text class="bb2-s" x="512" y="348" font-size="10">标签页之外的那个</text>

  <line x1="240" y1="334" x2="492" y2="334" stroke="#1C1A17" stroke-width="1.2" marker-start="url(#bb2-ink-l)" marker-end="url(#bb2-ink)"/>
  <text class="bb2-mono" x="366" y="326" font-size="9.5" text-anchor="middle">IPC</text>

</svg>
