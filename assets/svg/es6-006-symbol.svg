<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 244" width="100%" role="img" aria-labelledby="e66t e66d">
  <title id="e66t">三种 Symbol 与「它不是私有」这件事</title>
  <desc id="e66d">Symbol() 每次调用都返回全新的唯一值，用来做防撞的键或内部标记，而且不会被 for in 和 Object.keys 枚举到。Symbol.for() 走一张全局注册表，同一个字符串拿到的是同一个 Symbol，所以能跨模块共享。内置的 Symbol 是语言挂钩，比如 Symbol.iterator 让对象能被 for of 遍历。但要注意：Symbol 键不等于私有，用 getOwnPropertySymbols 照样能读到，真正的私有是 class 的井号字段。</desc>

  <style>
    .e66-chip{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.2}
    .e66-chip2{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.2}
    .e66-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .e66-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .e66-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="e66-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="e66-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <rect class="e66-chip" x="40" y="26" width="120" height="28" rx="2"/>
  <text class="e66-mono" x="100" y="45" font-size="8.5" text-anchor="middle">Symbol()</text>
  <line x1="160" y1="40" x2="196" y2="40" stroke="#1C1A17" stroke-width="1.3" marker-end="url(#e66-ink)"/>
  <text class="e66-t" x="204" y="36" font-size="8.5">私有唯一键</text>
  <text class="e66-s" x="204" y="50" font-size="7.5">防撞、内部标记；枚举隐身（for in / keys 都看不到）</text>

  <rect class="e66-chip" x="40" y="70" width="120" height="28" rx="2"/>
  <text class="e66-mono" x="100" y="89" font-size="8.5" text-anchor="middle">Symbol.for()</text>
  <line x1="160" y1="84" x2="196" y2="84" stroke="#1C1A17" stroke-width="1.3" marker-end="url(#e66-ink)"/>
  <text class="e66-t" x="204" y="80" font-size="8.5">全局注册表</text>
  <text class="e66-s" x="204" y="94" font-size="7.5">同一个字符串拿到的永远是同一个 —— 跨模块共享</text>

  <rect class="e66-chip2" x="40" y="114" width="120" height="28" rx="2"/>
  <text class="e66-mono" x="100" y="133" font-size="8.5" text-anchor="middle">Symbol.iterator</text>
  <line x1="160" y1="128" x2="196" y2="128" stroke="#B03A2E" stroke-width="1.3" marker-end="url(#e66-red)"/>
  <text class="e66-t" x="204" y="124" font-size="8.5" style="fill:#B03A2E">语言挂钩（元编程）</text>
  <text class="e66-s" x="204" y="138" font-size="7.5">定义「这个对象在语法里怎么表现」—— 遍历 / 转字符串 / instanceof</text>

  <line x1="40" y1="160" x2="700" y2="160" stroke="#CDC4AF" stroke-width="1"/>

  <text class="e66-t" x="40" y="182" font-size="8.5">安全性辨析：Symbol 键 ≠ 私有</text>
  <text class="e66-s" x="40" y="202" font-size="8">它只是「不会被常规枚举扫到」，<tspan class="e66-mono" font-size="8">Object.getOwnPropertySymbols(obj)</tspan> 照样能拿到。</text>
  <text class="e66-s" x="40" y="220" font-size="8">把它当「约定俗成的私有」可以，当「安全边界」不行 —— 真私有是 class 的 <tspan class="e66-mono" font-size="8">#field</tspan>，语言层面就取不到。</text>
  <text class="e66-t" x="40" y="238" font-size="8.5" style="fill:#B03A2E">一句话：Symbol 解决的是「键名撞车」，不是「别人看不见」。</text>
</svg>
