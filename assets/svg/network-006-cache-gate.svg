<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 434" width="100%" role="img" aria-labelledby="c1t c1d">
  <title id="c1t">浏览器缓存的两级闸门</title>
  <desc id="c1d">请求先过强缓存：未过期直接返回 200 from cache，不发请求；过期后进入协商缓存，带指纹问服务器，没变返回 304 无响应体，变了返回 200 与新资源。</desc>
  <defs>
    <marker id="c1-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="c1-cin" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
    <marker id="c1-mut" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6E675A"/>
    </marker>
  </defs>

  <style>
    .c1-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.6}
    .c1-hit{fill:#FBF7EE;stroke:#B03A2E;stroke-width:1.5}
    .c1-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .c1-serif{font-family:'Noto Serif SC','Songti SC','SimSun',serif;fill:#1C1A17}
    .c1-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .c1-lbl{font-family:'Inter','Noto Sans SC',sans-serif;font-size:10.5px;fill:#6E675A}
  </style>

  <!-- 起点 -->
  <rect class="c1-box" x="40" y="36" width="300" height="52" rx="4"/>
  <text class="c1-serif" x="190" y="68" font-size="14" text-anchor="middle">请求一个资源</text>

  <!-- ① 强缓存 -->
  <rect class="c1-box" x="40" y="132" width="300" height="64" rx="4"/>
  <text class="c1-mono" x="60" y="158" font-size="13" font-weight="700">① 强缓存</text>
  <text class="c1-small" x="60" y="176" font-size="10.5">本地拍板，不发请求</text>
  <text class="c1-mono" x="320" y="158" font-size="9.5" text-anchor="end" style="fill:#6E675A">Cache-Control</text>
  <text class="c1-mono" x="320" y="176" font-size="9.5" text-anchor="end" style="fill:#6E675A">max-age / Expires</text>

  <!-- ② 协商缓存 -->
  <rect class="c1-box" x="40" y="250" width="300" height="64" rx="4"/>
  <text class="c1-mono" x="60" y="276" font-size="13" font-weight="700">② 协商缓存</text>
  <text class="c1-small" x="60" y="294" font-size="10.5">带指纹问服务器</text>
  <text class="c1-mono" x="320" y="276" font-size="9.5" text-anchor="end" style="fill:#6E675A">If-None-Match</text>
  <text class="c1-mono" x="320" y="294" font-size="9.5" text-anchor="end" style="fill:#6E675A">If-Modified-Since</text>

  <!-- 终点 -->
  <rect class="c1-box" x="40" y="368" width="300" height="52" rx="4"/>
  <text class="c1-mono" x="190" y="392" font-size="12.5" text-anchor="middle" font-weight="700">200 OK</text>
  <text class="c1-small" x="190" y="409" font-size="10.5" text-anchor="middle">新资源 + 新指纹</text>

  <!-- 结果卡 A -->
  <rect class="c1-hit" x="420" y="140" width="290" height="48" rx="4"/>
  <text class="c1-mono" x="438" y="162" font-size="12" font-weight="700" style="fill:#B03A2E">200 from cache</text>
  <text class="c1-small" x="438" y="179" font-size="10.5">0 次网络请求 · 最快</text>

  <!-- 结果卡 B -->
  <rect class="c1-hit" x="420" y="258" width="290" height="48" rx="4"/>
  <text class="c1-mono" x="438" y="280" font-size="12" font-weight="700" style="fill:#B03A2E">304 Not Modified</text>
  <text class="c1-small" x="438" y="297" font-size="10.5">无 body，仍用本地副本</text>

  <!-- 连线 -->
  <line x1="190" y1="88" x2="190" y2="128" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#c1-ink)"/>
  <line x1="342" y1="164" x2="416" y2="164" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#c1-cin)"/>
  <text class="c1-lbl" x="379" y="155" text-anchor="middle" style="fill:#B03A2E">未过期</text>
  <line x1="190" y1="196" x2="190" y2="246" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#c1-ink)"/>
  <text class="c1-lbl" x="202" y="226">过期 / 没有强缓存</text>
  <line x1="342" y1="282" x2="416" y2="282" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#c1-cin)"/>
  <text class="c1-lbl" x="379" y="273" text-anchor="middle" style="fill:#B03A2E">没变</text>
  <line x1="190" y1="314" x2="190" y2="364" stroke="#1C1A17" stroke-width="1.6" marker-end="url(#c1-ink)"/>
  <text class="c1-lbl" x="202" y="344">变了</text>

</svg>
