<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 250" width="100%" role="img" aria-labelledby="h10tt h10td">
  <title id="h10tt">编译只做一次，运行时每改一次数据走一遍环</title>
  <desc id="h10td">上排是编译时：模板字符串经 parse、transform、generate 变成代码串，再由 new Function 生成 render 函数，整段只跑一次。下排是运行时：render 读 ctx.message 时被 track 记进账本，用户改动 message 触发 trigger，重渲染并 patch 到 DOM；这条环每改一次数据就走一遍。编译的终点正好是运行时的起点，两段接起来才是完整的 mini-Vue。</desc>

  <style>
    .h10t-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .h10t-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .h10t-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .h10t-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="h10t-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="h10t-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="h10t-t" x="40" y="26" font-size="8.5">编译时做一次，运行时每改一次数据走一遍环</text>

  <text class="h10t-s" x="40" y="48" font-size="7">编译时 · 一次性</text>
  <rect class="h10t-b" x="40" y="56" width="100" height="32" rx="2"/>
  <text class="h10t-t" x="90" y="76" font-size="7.5" text-anchor="middle">模板字符串</text>
  <rect class="h10t-b" x="152" y="56" width="100" height="32" rx="2"/>
  <text class="h10t-t" x="202" y="76" font-size="7.5" text-anchor="middle">parse → AST</text>
  <rect class="h10t-b" x="264" y="56" width="100" height="32" rx="2"/>
  <text class="h10t-t" x="314" y="76" font-size="7.5" text-anchor="middle">transform</text>
  <rect class="h10t-b" x="376" y="56" width="100" height="32" rx="2"/>
  <text class="h10t-t" x="426" y="76" font-size="7.5" text-anchor="middle">generate</text>
  <rect class="h10t-b" x="488" y="56" width="100" height="32" rx="2"/>
  <text class="h10t-t" x="538" y="76" font-size="7.5" text-anchor="middle">new Function</text>
  <rect class="h10t-q" x="600" y="56" width="100" height="32" rx="2"/>
  <text class="h10t-t" x="650" y="76" font-size="7.5" text-anchor="middle">render 函数</text>

  <line x1="142" y1="72" x2="148" y2="72" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h10t-ink)"/>
  <line x1="254" y1="72" x2="260" y2="72" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h10t-ink)"/>
  <line x1="366" y1="72" x2="372" y2="72" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h10t-ink)"/>
  <line x1="478" y1="72" x2="484" y2="72" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h10t-ink)"/>
  <line x1="590" y1="72" x2="596" y2="72" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h10t-ink)"/>

  <path d="M650 88 V112 H95 V144" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h10t-ink)"/>
  <text class="h10t-s" x="376" y="108" font-size="7" text-anchor="middle">编译的终点就是运行时的起点</text>

  <text class="h10t-s" x="40" y="140" font-size="7">运行时 · 每次更新</text>
  <rect class="h10t-q" x="40" y="148" width="110" height="32" rx="2"/>
  <text class="h10t-t" x="95" y="168" font-size="7.5" text-anchor="middle">render 读 ctx</text>
  <rect class="h10t-b" x="168" y="148" width="110" height="32" rx="2"/>
  <text class="h10t-t" x="223" y="168" font-size="7.5" text-anchor="middle">track 记账</text>
  <rect class="h10t-b" x="296" y="148" width="110" height="32" rx="2"/>
  <text class="h10t-t" x="351" y="168" font-size="7.5" text-anchor="middle">修改 message</text>
  <rect class="h10t-b" x="424" y="148" width="110" height="32" rx="2"/>
  <text class="h10t-t" x="479" y="168" font-size="7.5" text-anchor="middle">trigger 查账</text>
  <rect class="h10t-b" x="552" y="148" width="110" height="32" rx="2"/>
  <text class="h10t-t" x="607" y="168" font-size="7.5" text-anchor="middle">重渲染 → patch</text>

  <line x1="152" y1="164" x2="166" y2="164" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h10t-ink)"/>
  <line x1="280" y1="164" x2="294" y2="164" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h10t-ink)"/>
  <line x1="408" y1="164" x2="422" y2="164" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h10t-ink)"/>
  <line x1="536" y1="164" x2="550" y2="164" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h10t-ink)"/>

  <path d="M607 180 V204 H95 V184" fill="none" stroke="#B03A2E" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#h10t-red)"/>
  <text class="h10t-s" x="350" y="218" font-size="7" text-anchor="middle" style="fill:#B03A2E">改一次数据就走一圈，不需要重新编译</text>

  <text class="h10t-t" x="40" y="242" font-size="8.5" style="fill:#B03A2E">模板只编译一次，环却要走一辈子 —— 这就是「写的是模板，跑的是函数」。</text>
</svg>
