<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 268" width="100%" role="img" aria-labelledby="t5nt t5nd">
  <title id="t5nt">收窄是控制流分析，判别联合让它变成工程纪律</title>
  <desc id="t5nd">收窄的本质是控制流分析：编译器沿着代码路径证明这里只可能是更窄的类型。内置手段有 typeof、等值比较与 switch、in、instanceof、真值判断，其中真值判断会把 0 和空串一起排掉，口径偏宽要小心。自定义守卫用 v is X 把判定逻辑函数化，但必须诚实。判别联合把 status 当标签，switch 之后每个分支里类型精确，不可能的组合自然绝迹；再配一个 assertNever 兜底，将来新增成员漏改就编译报错。盲区是回调里收窄会失效、可变引用也会失效，用 const 快照或 as const 解决。</desc>

  <style>
    .t5n-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .t5n-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .t5n-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .t5n-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .t5n-m{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="t5n-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="t5n-t" x="40" y="26" font-size="8.5">收窄 = 编译器沿路径证明「这里只可能是更窄的类型」</text>

  <text class="t5n-s" x="40" y="50" font-size="7">内置五手段</text>
  <rect class="t5n-b" x="40" y="58" width="96" height="26" rx="1"/>
  <text class="t5n-m" x="88" y="75" font-size="6.5" text-anchor="middle">typeof</text>
  <rect class="t5n-b" x="144" y="58" width="110" height="26" rx="1"/>
  <text class="t5n-m" x="199" y="75" font-size="6.5" text-anchor="middle">=== / switch</text>
  <rect class="t5n-b" x="262" y="58" width="70" height="26" rx="1"/>
  <text class="t5n-m" x="297" y="75" font-size="6.5" text-anchor="middle">in</text>
  <rect class="t5n-b" x="340" y="58" width="96" height="26" rx="1"/>
  <text class="t5n-m" x="388" y="75" font-size="6.5" text-anchor="middle">instanceof</text>
  <rect class="t5n-q" x="444" y="58" width="120" height="26" rx="1"/>
  <text class="t5n-m" x="504" y="75" font-size="6.5" text-anchor="middle" style="fill:#B03A2E">真值（口径偏宽）</text>
  <text class="t5n-s" x="40" y="100" font-size="6.5">真值判断会把 0、空串、NaN 一起排掉 —— 想只排除 null 就写 !== null。</text>

  <text class="t5n-t" x="40" y="128" font-size="8">判别联合：把「不可能的组合」交给编译器</text>

  <rect class="t5n-b" x="40" y="136" width="330" height="60" rx="2"/>
  <text class="t5n-m" x="56" y="154" font-size="6.5">{ status: 'error', message: string }</text>
  <text class="t5n-m" x="56" y="170" font-size="6.5">{ status: 'success', data: T }</text>
  <text class="t5n-s" x="56" y="188" font-size="6.5">标签让两种状态成为两个类型，而不是一堆可选字段</text>

  <line x1="372" y1="166" x2="396" y2="166" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#t5n-ink)"/>
  <text class="t5n-s" x="384" y="160" font-size="6" text-anchor="middle">switch</text>

  <rect class="t5n-q" x="400" y="136" width="300" height="60" rx="2"/>
  <text class="t5n-s" x="414" y="154" font-size="6.5">case 'error' → 分支内只有 message，没有 data</text>
  <text class="t5n-s" x="414" y="170" font-size="6.5">case 'success' → 分支内只有 data</text>
  <text class="t5n-s" x="414" y="188" font-size="6.5">default: assertNever(x) —— 将来新增成员漏改即报错</text>

  <text class="t5n-t" x="40" y="220" font-size="8">两个盲区</text>
  <text class="t5n-s" x="40" y="236" font-size="7.5">回调里收窄会失效（编译器不敢保证回调执行时类型没变）→ 先把值存进 const</text>
  <text class="t5n-s" x="40" y="252" font-size="7.5">可变引用同样失效 → const 快照，或 as const 把字面量锁死</text>

  <text class="t5n-t" x="600" y="220" font-size="8" style="fill:#B03A2E">守卫要诚实</text>
  <text class="t5n-s" x="600" y="236" font-size="6.5">v is X 是你对编译器</text>
  <text class="t5n-s" x="600" y="248" font-size="6.5">打的包票，写错它不会</text>
  <text class="t5n-s" x="600" y="260" font-size="6.5">替你兜底。</text>
</svg>
