<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 46 740 200" width="100%" role="img" aria-labelledby="pr5t pr5d">
  <title id="pr5t">渲染管线的四段，以及三种改动各自要跑多远</title>
  <desc id="pr5d">渲染管线依次是样式计算、布局、绘制、合成。改几何尺寸要从样式一路跑到合成，整条链都跑一遍，最贵；改颜色阴影这类外观只要从绘制开始；而 transform 和 opacity 只走合成，最便宜。</desc>

  <style>
    .pr5-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .pr5-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .pr5-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .pr5-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="pr5-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <rect class="pr5-box" x="60" y="66" width="140" height="60" rx="3"/>
  <text class="pr5-mono" x="130" y="92" font-size="10.5" text-anchor="middle">Style</text>
  <text class="pr5-s" x="130" y="110" font-size="9" text-anchor="middle">样式计算</text>

  <line x1="204" y1="96" x2="226" y2="96" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#pr5-ink)"/>

  <rect class="pr5-box" x="230" y="66" width="140" height="60" rx="3"/>
  <text class="pr5-mono" x="300" y="92" font-size="10.5" text-anchor="middle">Layout</text>
  <text class="pr5-s" x="300" y="110" font-size="9" text-anchor="middle">布局</text>

  <line x1="374" y1="96" x2="396" y2="96" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#pr5-ink)"/>

  <rect class="pr5-box" x="400" y="66" width="140" height="60" rx="3"/>
  <text class="pr5-mono" x="470" y="92" font-size="10.5" text-anchor="middle">Paint</text>
  <text class="pr5-s" x="470" y="110" font-size="9" text-anchor="middle">绘制</text>

  <line x1="544" y1="96" x2="566" y2="96" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#pr5-ink)"/>

  <rect class="pr5-box" x="570" y="66" width="140" height="60" rx="3"/>
  <text class="pr5-mono" x="640" y="92" font-size="10.5" text-anchor="middle">Composite</text>
  <text class="pr5-s" x="640" y="110" font-size="9" text-anchor="middle">合成</text>

  <line x1="60" y1="164" x2="710" y2="164" stroke="#B03A2E" stroke-width="6" stroke-linecap="round"/>
  <text class="pr5-s" x="60" y="156" font-size="9.5" style="fill:#B03A2E">改几何 —— 整条链</text>

  <line x1="400" y1="192" x2="710" y2="192" stroke="#B03A2E" stroke-width="6" stroke-linecap="round" opacity="0.72"/>
  <text class="pr5-s" x="400" y="184" font-size="9.5" style="fill:#B03A2E">改外观 —— 从 Paint 起</text>

  <line x1="570" y1="220" x2="710" y2="220" stroke="#B03A2E" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
  <text class="pr5-s" x="564" y="212" font-size="9.5" text-anchor="end" style="fill:#B03A2E">transform / opacity —— 只合成</text>

</svg>
