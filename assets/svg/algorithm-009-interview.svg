<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 270" width="100%" role="img" aria-labelledby="a9it a9id">
  <title id="a9it">大厂算法真题的五种题型，和答题的三段式</title>
  <desc id="a9id">上排五张卡片是真题的五个类型：输出串烧考事件循环与 this，调度器考并发、顺序与容错，性能场景考虚拟列表与优化分层，手写组合考防抖加竞态加 hooks 封装，结构题留待下一波。这些考点的出处都在课程已有篇目里，没有新知识。下排是答题三段式：先识别考点对应哪一篇，再分层陈述先框架后细节，最后主动升级谈边界、取舍与备选方案。先说方案再写码，是大厂面试的隐形规则。</desc>

  <style>
    .a9i-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .a9i-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .a9i-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .a9i-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="a9i-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="a9i-t" x="40" y="26" font-size="8.5">真题五型 —— 考的不是新知识，是已有知识的组合</text>

  <rect class="a9i-b" x="40" y="48" width="124" height="80" rx="2"/>
  <text class="a9i-t" x="102" y="68" font-size="8" text-anchor="middle">输出串烧</text>
  <text class="a9i-s" x="102" y="88" font-size="7" text-anchor="middle">事件循环 + this</text>
  <text class="a9i-s" x="102" y="104" font-size="6.5" text-anchor="middle">js-async-005 / 007</text>
  <text class="a9i-s" x="102" y="118" font-size="6.5" text-anchor="middle">js-deep-006</text>

  <rect class="a9i-b" x="175" y="48" width="124" height="80" rx="2"/>
  <text class="a9i-t" x="237" y="68" font-size="8" text-anchor="middle">调度器</text>
  <text class="a9i-s" x="237" y="88" font-size="7" text-anchor="middle">并发 · 顺序 · 容错</text>
  <text class="a9i-s" x="237" y="104" font-size="6.5" text-anchor="middle">js-async-004 / 008</text>
  <text class="a9i-s" x="237" y="118" font-size="6.5" text-anchor="middle">固定 worker + 游标</text>

  <rect class="a9i-b" x="310" y="48" width="124" height="80" rx="2"/>
  <text class="a9i-t" x="372" y="68" font-size="8" text-anchor="middle">性能场景</text>
  <text class="a9i-s" x="372" y="88" font-size="7" text-anchor="middle">虚拟列表 / 分层</text>
  <text class="a9i-s" x="372" y="104" font-size="6.5" text-anchor="middle">performance-006</text>
  <text class="a9i-s" x="372" y="118" font-size="6.5" text-anchor="middle">rendering 系列</text>

  <rect class="a9i-b" x="445" y="48" width="124" height="80" rx="2"/>
  <text class="a9i-t" x="507" y="68" font-size="8" text-anchor="middle">手写组合</text>
  <text class="a9i-s" x="507" y="88" font-size="7" text-anchor="middle">防抖 + 竞态 + hooks</text>
  <text class="a9i-s" x="507" y="104" font-size="6.5" text-anchor="middle">handwritten 系列</text>
  <text class="a9i-s" x="507" y="118" font-size="6.5" text-anchor="middle">框架封装</text>

  <rect class="a9i-b" x="580" y="48" width="124" height="80" rx="2"/>
  <text class="a9i-t" x="642" y="68" font-size="8" text-anchor="middle">结构题</text>
  <text class="a9i-s" x="642" y="88" font-size="7" text-anchor="middle">easy ~ medium</text>
  <text class="a9i-s" x="642" y="104" font-size="6.5" text-anchor="middle">考稳不考难</text>
  <text class="a9i-s" x="642" y="118" font-size="6.5" text-anchor="middle">下一波</text>

  <text class="a9i-t" x="40" y="158" font-size="8.5">答题三段式 —— 先说方案，再写码</text>

  <rect class="a9i-q" x="60" y="170" width="180" height="50" rx="2"/>
  <text class="a9i-t" x="150" y="190" font-size="8" text-anchor="middle">① 识别考点</text>
  <text class="a9i-s" x="150" y="206" font-size="7" text-anchor="middle">这题在考哪一篇</text>

  <line x1="244" y1="195" x2="274" y2="195" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#a9i-ink)"/>

  <rect class="a9i-q" x="280" y="170" width="180" height="50" rx="2"/>
  <text class="a9i-t" x="370" y="190" font-size="8" text-anchor="middle">② 分层陈述</text>
  <text class="a9i-s" x="370" y="206" font-size="7" text-anchor="middle">先框架，后细节</text>

  <line x1="464" y1="195" x2="494" y2="195" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#a9i-ink)"/>

  <rect class="a9i-q" x="500" y="170" width="180" height="50" rx="2"/>
  <text class="a9i-t" x="590" y="190" font-size="8" text-anchor="middle">③ 主动升级</text>
  <text class="a9i-s" x="590" y="206" font-size="7" text-anchor="middle">边界、取舍、备选方案</text>

  <text class="a9i-t" x="40" y="252" font-size="8.5" style="fill:#B03A2E">识别考点比刷量重要 —— 面试官要听的是「你知道自己在解决哪一类问题」。</text>
</svg>
