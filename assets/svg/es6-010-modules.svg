<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 220" width="100%" role="img" aria-labelledby="e6at e6ad">
  <title id="e6at">静态依赖图的三级火箭</title>
  <desc id="e6ad">ESM 的 import 必须写在顶层、路径必须是字符串字面量，这些限制换来的是一张运行前就能画完的依赖图。有了这张图，编译期可以先分析，然后做 tree-shaking 把没用到的导出整体剔除，最后浏览器或 CDN 还能按图并行预加载。而 CJS 的 require 可以写在 if 里、路径可以是拼出来的，运行之前谁也不知道依赖谁，后面两步就都无从下手。</desc>

  <style>
    .e6a-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.3}
    .e6a-alt{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.3}
    .e6a-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .e6a-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .e6a-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="e6a-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <rect class="e6a-box" x="40" y="36" width="190" height="52" rx="3"/>
  <text class="e6a-t" x="135" y="58" font-size="9" text-anchor="middle">① 编译期分析</text>
  <text class="e6a-s" x="135" y="76" font-size="7.5" text-anchor="middle">画出一张完整的依赖图</text>
  <line x1="230" y1="62" x2="276" y2="62" stroke="#1C1A17" stroke-width="1.5" marker-end="url(#e6a-ink)"/>

  <rect class="e6a-alt" x="280" y="36" width="190" height="52" rx="3"/>
  <text class="e6a-t" x="375" y="58" font-size="9" text-anchor="middle">② tree-shaking</text>
  <text class="e6a-s" x="375" y="76" font-size="7.5" text-anchor="middle">没用到的导出整体剔除</text>
  <line x1="470" y1="62" x2="516" y2="62" stroke="#1C1A17" stroke-width="1.5" marker-end="url(#e6a-ink)"/>

  <rect class="e6a-box" x="520" y="36" width="180" height="52" rx="3"/>
  <text class="e6a-t" x="610" y="58" font-size="9" text-anchor="middle">③ 并行预加载</text>
  <text class="e6a-s" x="610" y="76" font-size="7.5" text-anchor="middle">modulepreload 按图抢跑</text>

  <text class="e6a-s" x="40" y="24" font-size="8.5">前提：一张「运行前就画得完」的依赖图</text>

  <line x1="40" y1="108" x2="700" y2="108" stroke="#CDC4AF" stroke-width="1"/>

  <text class="e6a-t" x="40" y="132" font-size="8.5">ESM 的三条「限制」</text>
  <text class="e6a-mono" x="180" y="132" font-size="8">import 在顶层 · 不能放函数里 · 路径是字面量</text>
  <text class="e6a-t" x="480" y="132" font-size="8" style="fill:#B03A2E">—— 换来上面那三级</text>

  <text class="e6a-t" x="40" y="160" font-size="8.5" style="fill:#B03A2E">CJS 为什么不行</text>
  <text class="e6a-mono" x="180" y="160" font-size="8">if (dev) require('./devtools')</text>
  <text class="e6a-s" x="420" y="160" font-size="8">运行之前谁也不知道依赖谁</text>
  <text class="e6a-s" x="180" y="178" font-size="8">路径还能拼：<tspan class="e6a-mono" font-size="8">require('./' + name)</tspan> —— 分析器只能保守全保留</text>

  <line x1="40" y1="194" x2="700" y2="194" stroke="#CDC4AF" stroke-width="1"/>
  <text class="e6a-s" x="40" y="212" font-size="8.5">所以「静态」不是风格问题：它是后面所有优化的入场券 —— 图都画不出来，谈何剔除与预加载。</text>
</svg>
