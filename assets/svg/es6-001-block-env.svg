<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 268" width="100%" role="img" aria-labelledby="e61t e61d">
  <title id="e61t">块级环境记录：let 把作用域多切了一刀</title>
  <desc id="e61d">var 时代只有函数环境记录，变量全挂在函数那一层，所以 if 里声明的 var 会漏到外面。let 引入了块级环境记录：进入 if 块时新建一层，块里的 a 是全新绑定，遮蔽外层的 a；块一结束，这层环境出链，外层的 a 又可见。查找永远从最内层往外走，所以块内打印 2，块外打印 1。</desc>

  <style>
    .e61-env{fill:none;stroke:#CDC4AF;stroke-width:1.2}
    .e61-env2{fill:none;stroke:#1C1A17;stroke-width:1.3}
    .e61-chip{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .e61-chip2{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .e61-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .e61-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .e61-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="e61-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="e61-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="e61-mono" x="44" y="36" font-size="8.5">function demo() {</text>
  <text class="e61-mono" x="44" y="56" font-size="8.5">  let a = 1;</text>
  <text class="e61-mono" x="44" y="76" font-size="8.5">  if (true) {</text>
  <text class="e61-mono" x="44" y="96" font-size="8.5" style="fill:#B03A2E">    let a = 2;</text>
  <text class="e61-mono" x="44" y="116" font-size="8.5">    console.log(a);</text>
  <text class="e61-s" x="176" y="116" font-size="8">// 2</text>
  <text class="e61-mono" x="44" y="136" font-size="8.5">  }</text>
  <text class="e61-mono" x="44" y="156" font-size="8.5">  console.log(a);</text>
  <text class="e61-s" x="176" y="156" font-size="8">// 1</text>
  <text class="e61-mono" x="44" y="176" font-size="8.5">}</text>

  <rect class="e61-env2" x="340" y="20" width="360" height="184" rx="3"/>
  <text class="e61-s" x="354" y="38" font-size="8">函数环境记录</text>
  <rect class="e61-chip" x="354" y="46" width="110" height="26" rx="2"/>
  <text class="e61-mono" x="409" y="63" font-size="8.5" text-anchor="middle">a = 1</text>

  <rect class="e61-env" x="420" y="86" width="260" height="100" rx="3"/>
  <text class="e61-s" x="434" y="104" font-size="8">块级环境记录</text>
  <rect class="e61-chip2" x="434" y="112" width="180" height="26" rx="2"/>
  <text class="e61-mono" x="524" y="129" font-size="8.5" text-anchor="middle">a = 2（遮蔽外层）</text>
  <text class="e61-s" x="434" y="158" font-size="7.5">块一结束，这层环境出链</text>
  <text class="e61-s" x="434" y="174" font-size="7.5">外层的 a 又可见</text>

  <path d="M300 112 H412" fill="none" stroke="#B03A2E" stroke-width="1.4" marker-end="url(#e61-red)"/>
  <text class="e61-s" x="306" y="106" font-size="7.5" style="fill:#B03A2E">先找内层</text>

  <text class="e61-s" x="212" y="156" font-size="7.5">→ 内层已出链，命中外层</text>

  <line x1="40" y1="228" x2="700" y2="228" stroke="#CDC4AF" stroke-width="1"/>
  <text class="e61-s" x="40" y="248" font-size="8.5">查找规则只有一条：从最内层往外走，遇到第一个同名绑定就停下 —— 这就是「遮蔽」。</text>
  <text class="e61-t" x="40" y="264" font-size="8.5" style="fill:#B03A2E">var 时代只有函数那一层，所以 if 里的 var 会漏出去；let 补的正是「块」这一刀。</text>
</svg>
