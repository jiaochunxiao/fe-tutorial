<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="100%" role="img" aria-labelledby="v8gt v8gd">
  <title id="v8gt">两种 API 的差别不在语法，在代码按什么维度分组</title>
  <desc id="v8gd">左半边是 Options API：代码按选项类型分组，data、mounted、methods 各占一块，同一个功能 A 的状态、监听、清理被切成三截，散落在三个选项里，改动它要上下翻几十行。右半边是 Composition API：代码按功能分组，功能 A 的状态、监听、清理挨在一起，删掉它就是删掉一个块。下半部分对照两种复用单位：mixin 是把选项隐式合并进来，带来来源不明、命名冲突、隐式耦合；组合式函数是显式调用，参数进、返回值出，来源就写在 import 那一行。</desc>

  <style>
    .v8g-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .v8g-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .v8g-r{fill:#E7DEC8;stroke:#B03A2E;stroke-width:1.1}
    .v8g-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .v8g-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .v8g-m{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <text class="v8g-t" x="40" y="26" font-size="8.5">同一个组件，两套分组方式 —— 功能 A 在两边的位置不一样</text>

  <text class="v8g-t" x="40" y="54" font-size="8.5">Options API · 按选项类型分组</text>
  <text class="v8g-t" x="390" y="54" font-size="8.5">Composition API · 按功能分组</text>

  <rect class="v8g-b" x="40" y="64" width="300" height="34" rx="2"/>
  <text class="v8g-m" x="52" y="84" font-size="7">data</text>
  <rect class="v8g-r" x="112" y="70" width="58" height="22" rx="2"/>
  <text class="v8g-t" x="141" y="85" font-size="7.5" text-anchor="middle">功能 A</text>
  <rect class="v8g-b" x="178" y="70" width="58" height="22" rx="2"/>
  <text class="v8g-t" x="207" y="85" font-size="7.5" text-anchor="middle">功能 B</text>
  <rect class="v8g-b" x="244" y="70" width="58" height="22" rx="2"/>
  <text class="v8g-t" x="273" y="85" font-size="7.5" text-anchor="middle">功能 C</text>

  <rect class="v8g-b" x="40" y="110" width="300" height="34" rx="2"/>
  <text class="v8g-m" x="52" y="130" font-size="7">mounted</text>
  <rect class="v8g-r" x="112" y="116" width="58" height="22" rx="2"/>
  <text class="v8g-t" x="141" y="131" font-size="7.5" text-anchor="middle">功能 A</text>
  <rect class="v8g-b" x="178" y="116" width="58" height="22" rx="2"/>
  <text class="v8g-t" x="207" y="131" font-size="7.5" text-anchor="middle">功能 B</text>
  <rect class="v8g-b" x="244" y="116" width="58" height="22" rx="2"/>
  <text class="v8g-t" x="273" y="131" font-size="7.5" text-anchor="middle">功能 C</text>

  <rect class="v8g-b" x="40" y="156" width="300" height="34" rx="2"/>
  <text class="v8g-m" x="52" y="176" font-size="7">methods</text>
  <rect class="v8g-r" x="112" y="162" width="58" height="22" rx="2"/>
  <text class="v8g-t" x="141" y="177" font-size="7.5" text-anchor="middle">功能 A</text>
  <rect class="v8g-b" x="244" y="162" width="58" height="22" rx="2"/>
  <text class="v8g-t" x="273" y="177" font-size="7.5" text-anchor="middle">功能 C</text>

  <rect class="v8g-r" x="390" y="64" width="300" height="34" rx="2"/>
  <text class="v8g-t" x="540" y="85" font-size="8" text-anchor="middle">功能 A · 状态 + 监听 + 清理</text>
  <rect class="v8g-b" x="390" y="110" width="300" height="34" rx="2"/>
  <text class="v8g-t" x="540" y="131" font-size="8" text-anchor="middle">功能 B · 状态 + 计算 + 方法</text>
  <rect class="v8g-b" x="390" y="156" width="300" height="34" rx="2"/>
  <text class="v8g-t" x="540" y="177" font-size="8" text-anchor="middle">功能 C · 状态 + 请求 + 取消</text>

  <text class="v8g-s" x="40" y="212" font-size="7.5">A 被切成三截，散在三个选项里 —— 改它要上下翻几十行。</text>
  <text class="v8g-s" x="390" y="212" font-size="7.5">A 的三件事挨在一起 —— 删掉它就是删掉一个块。</text>

  <text class="v8g-t" x="40" y="252" font-size="8.5">复用单位</text>
  <rect class="v8g-b" x="112" y="236" width="82" height="24" rx="2"/>
  <text class="v8g-t" x="153" y="252" font-size="7.5" text-anchor="middle">mixin</text>
  <text class="v8g-s" x="212" y="252" font-size="7.5">选项被隐式合并 —— 来源不明、命名冲突、隐式耦合</text>

  <rect class="v8g-b" x="112" y="266" width="82" height="24" rx="2"/>
  <text class="v8g-t" x="153" y="282" font-size="7.5" text-anchor="middle">组合式函数</text>
  <text class="v8g-s" x="212" y="282" font-size="7.5">参数进、返回值出 —— 来源就写在 import 那一行</text>

  <text class="v8g-t" x="40" y="314" font-size="8.5" style="fill:#B03A2E">组件小的时候两种写法都行；组件上千行，只有按功能分组的那个才守得住。</text>
</svg>
