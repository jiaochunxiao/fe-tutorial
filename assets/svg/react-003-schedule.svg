<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 264" width="100%" role="img" aria-labelledby="r3st r3sd">
  <title id="r3st">时间片让路与优先级的闭环</title>
  <desc id="r3sd">render 阶段每执行完一个工作单元就检查一次：这一轮大约五毫秒的时间片用完了吗，或者有没有更高优先级的任务在等着。没有就继续下一个单元；有就把控制权还给主线程，让它去处理输入和渲染帧，把断点记在 nextUnitOfWork 上，下一帧再从那里接着干。优先级分三档：同步的离散事件如点击输入最高，过渡更新次之，空闲最低；高优先级可以打断低优先级的 render，被打断的更新要重新开始。</desc>

  <style>
    .r3s-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .r3s-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .r3s-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .r3s-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="r3s-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="r3s-t" x="40" y="26" font-size="8.5">可中断渲染的闭环：链表给断点，时间片给让路时机</text>

  <path d="M435 70 V44 H165 V66" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#r3s-ink)"/>
  <text class="r3s-s" x="443" y="60" font-size="7.5">否：继续下一个</text>

  <rect class="r3s-b" x="80" y="70" width="170" height="44" rx="2"/>
  <text class="r3s-t" x="165" y="90" font-size="8.5" text-anchor="middle">执行一个工作单元</text>
  <text class="r3s-s" x="165" y="104" font-size="7.5" text-anchor="middle">render 阶段的一个 Fiber</text>

  <line x1="250" y1="92" x2="326" y2="92" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#r3s-ink)"/>

  <rect class="r3s-b" x="330" y="70" width="210" height="44" rx="2"/>
  <text class="r3s-t" x="435" y="90" font-size="8.5" text-anchor="middle">时间片（约 5ms）用完了？</text>
  <text class="r3s-s" x="435" y="104" font-size="7.5" text-anchor="middle">或有更高优先级的任务在等？</text>

  <text class="r3s-s" x="548" y="84" font-size="7.5">是</text>
  <line x1="540" y1="92" x2="576" y2="92" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#r3s-ink)"/>

  <rect class="r3s-b" x="580" y="70" width="120" height="44" rx="2"/>
  <text class="r3s-t" x="640" y="90" font-size="8.5" text-anchor="middle">让出主线程</text>
  <text class="r3s-s" x="640" y="104" font-size="7.5" text-anchor="middle">交还控制权</text>

  <line x1="640" y1="114" x2="640" y2="156" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#r3s-ink)"/>

  <rect class="r3s-b" x="430" y="160" width="210" height="44" rx="2"/>
  <text class="r3s-t" x="535" y="180" font-size="8.5" text-anchor="middle">从 nextUnitOfWork 继续</text>
  <text class="r3s-s" x="535" y="194" font-size="7.5" text-anchor="middle">断点记在 Fiber 节点上</text>

  <path d="M430 182 H165 V118" fill="none" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#r3s-ink)"/>
  <text class="r3s-s" x="290" y="176" font-size="7.5" text-anchor="middle">下一帧再进来</text>

  <text class="r3s-t" x="40" y="224" font-size="8.5">优先级（Lane）：高可以打断低 —— 被打断的更新会重新开始</text>

  <rect class="r3s-b" x="40" y="232" width="250" height="26" rx="1" style="fill:#E7DEC8"/>
  <text class="r3s-t" x="165" y="249" font-size="7.5" text-anchor="middle">同步 · 点击 / 输入</text>
  <rect class="r3s-b" x="290" y="232" width="230" height="26" rx="1"/>
  <text class="r3s-t" x="405" y="249" font-size="7.5" text-anchor="middle">过渡 · transition</text>
  <rect class="r3s-b" x="520" y="232" width="180" height="26" rx="1"/>
  <text class="r3s-t" x="610" y="249" font-size="7.5" text-anchor="middle">空闲</text>
</svg>
