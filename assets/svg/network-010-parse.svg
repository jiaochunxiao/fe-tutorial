<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 306" width="100%" role="img" aria-labelledby="n10pt n10pd">
  <title id="n10pt">边下载边解析：字节流怎么长成 DOM 树，以及三类阻塞</title>
  <desc id="n10pd">上半是一条五段流水线：字节流按编码解码成字符，切成词法单元 Tokens，组装成节点 Nodes，最后连成可查询的 DOM 树。浏览器不等全文下载完，边下边解析。中间一层是两个打断点：遇到 link 引入的 CSS 时，不阻塞 DOM 解析，但会阻塞 JS 执行和首次渲染；遇到 script 时直接暂停 DOM 解析，脚本可能 document.write 改写后续内容，必须下载并执行完才继续。下方是三种脚本姿态：默认阻塞、defer 推迟到解析完且保持顺序、async 下载不阻塞但下完立即执行且无序。底部给出优化结论：CSS 放头、JS 放尾或 defer、关键脚本排在关键 CSS 之后。</desc>

  <style>
    .n10p-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .n10p-c{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .n10p-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .n10p-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .n10p-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="n10p-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="n10p-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="n10p-t" x="30" y="26" font-size="8.5">边下载边解析：字节流怎么长成 DOM 树</text>

  <rect class="n10p-b" x="30" y="46" width="116" height="50" rx="2"/>
  <text class="n10p-t" x="88" y="68" font-size="8.5" text-anchor="middle">字节流</text>
  <text class="n10p-mono" x="88" y="84" font-size="7" text-anchor="middle" style="fill:#6E675A">Bytes</text>
  <line x1="146" y1="71" x2="164" y2="71" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#n10p-ink)"/>

  <rect class="n10p-b" x="168" y="46" width="116" height="50" rx="2"/>
  <text class="n10p-t" x="226" y="68" font-size="8.5" text-anchor="middle">字符</text>
  <text class="n10p-mono" x="226" y="84" font-size="7" text-anchor="middle" style="fill:#6E675A">按编码解码</text>
  <line x1="284" y1="71" x2="302" y2="71" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#n10p-ink)"/>

  <rect class="n10p-b" x="306" y="46" width="116" height="50" rx="2"/>
  <text class="n10p-t" x="364" y="68" font-size="8.5" text-anchor="middle">词法单元</text>
  <text class="n10p-mono" x="364" y="84" font-size="7" text-anchor="middle" style="fill:#6E675A">Tokens</text>
  <line x1="422" y1="71" x2="440" y2="71" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#n10p-ink)"/>

  <rect class="n10p-b" x="444" y="46" width="116" height="50" rx="2"/>
  <text class="n10p-t" x="502" y="68" font-size="8.5" text-anchor="middle">节点</text>
  <text class="n10p-mono" x="502" y="84" font-size="7" text-anchor="middle" style="fill:#6E675A">Nodes</text>
  <line x1="560" y1="71" x2="578" y2="71" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#n10p-ink)"/>

  <rect class="n10p-c" x="582" y="46" width="116" height="50" rx="2"/>
  <text class="n10p-t" x="640" y="68" font-size="8.5" text-anchor="middle">DOM 树</text>
  <text class="n10p-mono" x="640" y="84" font-size="7" text-anchor="middle" style="fill:#6E675A">可查询</text>

  <!-- 两个打断点 -->
  <rect class="n10p-b" x="30" y="118" width="330" height="88" rx="2"/>
  <text class="n10p-mono" x="42" y="138" font-size="8" style="fill:#B03A2E">&lt;link&gt; 引入 CSS</text>
  <text class="n10p-s" x="42" y="158" font-size="7.5">不阻塞 DOM 解析</text>
  <text class="n10p-s" x="42" y="174" font-size="7.5">但阻塞 JS 执行（脚本可能要读样式）</text>
  <text class="n10p-s" x="42" y="190" font-size="7.5" style="fill:#B03A2E">也阻塞首次渲染 —— 页面空等</text>

  <rect class="n10p-b" x="380" y="118" width="330" height="88" rx="2"/>
  <text class="n10p-mono" x="392" y="138" font-size="8" style="fill:#B03A2E">&lt;script&gt; 引入 JS</text>
  <text class="n10p-s" x="392" y="158" font-size="7.5" style="fill:#B03A2E">直接暂停 DOM 解析</text>
  <text class="n10p-s" x="392" y="174" font-size="7.5">脚本可能 document.write 改写后续内容</text>
  <text class="n10p-s" x="392" y="190" font-size="7.5">下载 + 执行完，解析才继续</text>

  <!-- 三种姿态 -->
  <rect class="n10p-b" x="30" y="222" width="216" height="42" rx="2"/>
  <text class="n10p-mono" x="42" y="240" font-size="8">默认</text>
  <text class="n10p-s" x="42" y="255" font-size="7.5">下完即执行，阻塞解析</text>

  <rect class="n10p-b" x="262" y="222" width="216" height="42" rx="2"/>
  <text class="n10p-mono" x="274" y="240" font-size="8">defer</text>
  <text class="n10p-s" x="274" y="255" font-size="7.5">解析完再执行，多个保持顺序</text>

  <rect class="n10p-b" x="494" y="222" width="216" height="42" rx="2"/>
  <text class="n10p-mono" x="506" y="240" font-size="8">async</text>
  <text class="n10p-s" x="506" y="255" font-size="7.5">下载不阻塞，下完立即执行、无序</text>

  <rect x="30" y="274" width="680" height="24" fill="#E7DEC8" opacity="0.55"/>
  <text class="n10p-s" x="42" y="290" font-size="7.5">优化结论：CSS 放头（尽早下载）、JS 放尾或用 defer、关键脚本排在关键 CSS 之后</text>
</svg>
