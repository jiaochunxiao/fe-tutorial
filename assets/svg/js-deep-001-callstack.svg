<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" width="100%" role="img" aria-labelledby="k1t k1d">
  <title id="k1t">调用栈的四个时刻</title>
  <desc id="k1d">四个连续快照：启动时栈里只有全局上下文；调用 main 后栈深为 2；main 里调用 greet 后栈深为 3；greet 里调用 hi 后栈深达到峰值 4。朱砂描边的那一层就是正在执行的栈顶。</desc>

  <style>
    .k1-frame{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .k1-base{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.4}
    .k1-top{fill:#FBF7EE;stroke:#B03A2E;stroke-width:1.8}
    .k1-topbase{fill:#E7DEC8;stroke:#B03A2E;stroke-width:1.8}
    .k1-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
    .k1-serif{font-family:'Noto Serif SC','Songti SC','SimSun',serif;fill:#1C1A17}
    .k1-small{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <line x1="44" y1="192" x2="736" y2="192" stroke="#CDC4AF" stroke-width="1.2"/>

  <rect class="k1-topbase" x="56" y="158" width="140" height="34" rx="2"/>
  <text class="k1-serif" x="126" y="180" font-size="11" text-anchor="middle">全局上下文</text>

  <rect class="k1-base" x="230" y="158" width="140" height="34" rx="2"/>
  <text class="k1-serif" x="300" y="180" font-size="11" text-anchor="middle">全局上下文</text>
  <rect class="k1-top" x="230" y="121" width="140" height="34" rx="2"/>
  <text class="k1-mono" x="300" y="143" font-size="11.5" text-anchor="middle">main()</text>

  <rect class="k1-base" x="404" y="158" width="140" height="34" rx="2"/>
  <text class="k1-serif" x="474" y="180" font-size="11" text-anchor="middle">全局上下文</text>
  <rect class="k1-frame" x="404" y="121" width="140" height="34" rx="2"/>
  <text class="k1-mono" x="474" y="143" font-size="11.5" text-anchor="middle">main()</text>
  <rect class="k1-top" x="404" y="84" width="140" height="34" rx="2"/>
  <text class="k1-mono" x="474" y="106" font-size="11.5" text-anchor="middle">greet()</text>

  <rect class="k1-base" x="578" y="158" width="140" height="34" rx="2"/>
  <text class="k1-serif" x="648" y="180" font-size="11" text-anchor="middle">全局上下文</text>
  <rect class="k1-frame" x="578" y="121" width="140" height="34" rx="2"/>
  <text class="k1-mono" x="648" y="143" font-size="11.5" text-anchor="middle">main()</text>
  <rect class="k1-frame" x="578" y="84" width="140" height="34" rx="2"/>
  <text class="k1-mono" x="648" y="106" font-size="11.5" text-anchor="middle">greet()</text>
  <rect class="k1-top" x="578" y="47" width="140" height="34" rx="2"/>
  <text class="k1-mono" x="648" y="69" font-size="11.5" text-anchor="middle">hi()</text>

  <text class="k1-mono" x="126" y="214" font-size="10.5" text-anchor="middle">① 启动</text>
  <text class="k1-mono" x="300" y="214" font-size="10.5" text-anchor="middle">② main()</text>
  <text class="k1-mono" x="474" y="214" font-size="10.5" text-anchor="middle">③ greet()</text>
  <text class="k1-mono" x="648" y="214" font-size="10.5" text-anchor="middle">④ hi()</text>

  <text class="k1-small" x="126" y="232" font-size="9.5" text-anchor="middle">栈深 1</text>
  <text class="k1-small" x="300" y="232" font-size="9.5" text-anchor="middle">栈深 2</text>
  <text class="k1-small" x="474" y="232" font-size="9.5" text-anchor="middle">栈深 3</text>
  <text class="k1-small" x="648" y="232" font-size="9.5" text-anchor="middle" style="fill:#B03A2E">栈深 4 · 峰值</text>

  <text class="k1-small" x="40" y="260" font-size="10.5">深度只跟「还没返回的调用」有关：调一次压一层，返回就弹一层，与堆里有多少对象无关。</text>

</svg>
