<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 286" width="100%" role="img" aria-labelledby="e8st e8sd">
  <title id="e8st">发布缓存的完整骨架：不可变资源加可变指针</title>
  <desc id="e8sd">资源用内容哈希命名，配一年强缓存加 immutable，底气来自「永不覆盖、只新增」。HTML 设 no-cache，每次协商，永远是最新的引用表。发布分四步：传齐新资源、切 HTML、灰度观察、异常就回滚指针。交替期里老会话和新会话各自跑自己那套，互不干扰；在途会话的 chunk 加载失败要有 reload 兜底。这套骨架和 K8s、CDN、对象存储是同一个模型。</desc>

  <style>
    .e8s-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.3}
    .e8s-alt{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.3}
    .e8s-step{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.2}
    .e8s-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .e8s-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .e8s-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="e8s-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="e8s-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <text class="e8s-s" x="40" y="42" font-size="8.5">资源</text>
  <rect class="e8s-box" x="110" y="24" width="180" height="34" rx="3"/>
  <text class="e8s-mono" x="200" y="45" font-size="8" text-anchor="middle">app.[contenthash].js</text>
  <line x1="290" y1="41" x2="330" y2="41" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#e8s-ink)"/>
  <rect class="e8s-alt" x="334" y="24" width="230" height="34" rx="3"/>
  <text class="e8s-mono" x="449" y="45" font-size="8" text-anchor="middle">max-age=1y, immutable</text>
  <text class="e8s-t" x="576" y="45" font-size="8" style="fill:#B03A2E">底气 = 永不覆盖，只新增</text>

  <text class="e8s-s" x="40" y="90" font-size="8.5">HTML</text>
  <rect class="e8s-box" x="110" y="72" width="100" height="34" rx="3"/>
  <text class="e8s-mono" x="160" y="93" font-size="8" text-anchor="middle">no-cache</text>
  <line x1="210" y1="89" x2="250" y2="89" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#e8s-ink)"/>
  <rect class="e8s-box" x="254" y="72" width="130" height="34" rx="3"/>
  <text class="e8s-t" x="319" y="93" font-size="8" text-anchor="middle">每次协商</text>
  <line x1="384" y1="89" x2="424" y2="89" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#e8s-ink)"/>
  <text class="e8s-t" x="430" y="93" font-size="8">始终是最新的「引用表」</text>

  <line x1="40" y1="122" x2="700" y2="122" stroke="#CDC4AF" stroke-width="1"/>

  <text class="e8s-s" x="40" y="148" font-size="8.5">发布</text>
  <rect class="e8s-step" x="110" y="130" width="130" height="36" rx="3"/>
  <text class="e8s-t" x="124" y="152" font-size="8">① 传齐新资源</text>
  <line x1="240" y1="148" x2="266" y2="148" stroke="#1C1A17" stroke-width="1.3" marker-end="url(#e8s-ink)"/>
  <rect class="e8s-step" x="270" y="130" width="110" height="36" rx="3"/>
  <text class="e8s-t" x="284" y="152" font-size="8">② 切 HTML</text>
  <line x1="380" y1="148" x2="406" y2="148" stroke="#1C1A17" stroke-width="1.3" marker-end="url(#e8s-ink)"/>
  <rect class="e8s-step" x="410" y="130" width="110" height="36" rx="3"/>
  <text class="e8s-t" x="424" y="152" font-size="8">③ 灰度观察</text>
  <line x1="520" y1="148" x2="546" y2="148" stroke="#B03A2E" stroke-width="1.3" marker-end="url(#e8s-red)"/>
  <rect class="e8s-step" x="550" y="130" width="150" height="36" rx="3"/>
  <text class="e8s-t" x="564" y="152" font-size="8" style="fill:#B03A2E">④ 异常回滚指针</text>

  <line x1="40" y1="186" x2="700" y2="186" stroke="#CDC4AF" stroke-width="1"/>

  <text class="e8s-t" x="40" y="210" font-size="8.5">交替期</text>
  <text class="e8s-s" x="110" y="210" font-size="8.5">老会话（旧 HTML + 旧 chunk）与新会话（新 HTML + 新 chunk）并存，互不干扰</text>
  <text class="e8s-t" x="40" y="232" font-size="8.5">在途保护</text>
  <text class="e8s-s" x="110" y="232" font-size="8.5">旧 chunk 被清掉了怎么办 —— chunk 加载失败要有 reload 兜底，别让用户停在白屏</text>

  <line x1="40" y1="248" x2="700" y2="248" stroke="#CDC4AF" stroke-width="1"/>
  <text class="e8s-t" x="40" y="270" font-size="8.5" style="fill:#B03A2E">通用骨架：不可变资源 + 可变指针 —— K8s 的镜像 tag、CDN 的源站、对象存储的版本，全是这个模型。</text>
</svg>
