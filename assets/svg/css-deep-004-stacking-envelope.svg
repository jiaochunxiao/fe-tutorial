<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 740 340" width="100%" role="img" aria-labelledby="sc4t sc4d">
  <title id="sc4t">层叠上下文的信封结构</title>
  <desc id="sc4d">层叠上下文 A 的 z 是 2，它里面还有子上下文 A1，z 是 5。但 A1 只能和 A 内部的兄弟比大小，它出不了 A 这个信封；层叠上下文 B 的 z 是 3，整组压在 A 上面，所以 A1 再大也照样被 B 盖住。</desc>

  <style>
    .sc4-ctx{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.6}
    .sc4-sub{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.4}
    .sc4-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .sc4-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .sc4-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="sc4-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
    <marker id="sc4-cin" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <line x1="70" y1="346" x2="70" y2="82" stroke="#1C1A17" stroke-width="1.2" marker-end="url(#sc4-ink)"/>
  <text class="sc4-s" x="58" y="240" font-size="9" text-anchor="middle" transform="rotate(-90 58 240)" style="fill:#6E675A">z 越大越靠前</text>

  <rect class="sc4-ctx" x="180" y="70" width="380" height="90" rx="4"/>
  <text class="sc4-t" x="196" y="98" font-size="11">层叠上下文 B</text>
  <text class="sc4-mono" x="196" y="118" font-size="10">z = 3</text>
  <text class="sc4-s" x="544" y="98" font-size="9.5" text-anchor="end">整组压在 A 上面</text>

  <rect class="sc4-ctx" x="180" y="200" width="380" height="130" rx="4"/>
  <text class="sc4-t" x="544" y="228" font-size="11" text-anchor="end">层叠上下文 A</text>
  <text class="sc4-mono" x="544" y="248" font-size="10" text-anchor="end">z = 2</text>

  <rect class="sc4-sub" x="220" y="250" width="200" height="56" rx="3"/>
  <text class="sc4-t" x="236" y="276" font-size="10.5">子上下文 A1</text>
  <text class="sc4-mono" x="236" y="294" font-size="10">z = 5</text>

  <path d="M320 246 V208" fill="none" stroke="#B03A2E" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#sc4-cin)"/>
  <line x1="304" y1="202" x2="336" y2="202" stroke="#B03A2E" stroke-width="1.8"/>
  <text class="sc4-s" x="346" y="228" font-size="9" style="fill:#B03A2E">信封边界，到此为止</text>

  <text class="sc4-s" x="180" y="362" font-size="9.5">比较只在同一层发生：A 和 B 比 2 : 3；A1 只跟 A 里的兄弟比</text>

</svg>
