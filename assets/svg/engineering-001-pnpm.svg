<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 306" width="100%" role="img" aria-labelledby="e1pt e1pd">
  <title id="e1pt">pnpm 的解法：全局存储加符号链接</title>
  <desc id="e1pd">pnpm 不再把包实体铺在 node_modules 里。所有包只以内容寻址的方式存在一份全局 store 中，磁盘靠硬链接复用。node_modules 顶层只放你 package.json 里直接声明的依赖，而且放的是指向 store 的符号链接；每个包的真正依赖放在它自己目录内的 node_modules 里。于是「没声明却能 import」这件事在物理上就不成立了。</desc>

  <style>
    .e1p-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.3}
    .e1p-store{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.3}
    .e1p-chip{fill:#FBF7EE;stroke:#CDC4AF;stroke-width:1.1}
    .e1p-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .e1p-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .e1p-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="e1p-red" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B03A2E"/>
    </marker>
  </defs>

  <rect class="e1p-box" x="40" y="28" width="320" height="200" rx="3"/>
  <text class="e1p-mono" x="54" y="50" font-size="9">node_modules/</text>
  <text class="e1p-s" x="150" y="50" font-size="7.5">（顶层只放直接依赖）</text>

  <rect class="e1p-chip" x="60" y="66" width="120" height="26" rx="2"/>
  <text class="e1p-mono" x="120" y="83" font-size="8.5" text-anchor="middle">axios</text>
  <line x1="180" y1="79" x2="470" y2="79" stroke="#B03A2E" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#e1p-red)"/>
  <text class="e1p-s" x="252" y="73" font-size="7.5" style="fill:#B03A2E">符号链接</text>

  <text class="e1p-mono" x="60" y="122" font-size="9">A/</text>
  <line x1="68" y1="130" x2="68" y2="196" stroke="#CDC4AF" stroke-width="1.2"/>
  <line x1="68" y1="150" x2="80" y2="150" stroke="#CDC4AF" stroke-width="1.2"/>
  <text class="e1p-mono" x="86" y="154" font-size="8.5">node_modules/</text>
  <line x1="68" y1="182" x2="80" y2="182" stroke="#CDC4AF" stroke-width="1.2"/>
  <text class="e1p-mono" x="86" y="186" font-size="8.5">dep</text>
  <line x1="112" y1="178" x2="470" y2="178" stroke="#B03A2E" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#e1p-red)"/>
  <text class="e1p-s" x="184" y="164" font-size="7.5" style="fill:#B03A2E">A 的真实依赖在它自己的目录里，不在顶层</text>

  <rect class="e1p-store" x="474" y="56" width="226" height="150" rx="3"/>
  <text class="e1p-mono" x="488" y="80" font-size="9">~/.pnpm/store/</text>
  <text class="e1p-t" x="488" y="102" font-size="8.5">全局内容寻址存储</text>
  <text class="e1p-s" x="488" y="120" font-size="8">相同内容的包只存一份，</text>
  <text class="e1p-s" x="488" y="136" font-size="8">硬链接进各项目 —— 省磁盘</text>
  <text class="e1p-mono" x="488" y="162" font-size="8">axios@1.2.4/</text>
  <text class="e1p-mono" x="488" y="180" font-size="8">dep@3.1.0/</text>

  <line x1="40" y1="248" x2="40" y2="266" stroke="#B03A2E" stroke-width="2.4"/>
  <text class="e1p-t" x="54" y="258" font-size="8.5">顶层只有【直接声明】的依赖 —— 幽灵依赖在物理上就不成立，import 直接报错</text>
  <text class="e1p-s" x="54" y="284" font-size="8.5">顺带好处：<tspan class="e1p-mono" font-size="8.5">workspace:*</tspan> 天然支撑 monorepo，多包共享同一个 store 也不重复装</text>
</svg>
