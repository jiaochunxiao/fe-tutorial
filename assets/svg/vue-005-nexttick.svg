<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 740 340" width="100%" role="img" aria-labelledby="nt5t nt5d">
  <title id="nt5t">nextTick 在微任务里排在渲染之后</title>
  <desc id="nt5d">同步块里连改四次数据，每次都触发一次 queueJob，但 Set 去重后只剩一个渲染任务，而且只在微任务里排一次 flushJobs。flushJobs 跑完 render、diff、patch，DOM 才算更新完，nextTick 的回调们紧跟在它后面。setTimeout 的回调属于宏任务，跨过了这次渲染。</desc>

  <style>
    .nt5-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.4}
    .nt5-key{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.6}
    .nt5-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .nt5-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .nt5-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="nt5-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="nt5-s" x="24" y="70" font-size="9.5">同步</text>
  <text class="nt5-s" x="24" y="228" font-size="9.5">微任务</text>
  <text class="nt5-s" x="24" y="330" font-size="9.5">宏任务</text>

  <rect class="nt5-box" x="80" y="48" width="560" height="36" rx="3"/>
  <text class="nt5-mono" x="96" y="71" font-size="9.5">count=1 → count=2 → push → name='x'</text>
  <text class="nt5-s" x="624" y="71" font-size="9" text-anchor="end">改了 4 次</text>

  <line x1="360" y1="84" x2="360" y2="104" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#nt5-ink)"/>

  <rect class="nt5-box" x="80" y="108" width="560" height="36" rx="3"/>
  <text class="nt5-s" x="96" y="131" font-size="9.5">trigger ×4 → queueJob ×4 → Set 去重 → 只剩一个渲染 job</text>

  <line x1="360" y1="144" x2="360" y2="176" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#nt5-ink)"/>

  <line x1="24" y1="162" x2="716" y2="162" stroke="#CDC4AF" stroke-width="1" stroke-dasharray="4 5"/>
  <text class="nt5-s" x="712" y="156" font-size="8.5" text-anchor="end">同步代码到此结束</text>

  <rect class="nt5-key" x="80" y="180" width="560" height="36" rx="3"/>
  <text class="nt5-s" x="96" y="203" font-size="9.5">flushJobs：render + diff + patch → DOM 真正更新完</text>

  <line x1="360" y1="216" x2="360" y2="236" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#nt5-ink)"/>

  <rect class="nt5-box" x="80" y="240" width="560" height="36" rx="3"/>
  <text class="nt5-s" x="96" y="263" font-size="9.5">nextTick 的回调们（A、C…）—— 挂在 flush 之后，所以能读到新 DOM</text>

  <line x1="360" y1="276" x2="360" y2="308" stroke="#1C1A17" stroke-width="1.4" marker-end="url(#nt5-ink)"/>

  <line x1="24" y1="294" x2="716" y2="294" stroke="#CDC4AF" stroke-width="1" stroke-dasharray="4 5"/>
  <text class="nt5-s" x="712" y="288" font-size="8.5" text-anchor="end">一次渲染到此结束</text>

  <rect class="nt5-box" x="80" y="312" width="560" height="36" rx="3"/>
  <text class="nt5-s" x="96" y="335" font-size="9.5">setTimeout 的回调（B）—— 属于宏任务，跨过了这次渲染</text>

</svg>
