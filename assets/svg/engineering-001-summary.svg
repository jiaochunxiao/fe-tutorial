<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" width="100%" role="img" aria-labelledby="e1st e1sd">
  <title id="e1st">从 package.json 到 node_modules：范围、锁定、还原</title>
  <desc id="e1sd">package.json 写的是范围（^1.2.3），lock 文件把它钉成精确版本加哈希，node_modules 由 lock 还原出来。装法有两条路：npm 和 yarn 的扁平化把顶层塞满所有包，换来去重，代价是幽灵依赖可用和重复版本黑洞；pnpm 用全局 store 加符号链接，顶层只放直接依赖，幽灵依赖直接报错。而这一切能成立的机制根基是 Node 的解析算法：require 逐级向上找 node_modules。</desc>

  <style>
    .e1s-box{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.3}
    .e1s-band{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.2}
    .e1s-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .e1s-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .e1s-mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#1C1A17}
  </style>

  <defs>
    <marker id="e1s-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <rect class="e1s-box" x="40" y="22" width="180" height="48" rx="3"/>
  <text class="e1s-mono" x="130" y="42" font-size="9" text-anchor="middle">package.json</text>
  <text class="e1s-s" x="130" y="58" font-size="8" text-anchor="middle">范围：^1.2.3</text>
  <line x1="220" y1="46" x2="272" y2="46" stroke="#1C1A17" stroke-width="1.5" marker-end="url(#e1s-ink)"/>
  <text class="e1s-s" x="246" y="40" font-size="7.5" text-anchor="middle">解析</text>

  <rect class="e1s-box" x="276" y="22" width="180" height="48" rx="3"/>
  <text class="e1s-mono" x="366" y="42" font-size="9" text-anchor="middle">lock 文件</text>
  <text class="e1s-s" x="366" y="58" font-size="8" text-anchor="middle">精确 1.2.4 + 完整性哈希</text>
  <line x1="456" y1="46" x2="508" y2="46" stroke="#1C1A17" stroke-width="1.5" marker-end="url(#e1s-ink)"/>
  <text class="e1s-s" x="482" y="40" font-size="7.5" text-anchor="middle">还原</text>

  <rect class="e1s-box" x="512" y="22" width="188" height="48" rx="3"/>
  <text class="e1s-mono" x="606" y="42" font-size="9" text-anchor="middle">node_modules</text>
  <text class="e1s-s" x="606" y="58" font-size="8" text-anchor="middle">磁盘上的实体</text>

  <line x1="40" y1="94" x2="700" y2="94" stroke="#CDC4AF" stroke-width="1"/>

  <text class="e1s-s" x="40" y="120" font-size="8.5">npm / yarn</text>
  <rect class="e1s-box" x="130" y="102" width="220" height="30" rx="3"/>
  <text class="e1s-t" x="142" y="121" font-size="8.5">扁平化：顶层塞满所有包</text>
  <text class="e1s-s" x="362" y="114" font-size="8">换来去重与旧包兼容</text>
  <text class="e1s-t" x="362" y="130" font-size="8" style="fill:#B03A2E">代价：幽灵依赖可用 + 重复版本黑洞</text>

  <text class="e1s-s" x="40" y="164" font-size="8.5">pnpm</text>
  <rect class="e1s-band" x="130" y="146" width="220" height="30" rx="3"/>
  <text class="e1s-t" x="142" y="165" font-size="8.5">全局 store + 符号链接</text>
  <text class="e1s-s" x="362" y="158" font-size="8">内容寻址，一份实体多处引用</text>
  <text class="e1s-t" x="362" y="174" font-size="8" style="fill:#B03A2E">好处：顶层只有直接依赖，幽灵依赖 404</text>

  <line x1="40" y1="198" x2="700" y2="198" stroke="#CDC4AF" stroke-width="1"/>

  <text class="e1s-t" x="40" y="220" font-size="8.5">机制根基</text>
  <text class="e1s-s" x="130" y="220" font-size="8.5">require('B') 会从当前目录逐级向上找 node_modules —— 扁平化能生效，靠的就是这条解析规则</text>

  <text class="e1s-t" x="40" y="246" font-size="8.5" style="fill:#B03A2E">四条纪律</text>
  <text class="e1s-s" x="130" y="246" font-size="8.5">lock 入库 ｜ CI 用 npm ci ｜ 不 import 未声明的包 ｜ audit 常态化</text>

  <text class="e1s-s" x="40" y="278" font-size="8">一句话：package.json 说的是「我要什么范围」，lock 说的是「这次装的是哪一个」，node_modules 只是还原结果。</text>
</svg>
