<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 232" width="100%" role="img" aria-labelledby="v7lt v7ld">
  <title id="v7lt">泄漏就是一条本该断掉却一直连着的引用链</title>
  <desc id="v7ld">所有内存泄漏都能归到同一个模型：从根出发有一条引用链，连到一个本该被回收的对象上，于是它一直活着。根可以是全局对象、当前调用栈、或者事件系统这类长生命周期的持有者。排查要做的就是在这条链上找到属于你的代码的第一环，浏览器 DevTools 的 Retainers 面板给你的正是这条链，而不是一堆孤立的对象。</desc>

  <style>
    .v7l-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .v7l-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .v7l-r{fill:#E7DEC8;stroke:#B03A2E;stroke-width:1.4}
    .v7l-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .v7l-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="v7l-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="v7l-t" x="40" y="26" font-size="8.5">一条「本该断掉却一直连着」的引用链</text>

  <rect class="v7l-q" x="40" y="62" width="120" height="44" rx="2"/>
  <text class="v7l-t" x="100" y="82" font-size="7.5" text-anchor="middle">根</text>
  <text class="v7l-s" x="100" y="96" font-size="6.5" text-anchor="middle">全局 / 栈 / 事件系统</text>

  <line x1="162" y1="84" x2="196" y2="84" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v7l-ink)"/>
  <rect class="v7l-b" x="200" y="62" width="110" height="44" rx="2"/>
  <text class="v7l-s" x="255" y="80" font-size="6.5" text-anchor="middle">中间持有者</text>
  <text class="v7l-s" x="255" y="93" font-size="6.5" text-anchor="middle">数组 / Map / 闭包</text>

  <line x1="312" y1="84" x2="346" y2="84" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v7l-ink)"/>
  <rect class="v7l-r" x="350" y="62" width="110" height="44" rx="2"/>
  <text class="v7l-t" x="405" y="80" font-size="6.5" text-anchor="middle">你的代码</text>
  <text class="v7l-s" x="405" y="93" font-size="6.5" text-anchor="middle" style="fill:#B03A2E">第一环</text>

  <line x1="462" y1="84" x2="496" y2="84" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#v7l-ink)"/>
  <rect class="v7l-b" x="500" y="62" width="110" height="44" rx="2"/>
  <text class="v7l-s" x="555" y="80" font-size="6.5" text-anchor="middle">本该死亡</text>
  <text class="v7l-s" x="555" y="93" font-size="6.5" text-anchor="middle">却还活着的对象</text>

  <text class="v7l-s" x="350" y="126" font-size="6.5" style="fill:#B03A2E">排查就从这一环下手：它往往是一次没解绑的监听、一个只增不减的数组</text>

  <text class="v7l-t" x="40" y="158" font-size="8">工具给你的就是这条链</text>
  <rect class="v7l-b" x="40" y="166" width="660" height="30" rx="2"/>
  <text class="v7l-t" x="56" y="185" font-size="7.5">DevTools → Memory → Heap snapshot → 选中对象 → Retainers（保留链）</text>

  <text class="v7l-s" x="40" y="216" font-size="7.5">不要盯着「哪个对象多」，要盯着「谁还拿着它」—— 数量只是症状，保留链才是病因。</text>
</svg>
