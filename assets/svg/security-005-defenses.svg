<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 264" width="100%" role="img" aria-labelledby="s5dt s5dd">
  <title id="s5dt">供应链的四道防线，和出事之后的五步响应</title>
  <desc id="s5dd">四道防线依次收窄攻击面：锁定把 lock 入库并用 integrity 哈希校验，升级走独立评审、audit 进 CI；引入审查用五问评估新包，陌生包先 ignore-scripts 装一遍；SRI 用 integrity 属性让被篡改的文件直接拒载，配 CSP 域名白名单，第三方脚本尽量自托管；收权把 CI 容器化、发布开 2FA、凭据最小权限。出事之后按五步走：检测、lock 回退、查 postinstall 行为、轮换凭据、复盘补门禁。</desc>

  <style>
    .s5d-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .s5d-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .s5d-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .s5d-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
  </style>

  <defs>
    <marker id="s5d-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="s5d-t" x="40" y="26" font-size="8.5">四道防线，从「装之前」一直收到「发布权限」</text>

  <rect class="s5d-b" x="40" y="44" width="160" height="106" rx="2"/>
  <text class="s5d-t" x="54" y="64" font-size="8">① 锁定</text>
  <text class="s5d-s" x="54" y="82" font-size="6.5">lock 入库 + integrity 哈希</text>
  <text class="s5d-s" x="54" y="96" font-size="6.5">升级走独立 MR 评审</text>
  <text class="s5d-s" x="54" y="110" font-size="6.5">audit 进 CI，不过就拦</text>
  <text class="s5d-s" x="54" y="130" font-size="6.5">管住「装什么版本」</text>

  <rect class="s5d-b" x="212" y="44" width="160" height="106" rx="2"/>
  <text class="s5d-t" x="226" y="64" font-size="8">② 引入审查</text>
  <text class="s5d-s" x="226" y="82" font-size="6.5">五问：活跃度 / 依赖量 /</text>
  <text class="s5d-s" x="226" y="96" font-size="6.5">有无替代 / 发布者 / 质量</text>
  <text class="s5d-s" x="226" y="110" font-size="6.5">陌生包先 --ignore-scripts</text>
  <text class="s5d-s" x="226" y="130" font-size="6.5">管住「装哪一个」</text>

  <rect class="s5d-b" x="384" y="44" width="160" height="106" rx="2"/>
  <text class="s5d-t" x="398" y="64" font-size="8">③ SRI + CSP</text>
  <text class="s5d-s" x="398" y="82" font-size="6.5">integrity="sha384-…"</text>
  <text class="s5d-s" x="398" y="96" font-size="6.5">篡改即拒载</text>
  <text class="s5d-s" x="398" y="110" font-size="6.5">CSP 域名白名单兜底</text>
  <text class="s5d-s" x="398" y="130" font-size="6.5">第三方脚本尽量自托管</text>

  <rect class="s5d-b" x="556" y="44" width="160" height="106" rx="2"/>
  <text class="s5d-t" x="570" y="64" font-size="8">④ 收权</text>
  <text class="s5d-s" x="570" y="82" font-size="6.5">CI 容器化，隔离执行</text>
  <text class="s5d-s" x="570" y="96" font-size="6.5">发布账号开 2FA</text>
  <text class="s5d-s" x="570" y="110" font-size="6.5">凭据最小权限、可轮换</text>
  <text class="s5d-s" x="570" y="130" font-size="6.5">管住「谁有权发」</text>

  <text class="s5d-t" x="40" y="176" font-size="8">出事之后的五步</text>

  <rect class="s5d-b" x="40" y="184" width="120" height="28" rx="1"/>
  <text class="s5d-t" x="100" y="202" font-size="7" text-anchor="middle">检测</text>
  <line x1="162" y1="198" x2="172" y2="198" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#s5d-ink)"/>
  <rect class="s5d-b" x="176" y="184" width="120" height="28" rx="1"/>
  <text class="s5d-t" x="236" y="202" font-size="7" text-anchor="middle">lock 回退</text>
  <line x1="298" y1="198" x2="308" y2="198" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#s5d-ink)"/>
  <rect class="s5d-b" x="312" y="184" width="120" height="28" rx="1"/>
  <text class="s5d-t" x="372" y="202" font-size="7" text-anchor="middle">查 postinstall</text>
  <line x1="434" y1="198" x2="444" y2="198" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#s5d-ink)"/>
  <rect class="s5d-b" x="448" y="184" width="120" height="28" rx="1"/>
  <text class="s5d-t" x="508" y="202" font-size="7" text-anchor="middle">轮换凭据</text>
  <line x1="570" y1="198" x2="580" y2="198" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#s5d-ink)"/>
  <rect class="s5d-b" x="584" y="184" width="132" height="28" rx="1"/>
  <text class="s5d-t" x="650" y="202" font-size="7" text-anchor="middle">复盘加门禁</text>

  <text class="s5d-t" x="40" y="248" font-size="8.5" style="fill:#B03A2E">四道防线对应四个问题：装什么版本、装哪一个、传的有没有被改、谁有权发。</text>
</svg>
