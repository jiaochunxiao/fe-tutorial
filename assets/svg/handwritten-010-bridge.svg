<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 214" width="100%" role="img" aria-labelledby="h10at h10ad">
  <title id="h10at">模板到 render 函数：编译器是两章之间的那座桥</title>
  <desc id="h10ad">模板字符串经过 parse 得到 AST，transform 把 Vue 方言改写成标准属性，generate 拼出 h 调用的代码字符串，最后用 new Function 生成 render 函数。这个 render 函数的签名是 h 与 ctx，正好是上一章响应式渲染引擎的入口——所以编译的终点就是响应式的起点，两章合起来才是完整的 mini-Vue。</desc>

  <style>
    .h10a-b{fill:#FBF7EE;stroke:#1C1A17;stroke-width:1.1}
    .h10a-q{fill:#E7DEC8;stroke:#1C1A17;stroke-width:1.1}
    .h10a-t{font-family:'Inter','Noto Sans SC',sans-serif;fill:#1C1A17}
    .h10a-s{font-family:'Inter','Noto Sans SC',sans-serif;fill:#6E675A}
    .h10a-m{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;fill:#6E675A}
  </style>

  <defs>
    <marker id="h10a-ink" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1C1A17"/>
    </marker>
  </defs>

  <text class="h10a-t" x="40" y="26" font-size="8.5">中间必须有一台翻译机：用户写模板，框架跑函数</text>

  <rect class="h10a-b" x="40" y="62" width="140" height="36" rx="2"/>
  <text class="h10a-t" x="110" y="84" font-size="8" text-anchor="middle">模板字符串</text>

  <text class="h10a-m" x="204" y="54" font-size="7">parse</text>
  <line x1="182" y1="80" x2="226" y2="80" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h10a-ink)"/>

  <rect class="h10a-b" x="230" y="62" width="140" height="36" rx="2"/>
  <text class="h10a-t" x="300" y="84" font-size="8" text-anchor="middle">AST</text>

  <text class="h10a-m" x="394" y="54" font-size="7">transform</text>
  <line x1="372" y1="80" x2="416" y2="80" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h10a-ink)"/>

  <rect class="h10a-b" x="420" y="62" width="140" height="36" rx="2"/>
  <text class="h10a-t" x="490" y="84" font-size="8" text-anchor="middle">AST'</text>

  <text class="h10a-m" x="584" y="54" font-size="7">generate</text>
  <line x1="562" y1="80" x2="606" y2="80" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h10a-ink)"/>

  <rect class="h10a-b" x="610" y="62" width="90" height="36" rx="2"/>
  <text class="h10a-t" x="655" y="84" font-size="8" text-anchor="middle">代码串</text>

  <line x1="655" y1="98" x2="655" y2="124" stroke="#1C1A17" stroke-width="1.1" marker-end="url(#h10a-ink)"/>
  <text class="h10a-m" x="665" y="116" font-size="7">new Function</text>

  <rect class="h10a-q" x="470" y="128" width="230" height="40" rx="2"/>
  <text class="h10a-t" x="585" y="146" font-size="8" text-anchor="middle">render(h, ctx)</text>
  <text class="h10a-s" x="585" y="159" font-size="6.5" text-anchor="middle">上一章的入口签名，正好对上</text>

  <line x1="468" y1="148" x2="426" y2="148" stroke="#B03A2E" stroke-width="1.1" marker-end="url(#h10a-ink)"/>
  <rect class="h10a-b" x="40" y="128" width="382" height="40" rx="2"/>
  <text class="h10a-t" x="58" y="146" font-size="8">响应式渲染引擎（handwritten-009）</text>
  <text class="h10a-s" x="58" y="159" font-size="6.5">读 ctx.message 时被 track 记账，改数据时 trigger 重跑</text>

  <text class="h10a-t" x="40" y="196" font-size="8.5" style="fill:#B03A2E">编译的终点 = 响应式的起点 —— 两篇合起来，才是一个完整的 mini-Vue。</text>
</svg>
